    const target = Math.floor(state.pop);
    while (state.citizens.length < target) spawnCitizen();
    while (state.citizens.length > target) state.citizens.pop();
    for (const c of state.citizens) {
      const dx = c.tx - c.x, dy = c.ty - c.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 0.05) {
        const anchor = state.buildings.length > 1 && RNG.next() < 0.6
          ? RNG.pick(state.buildings) : state.keep;
        c.tx = anchor.x + RNG.range(-1.5, 1.5);
        c.ty = anchor.y + RNG.range(-1.5, 1.5);
      } else {
        c.x += (dx / dist) * c.speed * dt;
        c.y += (dy / dist) * c.speed * dt;
      }
    }
    /* --- nosiciele (wizualni): obsadzony producent zanosi towar
       do najbliższego Składu / Dworu; ekonomia pozostaje nominalna --- */
    for (const b of state.buildings) {
      if (b.id === 'keep') continue;
      const def = Data.BUILDINGS[b.id];
      const out = def.out ? Object.keys(def.out)[0] : null;
      if (!out || !(out in Economy.LIMIT)) continue;
      b.carrierT = (b.carrierT ?? RNG.range(0, 2)) - dt;
      if (b.carrierT > 0 || !state.staffed[b.uid] || state.carriers.length >= 12) continue;
      b.carrierT = 2 + RNG.range(0, 1.5);
      let best = state.keep, bd = 1e9; // najbliższy Skład, w razie braku — Dwór
      for (const t of state.buildings) {
        if (t.id !== 'store' && t.id !== 'keep') continue;
        const d = Math.abs(t.x - b.x) + Math.abs(t.y - b.y);
        if (d < bd) { bd = d; best = t; }
      }
      const p = Data.FACTIONS[state.factionId].palette;
      state.carriers.push({
        x: b.x + 0.5, y: b.y + 0.5, tx: best.x + 0.5, ty: best.y + 0.5,
        carry: out, phase: RNG.range(0, 6.28),
        color: RNG.next() < 0.5 ? p.citizen : p.citizenAlt, speed: 0.35
      });
    }
    for (let i = state.carriers.length - 1; i >= 0; i--) {
      const c = state.carriers[i];
      const dx = c.tx - c.x, dy = c.ty - c.y, dist = Math.hypot(dx, dy);
      if (dist < 0.1) { state.carriers.splice(i, 1); continue; } // rozładowany
      c.x += (dx / dist) * c.speed * dt;
      c.y += (dy / dist) * c.speed * dt;
    }
  }

  function state$() { return state; }
  return { init, state: state$, build, placeFree, placeBuilding, canPlace, canAfford, costOf,
           tick, spawnCitizen, treeCount, addTree, takeTrees };
})();

/* ============================= MODUL: ECONOMY ==============================
   Ekonomia przepływowa v3.5: obsada, produkcja, popularność, imigracja/głód,
   narzędzia z zaworami bezpieczeństwa, magazyny z limitami, las odnawialny.
   Moduł jest czystą funkcją stanu — bot testujący może wołać Economy.tick()
   bez renderowania gry. */
const Economy = (() => {
  const LIMIT = { 'pień':100, deski:250, 'kamień':300, glina:300, zboże:40, mąka:40, woda:40,
    chleb:150, mięso:150, ser:150, owoce:150, daktyle:150, ryby:150,
    ruda:40, węgiel:40, sztabki:40, 'narzędzia':10, broń:60,
    żywica:40, kadzidło:40, winogrona:40, wino:60, 'miód pitny':60,
    bawełna:40, tkanina:60, ceramika:60 };
  const FOODS = ['ryby','chleb','mięso','ser','owoce','daktyle']; // ryby schodzą pierwsze
  const FOOD_PRIORITY = ['hunter','dairy','orchard','watercarrier','qanat','farm','mill','bakery','dategrove','fisherhut'];
  const MINE_EATERS = { ironmine:0.5, coalmine:0.5, incense:0.5, peatmine:0.25 };
  const DOBRO = { franks:'wino', saracens:'kadzidło', vikings:'miód pitny' };
  const TAX_INCOME = [0, 0.05, 0.10, 0.15];
  const RATIONS_POP = { 0.5:-25, 1:0, 1.5:8, 2:15 };
  const TAX_POP = { 0:8, 1:0, 2:-8, 3:-16 };

  function outGood(id) { const d = Data.BUILDINGS[id].out; return d ? Object.keys(d)[0] : null; }
  function outRate(id) { const d = Data.BUILDINGS[id].out; return d ? Object.values(d)[0] : 0; }
  function isFoodOut(id) { return FOODS.includes(outGood(id)); }

  /* mnożniki Wikingów: drwal 1,3; leśnik 2,0; tartak 1,3 (→2,6 deski) */
  const VIK_RATE = { woodcutter: 1.3, forester: 2.0, sawmill: 1.3 };
  function vikScale(id) {
    return World.state().factionId === 'vikings' ? (VIK_RATE[id] || 1) : 1;
  }

  function totalFood(res) { return FOODS.reduce((a, g) => a + (res[g] || 0), 0); }
  function foodRate(s) { return s.pop / 6 * s.controls.rations; }
  function housing(s) {
    const per = s.factionId === 'vikings' ? 8 : 6;
    return 20 + s.buildings.reduce((a, b) => a + (b.id === 'hut' ? per : 0), 0);
  }
  function capOf(s, good) {
    const producers = s.buildings.filter(b => outGood(b.id) === good).length;
    const stores = s.buildings.filter(b => b.id === 'store').length;
    return Math.min(LIMIT[good] ?? Infinity, 6 * producers + 20 + 80 * stores);
  }
  function popularity(s) {
    let p = 50 + (RATIONS_POP[s.controls.rations] ?? 0) + (TAX_POP[s.controls.tax] ?? 0);
    const kinds = FOODS.filter(g => s.res[g] > 5).length;
    if (kinds > 1) p += 4 * (kinds - 1);
    const temples = s.buildings.filter(b => b.id === 'temple').length;
    if (temples * 50 >= s.pop && s.churchFed) p += 10;
    const baths = s.buildings.filter(b => b.id === 'bathhouse').length;
    if (s.factionId === 'saracens' && baths * 50 >= s.pop && s.bathFed) p += 6;
    return Math.max(0, Math.min(100, p));
  }
  function potentialFood(s) {
    // produkcja żywności przy dostępnych wejściach; chleb liczy Piekarnia, Farma/Młyn nie
    const treeTotal = World.treeCount();
    let pot = 0;
    for (const b of s.buildings) {
      if (!isFoodOut(b.id)) continue;
      const def = Data.BUILDINGS[b.id];
      if (!def.worker) continue;
      let frac = 1;
      for (const g in (def.inp || {})) if (s.res[g] < def.inp[g]) frac = 0; // binarnie: wejścia dostępne lub nie
      if (b.id === 'hunter') frac *= Math.min(1, treeTotal / 80);
      pot += outRate(b.id) * frac;
    }
    return pot;
  }

  /* --- obsada: budynki żywności pierwszeństwo, potem reszta --- */
  function staff(s, dt) {
    s.staffed = {}; s.workersNeeded = 0;
    // budowniczowie i załoga na wyprawie zajmują ludzi; pracownicy budynków mają pierwszeństwo
    let free = Math.floor(s.pop) - (s.buildersActive || 0) - (s.crewAway || 0);
    let waitingTool = false;
    const prio = id => { const i = FOOD_PRIORITY.indexOf(id); return i === -1 ? 99 : i; };
    const order = [...s.buildings].sort((a, b) => prio(a.id) - prio(b.id));
    for (const b of order) {
      const def = Data.BUILDINGS[b.id];
      if (!def.worker || b.id === 'keep') continue;
      s.workersNeeded++;
      if (free < 1) continue; // narzędzie zużywamy dopiero przy faktycznym obsadzeniu
      if (def.tool && !s.tooled[b.uid]) {
        if (s.res.narzędzia >= 1) { s.res.narzędzia -= 1; s.tooled[b.uid] = true; }
        else { waitingTool = true; continue; }
      }
      s.staffed[b.uid] = true; free--;
    }
    s.workersStaffed = Object.keys(s.staffed).length;
    s.waitingForTool = waitingTool;
    // zawory bezpieczeństwa narzędzi
    if (waitingTool) {
      if (s.res.narzędzia < 1) // kuźnia zamkowa: ok. 1 narzędzie na 8 min, aż do pełnej sztuki
        s.res.narzędzia = Math.min(1, s.res.narzędzia + 0.125 * dt);
      const marketOn = s.buildings.some(b => b.id === 'market' && s.staffed[b.uid]);
      // zakup na Targu 20 zł, ale rezerwa na żołd (Frankowie) nietykalna
      if (marketOn && s.res.złoto >= 20 + (Tribute.soldierReserve ? Tribute.soldierReserve(s) : 0) && s.res.narzędzia < 1) {
        s.res.złoto -= 20;
        s.res.narzędzia = Math.min(LIMIT['narzędzia'], s.res.narzędzia + 1);
      }
    }
  }

  function tick(dt) {
    if (dt <= 0) return;
    const s = World.state();
    const res = s.res;
    staff(s, dt);
    const pop = popularity(s);
    res.popularity = pop;
    const popMult = Math.min(1.2, Math.max(0.8, 1 + 0.004 * (pop - 50)));
    const starving = s.starveTimer >= 5;
    const food5min = foodRate(s) * 5;
    const treeTotal = World.treeCount(); // raz na tick, nie przy każdym budynku
    s.churchFed = false; s.bathFed = false; // premie wyliczamy na nowo w tym ticku

    /* --- produkcja --- */
    for (const b of s.buildings) {
      const def = Data.BUILDINGS[b.id];
      if (b.id === 'keep' || !def.worker) continue;
      if (!s.staffed[b.uid]) continue;
      // kopalnie i wytwórnia kadzidła jedzą tylko z nadwyżki
      if (MINE_EATERS[b.id] && totalFood(res) < food5min) continue;
      // Dobrobyt: kościół/meczet spala dobro nacji (0,3/min)
      if (b.id === 'temple') {
        const good = DOBRO[s.factionId];
        if (res[good] >= 0.3 * dt) { res[good] -= 0.3 * dt; s.churchFed = true; }
        else s.churchFed = false;
        continue;
      }
      const og = outGood(b.id);
      const sc = vikScale(b.id);
      const inp = def.inp || {};
      let frac = 1;
      for (const g in inp) {
        const need = inp[g] * sc * dt;
        if (need > 0) frac = Math.min(frac, res[g] / need);
      }
      if (b.id === 'woodcutter') frac = Math.min(frac, treeTotal / (outRate('woodcutter') * sc * dt));
      if (b.id === 'hunter') frac *= Math.min(1, treeTotal / 80);
      const hungerK = (starving && !isFoodOut(b.id)) ? 0.75 : 1;
      // pełny magazyn wyjścia zatrzymuje budynek BEZ zużywania wejść (spec.)
      if (og && og in LIMIT) {
        const maxOut = outRate(b.id) * sc * popMult * hungerK * dt;
        if (maxOut > 0) frac = Math.min(frac, Math.max(0, capOf(s, og) - res[og]) / maxOut);
      }
      frac = Math.max(0, Math.min(1, frac));
      for (const g in inp) res[g] -= inp[g] * sc * frac * dt;
      if (b.id === 'bathhouse') s.bathFed = frac >= 1;
      // Leśniczówka: sadzonki dojrzewają po czasie nacji
      if (og === 'sadzonki') {
        // akumulacja ułamkowa — przy małym dt produkcja < 1 sadzonki/tick
        s.plantFrac += outRate(b.id) * sc * frac * popMult * dt;
        const growth = Data.FACTIONS[s.factionId].treeGrowthMin;
        while (s.plantFrac >= 1) { s.plantFrac -= 1; s.saplings.push({ t: s.time + growth }); }
        continue;
      }
      if (!og || !(og in LIMIT)) continue;
      const room = Math.max(0, capOf(s, og) - res[og]);
      const made = Math.min(outRate(b.id) * sc * frac * popMult * hungerK * dt, room);
      res[og] += made;
      if (b.id === 'woodcutter') World.takeTrees(made);
    }
    // dojrzałe sadzonki stają się drzewami
    s.saplings = s.saplings.filter(sp => {
      if (s.time >= sp.t) { World.addTree(); return false; }
      return true;
    });

    /* --- zawory Dworu --- */
    const sawmillOn = s.buildings.some(b => b.id === 'sawmill' && s.staffed[b.uid]);
    if (!sawmillOn && res['pień'] > 0) { // piła zamkowa: 0,6 pnia/min na deski
      const conv = Math.min(0.6 * dt, res['pień']);
      res['pień'] -= conv;
      res.deski = Math.min(capOf(s, 'deski'), res.deski + conv * 2);
    }
    if (s.factionId === 'franks' && !s.buildings.some(b => b.id === 'quarry') && res['kamień'] < 6)
      res['kamień'] = Math.min(6, res['kamień'] + 0.4 * dt);
    if (s.factionId === 'saracens' && !s.buildings.some(b => b.id === 'claypit') && res['glina'] < 6)
      res['glina'] = Math.min(6, res['glina'] + 0.4 * dt);

    /* --- jedzenie --- */
    let need = foodRate(s) * dt;
    // budowniczowie w pracy jedzą 1,5 racji (dodatek 0,5 × 1/6 porcji/min)
    need += (s.buildersWorking || 0) * 0.5 / 6 * s.controls.rations * dt;
    for (const b of s.buildings) {
      const e = MINE_EATERS[b.id];
      if (e && s.staffed[b.uid] && totalFood(res) >= food5min) need += e * dt;
    }
    const fish = Math.min(res['ryby'], need);
    res['ryby'] -= fish; need -= fish;
    if (need > 0) {
      const others = FOODS.slice(1);
      const tot = others.reduce((a, g) => a + res[g], 0);
      if (tot > 0) {
        // proporcjonalny rozdział z oryginalnej potrzeby, liczony globalnie
        const takeTot = Math.min(tot, need);
        for (const g of others) res[g] -= takeTot * (res[g] / tot);
        need -= takeTot;
      }
    }
    const shortfall = need;
    if (shortfall > 0.0001) s.starveTimer += dt;
    else s.starveTimer = 0;
    if (s.starveTimer > 5) s.pop = Math.max(10, s.pop - dt); // głód: 1 osoba/min

    /* --- podatki --- */
    res.złoto += TAX_INCOME[s.controls.tax] * s.pop * dt;

    /* --- imigracja --- */
    const ok = shortfall <= 0.0001 &&
      potentialFood(s) >= 1.1 * foodRate(s) &&
      s.pop < housing(s) &&
      pop >= 45;
    if (ok) {
      s.immigrantTimer += dt;
      const interval = 0.5 * 50 / Math.max(10, pop);
      if (s.immigrantTimer >= interval) { s.immigrantTimer = 0; s.pop += 1; }
    } else s.immigrantTimer = 0;
  }

  return { tick, LIMIT, FOODS, popularity, housing, capOf, potentialFood, foodRate, totalFood };
})();

/* ====================== MODUL: BUILD (Etap 3: logistyka) =================== */
/* Budowniczowie rekrutowani z wolnej ludności sami noszą materiały i budują.
   Reguły wg specyfikacji v3.5 ("Budowniczowie i budowa"):
   - złoto pobierane przy otwarciu placu, materiały — przy wniesieniu;
   - noszenie 0,2 min budowniczego na sztukę; budowa 1,0 + 0,1 min na sztukę,
     przydzieleni budowniczowie budują razem;
   - 1 budowniczy na plac; plac > 20 szt. dostaje +1 na każde 20 (max 3;
     Okręt 2, Przystań 1); gang: domyślnie 3, min 2, max 5;
   - plac bez ani jednej dostępnej sztuki materiału nie zajmuje budowniczych;
   - place w kolejce gracza; wcześniejszy plac ma pierwszeństwo do materiałów. */
const Build = (() => {
  const MAT = { d: 'deski', k: 'kamień', gl: 'glina' };
  const PIECE_MIN = 0.2;  // min noszenia na sztukę materiału
  const BASE_WORK = 1.0;  // stały czas budowy
  const PER_PIECE = 0.1;  // czas budowy na sztukę materiału

  function piecesOf(cost) { let n = 0; for (const k in cost) if (MAT[k]) n += cost[k]; return n; }
  function deliveredOf(site) { let n = 0; for (const g in site.need) n += (site.got[g] || 0); return n; }

  function enqueue(id, x, y) {
    const s = World.state();
    const check = World.canPlace(id, x, y);
    if (!check.ok) return check;
    // pierwsza Chata drwala darmowa — także gdy pierwszy plac jest dopiero w kolejce
    const free = id === 'woodcutter' &&
      !s.buildings.some(b => b.id === 'woodcutter') &&
      !s.sites.some(st => st.id === 'woodcutter');
    const cost = free ? {} : World.costOf(id);
    // rezerwa złota na żołd brakujących żołnierzy (Frankowie) nietykalna
    const reserve = Tribute.soldierReserve ? Tribute.soldierReserve(s) : 0;
    if ((cost.zl || 0) > s.res.złoto - reserve) return { ok: false, reason: 'Brak złota (rezerwa na żołd)!' };
    s.res.złoto -= (cost.zl || 0); // złoto przy otwarciu placu
    const site = { id, x, y, uid: s.nextId++, need: {}, got: {}, work: 0,
      gold: cost.zl || 0, pieces: piecesOf(cost),
      workNeed: BASE_WORK + PER_PIECE * piecesOf(cost), assigned: 0 };
    for (const k in cost) if (MAT[k]) site.need[MAT[k]] = cost[k];
    s.sites.push(site);
    // rezerwacja kafli pod plac
    const size = id === 'keep' ? 2 : 1;
    for (let dy = 0; dy < size; dy++) for (let dx = 0; dx < size; dx++) {
      const t = MapGen.at(s.map, x + dx, y + dy);
      if (t) t.occup = site.uid;
    }
    return { ok: true };
  }

  function siteAt(x, y) {
    return World.state().sites.find(st => st.x === x && st.y === y) || null;
  }

  function cancel(site) { // anulowanie placu: materiały i złoto wracają
    const s = World.state();
    for (const g in site.need) s.res[g] += (site.got[g] || 0);
    s.res.złoto += site.gold;
    const size = site.id === 'keep' ? 2 : 1;
    for (let dy = 0; dy < size; dy++) for (let dx = 0; dx < size; dx++) {
      const t = MapGen.at(s.map, site.x + dx, site.y + dy);
      if (t && t.occup === site.uid) t.occup = null;
    }
    s.sites.splice(s.sites.indexOf(site), 1);
  }

  function complete(site) {
    const s = World.state();
    s.sites.splice(s.sites.indexOf(site), 1);
    World.placeBuilding(site.id, site.x, site.y); // nadpisuje rezerwację placu
  }

  function tick(dt) {
    const s = World.state();
    // gang budowniczych: ustawienie 2–5; rekrutacja z wolnej ludności,
    // pracownicy budynków mają pierwszeństwo, ale gang nie schodzi poniżej 2
    const setting = Math.max(2, Math.min(5, s.builders));
    const freePop = Math.floor(s.pop) - s.workersStaffed;
    const active = Math.max(2, Math.min(setting, freePop));
    s.buildersActive = active;
    // dostępne materiały — wcześniejszy plac w kolejce bierze pierwszeństwo
    const avail = {};
    for (const g in s.res) if (typeof s.res[g] === 'number' && g !== 'popularity') avail[g] = s.res[g];
    const claimed = {}; // rezerwacja brakujących sztuk przez wcześniejsze place
    let left = active, working = 0;
    for (const site of [...s.sites]) { // kopia: complete() usuwa plac z s.sites w trakcie pętli
      site.assigned = 0;
      const missing = site.pieces - deliveredOf(site);
      if (missing > 0.0001) {
        // plac bez ani jednej dostępnej sztuki (po rezerwacji wcześniejszych) nie zajmuje budowniczych
        let any = false;
        for (const g in site.need)
          if ((site.got[g] || 0) < site.need[g] &&
              (avail[g] || 0) - (claimed[g] || 0) >= 0.001) any = true;
        if (!any) continue;
      }
      if (left < 1) continue;
      const cap = site.id === 'ship' ? 2 : site.id === 'dock' ? 1
        : Math.min(3, 1 + Math.floor(site.pieces / 20));
      site.assigned = Math.min(cap, left);
      left -= site.assigned;
      working += site.assigned;
      // etap 1: noszenie — 0,2 min budowniczego na sztukę
      if (missing > 0.0001) {
        for (const g in site.need)
          claimed[g] = (claimed[g] || 0) + (site.need[g] - (site.got[g] || 0));
        let budget = site.assigned / PIECE_MIN * dt;
        for (const g in site.need) {
          const miss = site.need[g] - (site.got[g] || 0);
          if (miss <= 0 || budget <= 0.0001) continue;
          const eff = (avail[g] || 0) - (claimed[g] || 0) + miss; // własna rezerwacja nie blokuje
          const take = Math.min(miss, Math.max(0, eff), budget);
          if (take > 0) {
            site.got[g] = (site.got[g] || 0) + take;
            avail[g] -= take; s.res[g] -= take; budget -= take;
          }
        }
      }
      // etap 2: budowa — przydzieleni budowniczowie budują razem
      if (deliveredOf(site) >= site.pieces - 1e-9) {
        site.work += site.assigned * dt;
        if (site.work >= site.workNeed) complete(site);
      }
    }
    s.buildersWorking = working;
  }

  function progressOf(site) { // do rysowania i HUD: 50% noszenie + 50% budowa
    const carry = site.pieces ? Math.min(1, deliveredOf(site) / site.pieces) : 1;
    const work = Math.min(1, site.work / site.workNeed);
    return carry * 0.5 + work * 0.5;
  }

  return { enqueue, siteAt, cancel, tick, progressOf };
})();

/* ===================== MODUL: TRIBUTE (Etap 4: haracz seniora) ============== */
/* Haracz jest jedyną presją w grze. Poziom L żąda 2L osobominut pracy na minutę;
   nacje płacą własną jednostką: Frankowie żołnierzem (broń + 3 zł żołdu + osoba),
   Saraceni złotem z handlu (krzywe cen na Targu), Wikingowie wyprawą okrętu.
   Terminy co 15 min od pierwszego (60 / 50 / 110), żądanie skumulowane,
   wyprawy zaokrąglane w dół, ogłoszenie 30 min przed pierwszym terminem. */
const Tribute = (() => {
  const PRESET_LEVEL = { easy: 3, normal: 5, hard: 6 };
  const PRESET_LABEL = { off: 'Wyłączony', easy: 'Łatwy (poz. 3)', normal: 'Normalny (poz. 5)',
    hard: 'Trudny (poz. 6)', master: 'Mistrz' };
  const MASTER_LEVEL = { franks: 10, saracens: 7, vikings: 12 };
  const FIRST_TERM = { franks: 60, saracens: 50, vikings: 110 };
  // wartość żądana na jednostkę czasu (na 15 min), wg tabeli "Skala poziomów"
  const RATE = {
    franks:  [0, 1.6, 3.2, 4.7, 6.3, 7.9, 9.5, 11.1, 12.6, 14.2, 15.8, 17.4],
    saracens:[0, 27, 54, 81, 108, 135, 162, 189, 216, 243, 270, 297],
    vikings: [0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5]
  };
  const TRADE = { kadzidło: { base: 4.2, floor: 0.9 }, tkanina: { base: 3.6, floor: 0.9 },
                  ceramika: { base: 2.4, floor: 0.6 } };
  const NEED_LIST = { franks: ['Koszary', 'Zbrojownia'], saracens: ['Targ'],
                      vikings: ['Przystań', 'Okręt', 'Miodosytnia', 'Zbrojownia'] };

  function set(preset) {
    const s = World.state();
    if (preset === 'off') { s.tribute = null; return 'Haracz wyłączony'; }
    const level = preset === 'master' ? MASTER_LEVEL[s.factionId] : PRESET_LEVEL[preset];
    s.tribute = { preset, level, firstTerm: FIRST_TERM[s.factionId], announced: false, msgShown: false,
      terms: 0, met: 0, missed: 0, delivered: 0, soldierFrac: 0 };
    return 'Haracz: ' + PRESET_LABEL[preset] + (preset === 'master' ? ' (poz. ' + level + ')' : '');
  }

  function requiredCum(level, faction, n) {
    const table = RATE[faction];
    // poziom spoza tabeli (np. Wikingowie "Mistrz" = 12) liczony liniowo od poziomu 1
    const perTerm = table[level] !== undefined ? table[level] : table[1] * level;
    return Math.floor(perTerm * n);
  }

  /* Frankowie: złoto potrzebne na żołd brakujących do najbliższego terminu
     żołnierzy — rezerwa nietykalna przy zakupach. */
  function soldierReserve(s) {
    const t = s.tribute;
    if (!t || s.factionId !== 'franks' || !t.announced) return 0;
    const upcoming = requiredCum(t.level, 'franks', Math.max(1, t.terms + 1));
    return 3 * Math.max(0, upcoming - t.delivered);
  }

  function tick(dt) {
    const s = World.state();
    marketTick(s, dt);
    if (s.factionId === 'vikings') voyagesTick(s, dt);
    const t = s.tribute;
    if (!t) return;
    // ogłoszenie 30 min przed pierwszym terminem, z listą brakujących budynków
    if (!t.announced && s.time >= t.firstTerm - 30) {
      const missing = NEED_LIST[s.factionId].filter(nm =>
        !s.buildings.some(b => Data.BUILDINGS[b.id] && Data.BUILDINGS[b.id].name === nm));
      t.announced = true;
      t.announceMsg = 'Senior żąda haraczu (poziom ' + t.level + ') — pierwsza rata za 30 min' +
        (missing.length ? '. Brakuje: ' + missing.join(', ') : '');
    }
    if (s.factionId === 'franks') soldiersTick(s, t, dt);
    // termin haraczu co 15 min; żądanie skumulowane od pierwszego terminu
    if (s.time >= t.firstTerm + t.terms * 15) {
      const required = requiredCum(t.level, s.factionId, t.terms + 1);
      if (s.factionId === 'saracens') { // płatność złotem — ze skarbca
        const due = Math.max(0, required - t.delivered);
        const pay = Math.min(s.res.złoto, due);
        s.res.złoto -= pay; t.delivered += pay;
      }
      if (t.delivered >= required) t.met++; else t.missed++;
      t.terms++;
    }
  }

  /* --- Frankowie: dostawa żołnierzy (Koszary, broń, żołd 3 zł, osoba) --- */
  function soldiersTick(s, t, dt) {
    if (!t.announced) return;
    if (!s.buildings.some(b => b.id === 'barracks')) return;
    const upcoming = requiredCum(t.level, 'franks', Math.max(1, t.terms + 1));
    let want = upcoming - t.delivered;
    if (want <= 0) return;
    t.soldierFrac += 2 * dt; // tempo dostaw: 2 żołnierzy/min
    while (t.soldierFrac >= 1 && want > 0) {
      // warunki: broń, żołd, ludność ponad 10
      if (s.res.broń < 1 || s.res.złoto < 3 || s.pop <= 10) { t.soldierFrac = 0; break; }
      s.res.broń -= 1; s.res.złoto -= 3; s.pop -= 1;
      t.delivered += 1; t.soldierFrac -= 1; want--;
    }
    if (t.soldierFrac > 1) t.soldierFrac = 0;
  }

  /* --- Wikingowie: wyprawy deterministyczne, bez losu --- */
  function voyagesTick(s, dt) {
    // powroty: łup, straty, liczy się do haraczu po powrocie
    for (let i = s.voyages.length - 1; i >= 0; i--) {
      const v = s.voyages[i];
      if (s.time < v.until) continue;
      s.voyages.splice(i, 1);
      s.crewAway -= v.crew;
      for (const uid of v.ships) {
        const b = s.buildings.find(bb => bb.uid === uid);
        if (b) b.awayUntil = 0;
      }
      s.pop = Math.max(10, s.pop - (v.great ? 2 : 1));       // straty: 1/2 osoby
      s.res.broń = Math.max(0, s.res.broń - (v.great ? 2 : 1)); // 1/2 bronie
      s.res.złoto += v.great ? 80 : 30;                       // łup
      if (v.great) s.res.narzędzia = Math.min(10, s.res.narzędzia + 2);
      if (s.tribute) s.tribute.delivered += v.great ? 3 : 1;
    }
    // wypłynięcia: tryb "Zwykłe" (1 okręt) albo "Mieszane" (wielka, gdy 2 okręty)
    if (!s.buildings.some(b => b.id === 'dock')) return;
    const freeShips = s.buildings.filter(b => b.id === 'ship' && !(b.awayUntil > s.time));
    if (s.voyageMode === 'mixed' && freeShips.length >= 2) {
      trySail(s, [freeShips[0], freeShips[1]], true);
    }
    const still = s.buildings.filter(b => b.id === 'ship' && !(b.awayUntil > s.time));
    if (still.length >= 1) trySail(s, [still[0]], false);
  }

  function trySail(s, ships, great) {
    const crew = great ? 12 : 6, needM = great ? 12 : 6, needW = great ? 12 : 6;
    if (s.res['miód pitny'] < needM || s.res.broń < needW) return;
    const freePop = Math.floor(s.pop) - s.workersStaffed - s.buildersActive - s.crewAway;
    if (freePop < crew) return;
    if (great) {
      // po odjeździe zostaje ≥ 90% potrzebnych robotników i ≥ 10 osób
      if (s.pop - crew < 10 || s.pop - crew < 0.9 * s.workersNeeded) return;
    }
    s.res['miód pitny'] -= needM;
    s.res.broń -= needW;
    s.crewAway += crew;
    const until = s.time + (great ? 12 : 10);
    for (const b of ships) b.awayUntil = until;
    s.voyages.push({ until, crew, great, ships: ships.map(b => b.uid) });
  }

  /* --- Targ: sprzedaż towarów handlowych z krzywymi cen (Saraceni) --- */
  function marketTick(s, dt) {
    const mkts = s.buildings.filter(b => b.id === 'market' && s.staffed[b.uid]).length;
    const serai = Math.min(2, s.buildings.filter(b => b.id === 'caravanserai' && s.staffed[b.uid]).length);
    if (mkts + serai === 0) return;
    const nM = mkts + 2 * serai;             // Karawanseraj liczy się jak 2 Targi
    const mul = 1 + 0.2 * serai;             // +20% cen bazowych i podłóg
    for (const g in TRADE) {
      let p = s.marketPrices[g];
      const base = TRADE[g].base * mul, floor = TRADE[g].floor * mul;
      p += (base - p) * 0.0143 * dt;        // odnowa: 1,43% luki na minutę
      const q = s.res[g];
      if (q > 0.001) {
        // sprzedaż z całego zapasu naraz; spadek 0,05 zł/szt. ÷ liczba Targów
        let revenue = 0, left = q, guard = 0;
        while (left > 0.001 && guard++ < 300) {
          const step = Math.min(1, left);
          revenue += Math.max(floor, p) * step;
          p = Math.max(floor, p - 0.05 * step / nM);
          left -= step;
        }
        if (left > 0.001) { revenue += Math.max(floor, p) * left; left = 0; } // powyżej 300 szt. po podłodze
        s.res.złoto += revenue;
        s.res[g] = 0;
      }
      s.marketPrices[g] = p;
    }
  }

  return { set, tick, soldierReserve, requiredCum, PRESET_LABEL };
})();

/* ==================== MODUL: EVENTS (Etap 5: świat dynamiczny) =================== */
/* Napad na karawanę (Saraceni): im więcej złota w skarbcu, tym większe ryzyko;
   pierwsze 150 zł nienaruszalne; Strażnica (0,6 zł/min, gdy złoto jest; max 2
   się liczą) zmniejsza ryzyko o 40% i łup o 25% za cenę utrzymania. Sprawdzenie
   co 10 min od 40. minuty. Kryzysy (zaraza, pożar łańcucha, krach cen) idą z
   harmonogramu — silnik pozostaje deterministyczny (RNG z ziarnem). */
const Events = (() => {
  const GUARD_UPKEEP = 0.6;  // zł/min
  const GUARD_MAX = 2;

  function msg(s, text) { (s.eventMsgs = s.eventMsgs || []).push({ text, time: s.time }); }

  /* Strażnice obsadzone z opłaconym utrzymaniem (bez złota nie działają) */
  function guardsActive(s, dt) {
    let active = 0;
    for (const b of s.buildings) {
      if (b.id !== 'guardpost' || !s.staffed[b.uid]) continue;
      const cost = GUARD_UPKEEP * dt;
      if (s.res.złoto >= cost) { s.res.złoto -= cost; active++; }
    }
    return Math.min(GUARD_MAX, active);
  }

  function tick(dt) {
    const s = World.state();
    if (s.factionId === 'saracens') {
      const guards = guardsActive(s, dt);
      const r = s.raids;
      if (s.time >= r.next) {          // kontrola co 10 min od 40. minuty
        r.next += 10;
        const gold = s.res.złoto;
        if (gold > 150) {              // pierwsze 150 zł nienaruszalne
          const chance = Math.min(0.5, (gold - 150) / 1000) * (1 - 0.4 * guards);
          if (RNG.next() < chance) {
            const loot = Math.min(400, 0.3 * (gold - 150) * (1 - 0.25 * guards));
            s.res.złoto -= loot;
            r.count++; r.lost += loot;
            msg(s, '⚔ Napad na karawanę! Zrabowano ' + Math.round(loot) + ' zł' +
                (guards ? ' (Strażnice złagodziły stratę)' : ' — zbuduj Strażnicę!'));
          }
        }
      }
    }
    runCrisis(s);                      // harmonogram kryzysów (jeśli włączony)
  }

  /* --- kryzysy wg scenariuszy z kryteriów akceptacji (v3.5) --- */
  function plague(s) { // zaraza: -12 osób, podłoga 10
    const before = Math.floor(s.pop);
    s.pop = Math.max(10, s.pop - 12);
    msg(s, '☠ Zaraza! Ludność spada z ' + before + ' do ' + Math.floor(s.pop));
  }
  function destroy(s, b) { // wyburzenie: zwolnij kafle, usuń z listy
    const size = b.id === 'keep' ? 2 : 1;
    for (let dy = 0; dy < size; dy++) for (let dx = 0; dx < size; dx++) {
      const t = MapGen.at(s.map, b.x + dx, b.y + dy);
      if (t && t.occup === b.uid) t.occup = null;
    }
    s.buildings.splice(s.buildings.indexOf(b), 1);
  }
  function fire(s, ids) { // pożar: po jednym budynku każdego typu z listy
    const burned = [];
    for (const id of ids) {
      const b = s.buildings.find(bb => bb.id === id);
      if (!b) continue;
      destroy(s, b);
      burned.push(Data.BUILDINGS[id].name);
    }
    if (burned.length) msg(s, '🔥 Pożar! Spłonęło: ' + burned.join(', '));
  }
  function priceCrash(s) { // krach cen: wszystko na podłogę krzywej
    s.marketPrices.kadzidło = 0.9; s.marketPrices.tkanina = 0.9; s.marketPrices.ceramika = 0.6;
    msg(s, '📉 Krach cen! Targ płaci ceny podłogowe.');
  }
  function deforest(s, n) { World.takeTrees(n); msg(s, '🪓 Wylesienie: ' + n + ' drzew.'); }

  /* harmonogram "Kryzysy: harmonogram" — scenariusze kryzysowe v3.5 */
  const SCHEDULE = {
    franks:   [ { at: 60, fn: s => { fire(s, ['bakery', 'mill', 'farm', 'orchard']); plague(s); } } ],
    saracens: [ { at: 60, fn: s => fire(s, ['dategrove', 'dategrove', 'qanat']) },
                { at: 70, fn: s => priceCrash(s) } ],
    vikings:  [ { at: 90, fn: s => fire(s, ['dock', 'ship']) } ]
  };
  function setCrisis(on) {
    const s = World.state();
    s.crisis = on ? { idx: 0 } : null;
    return on ? 'Kryzysy wg harmonogramu (scenariusze v3.5)' : 'Kryzysy wyłączone';
  }
  function runCrisis(s) {
    if (!s.crisis) return;
    const list = SCHEDULE[s.factionId] || [];
    while (s.crisis.idx < list.length && s.time >= list[s.crisis.idx].at) {
      list[s.crisis.idx].fn(s);
      s.crisis.idx++;
    }
  }

  return { tick, plague, fire, priceCrash, deforest, destroy, setCrisis, guardsActive };
})();

/* ===================== MODUL: TESTBOTS (boty R/D/N, Etap 5-testy) ============ */
/* Boty testowe wg "Metodologia testów" (v3.5): R = przepis z szumem ε,
   D = przepis z opóźnieniem decyzji, N = reaktywny bez przepisu.
   Mierniki: ludność @20/40/60/90/150, minuty głodu, terminy haraczu, złoto.
   Symulacja headless: stan gry jest zapisywany i odtwarzany, gra trwa bez zmian. */
const TestBots = (() => {
  /* przepisy nacji z rozdziałów "Przepis na gospodarkę" (v3.5) */
  const RECIPE = {
    franks: ['woodcutter','woodcutter','sawmill','orchard','hunter','quarry','forester',
      'watercarrier','farm','mill','bakery','barracks','hut','hut','dairy','market','store',
      'forester','woodcutter','ironmine','coalmine','coalmine','smelter','armory',
      'sawmill','farm','mill','bakery','hut','toolforge','hut'],
    saracens: ['woodcutter','woodcutter','sawmill','watercarrier','dategrove','claypit',
      'forester','forester','hunter','watercarrier','dategrove','market','store',
      'incensewood','incense','hut','hut','qanat','cotton','weaver','dategrove','dairy',
      'orchard','hut','temple','pottery','bathhouse','incensewood','incense','hut','caravanserai','hut'],
    vikings: ['woodcutter','woodcutter','woodcutter','sawmill','forester','fisherhut','fisherhut',
      'hunter','hut','hut','watercarrier','forester','sawmill','woodcutter','fisherhut',
      'dairy','orchard','market','store','mead','peatmine','charburner','charburner',
      'smelter','armory','dock','ship','hut','toolforge','temple','hut','fisherhut','ship','hut']
  };
  const FOOD_BUILD = {
    franks: ['farm','bakery','dairy','orchard','hunter','mill'],
    saracens: ['dategrove','dairy','orchard','hunter'],
    vikings: ['fisherhut','dairy','orchard','hunter']
  };

  function snapshot() { const s = World.state(); const o = {}; for (const k in s) { try { o[k] = JSON.parse(JSON.stringify(s[k])); } catch (e) { o[k] = s[k]; } } return o; }
  function restore(snap) {
    const s = World.state();
    for (const k in snap) s[k] = snap[k];
    s.keep = s.buildings.find(b => b.id === 'keep') || s.keep; // tożsamość Dworu po klonowaniu
  }

  /* szukanie miejsca: złoże / brzeg / las / zwykłe (spirala od Dworu) */
  function findPlace(s, id) {
    const def = Data.BUILDINGS[id]; if (!def) return null;
    const size = s.map.size;
    if (def.req && def.req.startsWith('deposit:')) {
      const kind = def.req.split(':')[1];
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        const t = MapGen.at(s.map, x, y);
        if (t && t.deposit === kind && World.canPlace(id, x, y).ok) return { x, y };
      }
      return null;
    }
    const c = Math.floor(size / 2);
    for (let r = 1; r < size; r++) {
      for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        const x = c + dx, y = c + dy; const t = MapGen.at(s.map, x, y);
        if (!t || t.h !== 1) continue;
        if ((def.req === 'shore' || def.req === 'waterEdge')) {
          let water = false;
          for (const [ox, oy] of [[1,0],[-1,0],[0,1],[0,-1]]) { const n = MapGen.at(s.map, x+ox, y+oy); if (n && n.h === 0) water = true; }
          if (!water) continue;
        }
        if (def.req === 'forest') {
          let trees = 0;
          for (const [ox, oy] of [[1,0],[-1,0],[0,1],[0,-1]]) { const n = MapGen.at(s.map, x+ox, y+oy); if (n) trees += n.trees; }
          if (trees < 4) continue;
        }
        if (World.canPlace(id, x, y).ok) return { x, y };
      }
    }
    return null;
  }

  function tryBuild(s, id) {
    const spot = findPlace(s, id);
    if (!spot) return 'noplace';
    const r = Build.enqueue(id, spot.x, spot.y);
    return r.ok ? 'built' : 'wait';
  }

  /* jeden przebieg; cfg: { faction, bot: 'R'|'D'|'N', epsilon, tax, preset } */
  function runSync(cfg, onTick) {
    const snap = snapshot();
    World.init(cfg.faction);
    const s = World.state();
    if (cfg.tax != null) s.controls.tax = cfg.tax;
    Tribute.set(cfg.preset || 'normal');
    const plan = (RECIPE[cfg.faction] || []).slice();
    let pi = 0, nextDecide = 0, famineMin = 0;
    const eps = cfg.epsilon != null ? cfg.epsilon : 0.15;
    const decideEvery = cfg.bot === 'D' ? 2.0 : 0.5;
    const marks = {};
    const DT = 0.1, END = 150;
    for (let t = 0; t < END; t += DT) {
      World.tick(DT); // Economy + Build + Tribute + Events + czas
      if (Economy.totalFood(s.res) < 0.01) famineMin += DT;
      for (const m of [20, 40, 60, 90, 150]) if (t >= m && !(m in marks)) marks[m] = Math.floor(s.pop);
      if (t >= nextDecide) {
        nextDecide = t + decideEvery;
        let id = null;
        if (cfg.bot === 'N') { // reaktywny, bez przepisu (głód > dach > deski > narzędzia > haracz)
          const needFood = Economy.potentialFood(s) < 1.1 * Economy.foodRate(s) + 0.5;
          const full = Economy.housing(s) <= s.pop;
          if (needFood) {
            for (const i2 of (FOOD_BUILD[cfg.faction] || [])) if (tryBuild(s, i2) === 'built') break;
          } else if (full) tryBuild(s, 'hut');
          else if (s.res.deski < 6) tryBuild(s, 'woodcutter');
          else if (s.waitingForTool) tryBuild(s, cfg.faction === 'saracens' ? 'store' : 'toolforge');
          else if (s.tribute && s.tribute.announceMsg) { // ogłoszenie haraczu: dobuduj łańcuch
            const need = { franks: ['barracks','armory'], saracens: ['market'], vikings: ['dock','ship','mead','armory'] }[cfg.faction] || [];
            for (const i2 of need) if (!s.buildings.some(b2 => b2.id === i2)) { tryBuild(s, i2); break; }
          } else tryBuild(s, 'hut');
        } else {
          if (RNG.next() >= eps && pi < plan.length) { // R/D: przepis; ε = szum nieuwagi
            id = plan[pi];
            const r2 = tryBuild(s, id);
            if (r2 === 'built') pi++;
            else if (r2 === 'noplace') pi++; // brak miejsca: pomiń (jak w kolejce gry)
            // 'wait' (brak złota) → ponów decyzję
          }
        }
      }
      if (onTick) onTick(t / END);
    }
    marks[150] = Math.floor(s.pop); // pętla kończy się tuż przed t = 150
    const tribute = s.tribute ? (s.tribute.met + '/' + (s.tribute.met + s.tribute.missed)) : '—';
    const out = { faction: cfg.faction, bot: cfg.bot, tax: s.controls.tax,
      pop: marks, famine: Math.round(famineMin), tribute, gold: Math.round(s.res.złoto), pop36: null };
    restore(snap);
    return out;
  }

  /* panel testowy (zwijany, wypisywany raport) */
  let panel = null;
  function createPanel() {
    if (panel) return;
    panel = document.createElement('div');
    panel.style.cssText = 'position:absolute;z-index:60;left:8px;bottom:120px;background:rgba(20,16,12,.94);border:1px solid #6b543a;color:#f0e6d2;font-size:12px;padding:6px 8px;max-width:300px;max-height:46vh;overflow:auto;';
    panel.innerHTML = '<b id="botToggle" style="color:#e8c860;cursor:pointer">🧪 Boty testowe ▸</b>' +
      '<div id="botBody" style="display:none;margin-top:4px">' +
      '<button data-b="R">Bot R (przepis+szum)</button> <button data-b="D">Bot D (opóźnienie)</button> <button data-b="N">Bot N (reaktywny)</button><br>' +
      '<button data-b="T3">Frank: podatek 3 (brzegowy)</button> <button data-b="ALL">3×R: F/S/V</button><br>' +
      '<div id="botOut" style="margin-top:6px;white-space:pre-line"></div></div>';
    panel.querySelectorAll('button').forEach(b => b.style.cssText = 'background:#3a2c1c;color:#f0e6d2;border:1px solid #6b543a;font-size:11px;padding:4px 6px;margin:2px;cursor:pointer;');
    document.body.appendChild(panel);
    panel.addEventListener('click', async e => {
      if (e.target.id === 'botToggle') {
        const body = document.getElementById('botBody');
        const open = body.style.display === 'none';
        body.style.display = open ? 'block' : 'none';
        e.target.textContent = open ? '🧪 Boty testowe ▾' : '🧪 Boty testowe ▸';
        return;
      }
      const b = e.target.getAttribute && e.target.getAttribute('data-b'); if (!b) return;
      const out = document.getElementById('botOut'); out.textContent = '…symulacja…';
      await new Promise(r => setTimeout(r, 10));
      const fac = World.state().factionId || 'franks';
      let lines = [];
      if (b === 'ALL') for (const f of ['franks','saracens','vikings']) lines.push(fmt(runSync({ faction: f, bot: 'R' })));
      else if (b === 'T3') lines.push(fmt(runSync({ faction: 'franks', bot: 'R', tax: 3 })));
      else lines.push(fmt(runSync({ faction: fac, bot: b })));
      out.textContent = lines.join('\n');
    });
  }
  function fmt(r) {
    const p = r.pop || {};
    return '[' + r.bot + ' · ' + r.faction + (r.tax !== 1 ? ' · podatek ' + r.tax : '') + ']\n' +
      'ludność @20/40/60/90/150: ' + (p[20]||'?') + '/' + (p[40]||'?') + '/' + (p[60]||'?') + '/' + (p[90]||'?') + '/' + (p[150]||'?') + '\n' +
      'głód: ' + r.famine + ' min · haracz: ' + r.tribute + ' terminów · złoto: ' + r.gold;
  }

  return { runSync, createPanel };
})();

/* ============================ MODUL: BUILDMODE ============================= */
const BuildMode = (() => {
  let selected = null; // id budynku w trybie budowy
  let hover = { x: -1, y: -1 };

  function select(id) { selected = id; }
  function clear() { selected = null; }
  function isSelected() { return selected; }
  function setHover(wx, wy) { hover.x = Math.floor(wx); hover.y = Math.floor(wy); }

  function click() {
    if (!selected) {
      // klik na plac budowy (poza trybem budowy) anuluje go — zwrot materiałów i złota
      const st = Build.siteAt(hover.x, hover.y);
      if (st) {
        Build.cancel(st);
        UI.flashHint('Budowa anulowana — materiały wróciły do magazynu');
        UI.refreshHUD();
      }
      return;
    }
    // klik otwiera plac budowy; budowniczowie doniosą materiały i zbudują
    const res = Build.enqueue(selected, hover.x, hover.y);
    if (!res.ok) { UI.flashHint(res.reason || 'Nie można tu budować'); return; }
    UI.refreshHUD();
    // tryb budowy zostaje włączony (budowa serii), ESC anuluje
  }

  function draw(ctx) {
    if (!selected) return;
    const s = World.state();
    const check = World.canPlace(selected, hover.x, hover.y);
    // przy kolejce budowy wystarczy złoto na otwarcie placu (materiały wnosi budowniczy)
    const affordable = (World.costOf(selected).zl || 0) <= s.res.złoto;
    const p = Data.FACTIONS[s.factionId].palette;
    const pos = Camera.worldToScreen(hover.x + 0.5, hover.y + 0.5);
    const w = Camera.tileW(), h = Camera.tileH();
    ctx.fillStyle = check.ok && affordable ? 'rgba(120,220,120,0.4)' : 'rgba(220,90,90,0.4)';
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y - h/2); ctx.lineTo(pos.x + w/2, pos.y);
    ctx.lineTo(pos.x, pos.y + h/2); ctx.lineTo(pos.x - w/2, pos.y);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 0.65; // duch budynku
    const art = Gfx.ART[Data.BUILDINGS[selected].art];
    if (art) art(ctx, pos.x, pos.y, Camera.zoom, p, performance.now() / 1000);
    ctx.globalAlpha = 1;
  }

  return { select, clear, isSelected, setHover, click, draw, hover: () => hover };
})();

/* ================================ MODUL: UI ================================ */
const UI = (() => {
  const hud = document.getElementById('hud');
  const buildBar = document.getElementById('buildBar');
  const buildTabs = document.getElementById('buildTabs');
  const buildItems = document.getElementById('buildItems');
  const tooltip = document.getElementById('tooltip');
  const hintEl = document.getElementById('hint');
  const DEFAULT_HINT = 'Przeciągnij prawym przyciskiem / WASD — kamera · kółko — zoom · ESC — anuluj budowę';
  let activeCat = 'Jedzenie';
  let hintTimer = null;
  let gameStarted = false;

  function buildFactionCards() {
    const wrap = document.getElementById('factionCards');
    for (const fid of ['franks', 'saracens', 'vikings']) {
      const f = Data.FACTIONS[fid];
      const card = document.createElement('div');
      card.className = 'factionCard';
      const mini = document.createElement('canvas');
      mini.width = 220; mini.height = 130;
      card.appendChild(mini);
      const h2 = document.createElement('h2'); h2.textContent = f.name; card.appendChild(h2);
      const tag = document.createElement('div'); tag.className = 'tagline'; tag.textContent = f.tagline; card.appendChild(tag);
      const ul = document.createElement('ul');
      f.desc.forEach(d => { const li = document.createElement('li'); li.textContent = d; ul.appendChild(li); });
      card.appendChild(ul);
      card.onclick = () => startGame(fid);
      // dotyk: tap bez przesunięcia startuje grę, przesunięcie przewija listę kart
      let tapStart = null;
      card.addEventListener('touchstart', ev => {
        const tp = ev.touches[0];
        tapStart = { x: tp.clientX, y: tp.clientY };
      }, { passive: true });
      card.addEventListener('touchend', ev => {
        if (!tapStart) return;
        const tp = ev.changedTouches[0];
        const moved = Math.hypot(tp.clientX - tapStart.x, tp.clientY - tapStart.y) > 10;
        tapStart = null;
        if (moved) return;
        ev.preventDefault(); // blokuje syntetyczny click (bez podwójnego startu)
        startGame(fid);
      }, { passive: false });
      wrap.appendChild(card);
      // miniatura: budynek + obywatel na tle terenu
      const mctx = mini.getContext('2d');
      const terrainColors = { grass: ['#5a8a3c', '#4e7a34'], sand: ['#d8c090', '#c8b080'], tundra: ['#6a7a4c', '#5e6e42'] };
      const [c1, c2] = terrainColors[f.palette.terrain];
      mctx.fillStyle = c1; mctx.fillRect(0, 0, 220, 130);
      mctx.fillStyle = c2;
      for (let i = 0; i < 40; i++) mctx.fillRect((i * 37) % 220, (i * 53) % 130, 12, 6);
      Gfx.ART.keep(mctx, 110, 92, 1.1, f.palette, 0);
      Gfx.ART.hut(mctx, 50, 108, 0.9, f.palette, 0);
      const fake = { phase: 1, color: f.palette.citizen };
      Gfx.drawCitizen(mctx, fake, 175, 110, 1.3, fid, f.palette, 0);
    }
  }

  function startGame(fid) {
    if (gameStarted) return;
    gameStarted = true;
    document.getElementById('factionPick').style.display = 'none';
    hud.style.display = 'flex';
    buildBar.style.display = 'block';
    document.getElementById('hint').style.display = 'block';
    World.init(fid);
    document.getElementById('hudFaction').innerHTML = '<b>' + Data.FACTIONS[fid].name + '</b>';
    // kamera na Dwór
    const c = MapGen.SIZE / 2;
    Camera.x = 0; Camera.y = 0;
    const target = Camera.worldToScreen(c, c);
    Camera.x -= target.x - canvas.width / dpr / 2;
    Camera.y -= target.y - canvas.height / dpr / 2;
    buildTabsUi();
    refreshHUD();
    // sterowanie racjami i podatkiem
    const s = World.state();
    const btnR = document.getElementById('btnRations');
    const btnT = document.getElementById('btnTax');
    const upd = () => {
      btnR.textContent = 'Racje: ×' + s.controls.rations;
      btnT.textContent = 'Podatek: ' + s.controls.tax;
    };
    btnR.onclick = () => {
      const opts = [0.5, 1, 1.5, 2];
      s.controls.rations = opts[(opts.indexOf(s.controls.rations) + 1) % opts.length];
      upd();
    };
    btnT.onclick = () => { s.controls.tax = (s.controls.tax + 1) % 4; upd(); };
    // liczbę budowniczych ustawia się w Dworze (2–5, domyślnie 3)
    const btnB = document.getElementById('btnBuilders');
    const updB = () => { btnB.textContent = '👷 Budowniczowie: ' + s.builders; };
    btnB.onclick = () => { s.builders = s.builders >= 5 ? 2 : s.builders + 1; updB(); };
    updB();
    // preset haraczu (Łatwy/Normalny/Trudny/Mistrz) i tryb wypraw Wikingów
    const btnTr = document.getElementById('btnTribute');
    const btnV = document.getElementById('btnVoyages');
    let preset = 'off';
    const updTr = () => {
      btnTr.textContent = '📜 Haracz: ' + (preset === 'off' ? 'Wyłączony' : Tribute.PRESET_LABEL[preset]);
    };
    btnTr.onclick = () => {
      const order = ['off', 'easy', 'normal', 'hard', 'master'];
      preset = order[(order.indexOf(preset) + 1) % order.length];
      UI.flashHint(Tribute.set(preset));
      updTr();
    };
    updTr();
    if (fid === 'vikings') {
      const updV = () => { btnV.textContent = '⛵ Wyprawy: ' + (s.voyageMode === 'mixed' ? 'Mieszane' : 'Zwykłe'); };
      btnV.onclick = () => { s.voyageMode = s.voyageMode === 'mixed' ? 'normal' : 'mixed'; updV(); };
      updV();
    } else {
      btnV.style.display = 'none';
    }
    // kryzysy wg harmonogramu (scenariusze v3.5) — domyślnie wyłączone
    const btnC = document.getElementById('btnCrisis');
    let crisisOn = false;
    const updC = () => { btnC.textContent = crisisOn ? '🔥 Kryzysy: harmonogram' : '🔥 Kryzysy: wył.'; };
    btnC.onclick = () => { crisisOn = !crisisOn; UI.flashHint(Events.setCrisis(crisisOn)); updC(); };
    updC();
    upd();
    document.getElementById('resPanel').style.display = 'block';
    Game.start();
  }

  function buildTabsUi() {
    const fid = World.state().factionId;
    buildTabs.innerHTML = '';
    for (const cat of Data.CATS) {
      const has = Object.entries(Data.BUILDINGS)
        .some(([id, d]) => d.cat === cat && (!d.factions || d.factions.includes(fid)) && id !== 'keep');
      if (!has) continue;
      const btn = document.createElement('button');
      btn.textContent = cat;
      if (cat === activeCat) btn.classList.add('active');
      btn.onclick = () => { activeCat = cat; buildTabsUi(); buildItemsUi(); };
      buildTabs.appendChild(btn);
    }
    buildItemsUi();
  }

  function buildItemsUi() {
    const fid = World.state().factionId;
    buildItems.innerHTML = '';
    for (const [id, def] of Object.entries(Data.BUILDINGS)) {
      if (id === 'keep') continue;
      if (def.cat !== activeCat) continue;
      if (def.factions && !def.factions.includes(fid)) continue;
      const item = document.createElement('div');
      item.className = 'buildItem';
      if (BuildMode.isSelected() === id) item.classList.add('selected');
      const mini = document.createElement('canvas');
      mini.width = 62; mini.height = 44;
      const mctx = mini.getContext('2d');
      const p = Data.FACTIONS[fid].palette;
      mctx.fillStyle = p.terrain === 'sand' ? '#d8c090' : p.terrain === 'tundra' ? '#6a7a4c' : '#5a8a3c';
      mctx.fillRect(0, 0, 62, 44);
      const art = Gfx.ART[def.art];
      if (art) art(mctx, 31, 38, 0.85, p, 0);
      item.appendChild(mini);
      const nm = document.createElement('div'); nm.className = 'bname'; nm.textContent = def.name; item.appendChild(nm);
      const cost = document.createElement('div'); cost.className = 'bcost';
      const c = World.costOf(id);
      cost.textContent = Object.entries(c).map(([k, v]) => v + Data.RES_LABEL[k]).join(' · ') +
        (def.tool ? ' + T' : '');
      item.appendChild(cost);
      item.onclick = () => {
        BuildMode.select(id);
        document.querySelectorAll('.buildItem').forEach(el => el.classList.remove('selected'));
        item.classList.add('selected');
      };
      item.onmouseenter = () => showTooltip(def, c, item);
      item.onmouseleave = hideTooltip;
      buildItems.appendChild(item);
    }
  }

  function showTooltip(def, c, anchor) {
    const afford = World.canAfford(Object.keys(Data.BUILDINGS).find(k => Data.BUILDINGS[k] === def));
    let html = '<h3>' + def.name + '</h3>';
    const costStr = Object.entries(c).map(([k, v]) => v + ' ' + Data.RES_LABEL[k]).join(', ');
    html += '<div class="' + (afford ? 'affordable' : 'expensive') + '">Koszt: ' + (costStr || '—') + '</div>';
    if (def.tool) html += '<div class="expensive">Wymaga narzędzia</div>';
    if (def.worker) html += '<div>Pracownik: ' + def.worker + '</div>';
    if (def.inp) html += '<div>Wejście: ' + Object.entries(def.inp).map(([k, v]) => v + ' ' + k).join(', ') + ' /min</div>';
    if (def.out) html += '<div><b>' + Object.entries(def.out).map(([k, v]) => v + ' ' + k).join(', ') + ' /min</b></div>';
    if (def.note) html += '<em>' + def.note + '</em>';
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    const r = anchor.getBoundingClientRect();
    tooltip.style.left = Math.min(window.innerWidth - 260, r.left) + 'px';
    tooltip.style.top = (r.top - tooltip.offsetHeight - 8) + 'px';
  }
  function hideTooltip() { tooltip.style.display = 'none'; }

  function refreshHUD() {
    const s = World.state();
    document.getElementById('hudTime').textContent = Math.floor(s.time);
    document.getElementById('hudPop').textContent = Math.floor(s.pop);
    document.getElementById('hudPopularity').textContent = Math.round(s.res.popularity || 50);
    document.getElementById('hudGold').textContent = Math.floor(s.res.złoto);
    document.getElementById('hudTools').textContent = Math.floor(s.res.narzędzia);
    document.getElementById('hudFood').textContent = Math.floor(Economy.totalFood(s.res));
    document.getElementById('hudJobs').textContent = s.workersStaffed + '/' + s.workersNeeded;
    document.getElementById('hudHousing').textContent = Economy.housing(s);
    // komunikaty zdarzeń (napady, kryzysy)
    while (s.eventMsgs && s.eventMsgs.length) flashHint(s.eventMsgs.shift().text);
    // ogłoszenie haraczu 30 min przed pierwszym terminem
    const t = s.tribute;
    if (t && t.announced && t.announceMsg && !t.msgShown) {
      t.msgShown = true;
      flashHint(t.announceMsg);
    }
    refreshResPanel();
  }

  let lastPanel = -1;
  function refreshResPanel() {
    const s = World.state();
    if (s.time - lastPanel < 0.2) return;
    lastPanel = s.time;
    const panel = document.getElementById('resPanel');
    let html = '<h3>MAGAZYN</h3>';
    let shown = 0;
    for (const g of Object.keys(Economy.LIMIT)) {
      const producers = s.buildings.filter(b => {
        const o = Data.BUILDINGS[b.id].out;
        return o && Object.keys(o)[0] === g;
      }).length;
      const val = s.res[g] || 0;
      if (val < 0.01 && producers === 0) continue;
      const cap = Economy.capOf(s, g);
      const full = val >= cap - 0.01;
      html += `<div class="row${full ? ' full' : ''}"><span>${g}</span>` +
              `<span class="v">${Math.floor(val)}<span class="cap"> /${cap}</span></span></div>`;
      shown++;
    }
    if (!shown) html += '<div class="row"><span class="v">— pusto —</span></div>';
    html += '<div class="sep"></div>';
    const starve = s.starveTimer > 0 ? Math.ceil(5 - s.starveTimer) : null;
    html += `<div class="row"><span>Głód za</span><span class="v">${starve !== null ? starve + ' min' : '—'}</span></div>`;
    if (s.waitingForTool) html += '<div class="row full"><span>Budynek czeka na narzędzie!</span></div>';
    // budowniczowie i kolejka budowy
    html += `<div class="row"><span>Budowniczowie</span><span class="v">${s.buildersActive || 0}/${s.builders}</span></div>`;
    if (s.sites.length) {
      html += '<div class="sep"></div><h3>BUDOWA</h3>';
      s.sites.slice(0, 4).forEach((st, i) => {
        const pr = Math.round(Build.progressOf(st) * 100);
        html += `<div class="row"><span>${i + 1}. ${Data.BUILDINGS[st.id].name}</span>` +
                `<span class="v">${pr}%</span></div>`;
      });
      if (s.sites.length > 4)
        html += `<div class="row"><span>…i ${s.sites.length - 4} dalej</span></div>`;
      html += '<div class="row"><span style="color:#7a6c55">Klik na plac = anuluj</span></div>';
    }
    // status haraczu i wypraw
    const t = s.tribute;
    if (t) {
      html += '<div class="sep"></div><h3>HARACZ</h3>';
      const unit = s.factionId === 'franks' ? 'żołn.' : s.factionId === 'saracens' ? 'zł' : 'wypr.';
      const required = Tribute.requiredCum(t.level, s.factionId, Math.max(1, t.terms + 1));
      const nextAt = t.firstTerm + t.terms * 15;
      if (s.time < t.firstTerm)
        html += `<div class="row"><span>Pierwsza rata</span><span class="v">za ${Math.ceil(nextAt - s.time)} min</span></div>`;
      else
        html += `<div class="row"><span>Następna rata</span><span class="v">za ${Math.ceil(nextAt - s.time)} min</span></div>`;
      html += `<div class="row"><span>Dostawa (${unit})</span><span class="v">${Math.floor(t.delivered)} / ${required}</span></div>`;
      html += `<div class="row"><span>Terminy</span><span class="v">${t.met} ✔ / ${t.missed} ✘</span></div>`;
      if (s.factionId === 'franks' && !s.buildings.some(b => b.id === 'barracks'))
        html += '<div class="row full"><span>Bez Koszar brak dostaw!</span></div>';
    }
    if (s.factionId === 'vikings' && (s.voyages.length || s.crewAway)) {
      html += `<div class="row"><span>Załoga w morzu</span><span class="v">${s.crewAway}</span></div>`;
      for (const v of s.voyages.slice(0, 3))
        html += `<div class="row"><span>${v.great ? 'Wielka wyprawa' : 'Wyprawa'} (2 okr.)</span>` +
                `<span class="v">${Math.ceil(Math.max(0, v.until - s.time))} min</span></div>`;
    }
    // napady na karawanę (Saraceni)
    if (s.factionId === 'saracens' && (s.raids.count || s.raids.lost)) {
      html += '<div class="sep"></div><h3>NAPADY</h3>';
      const guards = s.buildings.filter(b => b.id === 'guardpost' && s.staffed[b.uid]).length;
      html += `<div class="row"><span>Napady / strata</span><span class="v">${s.raids.count} / ${Math.round(s.raids.lost)} zł</span></div>`;
      html += `<div class="row"><span>Strażnice czynne</span><span class="v">${Math.min(2, guards)} (max 2)</span></div>`;
    }
    if (s.crisis) html += '<div class="row full"><span>🔥 Kryzysy: harmonogram aktywny</span></div>';
    panel.innerHTML = html;
  }

  function flashHint(msg) {
    hintEl.textContent = msg;
    hintEl.style.color = '#e8a060';
    hintEl.classList.add('flash'); // na telefonie podpowiedź jest widoczna tylko jako komunikat
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => {
      hintEl.textContent = DEFAULT_HINT;
      hintEl.style.color = '#b8a888';
      hintEl.classList.remove('flash');
    }, Math.max(2500, msg.length * 70));
  }

  return { buildFactionCards, startGame, refreshHUD, flashHint, tooltip };
})();

/* ================================ MODUL: GAME ============================== */
const Game = (() => {
  const ctx = canvas.getContext('2d');
  let running = false, lastFrame = 0, lastHudTick = -1;
  let keys = {};

  function fit() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }
  window.addEventListener('resize', () => fit());

  function start() {
    if (running) return;
    running = true;
    lastFrame = performance.now();
    requestAnimationFrame(loop);
    UI.refreshHUD();
    TestBots.createPanel(); // panel botów R/D/N (warstwa testowa)
  }

  function loop(now) {
    const realDt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    // ruch kamery
    const pan = 420 * realDt;
    if (keys['w'] || keys['arrowup']) Camera.y += pan;
    if (keys['s'] || keys['arrowdown']) Camera.y -= pan;
    if (keys['a'] || keys['arrowleft']) Camera.x += pan;
    if (keys['d'] || keys['arrowright']) Camera.x -= pan;
    // zegar gry: 4 s realnych = 1 min gry
    const s = World.state();
    const gameDt = realDt / 4 * s.speed;
    if (s.factionId) {
      World.tick(gameDt);
      const hudTick = Math.floor(s.time * 4); // odświeżenie HUD co 1/4 minuty gry
      if (hudTick !== lastHudTick) { lastHudTick = hudTick; UI.refreshHUD(); }
    }
    render(now / 1000);
    requestAnimationFrame(loop);
  }

  function render(t) {
    Gfx.setAnim(t);
    const s = World.state();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
    if (!s.map) return;
    const f = Data.FACTIONS[s.factionId];
    ctx.fillStyle = '#10140f';
    ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);
    const z = Camera.zoom;
    const size = s.map.size;
    const byUid = new Map();
    for (const b of s.buildings) byUid.set(b.uid, b);
    // zbierz obiekty do posortowania po głębi (y świata)
    const drawables = [];
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const tile = s.map.tiles[y * size + x];
        tile.x = x; tile.y = y;
        const scr = Camera.worldToScreen(x + 0.5, y + 0.5);
        if (scr.x < -80 || scr.x > canvas.width / dpr + 80 || scr.y < -80 || scr.y > canvas.height / dpr + 80) continue;
        drawTile(x, y, scr, tile);
        if (tile.occup) {
          const b = byUid.get(tile.occup);
          // budynek rysujemy raz, z kafla początkowego (Dwór 2x2 zajmuje cztery kafle)
          if (b && b.x === x && b.y === y) {
            const big = b.id === 'keep';
            drawables.push({ depth: x + y + (big ? 2.5 : 0.5), b,
              scr: big ? Camera.worldToScreen(x + 1.25, y + 1.25) : scr });
          }
        }
      }
    }
    // obywatele i nosiciele
    for (const c of s.citizens) {
      const scr = Camera.worldToScreen(c.x, c.y);
      drawables.push({ depth: c.x + c.y, citizen: c, scr });
    }
    for (const c of s.carriers) {
      const scr = Camera.worldToScreen(c.x, c.y);
      drawables.push({ depth: c.x + c.y, citizen: c, scr });
    }
    drawables.sort((a, b) => a.depth - b.depth);
    for (const d of drawables) {
      if (d.b) {
        const def = Data.BUILDINGS[d.b.id];
        const art = Gfx.ART[def.art];
        if (art) art(ctx, d.scr.x, d.scr.y, z, f.palette, t);
      } else {
        Gfx.drawCitizen(ctx, d.citizen, d.scr.x, d.scr.y, z, s.factionId, f.palette, t);
      }
    }
    // place budowy z budowniczymi
    for (const st of s.sites) {
      const scr = Camera.worldToScreen(st.x + 0.5, st.y + 0.5);
      if (scr.x < -80 || scr.x > canvas.width / dpr + 80 || scr.y < -80 || scr.y > canvas.height / dpr + 80) continue;
      Gfx.drawSite(ctx, scr.x, scr.y, z, f.palette, Build.progressOf(st));
      for (let i = 0; i < st.assigned; i++) {
        const ang = i * 2.1 + st.uid;
        const bx = scr.x + Math.cos(ang) * 12 * z;
        const by = scr.y + Math.sin(ang) * 6 * z + 3 * z;
        Gfx.drawCitizen(ctx, { phase: t * 2 + i, color: f.palette.citizen },
                        bx, by, z, s.factionId, f.palette, t);
      }
    }
    BuildMode.draw(ctx);
  }

  function drawTile(x, y, scr, tile) {
    let coast = 0;
    if (tile.h === 0) {
      const s2 = World.state();
      const dirs = [[0,-1],[1,0],[0,1],[-1,0]];
      for (let i = 0; i < 4; i++) {
        const n = MapGen.at(s2.map, x + dirs[i][0], y + dirs[i][1]);
        if (n && n.h !== 0) coast |= (1 << i);
      }
    }
    Gfx.drawTile(ctx, tile, scr.x, scr.y, Camera.zoom, Data.FACTIONS[World.state().factionId].palette.terrain, coast);
  }

  /* --- input --- */
  let dragging = false, dragStart = null, camStart = null, dragged = false;
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('mousedown', e => {
    dragged = false; // każde naciśnięcie zaczyna od zera (prawy przycisk nie generuje click, który by to zerował)
    if (e.button === 2 || (e.button === 0 && e.shiftKey)) {
      dragging = true; canvas.classList.add('dragging');
      dragStart = { x: e.clientX, y: e.clientY };
      camStart = { x: Camera.x, y: Camera.y };
    }
  });
  window.addEventListener('mouseup', e => {
    if (e.button === 2 || dragging) { dragging = false; canvas.classList.remove('dragging'); }
  });
  window.addEventListener('mousemove', e => {
    if (dragging) {
      if (Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y) > 5) dragged = true;
      Camera.x = camStart.x + (e.clientX - dragStart.x);
      Camera.y = camStart.y + (e.clientY - dragStart.y);
    } else {
      const w = Camera.screenToWorld(e.clientX, e.clientY);
      BuildMode.setHover(w.x, w.y);
    }
  });
  canvas.addEventListener('click', e => {
    if (dragged) { dragged = false; return; } // to był drag kamery, nie klik
    if (e.button === 0 && !e.shiftKey) {
      const w = Camera.screenToWorld(e.clientX, e.clientY);
      BuildMode.setHover(w.x, w.y);
      BuildMode.click();
    }
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const before = Camera.screenToWorld(e.clientX, e.clientY);
    Camera.zoom = Math.min(2.2, Math.max(0.5, Camera.zoom * (e.deltaY < 0 ? 1.1 : 0.9)));
    const after = Camera.worldToScreen(before.x, before.y);
    Camera.x += e.clientX - after.x;
    Camera.y += e.clientY - after.y;
  }, { passive: false });
  /* --- sterowanie dotykiem: 1 palec = kamera, 2 palce = pinch-zoom, tap = klik --- */
  let touchMode = null; // 'pan' | 'pinch' | null
  let tStart = null, tCamStart = null, pinchStart = null, pinchZoomStart = 1;
  const rectOf = () => canvas.getBoundingClientRect();
  function tPos(touches) {
    const r = rectOf();
    return { x: (touches[0].clientX - r.left), y: (touches[0].clientY - r.top) };
  }
  function tMid(touches) {
    const r = rectOf();
    return { x: ((touches[0].clientX + touches[1].clientX) / 2 - r.left),
             y: ((touches[0].clientY + touches[1].clientY) / 2 - r.top) };
  }
  function tDist(touches) {
    return Math.hypot(touches[0].clientX - touches[1].clientX,
                      touches[0].clientY - touches[1].clientY);
  }
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (e.touches.length === 1) {
      touchMode = 'pan';
      const p = tPos(e.touches);
      tStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, sx: p.x, sy: p.y, t: Date.now() };
      tCamStart = { x: Camera.x, y: Camera.y };
      dragged = false;
    } else if (e.touches.length === 2) {
      touchMode = 'pinch';
      dragged = true; // dwa palce nigdy nie są tapem
      pinchStart = { mid: tMid(e.touches), dist: tDist(e.touches), cam: { x: Camera.x, y: Camera.y } };
      pinchZoomStart = Camera.zoom;
    }
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (touchMode === 'pan' && e.touches.length === 1) {
      if (Math.hypot(e.touches[0].clientX - tStart.x, e.touches[0].clientY - tStart.y) > 8) dragged = true;
      Camera.x = tCamStart.x + (e.touches[0].clientX - tStart.x);
      Camera.y = tCamStart.y + (e.touches[0].clientY - tStart.y);
    } else if (touchMode === 'pinch' && e.touches.length === 2) {
      // zoom względem środka uszczypnięcia
      const d = tDist(e.touches);
      const zoomNew = Math.min(2.2, Math.max(0.5, pinchZoomStart * (d / pinchStart.dist)));
      const mid = tMid(e.touches);
      const before = Camera.screenToWorld(mid.x, mid.y);
      Camera.zoom = zoomNew;
      const after = Camera.worldToScreen(before.x, before.y);
      Camera.x += mid.x - after.x;
      Camera.y += mid.y - after.y;
      // pan środkiem uszczypnięcia
      Camera.x += mid.x - pinchStart.mid.x;
      Camera.y += mid.y - pinchStart.mid.y;
      pinchStart.mid = mid; // przyrostowo: bez kumulowania przesunięcia co klatkę
    }
  }, { passive: false });
  canvas.addEventListener('touchend', e => {
    e.preventDefault();
    if (touchMode === 'pan' && e.changedTouches.length === 1 && !dragged) {
      const dx = e.changedTouches[0].clientX - tStart.x;
      const dy = e.changedTouches[0].clientY - tStart.y;
      if (Math.hypot(dx, dy) < 8 && Date.now() - tStart.t < 600) {
        // tap: jak klik lewym przyciskiem — budowa / wybór
        const w = Camera.screenToWorld(tStart.sx, tStart.sy);
        BuildMode.setHover(w.x, w.y);
        BuildMode.click();
      }
    }
    if (e.touches.length === 0) { touchMode = null; dragged = false; }
  }, { passive: false });
  canvas.addEventListener('touchcancel', () => { touchMode = null; dragged = false; }, { passive: true });
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === 'Escape') {
      BuildMode.clear();
      document.querySelectorAll('.buildItem').forEach(el => el.classList.remove('selected'));
    }
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  document.getElementById('btnSpeed').onclick = () => {
    const s = World.state();
    s.speed = s.speed === 1 ? 2 : s.speed === 2 ? 4 : 1;
    document.getElementById('btnSpeed').textContent = 'Prędkość: ×' + s.speed;
  };

  fit();
  UI.buildFactionCards();
  return { start };
})();
</script>
</body>
</html>
