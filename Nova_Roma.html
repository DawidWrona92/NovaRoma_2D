    } else if (factionId === 'slavs') { // lniana koszula z czerwoną obwódką i pasem, jasne włosy z przepaską
      ctx.fillStyle = p.accent;
      ctx.fillRect(sx - 2.6*z, y0 - 6.8*z, 5.2*z, 0.9*z);
      ctx.fillRect(sx - 2.6*z, y0 - 4.6*z, 5.2*z, 0.7*z);
      ctx.fillStyle = '#c8a050'; ctx.beginPath(); ctx.arc(sx, y0 - 12.3*z, 2.7*z, Math.PI, 0); ctx.fill();
      ctx.fillStyle = p.accent; ctx.fillRect(sx - 2.5*z, y0 - 12.6*z, 5*z, 0.8*z);
    } else {
      ctx.fillStyle = '#5a4230';
      ctx.beginPath(); ctx.moveTo(sx - 2.6*z, y0 - 12.5*z); ctx.lineTo(sx, y0 - 15.5*z);
      ctx.lineTo(sx + 2.6*z, y0 - 12.5*z); ctx.closePath(); ctx.fill();
    }
    if (c.carry) { // nosiciel: skrzynka z towarem na głowie
      ctx.fillStyle = '#8a6a45'; ctx.fillRect(sx - 3*z, y0 - 18.5*z, 6*z, 4*z);
      ctx.strokeStyle = '#5a4230'; ctx.lineWidth = 0.7*z;
      ctx.strokeRect(sx - 3*z, y0 - 18.5*z, 6*z, 4*z);
      ctx.beginPath(); ctx.moveTo(sx, y0 - 18.5*z); ctx.lineTo(sx, y0 - 14.5*z); ctx.stroke();
    }
  }

  /* plac budowy: rusztowanie + pasek postępu */
  function drawSite(ctx, sx, sy, z, p, progress) {
    ctx.fillStyle = 'rgba(140,110,70,0.35)';
    ctx.beginPath(); ctx.ellipse(sx, sy, 13*z, 5.5*z, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#7a5c3a'; ctx.lineWidth = 1.6 * z;
    ctx.beginPath();
    ctx.moveTo(sx - 10*z, sy - 2*z); ctx.lineTo(sx - 10*z, sy - 16*z);
    ctx.moveTo(sx + 10*z, sy - 2*z); ctx.lineTo(sx + 10*z, sy - 16*z);
    ctx.moveTo(sx - 10*z, sy - 10*z); ctx.lineTo(sx + 10*z, sy - 10*z);
    ctx.moveTo(sx - 10*z, sy - 15*z); ctx.lineTo(sx + 10*z, sy - 15*z);
    ctx.stroke();
    ctx.fillStyle = 'rgba(160,120,70,0.5)';
    ctx.fillRect(sx - 10*z, sy - 15*z, 20*z, 5*z);
    ctx.fillStyle = '#c8a878'; ctx.fillRect(sx - 7*z, sy - 1*z, 8*z, 1.6*z);
    ctx.fillStyle = '#9a9a92'; ctx.beginPath(); ctx.ellipse(sx + 6*z, sy - 0.5*z, 2.2*z, 1.3*z, 0, 0, 7); ctx.fill();
    const w = 24 * z;
    ctx.fillStyle = '#241c12'; ctx.fillRect(sx - w/2, sy - 23*z, w, 4*z);
    ctx.fillStyle = '#c8a04e';
    ctx.fillRect(sx - w/2 + 0.5*z, sy - 22.5*z, Math.max(0, (w - z) * progress), 3*z);
  }

  return { drawTile, ART, drawCitizen, drawSite, shade, setAnim };
})();

/* ============================= MODUL: WORLD =============================== */
const World = (() => {
  const state = {
    factionId: null, map: null, buildings: [], citizens: [],
    time: 0, speed: 1, res: {}, nextId: 1,
    pop: 14, controls: { rations: 1, tax: 1 },
    starveTimer: 0, immigrantTimer: 0, tooled: {}, staffed: {},
    saplings: [], treeFrac: 0, plantFrac: 0, welfare: {}, foodRep: null,
    workersStaffed: 0, workersNeeded: 0, waitingForTool: false,
    /* liczniki do raportów i testów */
    stats: { toolsBought: 0, toolsForged: 0, planksSpent: 0, starveMin: 0 },
    /* ustawienia scenariusza: napady na karawanę (Saraceni), reguła wysyłki Wikingów (90% robotników zostaje) */
    settings: { raids: true, voyageGuard: true, shoreSpots: 6 },
    depositLeft: null, // opcjonalne skończone złoża, np. { clay: 60 } — wyczerpanie zatrzymuje tylko budowę, nie ekonomię
    /* Etap 3 — logistyka budowy */
    sites: [], builders: 3, buildersActive: 0, buildersWorking: 0, carriers: [],
    /* Etap 4 — haracz, handel, wyprawy */
    tribute: null, marketPrices: { kadzidło: 4.2, tkanina: 3.6, ceramika: 2.4 },
    voyageMode: 'normal', crewAway: 0, voyages: [], voyageStats: { done: 0, trips: 0 },
    /* Etap 5 — świat dynamiczny */
    raids: { count: 0, lost: 0, next: 40 }, crisis: null, eventMsgs: []
  };

  function init(factionId) {
    state.factionId = factionId;
    state.map = MapGen.generate(factionId);
    state.buildings = []; state.citizens = [];
    state.time = 0; state.nextId = 1;
    state.pop = 14; state.controls = { rations: 1, tax: 1 };
    state.starveTimer = 0; state.immigrantTimer = 0;
    state.tooled = {}; state.staffed = {}; state.saplings = [];
    state.treeFrac = 0; state.plantFrac = 0;
    state.welfare = {}; state.foodRep = null; state.waitingForTool = false;
    state.stats = { toolsBought: 0, toolsForged: 0, planksSpent: 0, starveMin: 0 };
    state.settings = { raids: true, voyageGuard: true, shoreSpots: 6 };
    state.depositLeft = null;
    Data.cur.faction = factionId;
    state.sites = []; state.builders = 3;
    state.buildersActive = 0; state.buildersWorking = 0; state.carriers = [];
    state.tribute = null;
    state.marketPrices = { kadzidło: 4.2, tkanina: 3.6, ceramika: 2.4 };
    state.voyageMode = 'normal'; state.crewAway = 0; state.voyages = []; state.voyageStats = { done: 0, trips: 0 };
    state.raids = { count: 0, lost: 0, next: 40 };
    state.crisis = null; state.eventMsgs = [];
    const f = Data.FACTIONS[factionId];
    // pełny magazyn towarów wg limitów z sekcji "Magazyny"
    state.res = {};
    for (const g of Object.keys(Economy.LIMIT)) state.res[g] = 0;
    state.res.złoto = f.start.gold;
    state.res.narzędzia = f.start.tools;
    state.res.deski = f.start.wood;
    state.res.kamień = f.start.stone || 0;
    state.res.glina = f.start.clay || 0;
    state.res[f.start.foodGood] = f.start.food; // kasza Słowian liczy się jako chleb
    state.res.popularity = 50;
    // Dwór na środku (2x2)
    const c = Math.floor(state.map.size / 2) - 1;
    placeBuilding('keep', c, c, true);
    state.keep = state.buildings[0];
    for (let i = 0; i < state.pop; i++) spawnCitizen();
  }

  function placeBuilding(id, x, y, instant) {
    const b = { id, x, y, uid: state.nextId++ };
    state.buildings.push(b);
    const size = id === 'keep' ? 2 : 1;
    for (let dy = 0; dy < size; dy++) for (let dx = 0; dx < size; dx++) {
      const t = MapGen.at(state.map, x + dx, y + dy);
      if (t) t.occup = b.uid;
    }
    return b;
  }

  function canPlace(id, x, y) {
    const def = Data.BUILDINGS[id];
    const size = id === 'keep' ? 2 : 1;
    let hasWater = false, hasForest = 0;
    for (let dy = -1; dy <= size; dy++) for (let dx = -1; dx <= size; dx++) {
      const t = MapGen.at(state.map, x + dx, y + dy);
      if (!t) continue;
      if (t.h === 0) hasWater = true;
      if (t.trees > 0) hasForest += t.trees;
    }
    for (let dy = 0; dy < size; dy++) for (let dx = 0; dx < size; dx++) {
      const t = MapGen.at(state.map, x + dx, y + dy);
      if (!t || t.h !== 1 || t.occup || t.trees > 0) return { ok: false, reason: 'Zajęte lub niebudowlane pole' };
      // złoże jest zarezerwowane dla pasującej kopalni
      if (t.deposit && def.req !== 'deposit:' + t.deposit) return { ok: false, reason: 'Złoże — miejsce tylko na kopalnię' };
    }
    if (def.req === 'forest' && hasForest < 4) return { ok: false, reason: 'Wymaga lasu w pobliżu' };
    if (def.req === 'shore' && !hasWater) return { ok: false, reason: 'Wymaga brzegu morza' };
    if (id === 'fisherhut') {
      const spots = state.settings.shoreSpots ?? 6; // miejsca pod Chaty rybaka na wybrzeżu (parametr generatora map)
      const used = state.buildings.filter(b => b.id === 'fisherhut').length + state.sites.filter(st => st.id === 'fisherhut').length;
      if (used >= spots) return { ok: false, reason: 'Brzeg pełny: maks. ' + spots + ' Chat rybaka (spec.)' };
    }
    if (def.req === 'waterEdge' && !hasWater) return { ok: false, reason: 'Wymaga bezpośredniego dostępu do wody' };
    if (def.req && def.req.startsWith('deposit:')) {
      const kind = def.req.split(':')[1];
      const t = MapGen.at(state.map, x, y);
      if (!t.deposit || t.deposit !== kind) return { ok: false, reason: 'Wymaga złoża (' + kind + ')' };
    }
    if (id === 'ship' && !state.buildings.some(b => b.id === 'dock'))
      return { ok: false, reason: 'Okręt wymaga Przystani' };
    return { ok: true };
  }

  function costOf(id) {
    const f = World.state().factionId;
    const raw = Data.BUILDINGS[id].costs[f];
    return raw ? { ...raw } : {};
  }

  function canAfford(id) {
    const c = costOf(id);
    const r = state.res;
    if ((c.d || 0) > r.deski) return false;
    if ((c.k || 0) > (r.kamień || 0)) return false;
    if ((c.gl || 0) > (r.glina || 0)) return false;
    if ((c.zl || 0) > r.złoto) return false;
    return true;
  }

  function build(id, x, y) {
    const c = costOf(id);
    if (!canAfford(id)) return false;
    const check = canPlace(id, x, y);
    if (!check.ok) return false;
    state.res.deski -= (c.d || 0);
    state.res.kamień = (state.res.kamień || 0) - (c.k || 0);
    state.res.glina = (state.res.glina || 0) - (c.gl || 0);
    state.res.złoto -= (c.zl || 0);
    placeBuilding(id, x, y);
    return true;
  }

  function placeFree(id, x, y) {
    if (!canPlace(id, x, y).ok) return false;
    placeBuilding(id, x, y);
    return true;
  }

  function spawnCitizen() {
    const p = Data.FACTIONS[state.factionId].palette;
    const keep = state.keep;
    state.citizens.push({
      x: keep.x + 1 + RNG.range(-1, 1), y: keep.y + 2 + RNG.range(0, 2),
      tx: keep.x + 1, ty: keep.y + 2,
      phase: RNG.range(0, 6.28),
      color: RNG.next() < 0.5 ? p.citizen : p.citizenAlt,
      speed: 0.25
    });
  }

  /* --- drzewa jako globalny zasób mapy --- */
  function treeCount() {
    let n = 0;
    for (const t of state.map.tiles) n += t.trees;
    return n;
  }
  function addTree() {
    const tiles = state.map.tiles;
    for (let tries = 0; tries < 30; tries++) {
      const t = tiles[RNG.int(0, tiles.length - 1)];
      if (t.h === 1 && !t.occup && t.trees < 3 && !t.deposit) { t.trees++; return true; }
    }
    return false;
  }
  function takeTrees(n) {
    state.treeFrac += n;
    while (state.treeFrac >= 1) {
      let done = false;
      for (let tries = 0; tries < 40 && !done; tries++) {
        const t = state.map.tiles[RNG.int(0, state.map.tiles.length - 1)];
        if (t.trees > 0) { t.trees--; done = true; }
      }
      state.treeFrac -= 1;
      if (!done) { state.treeFrac = 0; break; }
    }
  }

  function tick(dt) { // dt w minutach gry
    state.time += dt;
    Economy.tick(dt);
    Build.tick(dt); // kolejka placów, budowniczowie (po Economy — zna obsadę)
    Tribute.tick(dt); // haracz, sprzedaż na Targu, wyprawy Wikingów
    Events.tick(dt); // napady na karawany, kryzysy
    // liczba figurek = ludność
    const target = Math.floor(state.pop);
    while (state.citizens.length < target) spawnCitizen();
    while (state.citizens.length > target) state.citizens.pop();
    for (const c of state.citizens) {
      const dx = c.tx - c.x, dy = c.ty - c.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 0.05) {
        const anchor = state.buildings.length > 1 && RNG.next() < 0.6
          ? RNG.pick(state.buildings) : state.keep;
        c.tx = anchor.x + RNG.range(-1.5, 1.5);
        c.ty = anchor.y + RNG.range(-1.5, 1.5);
      } else {
        c.x += (dx / dist) * c.speed * dt;
        c.y += (dy / dist) * c.speed * dt;
      }
    }
    /* --- nosiciele (wizualni): obsadzony producent zanosi towar
       do najbliższego Składu / Dworu; ekonomia pozostaje nominalna --- */
    for (const b of state.buildings) {
      if (b.id === 'keep') continue;
      const def = Data.BUILDINGS[b.id];
      const out = def.out ? Object.keys(def.out)[0] : null;
      if (!out || !(out in Economy.LIMIT)) continue;
      b.carrierT = (b.carrierT ?? RNG.range(0, 2)) - dt;
      if (b.carrierT > 0 || !state.staffed[b.uid] || state.carriers.length >= 12) continue;
      b.carrierT = 2 + RNG.range(0, 1.5);
      let best = state.keep, bd = 1e9; // najbliższy Skład, w razie braku — Dwór
      for (const t of state.buildings) {
        if (t.id !== 'store' && t.id !== 'keep') continue;
        const d = Math.abs(t.x - b.x) + Math.abs(t.y - b.y);
        if (d < bd) { bd = d; best = t; }
      }
      const p = Data.FACTIONS[state.factionId].palette;
      state.carriers.push({
        x: b.x + 0.5, y: b.y + 0.5, tx: best.x + 0.5, ty: best.y + 0.5,
        carry: out, phase: RNG.range(0, 6.28),
        color: RNG.next() < 0.5 ? p.citizen : p.citizenAlt, speed: 0.35
      });
    }
    for (let i = state.carriers.length - 1; i >= 0; i--) {
      const c = state.carriers[i];
      const dx = c.tx - c.x, dy = c.ty - c.y, dist = Math.hypot(dx, dy);
      if (dist < 0.1) { state.carriers.splice(i, 1); continue; } // rozładowany
      c.x += (dx / dist) * c.speed * dt;
      c.y += (dy / dist) * c.speed * dt;
    }
  }

  function state$() { return state; }
  return { init, state: state$, build, placeFree, placeBuilding, canPlace, canAfford, costOf,
           tick, spawnCitizen, treeCount, addTree, takeTrees };
})();

/* ============================= MODUL: ECONOMY ==============================
   Ekonomia przepływowa (spec v3.6): obsada, produkcja, popularność, imigracja/głód,
   narzędzia z zaworami bezpieczeństwa, magazyny z limitami, las odnawialny,
   Puszcza (plon leśnych budynków zależny od gęstości lasu), budynki wielowyjściowe.
   Moduł jest czystą funkcją stanu — bot testujący może wołać Economy.tick()
   bez renderowania gry. */
const Economy = (() => {
  const LIMIT = { 'pień':100, deski:250, 'kamień':300, glina:300, zboże:40, mąka:40, woda:40,
    chleb:150, mięso:150, ser:150, owoce:150, daktyle:150, ryby:150,
    ruda:40, węgiel:40, sztabki:40, 'narzędzia':10, broń:60,
    żywica:40, kadzidło:40, winogrona:40, wino:60, 'miód pitny':60,
    bawełna:40, tkanina:60, ceramika:60,
    /* Słowianie: spec nie podaje limitów — półprodukty jak inne (40), towary daniny jak jedzenie (150);
       faktyczną pojemność wyznacza i tak wzór z capOf (6 × producenci + 20 + 80 × Składy) */
    plaster:40, 'futro surowe':40, 'futro wyprawione':150, 'miód':150, wosk:150 };
  const FOODS = ['ryby','chleb','mięso','ser','owoce','daktyle']; // ryby schodzą pierwsze
  /* gdy ludzi brakuje, najpierw obsadzane są budynki żywności */
  const FOOD_PRIORITY = ['hunter','dairy','orchard','gatherer','watercarrier','qanat','farm','field','mill','kasha','bakery','dategrove','fisherhut'];
  const MINE_EATERS = { ironmine:0.5, coalmine:0.5, incense:0.5, peatmine:0.25 };
  const DOBRO = { franks:'wino', saracens:'kadzidło', vikings:'miód pitny', slavs:'wosk' };
  const TAX_INCOME = [0, 0.05, 0.10, 0.15];
  const RATIONS_POP = { 0.5:-25, 1:0, 1.5:8, 2:15 };
  const TAX_POP = { 0:8, 1:0, 2:-8, 3:-16 };
  /* kolejność przetwarzania w ticku: woda i drewno → surowce → przetwórstwo → Dobrobyt.
     Kolejność ma znaczenie tylko tam, gdzie dwa budynki sięgają po ten sam towar w jednym ticku (spec). */
  const PROD_ORDER = ['qanat','watercarrier','woodcutter','forester','fisherhut','peatmine','claypit','quarry',
    'ironmine','coalmine','hunter','dairy','orchard','gatherer','field','farm','dategrove','cotton','incensewood',
    'vineyard','bartnik','trapper','charburner','sawmill','mill','kasha','winery','smelter','bakery','incense',
    'toolforge','armory','mead','weaver','pottery','waxery','tannery','sauna','temple','bathhouse'];
  const ORDER_IDX = {}; PROD_ORDER.forEach((id, i) => { ORDER_IDX[id] = i; });
  const orderOf = id => (id in ORDER_IDX ? ORDER_IDX[id] : 50);

  /* wyjścia budynku jako tablica [towar, tempo]; pierwsze jest wyjściem głównym */
  function outsOf(id) { const d = Data.BUILDINGS[id].out; return d ? Object.entries(d) : []; }
  function outGood(id) { const o = outsOf(id); return o.length ? o[0][0] : null; }
  function outRate(id) { const o = outsOf(id); return o.length ? o[0][1] : 0; }
  function isFoodOut(id) { return outsOf(id).some(([g]) => FOODS.includes(g)); }

  /* mnożniki Wikingów: drwal 1,3; leśnik 2,0; tartak 1,3 (→2,6 deski) */
  const VIK_RATE = { woodcutter: 1.3, forester: 2.0, sawmill: 1.3 };
  function vikScale(id) {
    return World.state().factionId === 'vikings' ? (VIK_RATE[id] || 1) : 1;
  }
  /* gęstość lasu: plon × min(1, drzewa / próg nacji) dla budynków z flagą forest */
  function forestMult(s, def, treeTotal) {
    return def.forest ? Math.min(1, treeTotal / Data.FOREST_REF[s.factionId]) : 1;
  }

  function totalFood(res) { return FOODS.reduce((a, g) => a + (res[g] || 0), 0); }
  function foodRate(s) { return s.pop / 6 * s.controls.rations; }
  function housing(s) {
    const per = s.factionId === 'vikings' ? 8 : 6;
    return 20 + s.buildings.reduce((a, b) => a + (b.id === 'hut' ? per : 0), 0);
  }
  /* pojemność towaru w osadzie: min(limit, 6 × czynni producenci + 20 (komora Dworu) + 80 × Składy) */
  function capOf(s, good) {
    let producers = 0, stores = 0;
    for (const b of s.buildings) {
      if (b.id === 'store') stores++;
      else if (s.staffed[b.uid] && outsOf(b.id).some(([g]) => g === good)) producers++;
    }
    return Math.min(LIMIT[good] ?? Infinity, 6 * producers + 20 + 80 * stores);
  }
  function popularity(s) {
    let p = 50 + (RATIONS_POP[s.controls.rations] ?? 0) + (TAX_POP[s.controls.tax] ?? 0);
    const kinds = FOODS.filter(g => s.res[g] > 5).length;
    if (kinds > 1) p += 4 * (kinds - 1);
    /* Dobrobyt: obsłużone budynki (zasilone w poprzednim ticku) × 50 osób ≥ ludność */
    const w = s.welfare || {};
    if ((w.temple || 0) > 0 && w.temple * 50 >= s.pop) p += 10;
    const baths = (w.bathhouse || 0) + (w.sauna || 0);
    if (baths > 0 && baths * 50 >= s.pop) p += 6;
    return Math.max(0, Math.min(100, p));
  }

  /* --- potencjał jedzenia: produkcja przy dostępnych wejściach (chleb liczy Piekarnia, Farma i Młyn nie) ---
     Wejście jest dostępne, gdy leży w magazynie albo wytwarza je obsadzony budynek, który sam ma wejścia. */
  function producibleSet(s) {
    const memo = new Map();
    const inputOk = (g, need) => (s.res[g] || 0) >= need ||
      s.buildings.some(b => outsOf(b.id).some(([og]) => og === g) && working(b));
    const working = b => {
      if (memo.has(b.uid)) return memo.get(b.uid);
      memo.set(b.uid, false); // blokada cykli
      let ok = !!s.staffed[b.uid];
      if (ok) { const inp = Data.BUILDINGS[b.id].inp || {}; for (const g in inp) if (!inputOk(g, inp[g])) { ok = false; break; } }
      memo.set(b.uid, ok);
      return ok;
    };
    return working;
  }
  function potentialFood(s) {
    const treeTotal = World.treeCount();
    const working = producibleSet(s);
    let pot = 0;
    for (const b of s.buildings) {
      if (!isFoodOut(b.id)) continue;
      const def = Data.BUILDINGS[b.id];
      if (!def.worker || !working(b)) continue;
      const k = forestMult(s, def, treeTotal);
      for (const [g, r] of outsOf(b.id)) if (FOODS.includes(g)) pot += r * k;
    }
    return pot;
  }
  /* bilans jedzenia do bramki imigracji i interfejsu: zużycie = ludzie + budowniczowie w pracy + kopalnie/wytwórnie;
     P_max to największa ludność, przy której brama (110% zużycia) jeszcze się otwiera */
  function foodReport(s) {
    const potential = potentialFood(s);
    const people = foodRate(s);
    const builders = (s.buildersWorking || 0) * 0.5 / 6 * s.controls.rations;
    let buildings = 0;
    for (const b of s.buildings) { const e = MINE_EATERS[b.id]; if (e && s.staffed[b.uid]) buildings += e; }
    const perPerson = s.controls.rations / 6;
    const room = Math.max(0, potential / 1.1 - builders - buildings);
    return { potential, people, builders, buildings, consumption: people + builders + buildings,
             pmax: Math.floor(room / perPerson) + 1 };
  }

  /* --- obsada: budynki żywności pierwszeństwo, potem reszta --- */
  function staff(s, dt) {
    s.staffed = {}; s.workersNeeded = 0;
    // budowniczowie i załoga na wyprawie zajmują ludzi; pracownicy budynków mają pierwszeństwo
    let free = Math.floor(s.pop) - (s.buildersActive || 0) - (s.crewAway || 0);
    let waitingTool = false;
    const prio = id => { const i = FOOD_PRIORITY.indexOf(id); return i === -1 ? 99 : i; };
    const order = [...s.buildings].sort((a, b) => prio(a.id) - prio(b.id));
    for (const b of s.buildings) b.st = null;
    for (const b of order) {
      const def = Data.BUILDINGS[b.id];
      if (!def.worker || b.id === 'keep') continue;
      s.workersNeeded++;
      if (free < 1) { b.st = { c: 'nostaff' }; continue; } // narzędzie zużywamy dopiero przy faktycznym obsadzeniu
      if (def.tool && !s.tooled[b.uid]) {
        if (s.res.narzędzia >= 1) { s.res.narzędzia -= 1; s.tooled[b.uid] = true; }
        else { waitingTool = true; b.st = { c: 'tool' }; continue; }
      }
      s.staffed[b.uid] = true; free--;
    }
    s.workersStaffed = Object.keys(s.staffed).length;
    s.waitingForTool = waitingTool;
    // zawory bezpieczeństwa narzędzi
    if (waitingTool) {
      if (s.res.narzędzia < 1) { // kuźnia zamkowa: ok. 1 narzędzie na 8 min, aż do pełnej sztuki
        const before = s.res.narzędzia;
        s.res.narzędzia = Math.min(1, s.res.narzędzia + 0.125 * dt);
        s.stats.toolsForged += s.res.narzędzia - before;
      }
      const marketOn = s.buildings.some(b => b.id === 'market' && s.staffed[b.uid]);
      // zakup na Targu 20 zł, ale rezerwa na żołd (Frankowie) nietykalna
      if (marketOn && s.res.złoto >= 20 + (Tribute.soldierReserve ? Tribute.soldierReserve(s) : 0) && s.res.narzędzia < 1) {
        s.res.złoto -= 20;
        s.res.narzędzia = Math.min(LIMIT['narzędzia'], s.res.narzędzia + 1);
        s.stats.toolsBought++;
      }
    }
  }

  function tick(dt) {
    if (dt <= 0) return;
    const s = World.state();
    const res = s.res;
    staff(s, dt);
    const pop = popularity(s);
    res.popularity = pop;
    const popMult = Math.min(1.2, Math.max(0.8, 1 + 0.004 * (pop - 50)));
    const starving = s.starveTimer >= 5;
    const food5min = foodRate(s) * 5;
    const treeTotal = World.treeCount(); // raz na tick, nie przy każdym budynku
    const fed = { temple: 0, bathhouse: 0, sauna: 0 }; // Dobrobyt liczony na nowo w tym ticku
    const producers = s.buildings.filter(b => b.id !== 'keep' && Data.BUILDINGS[b.id].worker && s.staffed[b.uid])
      .sort((a, b) => orderOf(a.id) - orderOf(b.id));

    /* wejścia dla kilku odbiorców (pnie: Tartak, Wypalarka, Garncarnia, Bania; węgiel: Huta i Zbrojownia;
       sztabki, woda…): gdy popyt przekracza zapas, każdy dostaje ten sam ułamek (spec). Ułamek liczony przy
       pierwszym odbiorcy z bieżącego zapasu (producenci są wcześniej w kolejce), więc sam się koryguje —
       bez tego Huta zawłaszcza jedyny węgiel i Zbrojownia stoi, aż zapas sztabek dobije do limitu. */
    const demand = {}, ration = {};
    for (const b of producers) {
      const inp = Data.BUILDINGS[b.id].inp; if (!inp) continue;
      const sc = vikScale(b.id);
      for (const g in inp) demand[g] = (demand[g] || 0) + inp[g] * sc * dt;
    }

    /* --- produkcja --- */
    for (const b of producers) {
      const def = Data.BUILDINGS[b.id];
      // kopalnie i wytwórnia kadzidła jedzą tylko z nadwyżki
      if (MINE_EATERS[b.id] && totalFood(res) < food5min) { b.st = { c: 'food' }; continue; }
      // Dobrobyt: kościół/meczet/kapliczka spala dobro nacji (0,3/min)
      if (b.id === 'temple') {
        const good = DOBRO[s.factionId];
        if (res[good] >= 0.3 * dt) { res[good] -= 0.3 * dt; fed.temple++; }
        else b.st = { c: 'in', g: good };
        continue;
      }
      const dk = def.req && def.req.startsWith('deposit:') ? def.req.slice(8) : null; // złoże może być skończone
      if (dk && s.depositLeft && s.depositLeft[dk] !== undefined && s.depositLeft[dk] <= 0) { b.st = { c: 'depleted', g: dk }; continue; }
      const outs = outsOf(b.id);
      const sc = vikScale(b.id);
      const inp = def.inp || {};
      let frac = 1, limit = null;
      for (const g in inp) {
        const need = inp[g] * sc * dt;
        if (need <= 0) continue;
        if (ration[g] === undefined) ration[g] = demand[g] > 0 ? Math.min(1, res[g] / demand[g]) : 1;
        const k = ration[g];
        if (k < frac) { frac = k; limit = g; }
      }
      if (limit !== null && frac < 0.999) b.st = { c: 'in', g: limit };
      if (b.id === 'woodcutter') {
        const k = treeTotal / (outRate('woodcutter') * sc * dt);
        if (k < frac) { frac = k; b.st = { c: 'in', g: 'drzewa' }; }
      }
      frac *= forestMult(s, def, treeTotal);
      const hungerK = (starving && !isFoodOut(b.id)) ? 0.75 : 1;
      // pełny magazyn wyjścia zatrzymuje budynek BEZ zużywania wejść (spec.)
      for (const [og, rate] of outs) {
        if (!(og in LIMIT)) continue;
        const maxOut = rate * sc * popMult * hungerK * dt;
        if (maxOut > 0) {
          const k = Math.max(0, capOf(s, og) - res[og]) / maxOut;
          if (k < frac) { frac = k; if (k < 0.999) b.st = { c: 'full', g: og }; }
        }
      }
      frac = Math.max(0, Math.min(1, frac));
      for (const g in inp) res[g] = Math.max(0, res[g] - inp[g] * sc * frac * dt);
      b.eff = frac * popMult * hungerK; // do pokazania w interfejsie
      if (def.welfare && frac >= 0.999) fed[b.id]++;
      for (const [og, rate] of outs) {
        // Leśniczówka: sadzonki dojrzewają po czasie nacji
        if (og === 'sadzonki') {
          // akumulacja ułamkowa — przy małym dt produkcja < 1 sadzonki/tick
          s.plantFrac += rate * sc * frac * popMult * dt;
          const growth = Data.FACTIONS[s.factionId].treeGrowthMin;
          while (s.plantFrac >= 1) { s.plantFrac -= 1; s.saplings.push({ t: s.time + growth }); }
          continue;
        }
        if (!(og in LIMIT)) continue;
        const room = Math.max(0, capOf(s, og) - res[og]);
        let made = Math.min(rate * sc * frac * popMult * hungerK * dt, room);
        if (dk && s.depositLeft && s.depositLeft[dk] !== undefined) { made = Math.min(made, s.depositLeft[dk]); s.depositLeft[dk] -= made; }
        res[og] += made;
        if (b.id === 'woodcutter') World.takeTrees(made);
      }
    }
    s.welfare = fed;
    // dojrzałe sadzonki stają się drzewami
    s.saplings = s.saplings.filter(sp => {
      if (s.time >= sp.t) { World.addTree(); return false; }
      return true;
    });

    /* --- zawory Dworu --- */
    // piła zamkowa: zawsze przerabia do 0,6 pnia/min na deski (1:1), jeśli są pnie
    if (res['pień'] > 0) {
      const conv = Math.min(0.6 * dt, res['pień']);
      const room = Math.max(0, capOf(s, 'deski') - res.deski);
      const used = Math.min(conv, room);
      res['pień'] -= used;
      res.deski += used;
    }
    if (s.factionId === 'franks' && !s.buildings.some(b => b.id === 'quarry') && res['kamień'] < 6)
      res['kamień'] = Math.min(6, res['kamień'] + 0.4 * dt);
    if (s.factionId === 'saracens' && !s.buildings.some(b => b.id === 'claypit') && res['glina'] < 6)
      res['glina'] = Math.min(6, res['glina'] + 0.4 * dt);

    /* --- jedzenie --- */
    let need = foodRate(s) * dt;
    // budowniczowie w pracy jedzą 1,5 racji (dodatek 0,5 × 1/6 porcji/min)
    need += (s.buildersWorking || 0) * 0.5 / 6 * s.controls.rations * dt;
    for (const b of s.buildings) {
      const e = MINE_EATERS[b.id];
      if (e && s.staffed[b.uid] && totalFood(res) >= food5min) need += e * dt;
    }
    const fish = Math.min(res['ryby'], need);
    res['ryby'] -= fish; need -= fish;
    if (need > 0) {
      const others = FOODS.slice(1);
      const tot = others.reduce((a, g) => a + res[g], 0);
      if (tot > 0) {
        // proporcjonalny rozdział z oryginalnej potrzeby, liczony globalnie
        const takeTot = Math.min(tot, need);
        for (const g of others) res[g] -= takeTot * (res[g] / tot);
        need -= takeTot;
      }
    }
    const shortfall = need;
    if (shortfall > 0.0001) s.starveTimer += dt;
    else s.starveTimer = 0;
    if (s.starveTimer > 5) { s.pop = Math.max(10, s.pop - dt); s.stats.starveMin += dt; } // głód: 1 osoba/min

    /* --- podatki --- */
    res.złoto += TAX_INCOME[s.controls.tax] * s.pop * dt;

    /* --- imigracja: brak głodu, potencjał jedzenia ≥ 110% zużycia, miejsce w chatach, popularność ≥ 45 --- */
    const rep = foodReport(s);
    s.foodRep = rep;
    const ok = shortfall <= 0.0001 &&
      rep.potential >= 1.1 * rep.consumption &&
      s.pop < housing(s) &&
      pop >= 45;
    if (ok) {
      s.immigrantTimer += dt;
      const interval = 0.5 * 50 / Math.max(10, pop);
      if (s.immigrantTimer >= interval) { s.immigrantTimer = 0; s.pop += 1; }
    } else s.immigrantTimer = 0;
  }

  return { tick, LIMIT, FOODS, MINE_EATERS, DOBRO, popularity, housing, capOf, potentialFood, foodReport, foodRate,
           totalFood, outsOf, outGood, isFoodOut, forestMult, orderOf };
})();

/* ====================== MODUL: BUILD (Etap 3: logistyka) =================== */
/* Budowniczowie rekrutowani z wolnej ludności sami noszą materiały i budują.
   Reguły wg specyfikacji v3.5 ("Budowniczowie i budowa"):
   - złoto pobierane przy otwarciu placu, materiały — przy wniesieniu;
   - noszenie 0,2 min budowniczego na sztukę; budowa 1,0 + 0,1 min na sztukę,
     przydzieleni budowniczowie budują razem;
   - 1 budowniczy na plac; plac > 20 szt. dostaje +1 na każde 20 (max 3;
     Okręt 2, Przystań 1); gang: domyślnie 3, min 2, max 5;
   - plac bez ani jednej dostępnej sztuki materiału nie zajmuje budowniczych;
   - place w kolejce gracza; wcześniejszy plac ma pierwszeństwo do materiałów. */
const Build = (() => {
  const MAT = { d: 'deski', k: 'kamień', gl: 'glina' };
  const PIECE_MIN = 0.2;  // min noszenia na sztukę materiału
  const BASE_WORK = 1.0;  // stały czas budowy
  const PER_PIECE = 0.1;  // czas budowy na sztukę materiału

  function piecesOf(cost) { let n = 0; for (const k in cost) if (MAT[k]) n += cost[k]; return n; }
  function deliveredOf(site) { let n = 0; for (const g in site.need) n += (site.got[g] || 0); return n; }

  function enqueue(id, x, y) {
    const s = World.state();
    const check = World.canPlace(id, x, y);
    if (!check.ok) return check;
    // pierwsza Chata drwala darmowa — także gdy pierwszy plac jest dopiero w kolejce
    const free = id === 'woodcutter' &&
      !s.buildings.some(b => b.id === 'woodcutter') &&
      !s.sites.some(st => st.id === 'woodcutter');
    const cost = free ? {} : World.costOf(id);
    // rezerwa złota na żołd brakujących żołnierzy (Frankowie) nietykalna
    const reserve = Tribute.soldierReserve ? Tribute.soldierReserve(s) : 0;
    if ((cost.zl || 0) > s.res.złoto - reserve) return { ok: false, reason: 'Brak złota (rezerwa na żołd)!' };
    s.res.złoto -= (cost.zl || 0); // złoto przy otwarciu placu
    const site = { id, x, y, uid: s.nextId++, need: {}, got: {}, work: 0,
      gold: cost.zl || 0, pieces: piecesOf(cost),
      workNeed: BASE_WORK + PER_PIECE * piecesOf(cost), assigned: 0 };
    for (const k in cost) if (MAT[k]) site.need[MAT[k]] = cost[k];
    s.sites.push(site);
    // rezerwacja kafli pod plac
    const size = id === 'keep' ? 2 : 1;
    for (let dy = 0; dy < size; dy++) for (let dx = 0; dx < size; dx++) {
      const t = MapGen.at(s.map, x + dx, y + dy);
      if (t) t.occup = site.uid;
    }
    return { ok: true };
  }

  function siteAt(x, y) {
    return World.state().sites.find(st => st.x === x && st.y === y) || null;
  }

  function cancel(site) { // anulowanie placu: materiały i złoto wracają
    const s = World.state();
    for (const g in site.need) s.res[g] += (site.got[g] || 0);
    s.stats.planksSpent -= (site.got.deski || 0);
    s.res.złoto += site.gold;
    const size = site.id === 'keep' ? 2 : 1;
    for (let dy = 0; dy < size; dy++) for (let dx = 0; dx < size; dx++) {
      const t = MapGen.at(s.map, site.x + dx, site.y + dy);
      if (t && t.occup === site.uid) t.occup = null;
    }
    s.sites.splice(s.sites.indexOf(site), 1);
  }

  function complete(site) {
    const s = World.state();
    s.sites.splice(s.sites.indexOf(site), 1);
    World.placeBuilding(site.id, site.x, site.y); // nadpisuje rezerwację placu
  }

  function tick(dt) {
    const s = World.state();
    // gang budowniczych: ustawienie 2–5; rekrutacja z wolnej ludności,
    // pracownicy budynków mają pierwszeństwo, ale gang nie schodzi poniżej 2
    const setting = Math.max(2, Math.min(5, s.builders));
    const freePop = Math.floor(s.pop) - s.workersStaffed - (s.crewAway || 0);
    const active = Math.max(2, Math.min(setting, freePop));
    s.buildersActive = active;
    // dostępne materiały — wcześniejszy plac w kolejce bierze pierwszeństwo
    const avail = {};
    for (const g in s.res) if (typeof s.res[g] === 'number' && g !== 'popularity') avail[g] = s.res[g];
    const claimed = {}; // rezerwacja brakujących sztuk przez wcześniejsze place
    let left = active, working = 0;
    for (const site of [...s.sites]) { // kopia: complete() usuwa plac z s.sites w trakcie pętli
      site.assigned = 0;
      const missing = site.pieces - deliveredOf(site);
      if (missing > 0.0001) {
        // plac bez ani jednej dostępnej sztuki (po rezerwacji wcześniejszych) nie zajmuje budowniczych
        let any = false;
        for (const g in site.need)
          if ((site.got[g] || 0) < site.need[g] &&
              (avail[g] || 0) - (claimed[g] || 0) >= 0.001) any = true;
        if (!any) continue;
      }
      if (left < 1) continue;
      const cap = site.id === 'ship' ? 2 : site.id === 'dock' ? 1
        : Math.min(3, 1 + Math.floor(site.pieces / 20));
      site.assigned = Math.min(cap, left);
      left -= site.assigned;
      working += site.assigned;
      // etap 1: noszenie — 0,2 min budowniczego na sztukę
      if (missing > 0.0001) {
        for (const g in site.need)
          claimed[g] = (claimed[g] || 0) + (site.need[g] - (site.got[g] || 0));
        let budget = site.assigned / PIECE_MIN * dt;
        for (const g in site.need) {
          const miss = site.need[g] - (site.got[g] || 0);
          if (miss <= 0 || budget <= 0.0001) continue;
          const eff = (avail[g] || 0) - (claimed[g] || 0) + miss; // własna rezerwacja nie blokuje
          const take = Math.min(miss, Math.max(0, eff), budget);
          if (take > 0) {
            site.got[g] = (site.got[g] || 0) + take;
            avail[g] -= take; s.res[g] = Math.max(0, s.res[g] - take); budget -= take;
            if (g === 'deski') s.stats.planksSpent += take;
          }
        }
      }
      // etap 2: budowa — przydzieleni budowniczowie budują razem
      if (deliveredOf(site) >= site.pieces - 1e-9) {
        site.work += site.assigned * dt;
        if (site.work >= site.workNeed) complete(site);
      }
    }
    s.buildersWorking = working;
  }

  function progressOf(site) { // do rysowania i HUD: 50% noszenie + 50% budowa
    const carry = site.pieces ? Math.min(1, deliveredOf(site) / site.pieces) : 1;
    const work = Math.min(1, site.work / site.workNeed);
    return carry * 0.5 + work * 0.5;
  }

  return { enqueue, siteAt, cancel, tick, progressOf };
})();

/* ===================== MODUL: TRIBUTE (Etap 4: haracz seniora) ============== */
/* Haracz jest jedyną presją w grze. Poziom L żąda 2L osobominut pracy na minutę;
   nacje płacą własną jednostką: Frankowie żołnierzem (broń + 3 zł żołdu + osoba),
   Saraceni złotem z handlu (krzywe cen na Targu), Wikingowie wyprawą okrętu,
   Słowianie koszykiem daniny (futro wyprawione, miód, wosk — wartość w osobominutach).
   Terminy co 15 min od pierwszego (60 / 50 / 110 / 60), żądanie skumulowane,
   wyprawy zaokrąglane w dół, ogłoszenie 30 min przed pierwszym terminem. */
const Tribute = (() => {
  /* presety trudności: poziom haraczu zależy od nacji (spec: Łatwy 3/3/3/3, Normalny 5/5/5/6,
     Trudny 6/6/6/8, Mistrz 10/7/12/11); scenarzysta może też podać poziom 1–11 ('custom') */
  const PRESET_LEVEL = {
    easy:   { franks: 3,  saracens: 3, vikings: 3,  slavs: 3 },
    normal: { franks: 5,  saracens: 5, vikings: 5,  slavs: 6 },
    hard:   { franks: 6,  saracens: 6, vikings: 6,  slavs: 8 },
    master: { franks: 10, saracens: 7, vikings: 12, slavs: 11 }
  };
  const PRESET_LABEL = { off: 'Wyłączony', easy: 'Łatwy', normal: 'Normalny', hard: 'Trudny', master: 'Mistrz', custom: 'Własny' };
  const FIRST_TERM = { franks: 60, saracens: 50, vikings: 110, slavs: 60 };
  const TERM_EVERY = 15;
  // wartość żądana na jednostkę czasu (na 15 min), wg tabeli "Skala poziomów"
  const RATE = {
    franks:  [0, 1.6, 3.2, 4.7, 6.3, 7.9, 9.5, 11.1, 12.6, 14.2, 15.8, 17.4],
    saracens:[0, 27, 54, 81, 108, 135, 162, 189, 216, 243, 270, 297],
    vikings: [0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5],
    slavs:   [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330]
  };
  const UNIT = { franks: 'żołn.', saracens: 'zł', vikings: 'wypr.', slavs: 'os.min.' };
  const TRADE = { kadzidło: { base: 4.2, floor: 0.9 }, tkanina: { base: 3.6, floor: 0.9 },
                  ceramika: { base: 2.4, floor: 0.6 } };
  /* łańcuch, który trzeba mieć na pierwszy termin (lista brakujących w ogłoszeniu) */
  const NEED_LIST = {
    franks: ['barracks', 'ironmine', 'coalmine', 'smelter', 'armory'],
    saracens: ['market', 'watercarrier', 'incensewood', 'incense'],
    vikings: ['mead', 'watercarrier', 'peatmine', 'charburner', 'smelter', 'armory', 'dock', 'ship'],
    slavs: ['bartnik', 'waxery', 'trapper', 'tannery', 'watercarrier', 'store']
  };

  function labelOf(t) {
    if (!t) return PRESET_LABEL.off;
    return t.preset === 'master' ? 'Mistrz (poz. ' + t.level + ')'
         : t.preset === 'custom' ? 'Poziom ' + t.level
         : PRESET_LABEL[t.preset] + ' (poz. ' + t.level + ')';
  }

  function set(preset, customLevel) {
    const s = World.state();
    if (preset === 'off') { s.tribute = null; return 'Haracz wyłączony'; }
    const level = preset === 'custom'
      ? Math.max(1, Math.min(11, Math.round(customLevel || 1)))
      : PRESET_LEVEL[preset][s.factionId];
    s.tribute = { preset, level, firstTerm: FIRST_TERM[s.factionId], announced: false, msgShown: false,
      terms: 0, met: 0, missed: 0, delivered: 0, soldierFrac: 0, byGood: {}, log: [], lastOk: null };
    return 'Haracz: ' + labelOf(s.tribute);
  }

  function requiredCum(level, faction, n) {
    const table = RATE[faction];
    // poziom spoza tabeli (np. Wikingowie "Mistrz" = 12) liczony liniowo od poziomu 1
    const perTerm = table[level] !== undefined ? table[level] : table[1] * level;
    return Math.floor(perTerm * n);
  }

  /* Frankowie: złoto potrzebne na żołd brakujących do najbliższego terminu
     żołnierzy — rezerwa nietykalna przy zakupach. */
  function soldierReserve(s) {
    const t = s.tribute;
    if (!t || s.factionId !== 'franks' || !t.announced) return 0;
    const upcoming = requiredCum(t.level, 'franks', Math.max(1, t.terms + 1));
    return 3 * Math.max(0, upcoming - t.delivered);
  }

  function missingChain(s) {
    const seen = new Set(), out = [];
    for (const id of (NEED_LIST[s.factionId] || [])) {
      if (s.buildings.some(b => b.id === id)) continue;
      const nm = Data.nameOf(id);
      if (!seen.has(nm)) { seen.add(nm); out.push(nm); }
    }
    return out;
  }

  function tick(dt) {
    const s = World.state();
    marketTick(s, dt);
    if (s.factionId === 'vikings') voyagesTick(s, dt);
    const t = s.tribute;
    if (!t) return;
    // ogłoszenie 30 min przed pierwszym terminem, z listą brakujących budynków
    if (!t.announced && s.time >= t.firstTerm - 30) {
      const missing = missingChain(s);
      t.announced = true;
      t.announceMsg = 'Senior żąda haraczu (poziom ' + t.level + ') — pierwsza rata za 30 min' +
        (missing.length ? '. Brakuje: ' + missing.join(', ') : '');
    }
    if (s.factionId === 'franks') soldiersTick(s, t, dt);
    // termin haraczu co 15 min; żądanie skumulowane od pierwszego terminu
    if (s.time >= t.firstTerm + t.terms * TERM_EVERY) {
      const required = requiredCum(t.level, s.factionId, t.terms + 1);
      let ok;
      if (s.factionId === 'saracens') { // płatność złotem — ze skarbca
        const due = Math.max(0, required - t.delivered);
        const pay = Math.min(s.res.złoto, due);
        s.res.złoto -= pay; t.delivered += pay;
        ok = t.delivered >= required - 1e-6;
      } else if (s.factionId === 'slavs') {
        ok = settleBasket(s, t, required);
      } else ok = t.delivered >= required - 1e-6;
      if (ok) t.met++; else t.missed++;
      t.lastOk = ok;
      t.log.push({ n: t.terms + 1, time: s.time, required, delivered: t.delivered, ok });
      t.terms++;
    }
  }

  /* --- Słowianie: danina koszykowa. Płatność idzie z magazynów w terminie: każdy towar pokrywa swój udział
     (40 / 35 / 25% wartości), nadwyżka dowolnego towaru zasila niedobór; spełnienie wymaga łącznej wartości
     ≥ żądanie i ≥ 50% udziału każdego towaru. Braki przechodzą na następny termin (żądanie skumulowane). --- */
  function settleBasket(s, t, required) {
    const V = Data.DANINA.values, SH = Data.DANINA.shares;
    const goods = Object.keys(V);
    const D = Math.max(0, required - t.delivered);          // brakująca wartość [osobominuty]
    const take = {}; let paid = 0, minOk = true;
    for (const g of goods) {
      const shareVal = SH[g] * D;
      const units = Math.min(s.res[g] || 0, shareVal / V[g]);
      take[g] = units; paid += units * V[g];
      if (units * V[g] < Data.DANINA.minShareEach * shareVal - 1e-9) minOk = false;
    }
    let short = D - paid;
    if (short > 1e-9) { // nadwyżka jednego towaru pokrywa niedobór innego (najpierw ta o największej wartości)
      const spare = goods.map(g => [g, (s.res[g] || 0) - take[g]]).filter(x => x[1] > 1e-9)
        .sort((a, b) => b[1] * V[b[0]] - a[1] * V[a[0]]);
      for (const [g, sp] of spare) {
        if (short <= 1e-9) break;
        const add = Math.min(sp, short / V[g]);
        take[g] += add; paid += add * V[g]; short -= add * V[g];
      }
    }
    for (const g of goods) { s.res[g] -= take[g]; t.byGood[g] = (t.byGood[g] || 0) + take[g] * V[g]; }
    t.delivered += paid;
    return paid >= D - 1e-6 && minOk;
  }

  /* Słowianie: ile każdego towaru brakuje do najbliższego terminu (dla interfejsu i doradcy) */
  function basketStatus(s) {
    const t = s.tribute; if (!t || s.factionId !== 'slavs') return null;
    const V = Data.DANINA.values, SH = Data.DANINA.shares;
    const required = requiredCum(t.level, 'slavs', t.terms + 1);
    const D = Math.max(0, required - t.delivered);
    const rows = Object.keys(V).map(g => {
      const needVal = SH[g] * D, needUnits = needVal / V[g], have = s.res[g] || 0;
      return { good: g, have, needUnits, needVal, haveVal: have * V[g], minUnits: Data.DANINA.minShareEach * needUnits };
    });
    return { required, D, rows, totalVal: rows.reduce((a, r) => a + r.haveVal, 0) };
  }

  /* --- Frankowie: dostawa żołnierzy (czynne Koszary, broń, żołd 3 zł, osoba) --- */
  function soldiersTick(s, t, dt) {
    if (!t.announced) return;
    if (!s.buildings.some(b => b.id === 'barracks' && s.staffed[b.uid])) return;
    const upcoming = requiredCum(t.level, 'franks', Math.max(1, t.terms + 1));
    let want = upcoming - t.delivered;
    if (want <= 0) return;
    t.soldierFrac += 2 * dt; // tempo dostaw: 2 żołnierzy/min
    while (t.soldierFrac >= 1 && want > 0) {
      // warunki: broń, żołd, ludność ponad 10
      if (s.res.broń < 1 || s.res.złoto < 3 || s.pop <= 10) { t.soldierFrac = 0; break; }
      s.res.broń -= 1; s.res.złoto -= 3; s.pop -= 1;
      t.delivered += 1; t.soldierFrac -= 1; want--;
    }
    if (t.soldierFrac > 1) t.soldierFrac = 0;
  }

  /* --- Wikingowie: wyprawy deterministyczne, bez losu --- */
  function voyagesTick(s, dt) {
    // powroty: łup, straty, liczy się do haraczu po powrocie
    for (let i = s.voyages.length - 1; i >= 0; i--) {
      const v = s.voyages[i];
      if (s.time < v.until) continue;
      s.voyages.splice(i, 1);
      s.crewAway -= v.crew;
      for (const uid of v.ships) {
        const b = s.buildings.find(bb => bb.uid === uid);
        if (b) b.awayUntil = 0;
      }
      s.pop = Math.max(10, s.pop - (v.great ? 2 : 1));       // straty: 1/2 osoby
      s.res.broń = Math.max(0, s.res.broń - (v.great ? 2 : 1)); // 1/2 bronie
      s.res.złoto += v.great ? 80 : 30;                       // łup
      if (v.great) s.res.narzędzia = Math.min(10, s.res.narzędzia + 2);
      s.voyageStats.done += v.great ? 3 : 1; s.voyageStats.trips++;
      if (s.tribute) s.tribute.delivered += v.great ? 3 : 1;
    }
    // wypłynięcia: tryb "Zwykłe" (1 okręt) albo "Mieszane" (wielka, gdy 2 okręty)
    if (!s.buildings.some(b => b.id === 'dock')) return;
    const freeShips = s.buildings.filter(b => b.id === 'ship' && !(b.awayUntil > s.time));
    if (s.voyageMode === 'mixed' && freeShips.length >= 2 && trySail(s, [freeShips[0], freeShips[1]], true)) return;
    const still = s.buildings.filter(b => b.id === 'ship' && !(b.awayUntil > s.time));
    if (still.length >= 1) trySail(s, [still[0]], false);
  }

  function trySail(s, ships, great) {
    const crew = great ? 12 : 6, needM = great ? 12 : 6, needW = great ? 12 : 6;
    if (s.res['miód pitny'] < needM || s.res.broń < needW) return false;
    // reguła wysyłki: po odjeździe zostaje ≥ 10 osób i (domyślnie) ≥ 90% robotników potrzebnych budynkom
    const left = Math.floor(s.pop) - (s.crewAway || 0) - crew;
    if (left < 10) return false;
    if (s.settings.voyageGuard !== false && left - (s.buildersActive || 0) < 0.9 * s.workersNeeded) return false;
    s.res['miód pitny'] -= needM;
    s.res.broń -= needW;
    s.crewAway += crew;
    const until = s.time + (great ? 12 : 10);
    for (const b of ships) b.awayUntil = until;
    s.voyages.push({ until, crew, great, ships: ships.map(b => b.uid) });
    return true;
  }

  /* --- Targ: sprzedaż towarów handlowych z krzywymi cen (Saraceni) --- */
  function marketTick(s, dt) {
    const mkts = s.buildings.filter(b => b.id === 'market' && s.staffed[b.uid]).length;
    const serai = s.buildings.filter(b => b.id === 'caravanserai' && s.staffed[b.uid]).length;
    // Karawanseraj liczy się jak 2 Targi (max 2 w sumie — drugi niczego nie dodaje); ceny +20% (bez kumulacji)
    const nM = mkts + Math.min(2, 2 * serai);
    if (nM === 0) return;
    const mul = serai > 0 ? 1.2 : 1;
    for (const g in TRADE) {
      let p = s.marketPrices[g];
      const base = TRADE[g].base * mul, floor = TRADE[g].floor * mul;
      p += (base - p) * 0.0143 * dt;        // odnowa: 1,43% luki na minutę
      const q = s.res[g];
      if (q > 0.001) {
        // sprzedaż z całego zapasu naraz; spadek 0,05 zł/szt. ÷ liczba Targów
        let revenue = 0, left = q, guard = 0;
        while (left > 0.001 && guard++ < 300) {
          const step = Math.min(1, left);
          revenue += Math.max(floor, p) * step;
          p = Math.max(floor, p - 0.05 * step / nM);
          left -= step;
        }
        if (left > 0.001) { revenue += Math.max(floor, p) * left; left = 0; } // powyżej 300 szt. po podłodze
        s.res.złoto += revenue;
        s.res[g] = 0;
      }
      s.marketPrices[g] = p;
    }
  }

  return { set, tick, soldierReserve, requiredCum, labelOf, missingChain, basketStatus,
           PRESET_LABEL, PRESET_LEVEL, FIRST_TERM, RATE, UNIT, TERM_EVERY };
})();

/* ==================== MODUL: EVENTS (Etap 5: świat dynamiczny) =================== */
/* Napad na karawanę (Saraceni): im więcej złota w skarbcu, tym większe ryzyko;
   pierwsze 150 zł nienaruszalne; Strażnica (0,6 zł/min, gdy złoto jest; max 2
   się liczą) zmniejsza ryzyko o 40% i łup o 25% za cenę utrzymania. Sprawdzenie
   co 10 min od 40. minuty. Kryzysy (zaraza, pożar łańcucha, krach cen) idą z
   harmonogramu — silnik pozostaje deterministyczny (RNG z ziarnem). */
const Events = (() => {
  const GUARD_UPKEEP = 0.6;  // zł/min
  const GUARD_MAX = 2;

  function msg(s, text) { (s.eventMsgs = s.eventMsgs || []).push({ text, time: s.time }); }

  /* Strażnice obsadzone z opłaconym utrzymaniem (bez złota nie działają) */
  function guardsActive(s, dt) {
    let active = 0;
    for (const b of s.buildings) {
      if (b.id !== 'guardpost' || !s.staffed[b.uid]) continue;
      const cost = GUARD_UPKEEP * dt;
      if (s.res.złoto >= cost) { s.res.złoto -= cost; active++; }
    }
    return Math.min(GUARD_MAX, active);
  }

  function tick(dt) {
    const s = World.state();
    if (s.factionId === 'saracens' && s.settings.raids !== false) { // napady można wyłączyć w scenariuszu (preset Łatwy)
      const guards = guardsActive(s, dt);
      const r = s.raids;
      if (s.time >= r.next) {          // kontrola co 10 min od 40. minuty
        r.next += 10;
        const gold = s.res.złoto;
        if (gold > 150) {              // pierwsze 150 zł nienaruszalne
          const chance = Math.min(0.5, (gold - 150) / 1000) * (1 - 0.4 * guards);
          if (RNG.next() < chance) {
            const loot = Math.min(400, 0.3 * (gold - 150) * (1 - 0.25 * guards));
            s.res.złoto -= loot;
            r.count++; r.lost += loot;
            msg(s, '⚔ Napad na karawanę! Zrabowano ' + Math.round(loot) + ' zł' +
                (guards ? ' (Strażnice złagodziły stratę)' : ' — zbuduj Strażnicę!'));
          }
        }
      }
    }
    runCrisis(s);                      // harmonogram kryzysów (jeśli włączony)
  }

  /* --- kryzysy wg scenariuszy z kryteriów akceptacji (v3.5) --- */
  function plague(s) { // zaraza: -12 osób, podłoga 10
    const before = Math.floor(s.pop);
    s.pop = Math.max(10, s.pop - 12);
    msg(s, '☠ Zaraza! Ludność spada z ' + before + ' do ' + Math.floor(s.pop));
  }
  function destroy(s, b) { // wyburzenie: zwolnij kafle, usuń z listy
    const size = b.id === 'keep' ? 2 : 1;
    for (let dy = 0; dy < size; dy++) for (let dx = 0; dx < size; dx++) {
      const t = MapGen.at(s.map, b.x + dx, b.y + dy);
      if (t && t.occup === b.uid) t.occup = null;
    }
    s.buildings.splice(s.buildings.indexOf(b), 1);
  }
  function fire(s, ids) { // pożar: po jednym budynku każdego typu z listy
    const burned = [];
    for (const id of ids) {
      const b = s.buildings.find(bb => bb.id === id);
      if (!b) continue;
      destroy(s, b);
      burned.push(Data.nameOf(id));
    }
    if (burned.length) msg(s, '🔥 Pożar! Spłonęło: ' + burned.join(', '));
  }
  function priceCrash(s) { // krach cen: wszystko na podłogę krzywej
    s.marketPrices.kadzidło = 0.9; s.marketPrices.tkanina = 0.9; s.marketPrices.ceramika = 0.6;
    msg(s, '📉 Krach cen! Targ płaci ceny podłogowe.');
  }
  function deforest(s, n) { World.takeTrees(n); msg(s, '🪓 Wylesienie: ' + n + ' drzew.'); }
  function forestFire(s, share) { // pożar lasu: znika część drzew (Puszcza Słowian: plony maleją, gdy drzew < 200)
    const n = Math.round(World.treeCount() * share);
    World.takeTrees(n);
    msg(s, '🔥 Pożar lasu! Znika ' + Math.round(share * 100) + '% drzew (' + n + ').');
  }

  /* harmonogram "Kryzysy: harmonogram" — scenariusze kryzysowe v3.5 */
  const SCHEDULE = {
    franks:   [ { at: 60, fn: s => { fire(s, ['bakery', 'mill', 'farm', 'orchard']); plague(s); } } ],
    saracens: [ { at: 60, fn: s => fire(s, ['dategrove', 'dategrove', 'qanat']) },
                { at: 70, fn: s => priceCrash(s) } ],
    vikings:  [ { at: 90, fn: s => fire(s, ['dock', 'ship']) } ],
    slavs:    [ { at: 60, fn: s => plague(s) },
                { at: 70, fn: s => { forestFire(s, 0.6); fire(s, ['bartnik', 'bartnik', 'bartnik', 'waxery', 'waxery', 'waxery']); } } ]
  };
  function setCrisis(on) {
    const s = World.state();
    s.crisis = on ? { idx: 0 } : null;
    return on ? 'Kryzysy wg harmonogramu (scenariusze spec v3.6)' : 'Kryzysy wyłączone';
  }
  function runCrisis(s) {
    if (!s.crisis) return;
    const list = SCHEDULE[s.factionId] || [];
    while (s.crisis.idx < list.length && s.time >= list[s.crisis.idx].at) {
      list[s.crisis.idx].fn(s);
      s.crisis.idx++;
    }
  }

  return { tick, plague, fire, priceCrash, deforest, forestFire, destroy, setCrisis, guardsActive, msg };
})();

/* ===================== MODUL: TESTBOTS (boty R/D/N, Etap 5-testy) ============ */
/* Boty testowe wg "Metodologia testów" (v3.5): R = przepis z szumem ε,
   D = przepis z opóźnieniem decyzji, N = reaktywny bez przepisu.
   Mierniki: ludność @20/40/60/90/150, minuty głodu, terminy haraczu, złoto.
   Symulacja headless: stan gry jest zapisywany i odtwarzany, gra trwa bez zmian. */
const TestBots = (() => {
  /* przepisy nacji z rozdziałów "Przepis na gospodarkę" (v3.5) */
  const RECIPE = {
    franks: ['woodcutter','woodcutter','sawmill','orchard','hunter','quarry','forester',
      'watercarrier','farm','mill','bakery','barracks','hut','hut','dairy','market','store',
      'forester','woodcutter','ironmine','coalmine','coalmine','smelter','armory',
      'sawmill','farm','mill','bakery','hut','toolforge','hut'],
    saracens: ['woodcutter','woodcutter','sawmill','watercarrier','dategrove','claypit',
      'forester','forester','hunter','watercarrier','dategrove','market','store',
      'incensewood','incense','hut','hut','qanat','cotton','weaver','dategrove','dairy',
      'orchard','hut','temple','pottery','bathhouse','incensewood','incense','market','caravanserai','hut','hut','cotton','weaver'],
    vikings: ['woodcutter','woodcutter','woodcutter','sawmill','forester','fisherhut','fisherhut',
      'hunter','hut','hut','watercarrier','forester','sawmill','woodcutter','fisherhut',
      'dairy','orchard','market','store','mead','peatmine','charburner','charburner',
      'smelter','armory','dock','ship','hut','toolforge','temple','hut','fisherhut','ship','hut'],
    /* Słowianie: 4 kroki z rozdziału "Przepis na gospodarkę" (pary: Chata łowcy + Garbarnia, Barć + Woskarnia) */
    slavs: ['woodcutter','woodcutter','sawmill','gatherer','gatherer','forester','hut','hut','orchard','watercarrier',
      'gatherer','field','field','kasha','trapper','tannery','bartnik','waxery',
      'hut','dairy','store','market','trapper','tannery','bartnik','waxery','hut',
      'temple','sauna','forester','bartnik','waxery','hut','hut','trapper','tannery']
  };
  const FOOD_BUILD = {
    franks: ['farm','bakery','dairy','orchard','hunter','mill'],
    saracens: ['dategrove','dairy','orchard','hunter'],
    vikings: ['fisherhut','dairy','orchard','hunter'],
    slavs: ['gatherer','dairy','orchard','field','kasha','hunter']
  };
  /* okno oceny: 6 terminów po pierwszym (spec: Frankowie 150, Saraceni 140, Wikingowie 200, Słowianie 150 min) */
  const EVAL_END = { franks: 150, saracens: 140, vikings: 200, slavs: 150 };

  function snapshot() { const s = World.state(); const o = {}; for (const k in s) { try { o[k] = JSON.parse(JSON.stringify(s[k])); } catch (e) { o[k] = s[k]; } } return o; }
  function restore(snap) {
    const s = World.state();
    for (const k in snap) s[k] = snap[k];
    s.keep = s.buildings.find(b => b.id === 'keep') || s.keep; // tożsamość Dworu po klonowaniu
    Data.cur.faction = s.factionId; // przebieg bota mógł dotyczyć innej nacji (nazwy budynków zależą od nacji)
  }

  /* szukanie miejsca: złoże / brzeg / las / zwykłe (spirala od Dworu) */
  function findPlace(s, id) {
    const def = Data.BUILDINGS[id]; if (!def) return null;
    const size = s.map.size;
    if (def.req && def.req.startsWith('deposit:')) {
      const kind = def.req.split(':')[1];
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        const t = MapGen.at(s.map, x, y);
        if (t && t.deposit === kind && World.canPlace(id, x, y).ok) return { x, y };
      }
      return null;
    }
    const c = Math.floor(size / 2);
    for (let r = 1; r < size; r++) {
      for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        const x = c + dx, y = c + dy; const t = MapGen.at(s.map, x, y);
        if (!t || t.h !== 1) continue;
        if ((def.req === 'shore' || def.req === 'waterEdge')) {
          let water = false;
          for (const [ox, oy] of [[1,0],[-1,0],[0,1],[0,-1]]) { const n = MapGen.at(s.map, x+ox, y+oy); if (n && n.h === 0) water = true; }
          if (!water) continue;
        }
        if (def.req === 'forest') {
          let trees = 0;
          for (const [ox, oy] of [[1,0],[-1,0],[0,1],[0,-1]]) { const n = MapGen.at(s.map, x+ox, y+oy); if (n) trees += n.trees; }
          if (trees < 4) continue;
        }
        if (World.canPlace(id, x, y).ok) return { x, y };
      }
    }
    return null;
  }

  function tryBuild(s, id) {
    // Okręt wymaga gotowej Przystani: gdy jej plac jeszcze stoi, bot czeka (nie pomija pozycji przepisu)
    if (id === 'ship' && !s.buildings.some(b => b.id === 'dock'))
      return s.sites.some(st => st.id === 'dock') ? 'wait' : 'noplace';
    const spot = findPlace(s, id);
    if (!spot) return 'noplace';
    const r = Build.enqueue(id, spot.x, spot.y);
    return r.ok ? 'built' : 'wait';
  }

  /* jeden przebieg; cfg: { faction, bot: 'R'|'D'|'N', epsilon, tax, preset } */
  function runSync(cfg, onTick) {
    const snap = snapshot();
    World.init(cfg.faction);
    const s = World.state();
    if (cfg.tax != null) s.controls.tax = cfg.tax;
    Tribute.set(cfg.preset || 'normal');
    const plan = (RECIPE[cfg.faction] || []).slice();
    let pi = 0, nextDecide = 0, famineMin = 0;
    const eps = cfg.epsilon != null ? cfg.epsilon : 0.15;
    const decideEvery = cfg.bot === 'D' ? 2.0 : 0.5;
    const marks = {};
    const DT = 0.1, END = cfg.end || EVAL_END[cfg.faction] || 150;
    let pop36 = null, peak = 0;
    for (let t = 0; t < END - 0.05; t += DT) {
      World.tick(DT); // Economy + Build + Tribute + Events + czas
      if (Economy.totalFood(s.res) < 0.01) famineMin += DT;
      if (pop36 === null && s.pop >= 36) pop36 = Math.round(t);
      if (s.pop > peak) peak = s.pop;
      for (const m of [20, 40, 60, 90, 150]) if (t >= m && !(m in marks)) marks[m] = Math.floor(s.pop);
      if (t >= nextDecide) {
        nextDecide = t + decideEvery;
        let id = null;
        if (cfg.bot === 'N') { // reaktywny, bez przepisu (głód > dach > deski > narzędzia > haracz)
          const needFood = Economy.potentialFood(s) < 1.1 * Economy.foodRate(s) + 0.5;
          const full = Economy.housing(s) <= s.pop;
          if (needFood) {
            for (const i2 of (FOOD_BUILD[cfg.faction] || [])) if (tryBuild(s, i2) === 'built') break;
          } else if (full) tryBuild(s, 'hut');
          else if (s.res.deski < 6) tryBuild(s, 'woodcutter');
          else if (s.waitingForTool) tryBuild(s, (cfg.faction === 'saracens' || cfg.faction === 'slavs') ? 'market' : 'toolforge');
          else if (s.tribute && s.tribute.announceMsg) { // ogłoszenie haraczu: dobuduj łańcuch
            const need = { franks: ['barracks','armory'], saracens: ['market'], vikings: ['dock','ship','mead','armory'],
              slavs: ['watercarrier','bartnik','waxery','trapper','tannery'] }[cfg.faction] || [];
            for (const i2 of need) if (!s.buildings.some(b2 => b2.id === i2)) { tryBuild(s, i2); break; }
          } else tryBuild(s, 'hut');
        } else {
          if (RNG.next() >= eps && pi < plan.length) { // R/D: przepis; ε = szum nieuwagi
            id = plan[pi];
            const r2 = tryBuild(s, id);
            if (r2 === 'built') pi++;
            else if (r2 === 'noplace') pi++; // brak miejsca: pomiń (jak w kolejce gry)
            // 'wait' (brak złota) → ponów decyzję
          }
        }
      }
      if (onTick) onTick(t / END);
    }
    if (!(150 in marks)) marks[150] = Math.floor(s.pop); // pętla kończy się tuż przed końcem okna
    const tribute = s.tribute ? (s.tribute.met + '/' + (s.tribute.met + s.tribute.missed)) : '—';
    const out = { faction: cfg.faction, bot: cfg.bot, tax: s.controls.tax,
      pop: marks, famine: Math.round(famineMin), tribute, gold: Math.round(s.res.złoto), pop36,
      endPop: Math.floor(s.pop), peak: Math.floor(peak), planks: Math.round(s.stats.planksSpent),
      toolsBought: s.stats.toolsBought, starveMin: Math.round(s.stats.starveMin),
      trees: World.treeCount(), delivered: s.tribute ? Math.round(s.tribute.delivered) : 0,
      voyages: s.voyageStats ? s.voyageStats.done : 0, byGood: s.tribute ? s.tribute.byGood : null,
      raids: s.raids.count, lost: Math.round(s.raids.lost) };
    restore(snap);
    return out;
  }

  /* panel testowy (zwijany, wypisywany raport) */
  let panel = null;
  function createPanel() {
    if (panel) return;
    panel = document.createElement('div');
    panel.style.cssText = 'position:absolute;z-index:60;left:8px;bottom:calc(var(--bar-h, 136px) + 8px);background:rgba(20,16,12,.94);border:1px solid #6b543a;color:#f0e6d2;font-size:12px;padding:6px 8px;max-width:300px;max-height:46vh;overflow:auto;';
    panel.innerHTML = '<b id="botToggle" style="color:#e8c860;cursor:pointer">🧪 Boty testowe ▸</b>' +
      '<div id="botBody" style="display:none;margin-top:4px">' +
      '<button data-b="R">Bot R (przepis+szum)</button> <button data-b="D">Bot D (opóźnienie)</button> <button data-b="N">Bot N (reaktywny)</button><br>' +
      '<button data-b="T3">Frank: podatek 3 (brzegowy)</button> <button data-b="ALL">4×R: W/F/V/S</button><br>' +
      '<div id="botOut" style="margin-top:6px;white-space:pre-line"></div></div>';
    panel.querySelectorAll('button').forEach(b => b.style.cssText = 'background:#3a2c1c;color:#f0e6d2;border:1px solid #6b543a;font-size:11px;padding:4px 6px;margin:2px;cursor:pointer;');
    document.body.appendChild(panel);
    panel.addEventListener('click', async e => {
      if (e.target.id === 'botToggle') {
        const body = document.getElementById('botBody');
        const open = body.style.display === 'none';
        body.style.display = open ? 'block' : 'none';
        e.target.textContent = open ? '🧪 Boty testowe ▾' : '🧪 Boty testowe ▸';
        return;
      }
      const b = e.target.getAttribute && e.target.getAttribute('data-b'); if (!b) return;
      const out = document.getElementById('botOut'); out.textContent = '…symulacja…';
      await new Promise(r => setTimeout(r, 10));
      const fac = World.state().factionId || 'franks';
      let lines = [];
      if (b === 'ALL') for (const f of ['slavs','franks','vikings','saracens']) lines.push(fmt(runSync({ faction: f, bot: 'R' })));
      else if (b === 'T3') lines.push(fmt(runSync({ faction: 'franks', bot: 'R', tax: 3 })));
      else lines.push(fmt(runSync({ faction: fac, bot: b })));
      out.textContent = lines.join('\n');
    });
  }
  function fmt(r) {
    const p = r.pop || {};
    return '[' + r.bot + ' · ' + r.faction + (r.tax !== 1 ? ' · podatek ' + r.tax : '') + ']\n' +
      'ludność @20/40/60/90/150: ' + (p[20]||'?') + '/' + (p[40]||'?') + '/' + (p[60]||'?') + '/' + (p[90]||'?') + '/' + (p[150]||'?') + '\n' +
      'głód: ' + r.famine + ' min · haracz: ' + r.tribute + ' terminów · złoto: ' + r.gold;
  }

  return { runSync, createPanel, RECIPE, FOOD_BUILD, EVAL_END, findPlace, tryBuild, snapshot, restore };
})();

/* ============================= MODUL: ADVISOR ============================== */
/* Doradca (spec: „interfejs musi pokazywać »brak wejścia« na budynku”, „doradca podaje pełną listę
   zależności i liczby budynków na poziom”, „podatek górniczy musi być widoczny”, ostrzeżenie przy
   popularności < 45). Moduł tylko czyta stan gry — nie zmienia ekonomii. */
const Advisor = (() => {
  const COLOR = { bad: '#e08484', warn: '#e8b060', info: '#a8b8a8', good: '#8fce8f' };
  const BADGE = { in: ['!', '#d84a4a'], tool: ['T', '#e8a030'], nostaff: ['P', '#5f86c4'], full: ['Z', '#8a8a82'], food: ['J', '#a8783a'], depleted: ['X', '#6a6a6a'] };

  /* budynki nacji, które wytwarzają dany towar (podpowiedź przy „brak wejścia”) */
  function sourcesOf(good, fid) {
    const out = [];
    for (const [id, d] of Object.entries(Data.BUILDINGS)) {
      if (id === 'keep' || (d.factions && !d.factions.includes(fid))) continue;
      if (d.out && good in d.out) out.push(Data.nameOf(id, fid));
    }
    return out;
  }
  const goodLabel = (def, g) => (def && def.outLabel && def.outLabel[g]) || g;

  function statusOf(b) {
    const s = World.state(), def = Data.BUILDINGS[b.id];
    const mk = (code, sev, text) => ({ code, sev, text });
    if (b.id === 'keep') return mk('ok', 'info', 'Serce osady: komora 20 szt. każdego towaru, piła zamkowa, 20 miejsc. Budowniczowie: ' + s.builders + ' (2–5; zmiana przyciskiem 👷 w pasku).');
    if (!def.worker) {
      if (b.id === 'ship' && b.awayUntil > s.time) return mk('ok', 'info', 'W rejsie — wróci za ' + Math.ceil(b.awayUntil - s.time) + ' min');
      return mk('ok', 'info', def.note || 'Nie wymaga pracownika');
    }
    if (!s.staffed[b.uid]) {
      if (b.st && b.st.c === 'tool')
        return mk('tool', 'warn', 'Czeka na narzędzie: Targ kupi je za 20 zł, kuźnia zamkowa dorobi ok. 1 szt. na 8 min');
      return mk('nostaff', 'warn', 'Brak pracownika — za mało wolnej ludności (żywność obsadzana pierwsza)');
    }
    const st = b.st;
    if (st && st.c === 'in') {
      if (st.g === 'drzewa') return mk('in', 'bad', 'Brak wejścia: drzewa na mapie — posadź je Leśniczówką');
      const src = sourcesOf(st.g, s.factionId);
      return mk('in', 'bad', 'Brak wejścia: ' + st.g + (src.length ? ' — zbuduj: ' + src.join(' / ') : ''));
    }
    if (st && st.c === 'full')
      return mk('full', 'warn', 'Magazyn pełny: ' + st.g + ' — produkcja stoi bez kary (zbuduj Skład albo zużyj towar)');
    if (st && st.c === 'food')
      return mk('food', 'warn', 'Stoi: jedzenie tylko z nadwyżki (zapas poniżej 5 min zużycia ludności)');
    if (st && st.c === 'depleted') return mk('depleted', 'warn', 'Złoże wyczerpane — budynek stoi');
    const eff = b.eff != null ? Math.round(b.eff * 100) : 100;
    return mk('ok', 'good', 'Pracuje — ' + eff + '% wydajności');
  }
  function codeOf(b) { // szybki kod statusu (bez tekstu) — używany co klatkę przy rysowaniu znaczników
    const s = World.state(), def = Data.BUILDINGS[b.id];
    if (b.id === 'keep' || !def.worker) return 'ok';
    if (!s.staffed[b.uid]) return (b.st && b.st.c === 'tool') ? 'tool' : 'nostaff';
    return (b.st && b.st.c) || 'ok';
  }
  function badgeOf(b) { return BADGE[codeOf(b)] || null; }

  /* ostrzeżenia ogólne, od najpilniejszych */
  function warnings(s) {
    const w = [], pop = s.res.popularity || 50, rep = s.foodRep;
    const cnt = id => s.buildings.filter(b => b.id === id).length;
    if (s.starveTimer > 0) {
      const left = Math.max(0, 5 - s.starveTimer);
      w.push({ sev: 'bad', text: s.starveTimer >= 5 ? 'GŁÓD: ludność ginie (1 os./min). Zbuduj żywność lub obniż racje.'
        : 'Brak jedzenia od ' + s.starveTimer.toFixed(1) + ' min — za ' + left.toFixed(1) + ' min zacznie ginąć ludność.' });
    }
    if (pop < 45) w.push({ sev: 'bad', text: 'Popularność ' + Math.round(pop) + ' < 45 — imigracja zamrożona.' +
      (s.controls.tax >= 2 ? ' Podatek ' + s.controls.tax + ' obniża ją o ' + (s.controls.tax === 3 ? 16 : 8) + ' (kościół/meczet/kapliczka +10).' : ' Zwiększ racje lub zbuduj Dobrobyt.') });
    else if (s.controls.tax === 3) w.push({ sev: 'warn', text: 'Podatek 3 daje −16 popularności — pułapka w grze startowej (spec: zamraża imigrację). Popularność: ' + Math.round(pop) + '.' });
    if (rep) {
      if (rep.buildings > 0) w.push({ sev: 'info', text: 'Podatek górniczy: kopalnie/wytwórnie zjadają ' + rep.buildings.toFixed(2).replace('.', ',') + ' porcji/min (≈ ' + Math.round(rep.buildings * 6) + ' ' + osob(Math.round(rep.buildings * 6)) + '), tylko z nadwyżki jedzenia.' });
      if (rep.potential < 1.1 * rep.consumption && s.starveTimer === 0) {
        const f1 = v => v.toFixed(1).replace('.', ',');
        if (Math.floor(s.pop) >= rep.pmax)
          w.push({ sev: 'info', text: 'Ludność osiągnęła limit żywności (' + Math.floor(s.pop) + ' ≈ maks. ' + rep.pmax + '): produkcja ' + f1(rep.potential) + ' = 110% zużycia ' + f1(rep.consumption) + '. Aby rosła, dobuduj źródła jedzenia.' });
        else
          w.push({ sev: 'warn', text: 'Imigracja wstrzymana: produkcja jedzenia ' + f1(rep.potential) + ' < 110% zużycia (' + f1(rep.consumption) + '). Maks. ludność ≈ ' + rep.pmax + '.' });
      }
    }
    if (s.pop >= Economy.housing(s)) w.push({ sev: 'warn', text: 'Brak miejsc w domach (' + Math.floor(s.pop) + '/' + Economy.housing(s) + ') — zbuduj Chaty.' });
    if (s.waitingForTool) w.push({ sev: 'warn', text: 'Budynek czeka na narzędzie — postaw Targ (kupno 20 zł)' + (s.factionId === 'franks' || s.factionId === 'vikings' ? ' lub Kuźnię narzędzi.' : '.') });
    // zbiorczo: budynki bez wejścia (z podpowiedzią źródła)
    const groups = {};
    for (const b of s.buildings) {
      if (codeOf(b) !== 'in') continue;
      const st = statusOf(b);
      const key = st.code + '|' + st.text;
      (groups[key] = groups[key] || { st, n: 0, name: Data.nameOf(b.id) }).n++;
    }
    for (const k in groups) {
      const g = groups[k];
      if (g.st.code === 'in') w.push({ sev: 'bad', text: g.n + '× ' + g.name + ' — ' + g.st.text });
    }
    const fullN = s.buildings.filter(b => codeOf(b) === 'full').length;
    if (fullN >= 2 && !cnt('store')) w.push({ sev: 'warn', text: fullN + ' budynków stoi z pełnym magazynem — Skład (+80 szt. każdego towaru) odblokuje produkcję.' });
    // haracz: łańcuch i terminy
    const t = s.tribute;
    if (t) {
      if (s.time >= t.firstTerm - 30 && s.time < t.firstTerm + 15 * Math.max(1, t.terms)) {
        const miss = Tribute.missingChain(s);
        if (miss.length) w.push({ sev: s.time >= t.firstTerm - 10 ? 'bad' : 'warn', text: 'Haracz: brakuje budynków łańcucha — ' + miss.join(', ') + '.' });
      }
      if (s.factionId === 'franks' && !cnt('barracks') && s.time >= t.firstTerm - 30)
        w.push({ sev: 'bad', text: 'Koszary! Bez nich nie ma dostaw żołnierzy (stawiaj najpóźniej 30 min przed pierwszym terminem).' });
      if (s.factionId === 'slavs') {
        const tr = World.treeCount(), ref = Data.FOREST_REF.slavs;
        if (tr < ref) w.push({ sev: 'warn', text: 'Puszcza: ' + tr + ' drzew < ' + ref + ' — plony zbieraczy, barci i łowców ×' + (tr / ref).toFixed(2).replace('.', ',') + '. Dosadź Leśniczówkami.' });
      }
    }
    if (s.factionId === 'slavs' && !t) {
      const tr = World.treeCount(), ref = Data.FOREST_REF.slavs;
      if (tr < ref) w.push({ sev: 'warn', text: 'Puszcza: ' + tr + ' drzew < ' + ref + ' — plony leśne ×' + (tr / ref).toFixed(2).replace('.', ',') + '.' });
    }
    if (s.factionId === 'vikings' && s.voyageMode === 'mixed' && cnt('ship') % 2 === 1)
      w.push({ sev: 'info', text: 'Tryb „Mieszane”: wielka wyprawa wymaga 2 okrętów naraz — przy nieparzystej liczbie okrętów jeden pływa jako zwykła wyprawa.' });
    if (s.factionId === 'saracens' && s.settings.raids !== false && s.res.złoto > 300)
      w.push({ sev: 'info', text: 'Napad na karawanę grozi, gdy skarbiec > 150 zł (teraz ' + Math.floor(s.res.złoto) + ' zł). Strażnica obniża ryzyko o 40%.' });
    return w;
  }

  /* wymagane budynki na wybrany poziom haraczu (orientacyjnie, wg tabel „Warstwy mistrzostwa” i tempa łańcuchów) */
  function plan(s) {
    const t = s.tribute; if (!t) return null;
    const fid = s.factionId, L = t.level, table = Tribute.RATE[fid];
    const rate = table[L] !== undefined ? table[L] : table[1] * L; // jednostek / 15 min
    const need = {}, notes = [];
    const add = (id, n) => { need[id] = Math.max(need[id] || 0, n); };
    if (fid === 'franks') {
      const w = rate / 15, cells = Math.max(1, Math.ceil(w - 1e-9));
      add('barracks', 1); add('armory', cells); add('smelter', cells); add('ironmine', cells); add('coalmine', 2 * cells);
      add('bakery', 1);
      notes.push('Żołnierz = 1 broń + 1 osoba + 3 zł żołdu: ' + w.toFixed(2).replace('.', ',') + ' żołn./min = ' + (3 * w).toFixed(1).replace('.', ',') + ' zł/min.');
      notes.push('Komórka metalurgii (Fe : 2 węgle : Huta : Zbrojownia) zjada 1,5 porcji/min — około pół łańcucha chleba.');
      if (L >= 10) notes.push('Poziom ' + L + ' wymaga rozbudowy ludności (3 Chaty, Sad, Mleczarnia, Myśliwy na każdy krok); podatek 2 + wino.');
    } else if (fid === 'saracens') {
      add('market', 1); add('watercarrier', 1); add('incensewood', 1); add('incense', 1);
      if (L >= 3) { add('incensewood', 2); add('incense', 2); }
      if (L >= 4) { add('cotton', 1); add('weaver', 1); }
      if (L >= 5) add('pottery', 1);
      if (L >= 6) { add('cotton', 2); add('weaver', 2); }
      if (L >= 7) { add('caravanserai', 1); add('market', 2); }
      notes.push('Skarbiec płaci ' + Math.round(rate) + ' zł co 15 min (' + (rate / 15).toFixed(1).replace('.', ',') + ' zł/min). Każdy towar ma własną krzywą cen; rynek się nasyca.');
      notes.push('Sufit pojemności wg spec: samo kadzidło 4, + ceramika 5, + tkanina 6, + Karawanseraj i 2. Targ 8.');
    } else if (fid === 'vikings') {
      add('dock', 1); add('mead', 1); add('watercarrier', 1); add('peatmine', 1); add('charburner', 2); add('smelter', 1); add('armory', 1);
      add('ship', L >= 12 ? 4 : L >= 8 ? 3 : L >= 4 ? 2 : 1);
      if (L >= 8) add('mead', 2);
      notes.push('Wyprawa: 6 załogi + 6 miodu + 6 broni, 10 min, ginie 1 osoba i 1 broń; wielka (2 okręty, 12/12/12) liczy się za 3.');
      notes.push('Poziom ' + L + ' = ' + rate.toFixed(1).replace('.', ',') + ' wypraw / 15 min. Ludność ogranicza: po odjeździe zostaje ≥ 90% robotników.');
      if (L >= 8) notes.push('Powyżej 7 potrzebna rozbudowa osady (Chaty, żywność) i tryb „Mieszane” (parzysta liczba okrętów).');
    } else if (fid === 'slavs') {
      const pairs = Math.max(1, Math.ceil(2 * L / 4.58 - 0.1)); // para miodu+wosku 2,34 i para futer 2,24 osobominut/min
      add('bartnik', pairs); add('waxery', pairs); add('trapper', pairs); add('tannery', pairs);
      add('watercarrier', Math.max(1, Math.ceil(0.4 * pairs / 1.5)));
      if (L >= 6) add('store', 1);
      notes.push('Poziom ' + L + ' żąda ' + 2 * L + ' osobominut/min (' + rate + ' / 15 min): futro 40%, miód 35%, wosk 25%; każdy towar ≥ 50% swojego udziału.');
      notes.push('Para łańcuchów (Barć+Woskarnia i Łowca+Garbarnia) daje ≈ 4,6 osobominut/min ≈ 2,3 poziomu. Skład podnosi pojemność (bez niego −1 poziom).');
      notes.push('Las poniżej 200 drzew obniża plony; Kapliczka spala wosk z daniny (Dobrobyt kosztuje ≈ 1 poziom).');
    }
    const lines = Object.entries(need).map(([id, n]) => ({ id, name: Data.nameOf(id), need: n, have: s.buildings.filter(b => b.id === id).length }));
    return { level: L, rate, lines, notes };
  }

  function esc(x) { return String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  const osob = n => n === 1 ? 'osobę' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? 'osoby' : 'osób';

  function render() {
    const s = World.state();
    let h = '<div class="advHead"><b>🧭 Doradca</b><span class="advClose" id="advClose">✕</span></div>';
    const ws = warnings(s);
    h += '<h4>Ostrzeżenia</h4>';
    if (!ws.length) h += '<div class="advRow" style="color:' + COLOR.good + '">Brak — osada działa bez zastrzeżeń.</div>';
    for (const x of ws) h += '<div class="advRow" style="color:' + COLOR[x.sev] + '">' + (x.sev === 'bad' ? '⛔ ' : x.sev === 'warn' ? '⚠ ' : 'ℹ ') + esc(x.text) + '</div>';
    const rep = s.foodRep;
    if (rep) {
      h += '<h4>Żywność</h4>';
      const f = v => v.toFixed(1).replace('.', ',');
      h += '<div class="advRow">Produkcja (potencjał): <b>' + f(rep.potential) + '</b> porcji/min</div>';
      h += '<div class="advRow">Zużycie: ludzie ' + f(rep.people) + (rep.builders ? ' + budowniczowie ' + f(rep.builders) : '') + (rep.buildings ? ' + kopalnie/wytwórnie ' + f(rep.buildings) : '') + ' = <b>' + f(rep.consumption) + '</b></div>';
      h += '<div class="advRow">Brama imigracji: produkcja ≥ 110% zużycia → maks. ludność ≈ <b>' + rep.pmax + '</b> (obecnie ' + Math.floor(s.pop) + ')</div>';
    }
    const pl = plan(s);
    h += '<h4>Haracz</h4>';
    if (!pl) h += '<div class="advRow" style="color:' + COLOR.info + '">Haracz wyłączony — wybierz preset albo poziom 1–11 w pasku u góry.</div>';
    else {
      h += '<div class="advRow">' + esc(Tribute.labelOf(s.tribute)) + ': ' + pl.rate + ' ' + Tribute.UNIT[s.factionId] + ' / 15 min. Budynki potrzebne na ten poziom:</div>';
      for (const l of pl.lines) {
        const ok = l.have >= l.need;
        h += '<div class="advRow" style="color:' + (ok ? COLOR.good : COLOR.warn) + '">' + (ok ? '✔' : '✘') + ' ' + esc(l.name) + ' ' + l.have + '/' + l.need + '</div>';
      }
      for (const n of pl.notes) h += '<div class="advRow" style="color:' + COLOR.info + '">• ' + esc(n) + '</div>';
    }
    h += '<h4>Znaczniki na budynkach</h4><div class="advRow" style="color:' + COLOR.info + '">' +
      '<b style="color:#d84a4a">!</b> brak wejścia · <b style="color:#e8a030">T</b> czeka na narzędzie · <b style="color:#5f86c4">P</b> brak pracownika · ' +
      '<b style="color:#8a8a82">Z</b> magazyn pełny · <b style="color:#a8783a">J</b> czeka na nadwyżkę jedzenia · <b style="color:#6a6a6a">X</b> złoże wyczerpane. Najedź kursorem lub dotknij budynek, aby zobaczyć szczegóły.</div>';
    return h;
  }

  return { statusOf, codeOf, badgeOf, warnings, plan, render, sourcesOf, goodLabel };
})();

/* ============================ MODUL: BUILDMODE ============================= */
const BuildMode = (() => {
  let selected = null; // id budynku w trybie budowy
  let hover = { x: -1, y: -1 };

  function select(id) { selected = id; }
  function clear() { selected = null; }
  function isSelected() { return selected; }
  function setHover(wx, wy) { hover.x = Math.floor(wx); hover.y = Math.floor(wy); }

  function buildingAtHover() {
    const s = World.state(), t = s.map && MapGen.at(s.map, hover.x, hover.y);
    if (!t || !t.occup) return null;
    return s.buildings.find(b => b.uid === t.occup) || null;
  }

  function click() {
    if (!selected) {
      // klik na plac budowy (poza trybem budowy) anuluje go — zwrot materiałów i złota
      const st = Build.siteAt(hover.x, hover.y);
      if (st) {
        Build.cancel(st);
        UI.flashHint('Budowa anulowana — materiały wróciły do magazynu');
        UI.refreshHUD();
        return;
      }
      UI.pinBuilding(buildingAtHover()); // klik na budynek: karta stanu (klik w puste pole ją zamyka)
      return;
    }
    // klik otwiera plac budowy; budowniczowie doniosą materiały i zbudują
    const res = Build.enqueue(selected, hover.x, hover.y);
    if (!res.ok) { UI.flashHint(res.reason || 'Nie można tu budować'); return; }
    UI.refreshHUD();
    // tryb budowy zostaje włączony (budowa serii), ESC anuluje
  }

  function draw(ctx) {
    if (!selected) return;
    const s = World.state();
    const check = World.canPlace(selected, hover.x, hover.y);
    // przy kolejce budowy wystarczy złoto na otwarcie placu (materiały wnosi budowniczy)
    const affordable = (World.costOf(selected).zl || 0) <= s.res.złoto;
    const p = Data.FACTIONS[s.factionId].palette;
    const pos = Camera.worldToScreen(hover.x + 0.5, hover.y + 0.5);
    const w = Camera.tileW(), h = Camera.tileH();
    ctx.fillStyle = check.ok && affordable ? 'rgba(120,220,120,0.4)' : 'rgba(220,90,90,0.4)';
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y - h/2); ctx.lineTo(pos.x + w/2, pos.y);
    ctx.lineTo(pos.x, pos.y + h/2); ctx.lineTo(pos.x - w/2, pos.y);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 0.65; // duch budynku
    const art = Gfx.ART[Data.BUILDINGS[selected].art];
    if (art) art(ctx, pos.x, pos.y, Camera.zoom, p, performance.now() / 1000);
    ctx.globalAlpha = 1;
  }

  return { select, clear, isSelected, setHover, click, draw, buildingAtHover, hover: () => hover };
})();

/* ================================ MODUL: UI ================================ */
const UI = (() => {
  const hud = document.getElementById('hud');
  const buildBar = document.getElementById('buildBar');
  const buildTabs = document.getElementById('buildTabs');
  const buildItems = document.getElementById('buildItems');
  const tooltip = document.getElementById('tooltip');
  const hintEl = document.getElementById('hint');
  const DEFAULT_HINT = 'Przeciągnij prawym przyciskiem / WASD — kamera · kółko — zoom · ESC — anuluj budowę';
  let activeCat = 'Jedzenie';
  let hintTimer = null;
  let gameStarted = false;

  function buildFactionCards() {
    const wrap = document.getElementById('factionCards');
