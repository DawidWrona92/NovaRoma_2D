<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Nova Roma — Etap 5</title>
<style>
  :root {
    --panel-bg: rgba(20, 16, 12, 0.92);
    --panel-border: #6b543a;
    --gold: #e8c860;
    --text: #f0e6d2;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0b08; font-family: Georgia, 'Times New Roman', serif; }
  #game { position: absolute; inset: 0; display: block; cursor: default; touch-action: none; -webkit-user-select: none; user-select: none; }
  #game.dragging { cursor: grabbing; }

  /* ---------- HUD górny ---------- */
  #hud {
    position: absolute; top: 0; left: 0; right: 0; height: calc(46px + var(--safe-top));
    background: linear-gradient(#2a2018, #1a140e);
    border-bottom: 2px solid var(--panel-border);
    display: flex; align-items: center; gap: 18px; padding: var(--safe-top) 14px 0;
    color: var(--text); font-size: 14px; z-index: 10;
    user-select: none;
  }
  #hud .title { color: var(--gold); font-weight: bold; font-size: 16px; letter-spacing: 1px; }
  #hud .stat { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #hud .stat b { color: var(--gold); }
  #hud .spacer { flex: 1; }
  #hud button {
    background: #3a2c1c; color: var(--text); border: 1px solid var(--panel-border);
    padding: 4px 12px; cursor: pointer; font-family: inherit; font-size: 13px;
  }
  #hud button:hover { background: #55412a; }

  @media (max-width: 720px), (max-height: 640px) {
    /* HUD na telefonie: zwarty, zawijany, większe przyciski dotykowe */
    #hud { flex-wrap: wrap; height: auto; padding: calc(4px + var(--safe-top)) 8px 4px; font-size: 12px; gap: 8px 12px; overflow-x: hidden; }
    #hud .title { font-size: 13px; }
    #hud button { padding: 8px 10px; font-size: 12px; touch-action: manipulation; }
    /* podpowiedź widoczna na telefonie tylko jako komunikat chwilowy */
    #hint:not(.flash) { display: none !important; }
    #hint.flash { top: auto !important; bottom: 150px; left: 8px !important; right: 8px; font-size: 13px !important; }
    #resPanel { width: 132px; font-size: 10px; top: auto; height: 40vh; }
    .buildItem { width: 64px; }
  }
  /* ---------- Panel wyboru nacji ---------- */
  #factionPick {
    position: absolute; inset: 0; z-index: 50; display: flex;
    align-items: flex-start; justify-content: center;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: radial-gradient(ellipse at center, #2a2118 0%, #0d0b08 75%);
  }
  #factionPick .inner { text-align: center; max-width: 860px; padding: 20px; }
  #factionPick h1 { color: var(--gold); font-size: 42px; letter-spacing: 4px; margin-bottom: 4px; text-shadow: 0 2px 8px #000; }
  #factionPick p.sub { color: #a89878; margin-bottom: 26px; font-style: italic; }
  .factionCards { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }
  .factionCard {
    width: 240px; background: var(--panel-bg); border: 2px solid var(--panel-border);
    padding: 14px; cursor: pointer; color: var(--text); transition: transform .15s, box-shadow .15s;
  }
  .factionCard:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.6); border-color: var(--gold); }
  .factionCard canvas { width: 100%; height: 130px; display: block; background: #10130f; border: 1px solid #000; }
  .factionCard h2 { margin: 10px 0 2px; font-size: 20px; }
  .factionCard .tagline { font-size: 12px; color: #a89878; font-style: italic; margin-bottom: 8px; }
  .factionCard ul { list-style: none; font-size: 12px; text-align: left; color: #c8bda8; }
  .factionCard li::before { content: "◆ "; color: var(--gold); }
  @media (max-width: 720px), (max-height: 640px) {
    #factionPick { align-items: flex-start; overflow-y: auto; }
    #factionPick .inner { max-width: 100%; padding: calc(16px + var(--safe-top)) 12px 40px; }
    #factionPick h1 { font-size: 30px; letter-spacing: 2px; }
    #factionPick p.sub { margin-bottom: 16px; font-size: 14px; }
    .factionCards { flex-direction: column; align-items: center; }
    .factionCard { width: 100%; max-width: 420px; padding: 12px; touch-action: manipulation; }
    .factionCard:active { transform: scale(0.97); }
  }

  /* ---------- Dolny pasek budowy ---------- */
  #buildBar {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
    background: linear-gradient(#1a140e, #241c12);
    border-top: 2px solid var(--panel-border);
    padding: 6px 10px calc(8px + var(--safe-bottom)); color: var(--text);
    user-select: none;
  }
  #buildTabs { display: flex; gap: 6px; margin-bottom: 6px; }
  #buildTabs button {
    background: transparent; border: none; color: #a89878; font-family: inherit;
    font-size: 13px; padding: 3px 10px; cursor: pointer; border-bottom: 2px solid transparent;
  }
  #buildTabs button.active { color: var(--gold); border-bottom-color: var(--gold); }
  #buildItems { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; }
  .buildItem {
    flex: 0 0 auto; width: 74px; background: #241c12; border: 1px solid #4a3a26;
    padding: 4px 3px; cursor: pointer; text-align: center;
  }
  .buildItem:hover { border-color: var(--gold); background: #35281a; }
  .buildItem.selected { border-color: var(--gold); box-shadow: 0 0 6px rgba(232,200,96,.5); background: #35281a; }
  .buildItem canvas { width: 62px; height: 44px; display: block; margin: 0 auto; }
  .buildItem .bname { font-size: 10px; line-height: 1.1; margin-top: 2px; height: 22px; overflow: hidden; }
  .buildItem .bcost { font-size: 9px; color: #9a8a68; }

  /* ---------- Tooltip / info ---------- */
  #tooltip {
    position: absolute; z-index: 20; pointer-events: none; display: none;
    background: var(--panel-bg); border: 1px solid var(--panel-border); color: var(--text);
    padding: 8px 10px; font-size: 12px; max-width: 240px; line-height: 1.45;
  }
  #tooltip h3 { color: var(--gold); font-size: 14px; margin-bottom: 3px; }
  #tooltip .affordable { color: #8fce8f; }
  #tooltip .expensive { color: #e08484; }

  #hint {
    position: absolute; z-index: 30; left: 12px; top: calc(54px + var(--safe-top)); color: #b8a888;
    font-size: 12px; background: rgba(20,16,12,.85); padding: 4px 8px; border-radius: 3px;
    pointer-events: none;
  }

  #resPanel {
    position: absolute; z-index: 8; top: calc(54px + var(--safe-top)); right: 0; bottom: 90px; width: 172px;
    background: var(--panel-bg); border: 1px solid var(--panel-border);
    border-right: none; color: var(--text); font-size: 11px;
    padding: 6px 8px; overflow-y: auto; user-select: none;
  }
  #resPanel h3 { color: var(--gold); font-size: 12px; margin-bottom: 4px; letter-spacing: 1px; }
  #resPanel .row { display: flex; justify-content: space-between; line-height: 1.5; }
  #resPanel .row .v { color: #c8bda8; }
  #resPanel .row .cap { color: #7a6c55; font-size: 10px; }
  #resPanel .sep { border-top: 1px solid #3a2f22; margin: 5px 0; }
  #resPanel .full { color: #e08484; }
</style>
</head>

</div>

    <div class="factionCards" id="factionCards"></div>
  </div>
</div>

<script>
"use strict";
/* nakładka błędów: każdy błąd JS pokazuje się na ekranie (debug na telefonie) */
window.addEventListener('error', ev => {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#5a1a1a;color:#ffd0d0;font:12px monospace;padding:8px;white-space:pre-wrap;';
  d.textContent = '⚠ Błąd: ' + (ev.message || '?') + ' @ linia ' + (ev.lineno || '?');
  document.body.appendChild(d);
});
/* ============================================================================
   NOVA ROMA — silnik świata, wybór nacji, budowa, ekonomia, haracz, zdarzenia.
   Moduły (każdy to IIFE z jasnym API):

     Data      — cała zawartość (nacje, budynki, koszty, produkcja) jako dane
     RNG       — deterministyczny generator liczb losowych
     MapGen    — proceduralna mapa (teren, drzewa, złoża, brzeg)
     Gfx       — rysowanie kafli, budynków i obywateli
     Camera    — przesuwanie / zoom / konwersja współrzędnych
     World     — stan gry: kafle, budynki, obywatele, zasoby
     Economy   — ekonomia przepływowa (Etap 2): obsada, produkcja, głód
     Build     — logistyka budowy (Etap 3): kolejka placów, budowniczowie
     Tribute   — haracz seniora (Etap 4): żołnierze / złoto / wyprawy
     Events    — świat dynamiczny (Etap 5): napady, kryzysy
     TestBots  — boty testowe R/D/N
     BuildMode — interfejs budowy, walidacja miejsc, duch budynku
     UI        — HUD, pasek budowy, tooltipy
     Game      — pętla czasu, render, input
   ========================================================================== */

/* ====================== GLOBALNE (canvas dla Camera) ====================== */
const canvas = document.getElementById('game');
let dpr = window.devicePixelRatio || 1;

/* ============================== MODUL: RNG ================================ */
const RNG = (() => {
  let s = 123456789;
  function seed(v) { s = v >>> 0; }
  function next() { // mulberry32
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  return { seed, next, range: (a, b) => a + next() * (b - a),
           int: (a, b) => Math.floor(a + next() * (b - a + 1)),
           pick: arr => arr[Math.floor(next() * arr.length)] };
})();

    peatmine: { name:'Kopalnia darniowa', cat:'Surowce', art:'peatmine', worker:1, tool:true, factions:['vikings'], req:'deposit:peat', out:{ ruda:1.5 }, costs:{ vikings:{d:10} }, note:'Zjada 0,25 porcji/min' },
    charburner:{ name:'Wypalarka węgla', cat:'Surowce', art:'kiln', worker:1, factions:['vikings'], inp:{ pień:2.0 }, out:{ węgiel:1.0 }, costs:{ vikings:{d:8} }, note:'Jedyne źródło węgla' },
    mead:     { name:'Miodosytnia', cat:'Rzemiosło', art:'mead', worker:1, factions:['vikings'], inp:{ woda:0.5 }, out:{ 'miód pitny':1.0 }, costs:{ vikings:{d:9} } },
    dock:     { name:'Przystań', cat:'Militaria', art:'dock', worker:0, factions:['vikings'], req:'waterEdge', costs:{ vikings:{d:15} }, note:'Warunek dla Okrętu' },
    ship:     { name:'Okręt', cat:'Militaria', art:'ship', worker:0, factions:['vikings'], req:'waterEdge', costs:{ vikings:{d:40} }, note:'Wyprawa: 6 załogi, 6 miodu, 6 broni' }
  };

  const CATS = ['Mieszkania','Jedzenie','Drewno','Surowce','Rzemiosło','Handel','Militaria','Społeczne'];

  const RES_LABEL = { d:'deski', k:'kamień', gl:'glina', zl:'złoto' };

  return { FACTIONS, BUILDINGS, CATS, RES_LABEL };
})();

/* ============================= MODUL: CAMERA ============================== */
const Camera = (() => {
  const api = { x: 0, y: 0, zoom: 1 };
  const TW = 64, TH = 32; // rozmiar kafla izometrycznego przy zoom=1
  api.tileW = () => TW * api.zoom;
  api.tileH = () => TH * api.zoom;
  api.screenToWorld = (sx, sy) => {
    const w = canvas.width / dpr, h = canvas.height / dpr;
    const u = (sx - api.x - w / 2) / (TW * api.zoom);
    const v = (sy - api.y - h / 2) / (TH * api.zoom);
    return { x: u + v, y: v - u };
  };
  api.worldToScreen = (wx, wy) => {
    const w = canvas.width / dpr, h = canvas.height / dpr;
    return { x: (wx - wy) * (TW*api.zoom/2) + api.x + w/2,
             y: (wx + wy) * (TH*api.zoom/2) + api.y + h/2 };
  };
  return api;
})();

/* ============================= MODUL: MAPGEN ============================== */
/* Kafel: { h: typ terenu (0 woda, 1 piasek/trawa, 2 skała), trees: 0..3,
           deposit: null|'stone'|'iron'|'coal'|'clay'|'peat', occup: uid|null } */
const MapGen = (() => {
  const SIZE = 48;
  function generate(factionId) {
    RNG.seed(factionId === 'franks' ? 777 : factionId === 'saracens' ? 888 : 999);
    const c = Math.floor(SIZE/2);
    const tiles = new Array(SIZE * SIZE);
    for (let i = 0; i < SIZE * SIZE; i++) tiles[i] = { h: 1, trees: 0, deposit: null, occup: null };

    // Morze po jednej krawędzi (Wikingowie — pełne morze; inni — jezioro/zatoka)
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        const i = y * SIZE + x;
        const nx = x / SIZE, ny = y / SIZE;
        const coast = 5 + Math.sin(y * 0.35) * 2.5 + RNG.range(-0.8, 0.8)
                      + (factionId === 'vikings' ? -1.5 : 3.5);
        if (x < coast) tiles[i].h = 0;
        const mtn = Math.sin(nx*9)*Math.cos(ny*7)*0.9 + Math.sin((nx+ny)*13)*0.5;
        if (mtn > 0.92 && tiles[i].h === 1 && Math.hypot(x - c, y - c) > 9) tiles[i].h = 2; // skały nie na starcie
      }
    }
    // Drzewa — kępy; cel docelowy z danych nacji (przybliżenie gęstością)
    const f = Data.FACTIONS[factionId];
    const density = f.treesTarget / (SIZE * SIZE * 0.6);
    for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
      const i = y * SIZE + x;
      if (tiles[i].h !== 1) continue;
      const clump = Math.sin(x*0.9)*Math.cos(y*0.8) + RNG.range(-0.5, 0.5);
      if (clump > 0.1 && RNG.next() < density * 2.2)
        tiles[i].trees = RNG.int(1, 3);
    }
    // Złoża: gwarantowane minima; poza placem Dworu, na kaflu bez drzew
    const depPlan = {
      franks: [['stone',3], ['iron',2], ['coal',3]],
      saracens: [['clay',2]],
      vikings: [['peat',2]]
    }[factionId];
    for (const [kind, count] of depPlan) {
      let placed = 0, guard = 0;
      while (placed < count && guard++ < 500) {
        const x = RNG.int(6, SIZE-3), y = RNG.int(2, SIZE-3);
        const i = y * SIZE + x;
        const inPlaza = Math.abs(x - c) <= 3 && Math.abs(y - c) <= 3;
        if (tiles[i].h === 1 && !tiles[i].deposit && !inPlaza) {
          tiles[i].deposit = kind; tiles[i].trees = 0; placed++;
        }
      }
    }
    // Wyczyść plac pod Dwór (środek mapy)
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      const t = tiles[(c+dy)*SIZE + (c+dx)];
      if (t) { t.h = 1; t.trees = 0; t.deposit = null; }
    }
    return { size: SIZE, tiles };
  }
  function at(map, x, y) {
    if (x < 0 || y < 0 || x >= map.size || y >= map.size) return null;
    return map.tiles[y * map.size + x];
  }
  function neighbors(map, x, y) {
    return [[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy]) => at(map, x+dx, y+dy)).filter(Boolean);
  }
  return { generate, at, neighbors, SIZE };
})();

/* =============================== MODUL: GFX =============================== */
/* Sprite'y proceduralne (canvas 2D). Zasady czytelności:
   1. jedna bryła budynku + jeden sygnaturowy rekwizyt przylegający do ściany;
   2. unikalna sylwetka (wieża, komin, kopuła, koło, maszt);
   3. kolor kategorii: Militaria — proporzec, Społeczne — niebieski akcent,
      Handel — pasiasty daszek, Produkcja — ciepłe dachy z dymem;
   4. działki (farmy, sady, gaje) scalone płotem w jedną całość;
   5. teren żyje: kępki trawy, kwiaty, kamyki — deterministycznie z hasha
      pozycji kafla (bez RNG w renderze: zero migotania między klatkami). */
const Gfx = (() => {
  let t_anim = 0;
  function setAnim(v) { t_anim = v; }

  function shade(color, f) { // rozjaśnianie / przyciemnianie koloru (#rrggbb albo rgb(r,g,b))
    let r, g, b;
    if (color[0] === '#') {
      const n = parseInt(color.slice(1), 16);
      r = (n >> 16) & 255; g = (n >> 8) & 255; b = n & 255;
    } else {
      const m = color.match(/\d+/g) || [0, 0, 0];
      r = +m[0]; g = +m[1]; b = +m[2];
    }
    r = Math.min(255, Math.max(0, r * f)) | 0;
    g = Math.min(255, Math.max(0, g * f)) | 0;
    b = Math.min(255, Math.max(0, b * f)) | 0;
    return `rgb(${r},${g},${b})`;
  }

  /* deterministyczny hash kafla 0..1 (stabilny między klatkami) */
  function thash(x, y, n) {
    let v = (x * 374761393 + y * 668265263 + n * 69069) | 0;
    v = Math.imul(v ^ (v >>> 13), 1274126177);
    return ((v ^ (v >>> 16)) >>> 0) / 4294967296;
  }

  /* ============================== TEREN ============================== */
  function drawTile(ctx, t, sx, sy, z, terrain, coast) {
    const w = Camera.tileW(), h = Camera.tileH();
    let c;
    if (t.h === 0) c = terrain === 'sand' ? '#3a7192' : '#4a7a94';
    else if (t.h === 2) c = terrain === 'sand' ? '#a89880' : '#75746c';
    else c = terrain === 'grass' ? '#4f7c3a' : terrain === 'sand' ? '#cbb684' : '#63724a';
    ctx.fillStyle = shade(c, 0.96 + ((t.x + t.y) % 2) * 0.04);
    ctx.beginPath();
    ctx.moveTo(sx, sy - h/2); ctx.lineTo(sx + w/2, sy);
    ctx.lineTo(sx, sy + h/2); ctx.lineTo(sx - w/2, sy);
    ctx.closePath(); ctx.fill();
    /* ziarno terenu: deterministyczne nakrapki jasne/ciemne */
    ctx.save(); ctx.clip();
    const gr = t.h === 0 ? 10 : 7;
    for (let i = 0; i < gr; i++) {
      const rA = thash(t.x, t.y, 200 + i), rB = thash(t.x, t.y, 240 + i);
      const gx = sx + (rA - 0.5) * w * 0.82;
      const gy = sy + (rB - 0.5) * h * 0.82;
      ctx.fillStyle = shade(c, thash(t.x, t.y, 280 + i) > 0.5 ? 1.14 : 0.8);
      ctx.fillRect(gx, gy, 1.7*z, 1.0*z);
    }
    ctx.restore();

    if (t.h === 0) { // woda: piana przy brzegu, zmarszczki, błyski
      if (coast) {
        const VT = [[0,-h/2, w/2,0], [w/2,0, 0,h/2], [0,h/2, -w/2,0], [-w/2,0, 0,-h/2]];
        for (let e = 0; e < 4; e++) {
          if (!(coast & (1 << e))) continue;
          const vx1 = VT[e][0], vy1 = VT[e][1], vx2 = VT[e][2], vy2 = VT[e][3];
          const k = 0.82, wob = Math.sin(t_anim * 1.6 + t.x * 1.3 + t.y * 0.7 + e * 1.6) * 1.6 * z;
          ctx.strokeStyle = "rgba(230,240,240,0.38)"; ctx.lineWidth = 2.0 * z;
          ctx.beginPath();
          ctx.moveTo(sx + vx1 * k, sy + vy1 * k);
          ctx.quadraticCurveTo(sx + (vx1 + vx2) * 0.35 + wob, sy + (vy1 + vy2) * 0.35 + wob * 0.5, sx + vx2 * k, sy + vy2 * k);
          ctx.stroke();
          ctx.strokeStyle = "rgba(230,240,240,0.15)"; ctx.lineWidth = 3.6 * z;
          ctx.beginPath();
          ctx.moveTo(sx + vx1 * k * 0.92, sy + vy1 * k * 0.92);
          ctx.lineTo(sx + vx2 * k * 0.92, sy + vy2 * k * 0.92);
          ctx.stroke();
        }
      }
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.beginPath(); ctx.ellipse(sx, sy, w/4, h/6, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 1;
      for (let i = 0; i < 3; i++) {
        const r1 = thash(t.x, t.y, i * 2), r2 = thash(t.x, t.y, i * 2 + 1);
        const drift = ((t_anim * 0.35 + i * 0.33) % 1 - 0.5) * w * 0.2;
        const wx = sx + (r1 - 0.5) * w * 0.5 + drift, wy = sy + (r2 - 0.5) * h * 0.5;
        ctx.beginPath(); ctx.moveTo(wx - 4*z, wy); ctx.quadraticCurveTo(wx, wy - 2*z, wx + 4*z, wy); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      for (let i = 0; i < 4; i++) {
        const bA = thash(t.x, t.y, 300 + i), bB = thash(t.x, t.y, 320 + i);
        ctx.fillRect(sx + (bA - 0.5) * w * 0.7, sy + (bB - 0.5) * h * 0.7, 1.2*z, 0.7*z);
      }
    } else if (terrain === 'grass' && t.h === 1) { // łąka: kępki, kwiaty, kamyki
      const nTufts = 2 + Math.floor(thash(t.x, t.y, 9) * 3);
      for (let i = 0; i < nTufts; i++) {
        const gx = sx + (thash(t.x, t.y, i * 3) - 0.5) * w * 0.62;
        const gy = sy + (thash(t.x, t.y, i * 3 + 1) - 0.5) * h * 0.62;
        drawGrassTuft(ctx, gx, gy, z, 0.8 + thash(t.x, t.y, i * 3 + 2) * 0.5);
      }
      if (thash(t.x, t.y, 30) > 0.62) { // kwiatek
        const fx = sx + (thash(t.x, t.y, 31) - 0.5) * w * 0.5;
        const fy = sy + (thash(t.x, t.y, 32) - 0.5) * h * 0.5;
        const fc = thash(t.x, t.y, 33) > 0.5 ? '#e8d84a' : '#e07a9a';
        ctx.strokeStyle = '#4a7a34'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - 4*z); ctx.stroke();
        ctx.fillStyle = fc;
        ctx.beginPath(); ctx.arc(fx, fy - 5*z, 1.8*z, 0, 7); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(fx, fy - 5*z, 0.7*z, 0, 7); ctx.fill();
      }
      if (thash(t.x, t.y, 40) > 0.78) { // kamyk
        const px = sx + (thash(t.x, t.y, 41) - 0.5) * w * 0.55;
        const py = sy + (thash(t.x, t.y, 42) - 0.5) * h * 0.55;
        ctx.fillStyle = '#8a8a80';
        ctx.beginPath(); ctx.ellipse(px, py, 2.4*z, 1.4*z, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#a8a89c';
        ctx.beginPath(); ctx.ellipse(px - 0.6*z, py - 0.5*z, 1*z, 0.55*z, 0, 0, 7); ctx.fill();
      }
    } else if (terrain === 'sand' && t.h === 1) { // piach: zmarszczki
      ctx.strokeStyle = 'rgba(120,90,50,0.25)'; ctx.lineWidth = 1;
      for (let i = 0; i < 3; i++) {
        const ry = sy - h*0.22 + i*h*0.22 + (thash(t.x, t.y, i) - 0.5) * h * 0.12;
        ctx.beginPath(); ctx.moveTo(sx - w*0.3, ry);
        ctx.quadraticCurveTo(sx, ry + (thash(t.x, t.y, i + 5) - 0.5) * h * 0.2, sx + w*0.3, ry);
        ctx.stroke();
      }
    } else if (t.h === 2) { // skały: spękania
      ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1;
      for (let i = 0; i < 2; i++) {
        const rx = sx + (thash(t.x, t.y, i + 60) - 0.5) * w * 0.4;
        const ry = sy + (thash(t.x, t.y, i + 62) - 0.5) * h * 0.4;
        ctx.beginPath(); ctx.moveTo(rx - 4*z, ry); ctx.lineTo(rx + 4*z, ry + (thash(t.x, t.y, i + 64) - 0.5) * 4*z); ctx.stroke();
      }
    }

    // drzewa na kafel (1–3 szt.)
    if (t.trees > 0) {
      const spots = [[-0.18, -0.1], [0.12, -0.18], [0.02, 0.1]];
      for (let i = 0; i < t.trees; i++) {
        const ox = spots[i][0] * w, oy = spots[i][1] * h;
        drawTree(ctx, sx + ox, sy + oy, z, terrain);
      }
    }
    if (t.deposit) drawDeposit(ctx, sx, sy, z, t.deposit);
  }

  function drawGrassTuft(ctx, x, y, z, sc) {
    ctx.strokeStyle = '#4e8034'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = -1; i <= 1; i++) {
      ctx.moveTo(x, y);
      ctx.lineTo(x + i * 2.4*z*sc, y - 5*z*sc + Math.abs(i) * 1.2*z);
    }
    ctx.stroke();
    ctx.strokeStyle = '#6ba04a';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 0.8*z, y - 4.6*z*sc); ctx.stroke();
  }

  function drawTree(ctx, x, y, z, terrain) {
    const s = z;
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; // cień korony
    ctx.beginPath(); ctx.ellipse(x + 2.2*s, y + 1.2*s, 7*s, 2.6*s, 0, 0, 7); ctx.fill();
    const trunk = terrain === 'sand' ? '#8a6a45' : '#5c4630';
    const leaf = terrain === 'sand' ? '#5a8a4a' : terrain === 'tundra' ? '#3e6a44' : '#3a7a34';
    ctx.fillStyle = trunk;
    ctx.fillRect(x - 1.5*s, y - 8*s, 3*s, 8*s);
    ctx.fillStyle = leaf;
    ctx.beginPath(); ctx.moveTo(x, y - 20*s); ctx.lineTo(x + 7*s, y - 6*s); ctx.lineTo(x - 7*s, y - 6*s);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = shade(leaf, 1.25); // oświetlenie lewej strony
    ctx.beginPath(); ctx.moveTo(x, y - 20*s); ctx.lineTo(x - 5*s, y - 8*s); ctx.lineTo(x - 1*s, y - 8*s);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = shade(leaf, 0.7); // przygaszenie prawej
    ctx.beginPath(); ctx.moveTo(x, y - 20*s); ctx.lineTo(x + 7*s, y - 6*s); ctx.lineTo(x + 2*s, y - 8*s);
    ctx.closePath(); ctx.fill();
  }

  function drawDeposit(ctx, x, y, z, kind) {
    const colors = { stone:'#9a9a92', iron:'#a58760', coal:'#3a3a3a', clay:'#b07050', peat:'#6a5030' };
    const c = colors[kind];
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(x, y + 2*z, 13*z, 5*z, 0, 0, 7); ctx.fill();
    for (const [ox, oy, r] of [[-8,2,4],[6,4,5],[0,-4,3]]) {
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.ellipse(x + ox*z, y + oy*z, r*z, r*0.55*z, 0, 0, 7); ctx.fill();
      ctx.fillStyle = shade(c, 1.35);
      ctx.beginPath(); ctx.ellipse(x + ox*z - 1, y + oy*z - 1, r*z*0.45, r*0.25*z, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = shade(c, 0.5); ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.ellipse(x + ox*z, y + oy*z, r*z, r*0.55*z, 0, 0, 7); ctx.stroke();
    }
    if (kind === 'iron') { // rudy błysk
      ctx.fillStyle = '#d8c8a8';
      ctx.fillRect(x - 6*z, y + 2*z, 1.4*z, 1.4*z); ctx.fillRect(x + 8*z, y + 1*z, 1.4*z, 1.4*z);
    }
  }

  function shadow(ctx, x, y, z, rx) { // kierunkowy cień: światło z lewej-góry
    const ox = rx * 0.3 * z, oy = 0.5 * z;
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath(); ctx.ellipse(x + ox, y + oy, rx * z * 1.12, rx * 0.42 * z, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.10)"; // miękka poświata
    ctx.beginPath(); ctx.ellipse(x + ox * 0.5, y + oy * 0.5, rx * z * 1.3, rx * 0.5 * z, 0, 0, 7); ctx.fill();
  }

  /* ===================== PRYMITYWY I REKWIZYTY ===================== */

  function base(ctx, x, y, z, p, wW, wH) { // prostokąt ściany (front)
    ctx.fillStyle = p.wall; ctx.fillRect(x - wW/2, y - wH, wW, wH);
    ctx.strokeStyle = shade(p.wall, 0.6); ctx.lineWidth = 1; ctx.strokeRect(x - wW/2, y - wH, wW, wH);
    ctx.fillStyle = shade(p.wall, 1.16); ctx.fillRect(x - wW/2, y - wH, wW, 2*z); // rozświetlona góra ściany
    ctx.fillStyle = shade(p.wall, 0.8); ctx.fillRect(x - wW/2, y - 2*z, wW, 2*z); // przyziemie w cieniu
    if (p.timber) { // szachulec / bierwiona
      ctx.strokeStyle = shade(p.timber, 1.0); ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(x - wW/2, y - wH/2); ctx.lineTo(x + wW/2, y - wH/2);
      ctx.moveTo(x - wW/2, y - wH); ctx.lineTo(x + wW/2, y);
      ctx.moveTo(x + wW/2, y - wH); ctx.lineTo(x - wW/2, y);
      ctx.stroke();
    }
  }

  function door(ctx, x, y, z, col) {
    ctx.fillStyle = col || '#3a2a1a'; ctx.fillRect(x - 3*z, y - 8*z, 6*z, 8*z);
    ctx.fillStyle = shade(col || '#3a2a1a', 1.5);
    ctx.fillRect(x - 2.2*z, y - 7*z, 1.2*z, 1.2*z); // klamka
  }

  function windowLit(ctx, x, y, z, p) { // okno z "łuną"
    ctx.fillStyle = '#f8e8a0'; ctx.fillRect(x - 2.5*z, y - 3*z, 5*z, 5*z);
    ctx.strokeStyle = shade(p.wall, 0.5); ctx.lineWidth = 1;
    ctx.strokeRect(x - 2.5*z, y - 3*z, 5*z, 5*z);
    ctx.beginPath(); ctx.moveTo(x, y - 3*z); ctx.lineTo(x, y + 2*z); ctx.stroke();
  }

  function roofGable(ctx, x, y, z, p, wW, wH, rh, col) { // dwuspadowy dach
    const c = col || p.roof;
    const g = ctx.createLinearGradient(x - wW/2, y - wH - rh, x + wW/2, y - wH);
    g.addColorStop(0, shade(c, 1.18)); g.addColorStop(0.55, c); g.addColorStop(1, shade(c, 0.8));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x - wW/2 - 2*z, y - wH); ctx.lineTo(x, y - wH - rh);
    ctx.lineTo(x + wW/2 + 2*z, y - wH); ctx.lineTo(x + wW/2 - 1*z, y - wH + 3*z);
    ctx.lineTo(x - wW/2 + 1*z, y - wH + 3*z);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(c, 0.55); ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = shade(c, 1.25); // krawędź słońca
    ctx.beginPath();
    ctx.moveTo(x - wW/2 - 2*z, y - wH); ctx.lineTo(x, y - wH - rh);
    ctx.lineTo(x, y - wH - rh + 3*z); ctx.lineTo(x - wW/2 + 1*z, y - wH + 3*z);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(c, 0.5); // strzecha
    ctx.beginPath();
    ctx.moveTo(x - wW/2 + 1*z, y - wH + 3*z); ctx.lineTo(x + wW/2 - 1*z, y - wH + 3*z);
    ctx.stroke();
  }

  function roofFlat(ctx, x, y, z, p, wW, wH) { // płaski dach (Saraceni)
    const g = ctx.createLinearGradient(x - wW/2 - 2*z, y - wH - 7*z, x + wW/2 + 2*z, y - wH - 1*z);
    g.addColorStop(0, shade(p.roof, 1.15)); g.addColorStop(1, shade(p.roof, 0.82));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x - wW/2 - 2*z, y - wH - 4*z); ctx.lineTo(x, y - wH - 1*z);
    ctx.lineTo(x + wW/2 + 2*z, y - wH - 4*z); ctx.lineTo(x, y - wH - 7*z);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(p.roof, 0.6); ctx.lineWidth = 1; ctx.stroke();
  }

  function dome(ctx, x, y, z, p, wW, wH, col) {
    ctx.fillStyle = col || p.accent;
    ctx.beginPath(); ctx.ellipse(x, y - wH - 2*z, wW*0.42, wH*0.55, 0, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = shade(col || p.accent, 0.55); ctx.stroke();
    ctx.fillStyle = shade(col || p.accent, 1.3); // podświetlenie kopuły
    ctx.beginPath(); ctx.ellipse(x - wW*0.13, y - wH - 2.5*z, wW*0.16, wH*0.34, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = p.metal; // iglica
    ctx.fillRect(x - 0.8*z, y - wH - 2*z - wH*0.55 - 5*z, 1.6*z, 5*z);
  }

  function chimneyWith(ctx, x, y, z, c) { // komin + dymek
    ctx.fillStyle = shade(c || '#8a7a6a', 0.9);
    ctx.fillRect(x - 2.5*z, y - 8*z, 5*z, 8*z);
    ctx.fillStyle = shade(c || '#8a7a6a', 0.6);
    ctx.fillRect(x - 3*z, y - 9.5*z, 6*z, 2*z);
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(x + Math.sin(i*1.5)*3*z, y - (13 + i*5)*z, (2.5 + i*0.8)*z, 0, 7);
      ctx.fillStyle = `rgba(210,210,210,${0.42 - i*0.12})`;
      ctx.fill();
    }
  }

  /* rekwizyty — zawsze przylegające do budynku (x,y = punkt przy ścianie) */
  function barrelV(ctx, x, y, z, c, w, h) { // beczka pionowa
    ctx.fillStyle = shade(c, 1.1);
    ctx.beginPath(); ctx.ellipse(x, y, w*z, w*0.45*z, 0, 0, 7); ctx.fill(); // dno
    ctx.fillRect(x - w*z, y - h*z, 2*w*z, h*z);
    ctx.strokeStyle = shade(c, 0.55); ctx.lineWidth = 1;
    ctx.strokeRect(x - w*z, y - h*z, 2*w*z, h*z);
    ctx.beginPath(); ctx.moveTo(x - w*z, y - h*0.3*z); ctx.lineTo(x + w*z, y - h*0.3*z);
    ctx.moveTo(x - w*z, y - h*0.7*z); ctx.lineTo(x + w*z, y - h*0.7*z); ctx.stroke(); // obręcze
    ctx.fillStyle = shade(c, 1.3);
    ctx.beginPath(); ctx.ellipse(x, y - h*z, w*z, w*0.45*z, 0, 0, 7); ctx.fill(); // wieczko
  }
  function logStack(ctx, x, y, z, c, n) { // stos kłód poziomych
    for (let i = 0; i < n; i++) {
      const ly = y - (i % 2) * 4*z - Math.floor(i / 2) * 0;
      const lx = x + (i % 2 ? 5 : 0) * z;
      ctx.fillStyle = c;
      ctx.fillRect(lx - 5*z, ly - 6*z - (i > 1 ? 4*z : 0), 11*z, 5*z);
      ctx.fillStyle = shade(c, 1.35);
      ctx.beginPath(); ctx.ellipse(lx + 6*z, ly - 3.5*z - (i > 1 ? 4*z : 0), 1.8*z, 2.5*z, 0, 0, 7); ctx.fill();
    }
  }
  function crate(ctx, x, y, z, c, s) { // skrzynia
    ctx.fillStyle = c; ctx.fillRect(x - s*z, y - 2*s*z, 2*s*z, 2*s*z);
    ctx.strokeStyle = shade(c, 0.6); ctx.lineWidth = 1;
    ctx.strokeRect(x - s*z, y - 2*s*z, 2*s*z, 2*s*z);
    ctx.beginPath(); ctx.moveTo(x - s*z, y - 2*s*z); ctx.lineTo(x + s*z, y); ctx.stroke();
  }
  function sack(ctx, x, y, z, c) { // worek z ziarnem
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.ellipse(x, y - 3.5*z, 3.4*z, 3.8*z, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = shade(c, 0.6); ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 1.5*z, y - 6.2*z); ctx.lineTo(x + 1.5*z, y - 6.2*z); ctx.stroke();
  }
  function pennant(ctx, x, y, z, p, t) { // proporzec na maszcie przy ścianie
    ctx.strokeStyle = '#5a4230'; ctx.lineWidth = 1.5*z;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 22*z); ctx.stroke();
    ctx.fillStyle = p.cloth;
    ctx.beginPath(); ctx.moveTo(x, y - 22*z);
    ctx.lineTo(x + 10*z + Math.sin(t*3)*2*z, y - 19*z);
    ctx.lineTo(x, y - 16*z); ctx.closePath(); ctx.fill();
  }
  function plot(ctx, x, y, z, col) { // działka: płaski romb "ziemi" + niski płot
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(x, y - 9*z); ctx.lineTo(x + 20*z, y); ctx.lineTo(x, y + 9*z); ctx.lineTo(x - 20*z, y);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(90,66,48,0.85)'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x, y - 9*z); ctx.lineTo(x - 20*z, y); ctx.lineTo(x, y + 9*z);
    ctx.lineTo(x + 20*z, y); ctx.closePath(); ctx.stroke();
    for (const [fx, fy] of [[-18, 0], [0, -8], [18, 0], [0, 8]]) { // słupki płotu
      ctx.strokeStyle = '#7a5c3a'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(x + fx*z, y + fy*z); ctx.lineTo(x + fx*z, y + fy*z - 4*z); ctx.stroke();
    }
  }

  /* ============================ ARTS: JEDEN BUDYNEK = JEDEN ART =========================
     (ctx, x, y, z, p, t): x,y = punkt odniesienia na kaflu; p = paleta nacji. */
  const ART = {

    /* ---- MIESZKANIA ---- */
    hut(ctx, x, y, z, p, t) {
      shadow(ctx, x, y, z, 15);
      base(ctx, x, y, z, p, 26*z, 16*z);
      if (p.terrain === 'sand') roofFlat(ctx, x, y, z, p, 26*z, 16*z);
      else roofGable(ctx, x, y, z, p, 26*z, 16*z, 12*z);
      door(ctx, x - 6*z, y, z);
      windowLit(ctx, x + 5*z, y - 10*z, z, p);
      ctx.fillStyle = '#d84a5a'; // skrzynka z kwiatami pod oknem
      ctx.fillRect(x + 2*z, y - 4.5*z, 7*z, 3*z);
      ctx.fillStyle = '#4a8a3a';
      ctx.fillRect(x + 2.5*z, y - 5.5*z, 6*z, 1.2*z);
      chimneyWith(ctx, x + 8*z, y - 20*z, z, p.stone);
    },

    /* ---- DREWNO ---- */
    woodcutter(ctx, x, y, z, p, t) { // pniak z toporkiem + stos kłód
      shadow(ctx, x, y, z, 15);
      base(ctx, x, y, z, p, 24*z, 15*z);
      roofGable(ctx, x, y, z, p, 24*z, 15*z, 11*z);
      door(ctx, x - 5*z, y, z);
      logStack(ctx, x + 8*z, y - 1*z, z, '#8a6a45', 3);
      ctx.fillStyle = '#7a5a3a';
      ctx.fillRect(x - 14*z, y - 5*z, 5*z, 5*z);
      ctx.strokeStyle = '#5a4230'; ctx.lineWidth = 1.6*z;
      ctx.beginPath(); ctx.moveTo(x - 11.5*z, y - 5*z); ctx.lineTo(x - 8*z, y - 11*z); ctx.stroke();
      ctx.fillStyle = p.metal;
      ctx.beginPath(); ctx.moveTo(x - 8*z, y - 11*z); ctx.lineTo(x - 5.5*z, y - 9.5*z);
      ctx.lineTo(x - 8*z, y - 8.5*z); ctx.closePath(); ctx.fill();
    },
    forester(ctx, x, y, z, p, t) { // skrzynka z sadzonkami
      shadow(ctx, x, y, z, 14);
      base(ctx, x, y, z, p, 22*z, 14*z);
      roofGable(ctx, x, y, z, p, 22*z, 14*z, 13*z, p.roofAlt);
      door(ctx, x - 4*z, y, z);
      windowLit(ctx, x + 4*z, y - 9*z, z, p);
      crate(ctx, x + 10*z, y, z, '#8a6a45', 5);
      ctx.fillStyle = '#4a8a3a';
      for (let i = 0; i < 3; i++) {
        const sxp = x + (7.5 + i * 2.4)*z;
        ctx.fillRect(sxp - 0.5*z, y - 14*z, 1*z, 4.2*z);
        ctx.beginPath(); ctx.ellipse(sxp, y - 15*z, 1.8*z, 2.4*z, 0, 0, 7); ctx.fill();
      }
    },
    sawmill(ctx, x, y, z, p, t) { // koło piły + deski
      shadow(ctx, x, y, z, 17);
      base(ctx, x, y, z, p, 30*z, 17*z);
      roofGable(ctx, x, y, z, p, 30*z, 17*z, 9*z);
      door(ctx, x - 8*z, y, z);
      ctx.save(); ctx.translate(x + 9*z, y - 8*z); ctx.rotate(t * 3);
      ctx.strokeStyle = p.metal; ctx.lineWidth = 2*z;
      ctx.beginPath(); ctx.arc(0, 0, 6*z, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-6*z, 0); ctx.lineTo(6*z, 0); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = '#c8a878';
      for (let i = 0; i < 3; i++) ctx.fillRect(x - 15*z, y - 10*z - i*2.6*z, 7*z, 1.8*z);
      ctx.strokeStyle = '#8a6a45'; ctx.lineWidth = 0.8;
      for (let i = 0; i < 3; i++) ctx.strokeRect(x - 15*z, y - 10*z - i*2.6*z, 7*z, 1.8*z);
    },

    /* ---- JEDZENIE ---- */
    hunter(ctx, x, y, z, p, t) { // poroże na szczycie + wędzarka
      shadow(ctx, x, y, z, 14);
      base(ctx, x, y, z, p, 24*z, 15*z);
      roofGable(ctx, x, y, z, p, 24*z, 15*z, 11*z, p.roofAlt);
      door(ctx, x - 4*z, y, z);
      ctx.strokeStyle = '#e8d8b8'; ctx.lineWidth = 1.6*z;
      ctx.beginPath();
      ctx.moveTo(x - 3*z, y - 24*z); ctx.lineTo(x - 7*z, y - 29*z);
      ctx.moveTo(x - 5.5*z, y - 27*z); ctx.lineTo(x - 8.5*z, y - 27.5*z);
      ctx.moveTo(x + 3*z, y - 24*z); ctx.lineTo(x + 7*z, y - 29*z);
      ctx.moveTo(x + 5.5*z, y - 27*z); ctx.lineTo(x + 8.5*z, y - 27.5*z);
      ctx.stroke();
      ctx.strokeStyle = '#5a4230'; ctx.lineWidth = 1.5*z;
      ctx.beginPath(); ctx.moveTo(x + 9*z, y); ctx.lineTo(x + 9*z, y - 14*z);
      ctx.moveTo(x + 14*z, y); ctx.lineTo(x + 14*z, y - 14*z);
      ctx.moveTo(x + 7.5*z, y - 14*z); ctx.lineTo(x + 15.5*z, y - 14*z); ctx.stroke();
      ctx.fillStyle = '#a05a30';
      for (const ox of [9, 14]) { // szynki
        ctx.beginPath(); ctx.ellipse(x + ox*z, y - 9*z, 2.2*z, 3.6*z, 0, 0, 7); ctx.fill();
        ctx.strokeStyle = '#c89858'; ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(x + ox*z, y - 13*z); ctx.lineTo(x + ox*z, y - 5.4*z); ctx.stroke();
      }
    },
    fisher(ctx, x, y, z, p, t) { // na palach + suszące się sieci/ryby
      shadow(ctx, x, y, z, 14);
      ctx.fillStyle = '#6a4a2c';
      for (const ox of [-9, 0, 9]) ctx.fillRect(x + ox*z - 1.2*z, y - 6*z, 2.4*z, 6*z);
      base(ctx, x, y - 5*z, z, p, 22*z, 13*z);
      roofGable(ctx, x, y - 5*z, z, p, 22*z, 13*z, 11*z);
      door(ctx, x - 4*z, y - 3*z, z);
      ctx.strokeStyle = '#5a4230'; ctx.lineWidth = 1.4*z;
      ctx.beginPath();
      ctx.moveTo(x + 12*z, y); ctx.lineTo(x + 12*z, y - 12*z); ctx.stroke();
      ctx.strokeStyle = 'rgba(230,225,210,0.9)'; ctx.lineWidth = 0.6;
      for (let i = 0; i < 3; i++) { // siatka
        ctx.beginPath();
        ctx.moveTo(x + 12.5*z, y - 3*z - i*3.2*z); ctx.lineTo(x + 17.5*z, y - 5*z - i*3.2*z);
        ctx.moveTo(x + 12.5*z, y - 5*z - i*3.2*z); ctx.lineTo(x + 17.5*z, y - 3*z - i*3.2*z);
        ctx.stroke();
      }
      ctx.fillStyle = '#b8c8d8'; // ryby
      ctx.beginPath(); ctx.ellipse(x + 14.5*z, y - 2*z, 2.6*z, 1.2*z, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + 17*z, y - 2*z); ctx.lineTo(x + 19*z, y - 3.2*z);
      ctx.lineTo(x + 19*z, y - 0.8*z); ctx.closePath(); ctx.fill();
    },
    dairy(ctx, x, y, z, p, t) { // konwie + ser
      shadow(ctx, x, y, z, 16);
      base(ctx, x, y, z, p, 26*z, 16*z);
      if (p.terrain === 'sand') roofFlat(ctx, x, y, z, p, 26*z, 16*z);
      else roofGable(ctx, x, y, z, p, 26*z, 16*z, 9*z);
      door(ctx, x - 6*z, y, z);
      windowLit(ctx, x + 4*z, y - 11*z, z, p);
      for (const ox of [10, 14]) {
        ctx.fillStyle = '#d8d0c0';
        ctx.fillRect(x + ox*z - 2*z, y - 8*z, 4*z, 8*z);
        ctx.strokeStyle = '#9a9280'; ctx.lineWidth = 1;
        ctx.strokeRect(x + ox*z - 2*z, y - 8*z, 4*z, 8*z);
        ctx.beginPath(); ctx.arc(x + ox*z, y - 8*z, 2*z, Math.PI, 0); ctx.stroke(); // uchwyt
        ctx.fillStyle = '#f4f0e8'; ctx.fillRect(x + ox*z - 2*z, y - 10*z, 4*z, 2*z); // wieczko
      }
      ctx.fillStyle = '#e8c860'; // głowa sera
      ctx.beginPath(); ctx.ellipse(x + 12*z, y - 2*z, 2.4*z, 1.4*z, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = '#c8a040'; ctx.beginPath(); ctx.ellipse(x + 12*z, y - 2*z, 1.4*z, 0.8*z, 0, 0, 7); ctx.stroke();
    },
    bakery(ctx, x, y, z, p, t) { // precel na szyldzie + worki mąki
      shadow(ctx, x, y, z, 16);
      base(ctx, x, y, z, p, 28*z, 16*z);
      roofGable(ctx, x, y, z, p, 28*z, 16*z, 10*z);
      door(ctx, x - 7*z, y, z);
      windowLit(ctx, x + 6*z, y - 11*z, z, p);
      chimneyWith(ctx, x + 10*z, y - 24*z, z, p.stone);
      ctx.strokeStyle = '#5a4230'; ctx.lineWidth = 1.2*z;
      ctx.beginPath(); ctx.moveTo(x - 14*z, y - 12*z); ctx.lineTo(x - 14*z, y - 2*z); ctx.stroke();
      ctx.strokeStyle = '#c89040'; ctx.lineWidth = 2.2*z; // precel
      ctx.beginPath(); ctx.arc(x - 14*z, y - 6*z, 2.8*z, 0, 7); ctx.stroke();
      sack(ctx, x - 9*z, y, z, '#d8c8a0');
      sack(ctx, x - 4.5*z, y, z, '#e0d2ae');
    },
    incense(ctx, x, y, z, p, t) { // kadzielnice z dymem + wory żywicy
      shadow(ctx, x, y, z, 16);
      base(ctx, x, y, z, p, 26*z, 16*z);
      roofFlat(ctx, x, y, z, p, 26*z, 16*z);
      door(ctx, x - 6*z, y, z);
      ctx.fillStyle = '#b08040';
      ctx.beginPath(); ctx.moveTo(x + 8*z, y); ctx.lineTo(x + 7*z, y - 6*z);
      ctx.lineTo(x + 15*z, y - 6*z); ctx.lineTo(x + 14*z, y); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = shade('#b08040', 0.6); ctx.stroke();
      for (let i = 0; i < 3; i++) { // kłąb kadzidła
        ctx.beginPath();
        ctx.arc(x + 11*z + Math.sin(i*2)*2.5*z, y - (10 + i*5)*z, (2.2 + i*0.7)*z, 0, 7);
        ctx.fillStyle = `rgba(230,220,200,${0.38 - i*0.1})`;
        ctx.fill();
      }
      sack(ctx, x - 2*z, y, z, '#c8a860');
      sack(ctx, x + 2.5*z, y, z, '#b89450');
    },
    farm(ctx, x, y, z, p, t) { // jedna działka z płotem, chatka w rogu
      function wRow(i) { return 18*z - i*3.5*z; }
      function hRow(i) { return 5.5*z - i*1.5*z; }
      plot(ctx, x, y, z, p.terrain === 'sand' ? '#c8b078' : '#c9a84e');
      ctx.strokeStyle = shade('#c8a850', 0.72); ctx.lineWidth = 1; // bruzdy pól
      for (let i = 1; i < 4; i++) {
        ctx.beginPath(); ctx.moveTo(x - wRow(i), y - hRow(i));
        ctx.lineTo(x + wRow(i), y - hRow(i)); ctx.stroke();
      }
      ctx.strokeStyle = '#d8c058'; // kłosy
      for (let i = 0; i < 6; i++) {
        const gx = x + (thash(i, 3, 1) - 0.5) * 30*z, gy = y + (thash(i, 7, 2) - 0.5) * 12*z;
        ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + 0.5*z, gy - 4*z); ctx.stroke();
      }
      shadow(ctx, x + 9*z, y - 7*z, z, 7);
      base(ctx, x + 9*z, y - 7*z, z, p, 13*z, 9*z);
      roofGable(ctx, x + 9*z, y - 7*z, z, p, 13*z, 9*z, 6*z, p.roofAlt);
    },
    cotton(ctx, x, y, z, p, t) { // krzaki z białymi kłębami w rzędach
      plot(ctx, x, y, z, '#cdb98a');
      for (let i = 0; i < 6; i++) {
        const gx = x + (thash(i, 11, 3) - 0.5) * 32*z;
        const gy = y + (thash(i, 13, 4) - 0.5) * 13*z;
        ctx.fillStyle = '#5a8a44';
        ctx.beginPath(); ctx.ellipse(gx, gy - 2.5*z, 3.2*z, 2.6*z, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#f4f0ea';
        for (const [ox, oy] of [[-1.4, -3.6], [0.6, -4.6], [2, -3.2]]) {
          ctx.beginPath(); ctx.arc(gx + ox*z, gy + oy*z, 1.3*z, 0, 7); ctx.fill();
        }
      }
    },
    orchard(ctx, x, y, z, p, t) { // płot + 3 drzewa owocowe
      plot(ctx, x, y, z, '#8aa85c');
      const colors = p.terrain === 'sand' ? '#e88a3a' : '#d84a4a';
      for (const [ox, oy] of [[-9, -2], [8, -6], [0, 4]]) {
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        ctx.beginPath(); ctx.ellipse(x + ox*z, y + oy*z + 1*z, 5*z, 1.8*z, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#5c4630';
        ctx.fillRect(x + ox*z - 1*z, y + oy*z - 9*z, 2*z, 9*z);
        ctx.fillStyle = p.terrain === 'sand' ? '#6a9a4a' : '#4a8a3a';
        ctx.beginPath(); ctx.arc(x + ox*z, y + oy*z - 13*z, 6*z, 0, 7); ctx.fill();
        ctx.fillStyle = colors; // owoce
        ctx.beginPath();
        ctx.arc(x + ox*z - 2*z, y + oy*z - 12*z, 1.6*z, 0, 7);
        ctx.arc(x + ox*z + 2.5*z, y + oy*z - 14*z, 1.6*z, 0, 7); ctx.fill();
      }
    },
    vineyard(ctx, x, y, z, p, t) { // rzędy winorośli na poprzeczkach
      plot(ctx, x, y, z, '#96b060');
      for (let i = 0; i < 3; i++) {
        const gx = x - 12*z + i * 12*z;
        ctx.strokeStyle = '#6a4a2c'; ctx.lineWidth = 1.6*z;
        ctx.beginPath();
        ctx.moveTo(gx - 4*z, y); ctx.lineTo(gx - 4*z, y - 12*z);
        ctx.moveTo(gx + 4*z, y); ctx.lineTo(gx + 4*z, y - 12*z);
        ctx.moveTo(gx - 5*z, y - 11*z); ctx.lineTo(gx + 5*z, y - 11*z);
        ctx.stroke();
        ctx.fillStyle = '#4a8a3a'; // listowie
        ctx.beginPath(); ctx.ellipse(gx, y - 9*z, 5.5*z, 3*z, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#6a3a72'; // grona
        for (const ox of [-3, 0, 3]) {
          ctx.beginPath(); ctx.arc(gx + ox*z, y - 8*z, 1.4*z, 0, 7); ctx.fill();
          ctx.beginPath(); ctx.arc(gx + ox*z, y - 6.2*z, 1.4*z, 0, 7); ctx.fill();
        }
      }
    },
    palms(ctx, x, y, z, p, t) { // gaj daktylowy: palmy w wygrodzeniu
      plot(ctx, x, y, z, '#c8ae74');
      for (const [ox, oy] of [[-9, 1], [7, -3], [1, 5]]) {
        const px = x + ox*z, py = y + oy*z;
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        ctx.beginPath(); ctx.ellipse(px, py + 0.5*z, 4*z, 1.6*z, 0, 0, 7); ctx.fill();
        ctx.strokeStyle = '#8a6a45'; ctx.lineWidth = 2*z;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.quadraticCurveTo(px + 2*z, py - 10*z, px + 1*z, py - 17*z); ctx.stroke();
        ctx.fillStyle = '#5a9a4a';
        for (let i = 0; i < 5; i++) {
          const a = -0.5 + i * 0.5;
          ctx.beginPath(); ctx.ellipse(px + 1*z + Math.cos(a)*6*z, py - 17*z + Math.sin(a)*3*z, 6*z, 2.2*z, a, 0, 7); ctx.fill();
        }
        ctx.fillStyle = '#e8a040';
        ctx.beginPath(); ctx.arc(px + 1*z, py - 15*z, 1.8*z, 0, 7); ctx.fill();
      }
    },
    shrubs(ctx, x, y, z, p, t) { // las kadzidlany: krzewy żywiczne w wygrodzeniu
      plot(ctx, x, y, z, '#7a9454');
      for (const [ox, oy] of [[-8, -1], [6, 4], [4, -5]]) {
        ctx.fillStyle = '#5a7a4a';
        ctx.beginPath(); ctx.ellipse(x + ox*z, y + oy*z, 5*z, 3*z, 0, 0, 7); ctx.fill();
        ctx.fillStyle = shade('#5a7a4a', 1.3);
        ctx.beginPath(); ctx.ellipse(x + ox*z - 1.5*z, y + oy*z - 1*z, 2*z, 1.2*z, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#d8a850'; // kropla żywicy
        ctx.beginPath(); ctx.arc(x + ox*z, y + oy*z - 3.4*z, 1.2*z, 0, 7); ctx.fill();
      }
    },
    qanat(ctx, x, y, z, p, t) { // studnia-szyb z łukiem + kanał
      ctx.fillStyle = '#b89868';
      ctx.beginPath(); ctx.ellipse(x, y, 12*z, 6*z, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = shade('#b89868', 0.6); ctx.stroke();
      ctx.fillStyle = '#3a8ac8'; // wodne oko
      ctx.beginPath(); ctx.ellipse(x, y, 7*z, 3.2*z, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; // krążki światła
      const off = (t * 8) % 10;
      ctx.beginPath(); ctx.ellipse(x - 5 + off, y, 2.6*z, 1*z, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = '#a08858'; ctx.lineWidth = 2*z;
      ctx.beginPath(); ctx.moveTo(x - 10*z, y - 5*z); ctx.lineTo(x, y - 12*z); ctx.lineTo(x + 10*z, y - 5*z); ctx.stroke();
      ctx.strokeStyle = '#7a6a48'; ctx.lineWidth = 1.2*z;
      ctx.beginPath(); ctx.arc(x, y - 8*z, 2.6*z, 0, 7); ctx.stroke(); // kołowrót
    },
    well(ctx, x, y, z, p, t) { // chata nosiwody: studnia z żurawiem
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.beginPath(); ctx.ellipse(x, y + 1*z, 12*z, 5*z, 0, 0, 7); ctx.fill();
      ctx.fillStyle = p.stone;
      ctx.beginPath(); ctx.ellipse(x, y, 12*z, 6*z, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = shade(p.stone, 0.6); ctx.stroke();
      ctx.fillStyle = '#3a5a7a';
      ctx.beginPath(); ctx.ellipse(x, y - 1*z, 8*z, 4*z, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath(); ctx.ellipse(x - 2*z, y - 1.8*z, 2.4*z, 0.9*z, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = '#5c4630'; ctx.lineWidth = 1.5*z;
      ctx.beginPath(); ctx.moveTo(x - 8*z, y); ctx.lineTo(x, y - 20*z); ctx.lineTo(x + 8*z, y); ctx.stroke();
      const bob = Math.sin(t * 2) * 2*z;
      ctx.fillStyle = '#7a5a3a'; ctx.fillRect(x - 2.5*z, y - 12*z + bob, 5*z, 5*z);
    },

    /* ---- SUROWCE ---- */
    quarry(ctx, x, y, z, p, t) { // jeden wykop ze schodkami + blok
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.beginPath(); ctx.ellipse(x, y + 1.5*z, 17*z, 7*z, 0, 0, 7); ctx.fill();
      ctx.fillStyle = shade(p.stone, 0.78);
      ctx.beginPath(); ctx.ellipse(x, y, 16*z, 8*z, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = shade(p.stone, 0.5); ctx.stroke();
      ctx.fillStyle = shade(p.stone, 0.62); // stopnie wykopu
      ctx.beginPath(); ctx.ellipse(x, y, 11*z, 5*z, 0, 0, 7); ctx.fill();
      ctx.fillStyle = shade(p.stone, 0.48);
      ctx.beginPath(); ctx.ellipse(x, y, 6*z, 2.6*z, 0, 0, 7); ctx.fill();
      ctx.fillStyle = p.stone; // ociosany blok
      ctx.fillRect(x + 8*z, y - 6*z, 6*z, 4*z);
      ctx.strokeStyle = shade(p.stone, 0.6); ctx.strokeRect(x + 8*z, y - 6*z, 6*z, 4*z);
      ctx.strokeStyle = '#8a6a45'; ctx.lineWidth = 1.5*z; // kilof w bloku
      ctx.beginPath(); ctx.moveTo(x + 10*z, y - 8*z); ctx.lineTo(x + 12*z, y - 11*z); ctx.stroke();
    },
    claypit(ctx, x, y, z, p, t) { // płytki wykop + gliniane kopczyki
      ctx.fillStyle = 'rgba(0,0,0,0.13)';
      ctx.beginPath(); ctx.ellipse(x, y + 1.5*z, 16*z, 7*z, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#9a6244';
      ctx.beginPath(); ctx.ellipse(x, y, 15*z, 7*z, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#b07050'; // kałuża wilgotnej gliny
      ctx.beginPath(); ctx.ellipse(x, y, 9*z, 4*z, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.beginPath(); ctx.ellipse(x - 2*z, y - 1*z, 2.6*z, 1*z, 0, 0, 7); ctx.fill();
      for (const [ox, oy] of [[-10, -4], [10, 3]]) { // kopczyki + cegły
        ctx.fillStyle = '#c08058';
        ctx.beginPath(); ctx.ellipse(x + ox*z, y + oy*z, 4*z, 2.4*z, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#d09868';
        ctx.fillRect(x + ox*z - 2*z, y + oy*z - 4*z, 4*z, 2.2*z);
      }
    },
    ironmine(ctx, x, y, z, p, t) { // sztolnia + ruda rdzawa
      shadow(ctx, x, y, z, 14);
      base(ctx, x, y, z, p, 22*z, 14*z);
      roofGable(ctx, x, y, z, p, 22*z, 14*z, 9*z, p.roofAlt);
      ctx.fillStyle = '#1a120c'; // otwór szybu
      ctx.beginPath(); ctx.moveTo(x - 5*z, y); ctx.lineTo(x - 5*z, y - 8*z);
      ctx.arc(x, y - 8*z, 5*z, Math.PI, 0); ctx.lineTo(x + 5*z, y);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = p.timber || '#5a4230'; ctx.lineWidth = 1.6*z; ctx.stroke();
      ctx.fillStyle = '#a58760'; // hałda rudy
      ctx.beginPath(); ctx.ellipse(x + 10*z, y - 1*z, 5*z, 3*z, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#d8c8a8';
      ctx.fillRect(x + 9*z, y - 2*z, 1.3*z, 1.3*z); ctx.fillRect(x + 12*z, y - 3.2*z, 1.3*z, 1.3*z);
    },
    coalmine(ctx, x, y, z, p, t) { // sztolnia + czarna hałda + wózek
      shadow(ctx, x, y, z, 14);
      base(ctx, x, y, z, p, 22*z, 14*z);
      roofGable(ctx, x, y, z, p, 22*z, 14*z, 9*z, '#3a3a3a');
      ctx.fillStyle = '#0c0a08';
      ctx.beginPath(); ctx.moveTo(x - 5*z, y); ctx.lineTo(x - 5*z, y - 8*z);
      ctx.arc(x, y - 8*z, 5*z, Math.PI, 0); ctx.lineTo(x + 5*z, y);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = p.timber || '#5a4230'; ctx.lineWidth = 1.6*z; ctx.stroke();
      ctx.fillStyle = '#262626'; // hałda węgla
      ctx.beginPath(); ctx.ellipse(x + 11*z, y - 1*z, 6*z, 3.4*z, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#4a4a52';
      ctx.fillRect(x + 9*z, y - 2*z, 1.2*z, 1.2*z); ctx.fillRect(x + 13*z, y - 3*z, 1.2*z, 1.2*z);
      ctx.fillStyle = '#5a5a62'; ctx.fillRect(x - 13*z, y - 5*z, 6*z, 4*z); // wózek
      ctx.fillStyle = '#262626'; ctx.fillRect(x - 12*z, y - 6.4*z, 4*z, 2*z);
      ctx.fillStyle = '#3a3a3a'; ctx.beginPath(); ctx.arc(x - 11.5*z, y - 0.5*z, 1.2*z, 0, 7); ctx.fill();
    },
    peatmine(ctx, x, y, z, p, t) { // sztolnia + ściana darni
      shadow(ctx, x, y, z, 14);
      base(ctx, x, y, z, p, 22*z, 14*z);
      roofGable(ctx, x, y, z, p, 22*z, 14*z, 9*z, '#6a5030');
      ctx.fillStyle = '#1a120c';
      ctx.beginPath(); ctx.moveTo(x - 5*z, y); ctx.lineTo(x - 5*z, y - 8*z);
      ctx.arc(x, y - 8*z, 5*z, Math.PI, 0); ctx.lineTo(x + 5*z, y);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = p.timber || '#5a4230'; ctx.lineWidth = 1.6*z; ctx.stroke();
      for (let r = 0; r < 3; r++) for (let c = 0; c < 2; c++) { // cegły torfu
        ctx.fillStyle = (r + c) % 2 ? '#7a5a38' : '#6a4c30';
        ctx.fillRect(x + (7 + c * 4.5)*z, y - (3 + r * 3)*z, 4*z, 2.6*z);
      }
    },
    mine(ctx, x, y, z, p, t) { // kompatybilność: domyślna kopalnia = żelazo
      ART.ironmine(ctx, x, y, z, p, t);
    },

    /* ---- RZEMIOSŁO ---- */
    smelter(ctx, x, y, z, p, t) { // wielki komin + łuna pieca
      shadow(ctx, x, y, z, 17);
      base(ctx, x, y, z, p, 28*z, 18*z);
      roofGable(ctx, x, y, z, p, 28*z, 18*z, 8*z, p.roofAlt);
      ctx.fillStyle = shade(p.stone, 0.68);
      ctx.fillRect(x - 4*z, y - 11*z, 9*z, 11*z);
      ctx.fillStyle = '#e87830';
      ctx.beginPath(); ctx.arc(x + 0.5*z, y - 1.5*z, 3.6*z, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#f8c040';
      ctx.beginPath(); ctx.arc(x + 0.5*z, y - 1*z, 2*z, Math.PI, 0); ctx.fill();
      chimneyWith(ctx, x + 11*z, y - 30*z, z, shade(p.stone, 0.55)); // komin dymi wysoko
      ctx.fillStyle = shade(p.stone, 0.7);
      ctx.fillRect(x + 8.5*z, y - 34*z, 5*z, 22*z);
      ctx.fillStyle = shade(p.stone, 0.6);
      ctx.fillRect(x + 7.5*z, y - 36*z, 6.5*z, 2.5*z);
    },
    toolforge(ctx, x, y, z, p, t) { // kowadło + iskra + narzędzia
      shadow(ctx, x, y, z, 16);
      base(ctx, x, y, z, p, 26*z, 17*z);
      roofGable(ctx, x, y, z, p, 26*z, 17*z, 9*z);
      door(ctx, x - 8*z, y, z);
      windowLit(ctx, x - 1*z, y - 12*z, z, p);
      ctx.strokeStyle = '#8a6a45'; ctx.lineWidth = 1.8*z; // młot przy ścianie
      ctx.beginPath(); ctx.moveTo(x + 3*z, y - 2*z); ctx.lineTo(x + 6*z, y - 6.5*z); ctx.stroke();
      ctx.fillStyle = '#4a4a52'; ctx.save(); ctx.translate(x + 6.7*z, y - 7.4*z);
      ctx.rotate(0.5); ctx.fillRect(-1.6*z, -2.4*z, 3.2*z, 4.8*z); ctx.restore();
      ctx.fillStyle = '#4a4a52'; // kowadło
      ctx.fillRect(x + 9*z, y - 8*z, 7*z, 2.6*z);
      ctx.fillRect(x + 11*z, y - 5.4*z, 3*z, 3*z);
      ctx.fillStyle = '#6a6a72'; ctx.fillRect(x + 9*z, y - 8*z, 7*z, 1*z);
      const spark = (t * 4) % 1; // iskra nad kowadłem
      ctx.fillStyle = `rgba(255,200,80,${1 - spark})`;
      ctx.beginPath(); ctx.arc(x + 12.5*z, y - (11 + spark * 8) * z, 2*z, 0, 7); ctx.fill();
      chimneyWith(ctx, x - 11*z, y - 22*z, z, p.stone);
    },
    armory(ctx, x, y, z, p, t) { // stojak z tarczą i mieczem
      shadow(ctx, x, y, z, 16);
      base(ctx, x, y, z, p, 26*z, 17*z);
      roofGable(ctx, x, y, z, p, 26*z, 17*z, 9*z, shade(p.roof, 0.75));
      door(ctx, x - 8*z, y, z);
      ctx.strokeStyle = '#5a4230'; ctx.lineWidth = 1.6*z;
      ctx.beginPath(); ctx.moveTo(x + 9*z, y); ctx.lineTo(x + 9*z, y - 13*z); ctx.stroke();
      ctx.fillStyle = '#c8ccd4'; // miecz pionowy
      ctx.beginPath(); ctx.moveTo(x + 9*z, y - 13*z); ctx.lineTo(x + 8*z, y - 5.5*z);
      ctx.lineTo(x + 10*z, y - 5.5*z); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#8a6a45'; ctx.fillRect(x + 7*z, y - 6.5*z, 4*z, 1.4*z); // jelec
      ctx.fillStyle = p.accent; // okrągła tarcza
      ctx.beginPath(); ctx.arc(x + 14*z, y - 7*z, 3.6*z, 0, 7); ctx.fill();
      ctx.strokeStyle = shade(p.metal, 0.6); ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(x + 14*z, y - 7*z, 3.6*z, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + 14*z, y - 7*z, 1.4*z, 0, 7); ctx.stroke(); // umbon
      pennant(ctx, x - 12*z, y, z, p, t);
    },
    winery(ctx, x, y, z, p, t) { // duże beczki leżakowe + amfora
      shadow(ctx, x, y, z, 16);
      base(ctx, x, y, z, p, 26*z, 15*z);
      roofGable(ctx, x, y, z, p, 26*z, 15*z, 9*z, '#7a3a52');
      door(ctx, x - 6*z, y, z);
      windowLit(ctx, x + 3*z, y - 10*z, z, p);
      barrelV(ctx, x + 9*z, y, z, '#8a6244', 3.2, 8);
      barrelV(ctx, x + 15*z, y, z, '#8a6244', 3.2, 8);
      ctx.fillStyle = '#b87840'; // amfora
      ctx.beginPath(); ctx.ellipse(x + 12*z, y - 3*z, 2*z, 3.2*z, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#d89860';
      ctx.fillRect(x + 10.8*z, y - 7.2*z, 2.4*z, 2*z);
    },
    weaver(ctx, x, y, z, p, t) { // krosno z tkaniną
      shadow(ctx, x, y, z, 16);
      base(ctx, x, y, z, p, 26*z, 15*z);
      if (p.terrain === 'sand') roofFlat(ctx, x, y, z, p, 26*z, 15*z);
      else roofGable(ctx, x, y, z, p, 26*z, 15*z, 8*z);
      door(ctx, x - 7*z, y, z);
      ctx.strokeStyle = '#7a5c3a'; ctx.lineWidth = 1.5*z; // krosno: rama + pasy tkaniny
      ctx.strokeRect(x + 5*z, y - 14*z, 10*z, 13*z);
      ctx.beginPath();
      for (let i = 1; i < 4; i++) { ctx.moveTo(x + (5 + i*2.5)*z, y - 14*z); ctx.lineTo(x + (5 + i*2.5)*z, y - 1*z); }
      ctx.stroke();
      ctx.fillStyle = p.cloth; // gotowy wzór
      ctx.fillRect(x + 7.5*z, y - 12*z, 5*z, 9*z);
      ctx.fillStyle = shade(p.cloth, 1.35);
      ctx.fillRect(x + 7.5*z, y - 9.5*z, 5*z, 1.6*z);
      ctx.fillRect(x + 7.5*z, y - 5.5*z, 5*z, 1.6*z);
      ctx.fillStyle = '#e8e0d0'; ctx.fillRect(x + 2.5*z, y - 4*z, 1.6*z, 4*z); // szpule nitek
      ctx.fillStyle = p.accent; ctx.fillRect(x + 2.5*z, y - 5.4*z, 1.6*z, 1.4*z);
    },
    pottery(ctx, x, y, z, p, t) { // rząd amfor + wielki garnek
      shadow(ctx, x, y, z, 16);
      base(ctx, x, y, z, p, 26*z, 15*z);
      roofFlat(ctx, x, y, z, p, 26*z, 15*z);
      door(ctx, x - 7*z, y, z);
      for (let i = 0; i < 3; i++) {
        const ax = x + (4 + i * 4)*z;
        ctx.fillStyle = '#b87840';
        ctx.beginPath(); ctx.ellipse(ax, y - 2.6*z, 1.6*z, 2.6*z, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#d89860';
        ctx.beginPath(); ctx.moveTo(ax - 1*z, y - 4.4*z); ctx.lineTo(ax - 1.6*z, y - 6*z);
        ctx.lineTo(ax + 1.6*z, y - 6*z); ctx.lineTo(ax + 1*z, y - 4.4*z); ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = '#a05828'; // wielki garnek
      ctx.beginPath(); ctx.ellipse(x + 16*z, y - 3.5*z, 3*z, 3.5*z, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = shade('#a05828', 0.6); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(x + 16*z, y - 3.5*z, 1.8*z, 2.2*z, 0, 0, 7); ctx.stroke();
      ctx.fillStyle = '#d89860';
      ctx.fillRect(x + 13.5*z, y - 8*z, 5*z, 1.6*z); // obręcz
    },
    mead(ctx, x, y, z, p, t) { // beczki miodu + plaster na szyldzie
      shadow(ctx, x, y, z, 16);
      base(ctx, x, y, z, p, 26*z, 15*z);
      roofGable(ctx, x, y, z, p, 26*z, 15*z, 9*z, '#a87828');
      door(ctx, x - 7*z, y, z);
      windowLit(ctx, x + 2*z, y - 10*z, z, p);
      barrelV(ctx, x + 8*z, y, z, '#96a044', 3.2, 8);
      barrelV(ctx, x + 14*z, y, z, '#96a044', 3.2, 8);
      ctx.fillStyle = '#e8b840'; // plaster miodu
      for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) {
        ctx.beginPath();
        ctx.arc(x + 10.5*z + c*2.6*z, y - 5.5*z - r*2.6*z, 1.3*z, 0, 7); ctx.fill();
      }
      chimneyWith(ctx, x - 10*z, y - 21*z, z, p.stone);
    },
    kiln(ctx, x, y, z, p, t) { // wypalarka węgla: kopuła pieca z łuną
      shadow(ctx, x, y, z, 12);
      ctx.fillStyle = shade('#8a7a5a', 0.8);
      ctx.beginPath(); ctx.moveTo(x - 11*z, y); ctx.lineTo(x - 4*z, y - 19*z);
      ctx.lineTo(x + 4*z, y - 19*z); ctx.lineTo(x + 11*z, y); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#4a3a28'; ctx.stroke();
      ctx.fillStyle = shade('#8a7a5a', 0.55); // obwałowanie
      ctx.fillRect(x - 11*z, y - 3*z, 22*z, 3*z);
      ctx.fillStyle = '#e87830'; // łuna w otworze
      ctx.beginPath(); ctx.arc(x, y - 2*z, 3.5*z, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#f8c040';
      ctx.beginPath(); ctx.arc(x, y - 1.6*z, 1.8*z, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = '#6a4c30'; ctx.lineWidth = 1.3*z; // stos chrustu
      for (let i = 0; i < 3; i++) {
        ctx.beginPath(); ctx.moveTo(x + 9*z, y - i*1.8*z); ctx.lineTo(x + 15*z, y - 2*z - i*1.8*z); ctx.stroke();
      }
      chimneyWith(ctx, x, y - 21*z, z);
    },
    mill(ctx, x, y, z, p, t) { // wieża + skrzydło
      shadow(ctx, x, y, z, 13);
      ctx.fillStyle = p.wall; // stożkowy korpus młyna
      ctx.beginPath(); ctx.moveTo(x - 11*z, y); ctx.lineTo(x - 5*z, y - 24*z);
      ctx.lineTo(x + 5*z, y - 24*z); ctx.lineTo(x + 11*z, y); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = shade(p.wall, 0.6); ctx.stroke();
      if (p.timber) {
        ctx.strokeStyle = shade(p.timber, 1.0); ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(x - 8*z, y - 8*z); ctx.lineTo(x + 8*z, y - 8*z);
        ctx.moveTo(x - 6.5*z, y - 16*z); ctx.lineTo(x + 6.5*z, y - 16*z); ctx.stroke();
      }
      ctx.fillStyle = p.roof; // czapka
      ctx.beginPath(); ctx.moveTo(x - 6*z, y - 24*z); ctx.lineTo(x, y - 30*z); ctx.lineTo(x + 6*z, y - 24*z);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = shade(p.roof, 0.6); ctx.stroke();
      windowLit(ctx, x, y - 14*z, z, p);
      ctx.save(); ctx.translate(x + 5*z, y - 26*z); ctx.rotate(t * 1.2); // skrzydło — obraca się
      ctx.strokeStyle = p.timber || '#6b4a2f'; ctx.lineWidth = 1.6*z;
      for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 13*z, Math.sin(a) * 13*z); ctx.stroke();
        ctx.strokeStyle = 'rgba(230,225,210,0.75)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(Math.cos(a)*7*z, Math.sin(a)*7*z);
        ctx.lineTo(Math.cos(a + 0.5)*12*z, Math.sin(a + 0.5)*12*z); ctx.stroke();
        ctx.strokeStyle = p.timber || '#6b4a2f'; ctx.lineWidth = 1.6*z;
      }
      ctx.restore();
    },

    /* ---- HANDEL ---- */
    market(ctx, x, y, z, p, t) { // stragan z pasiastym daszkiem
      shadow(ctx, x, y, z, 17);
      ctx.fillStyle = '#7a5a3a';
      ctx.fillRect(x - 14*z, y - 10*z, 3*z, 10*z);
      ctx.fillRect(x + 11*z, y - 10*z, 3*z, 10*z);
      ctx.beginPath();
      ctx.moveTo(x - 18*z, y - 10*z); ctx.lineTo(x, y - 17*z); ctx.lineTo(x + 18*z, y - 10*z);
      ctx.lineTo(x, y - 4*z); ctx.closePath();
      ctx.fillStyle = p.cloth; ctx.fill();
      ctx.save(); ctx.clip();
      ctx.fillStyle = '#f0ead8';
      ctx.fillRect(x - 18*z, y - 14*z, 36*z, 3*z); ctx.fillRect(x - 18*z, y - 8*z, 36*z, 3*z);
      ctx.restore();
      ctx.strokeStyle = shade(p.cloth, 0.6); ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x - 18*z, y - 10*z); ctx.lineTo(x, y - 17*z); ctx.lineTo(x + 18*z, y - 10*z);
      ctx.lineTo(x, y - 4*z); ctx.closePath(); ctx.stroke();
      ctx.fillStyle = '#8a6a45'; ctx.fillRect(x - 12*z, y - 4.5*z, 24*z, 4.5*z); // towary na ladzie
      ctx.fillStyle = '#e8c060';
      ctx.beginPath(); ctx.arc(x - 6*z, y - 5*z, 2.2*z, 0, 7); ctx.fill();
      ctx.fillStyle = p.metal;
      ctx.beginPath(); ctx.arc(x + 2*z, y - 5*z, 1.8*z, 0, 7); ctx.fill();
      ctx.fillStyle = '#b87840';
      ctx.beginPath(); ctx.ellipse(x + 8*z, y - 5*z, 1.6*z, 2.2*z, 0, 0, 7); ctx.fill();
    },
    store(ctx, x, y, z, p, t) { // dom magazynowy + piętrowe skrzynie
      shadow(ctx, x, y, z, 17);
      base(ctx, x, y, z, p, 30*z, 15*z);
      roofGable(ctx, x, y, z, p, 30*z, 15*z, 8*z, p.roofAlt);
      door(ctx, x - 9*z, y, z);
      crate(ctx, x + 5*z, y, z, '#8a6a45', 4.5);
      crate(ctx, x + 12*z, y, z, '#8a6a45', 4.5);
      crate(ctx, x + 8.5*z, y - 9*z, z, '#9a7a55', 3.8);
      ctx.strokeStyle = '#5a4230'; ctx.lineWidth = 1.2;
      ctx.strokeRect(x + 5*z - 4.5*z, y - 9*z, 9*z, 9*z);
      ctx.strokeRect(x + 12*z - 4.5*z, y - 9*z, 9*z, 9*z);
    },
    serai(ctx, x, y, z, p, t) { // otoczony mur z bramą
      shadow(ctx, x, y, z, 21);
      base(ctx, x, y, z, p, 36*z, 14*z);
      roofFlat(ctx, x, y, z, p, 36*z, 14*z);
      ctx.fillStyle = shade(p.wall, 0.85); // krenelaż
      for (let i = 0; i < 7; i++) ctx.fillRect(x - 18*z + i*5.4*z, y - 18*z, 3*z, 4*z);
      for (const ox of [-15, 15]) { // narożne wieżyczki
        ctx.fillStyle = p.wall; ctx.fillRect(x + ox*z, y - 26*z, 4.5*z, 26*z);
        ctx.strokeStyle = shade(p.wall, 0.55); ctx.strokeRect(x + ox*z, y - 26*z, 4.5*z, 26*z);
        dome(ctx, x + ox*z + 2.2*z, y, z, p, 9*z, 26*z, p.accent);
      }
      ctx.fillStyle = '#c89858'; // brama
      ctx.beginPath(); ctx.moveTo(x - 3.5*z, y); ctx.lineTo(x - 3.5*z, y - 7*z);
      ctx.arc(x, y - 7*z, 3.5*z, Math.PI, 0); ctx.lineTo(x + 3.5*z, y);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = shade('#c89858', 0.6); ctx.stroke();
    },

    /* ---- SPOŁECZNE ---- */
    temple(ctx, x, y, z, p, t) { // kościół / meczet
      shadow(ctx, x, y, z, 16);
      if (p.terrain === 'sand') { // meczet: kopuła + minaret
        base(ctx, x, y, z, p, 26*z, 20*z);
        roofFlat(ctx, x, y, z, p, 26*z, 20*z);
        dome(ctx, x, y, z, p, 26*z, 20*z);
        ctx.fillStyle = p.wall;
        ctx.fillRect(x + 15*z, y - 34*z, 4*z, 34*z);
        ctx.strokeStyle = shade(p.wall, 0.6); ctx.strokeRect(x + 15*z, y - 34*z, 4*z, 34*z);
        dome(ctx, x + 17*z, y, z, p, 10*z, 34*z, p.accent);
        ctx.strokeStyle = '#e8c860'; ctx.lineWidth = 1.4*z; // półksiężyc
        ctx.beginPath(); ctx.arc(x + 17*z, y - 44*z, 2.6*z, 0.6, 4.4); ctx.stroke();
      } else { // kościół: wieża z krzyżem
        base(ctx, x, y, z, p, 26*z, 20*z);
        roofGable(ctx, x, y, z, p, 26*z, 20*z, 13*z);
        ctx.fillStyle = p.wall;
        ctx.fillRect(x - 4*z, y - 38*z, 9*z, 20*z);
        ctx.strokeStyle = shade(p.wall, 0.6); ctx.strokeRect(x - 4*z, y - 38*z, 9*z, 20*z);
        windowLit(ctx, x + 0.5*z, y - 32*z, z, p); // witraż
        ctx.fillStyle = p.metal; // krzyż
        ctx.fillRect(x + 0.5*z, y - 46*z, 1.2*z, 5*z);
        ctx.fillRect(x - 1.5*z, y - 44.5*z, 4*z, 1.2*z);
        windowLit(ctx, x + 8*z, y - 12*z, z, p);
      }
    },
    bath(ctx, x, y, z, p, t) { // kopuła + para + basen
      shadow(ctx, x, y, z, 16);
      base(ctx, x, y, z, p, 26*z, 16*z);
      roofFlat(ctx, x, y, z, p, 26*z, 16*z);
      dome(ctx, x - 4*z, y, z, p, 20*z, 16*z, '#4aa5c0');
      ctx.fillStyle = '#3a8ac8'; // basen przed wejściem
      ctx.beginPath(); ctx.ellipse(x + 8*z, y + 2*z, 6*z, 2.6*z, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath(); ctx.ellipse(x + 7*z, y + 1.4*z, 2*z, 0.8*z, 0, 0, 7); ctx.fill();
      for (let i = 0; i < 3; i++) { // obłoki pary
        ctx.beginPath();
        ctx.arc(x + 2*z + Math.sin(i*2)*3*z, y - (24 + i*5)*z, (3 + i*1.2)*z, 0, 7);
        ctx.fillStyle = `rgba(240,240,245,${0.3 - i*0.08})`;
        ctx.fill();
      }
    },

    /* ---- MILITARIA ---- */
    barracks(ctx, x, y, z, p, t) { // budynek + proporzec + manekin treningowy
      shadow(ctx, x, y, z, 18);
      base(ctx, x, y, z, p, 32*z, 17*z);
      roofGable(ctx, x, y, z, p, 32*z, 17*z, 10*z);
      door(ctx, x - 10*z, y, z);
      windowLit(ctx, x - 2*z, y - 11*z, z, p);
      windowLit(ctx, x + 6*z, y - 11*z, z, p);
      pennant(ctx, x - 14*z, y, z, p, t);
      ctx.fillStyle = '#7a5c3a'; ctx.fillRect(x + 13*z, y - 2*z, 2*z, 2*z); // podstawa
      ctx.fillRect(x + 13.7*z, y - 12*z, 1.6*z, 10*z); // słupek
      ctx.fillStyle = '#d8c8a0'; ctx.beginPath(); ctx.arc(x + 14.5*z, y - 13.5*z, 2*z, 0, 7); ctx.fill(); // głowa
      ctx.fillStyle = '#c8b890'; ctx.fillRect(x + 12.5*z, y - 11*z, 4*z, 5*z); // korpus
      ctx.fillStyle = p.accent; ctx.beginPath(); ctx.arc(x + 14.5*z, y - 8.5*z, 2.4*z, 0, 7); ctx.fill(); // tarcza
      ctx.strokeStyle = shade(p.metal, 0.6); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x + 14.5*z, y - 8.5*z, 2.4*z, 0, 7); ctx.stroke();
    },
    guard(ctx, x, y, z, p, t) { // wieża wartownicza
      shadow(ctx, x, y, z, 12);
      base(ctx, x, y, z, p, 17*z, 26*z);
      roofFlat(ctx, x, y, z, p, 19*z, 26*z);
      ctx.strokeStyle = shade(p.wall, 0.55); // kondygnacje
      for (let i = 1; i < 3; i++) { ctx.beginPath(); ctx.moveTo(x - 8.5*z, y - i*8*z); ctx.lineTo(x + 8.5*z, y - i*8*z); ctx.stroke(); }
      windowLit(ctx, x, y - 12*z, z, p); // strzelnica
      ctx.fillStyle = shade(p.wall, 0.85); // blanki + chorągiew
      for (let i = 0; i < 3; i++) ctx.fillRect(x - 9.5*z + i*7*z, y - 31*z, 3.5*z, 5*z);
      ctx.fillStyle = p.accent; ctx.fillRect(x - 2*z, y - 34*z, 5*z, 4*z);
      pennant(ctx, x + 8*z, y - 26*z, z, p, t);
    },
    dock(ctx, x, y, z, p, t) { // pomost z cumami i skrzyniami
      ctx.fillStyle = '#6a4a2c'; // pale w wodzie
      for (let i = 0; i < 4; i++) ctx.fillRect(x - 16*z + i*9*z, y - 2*z, 5*z, 12*z);
      ctx.fillStyle = '#8a6a45'; // pomost
      ctx.fillRect(x - 18*z, y - 8*z, 36*z, 6*z);
      ctx.strokeStyle = '#5a4230'; ctx.strokeRect(x - 18*z, y - 8*z, 36*z, 6*z);
      ctx.strokeStyle = shade('#8a6a45', 0.7); ctx.lineWidth = 0.8; // deski
      for (let i = 1; i < 6; i++) { ctx.beginPath(); ctx.moveTo(x - 18*z + i*6*z, y - 8*z); ctx.lineTo(x - 18*z + i*6*z, y - 2*z); ctx.stroke(); }
      crate(ctx, x - 10*z, y - 8*z, z, '#8a6a45', 3);
      ctx.fillStyle = '#7a5a3a'; ctx.fillRect(x + 8*z, y - 13*z, 2.4*z, 5*z); // pachołek cumowniczy
      ctx.strokeStyle = '#c8b090'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.ellipse(x + 9.2*z, y - 10*z, 4*z, 1.6*z, 0, 0, 7); ctx.stroke();
    },
    ship(ctx, x, y, z, p, t) { // smocza głowa + tarcze na burcie
      const bob = Math.sin(t * 1.5) * 1.5*z;
      ctx.save(); ctx.translate(0, bob);
      ctx.fillStyle = 'rgba(0,0,0,0.2)'; // cień na wodzie
      ctx.beginPath(); ctx.ellipse(x, y + 4*z, 20*z, 3*z, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#6a4a2c'; // kadłub
      ctx.beginPath();
      ctx.moveTo(x - 20*z, y - 8*z); ctx.quadraticCurveTo(x, y - 2*z, x + 20*z, y - 8*z);
      ctx.lineTo(x + 14*z, y - 16*z); ctx.lineTo(x - 14*z, y - 16*z); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#3a2c1a'; ctx.stroke();
      ctx.strokeStyle = shade('#6a4a2c', 0.6); // poszycie
      ctx.beginPath(); ctx.moveTo(x - 17*z, y - 11*z); ctx.lineTo(x + 17*z, y - 11*z); ctx.stroke();
      ctx.fillStyle = '#8a6a45'; ctx.fillRect(x - 1.5*z, y - 34*z, 3*z, 18*z); // maszt
      ctx.save(); ctx.translate(x + 20*z, y - 8*z);
      ctx.fillStyle = '#8a6a45';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(6*z, -4*z, 5*z, -9*z);
      ctx.lineTo(1.5*z, -7*z); ctx.quadraticCurveTo(3*z, -3*z, -2*z, -1*z); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#3a2c1a'; ctx.stroke();
      ctx.restore();
      for (let i = -1; i <= 1; i++) { // tarcze w rzędzie na burcie
        ctx.fillStyle = i % 2 ? p.cloth : p.accent;
        ctx.beginPath(); ctx.arc(x + i*8*z, y - 12*z, 2.8*z, 0, 7); ctx.fill();
        ctx.strokeStyle = shade(p.metal, 0.6); ctx.lineWidth = 1; ctx.stroke();
        ctx.beginPath(); ctx.arc(x + i*8*z, y - 12*z, 1*z, 0, 7); ctx.stroke();
      }
      ctx.restore();
    },

    /* ---- DWÓR (startowy, 2x2) ---- */
    keep(ctx, x, y, z, p, t) {
      shadow(ctx, x, y, z, 24);
      base(ctx, x, y, z, p, 44*z, 30*z);
      if (p.terrain === 'sand') {
        roofFlat(ctx, x, y, z, p, 44*z, 30*z);
        dome(ctx, x, y, z, p, 30*z, 30*z);
      } else {
        roofGable(ctx, x, y, z, p, 44*z, 30*z, 18*z);
      }
      ctx.fillStyle = p.wall; ctx.fillRect(x - 2*z, y - 52*z, 10*z, 30*z); // wieża narożna
      ctx.strokeStyle = shade(p.wall, 0.55); ctx.strokeRect(x - 2*z, y - 52*z, 10*z, 30*z);
      if (p.terrain === 'sand') dome(ctx, x + 3*z, y - 4*z, z, p, 14*z, 52*z);
      else {
        ctx.fillStyle = p.roof;
        ctx.beginPath(); ctx.moveTo(x - 4*z, y - 52*z); ctx.lineTo(x + 3*z, y - 62*z); ctx.lineTo(x + 10*z, y - 52*z); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = shade(p.roof, 0.6); ctx.stroke();
      }
      pennant(ctx, x + 3*z, y - 62*z, z, p, t); // proporzec na wieży
      door(ctx, x, y, z);
      windowLit(ctx, x - 14*z, y - 20*z, z, p);
      windowLit(ctx, x + 14*z, y - 20*z, z, p);
    }
  };

  /* --- obywatel: mała figurka zależna od nacji --- */
  function drawCitizen(ctx, c, sx, sy, z, factionId, p, t) {
    const step = Math.sin(t * 8 + c.phase) * 1.2 * z;
    const y0 = sy - 4 * z;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(sx, y0, 4.5*z, 2*z, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#3a2c1e'; ctx.lineWidth = 1.4*z;
    ctx.beginPath();
    ctx.moveTo(sx - 1.5*z, y0 - 4*z); ctx.lineTo(sx - 1.5*z + step, y0);
    ctx.moveTo(sx + 1.5*z, y0 - 4*z); ctx.lineTo(sx + 1.5*z - step, y0);
    ctx.stroke();
    ctx.fillStyle = c.color;
    ctx.fillRect(sx - 2.6*z, y0 - 9.5*z, 5.2*z, 5.5*z);
    ctx.fillStyle = p.skin;
    ctx.beginPath(); ctx.arc(sx, y0 - 11.5*z, 2.5*z, 0, 7); ctx.fill();
    if (factionId === 'saracens') {
      ctx.fillStyle = '#f0ead8';
      ctx.beginPath(); ctx.ellipse(sx, y0 - 13*z, 3*z, 1.8*z, 0, 0, 7); ctx.fill();
    } else if (factionId === 'vikings') {
      ctx.fillStyle = p.metal;
      ctx.beginPath(); ctx.arc(sx, y0 - 12.2*z, 2.7*z, Math.PI, 0); ctx.fill();
      ctx.fillStyle = shade(p.metal, 0.7); ctx.fillRect(sx - 0.4*z, y0 - 12.5*z, 0.8*z, 2*z);
      ctx.fillStyle = p.cloth;
      ctx.beginPath(); ctx.ellipse(sx - 3.6*z, y0 - 8*z, 2.2*z, 3*z, 0.3, 0, 7); ctx.fill();
      ctx.strokeStyle = shade(p.metal, 0.6); ctx.lineWidth = 0.8*z; ctx.stroke();
    } else {
      ctx.fillStyle = '#5a4230';
      ctx.beginPath(); ctx.moveTo(sx - 2.6*z, y0 - 12.5*z); ctx.lineTo(sx, y0 - 15.5*z);
      ctx.lineTo(sx + 2.6*z, y0 - 12.5*z); ctx.closePath(); ctx.fill();
    }
    if (c.carry) { // nosiciel: skrzynka z towarem na głowie
      ctx.fillStyle = '#8a6a45'; ctx.fillRect(sx - 3*z, y0 - 18.5*z, 6*z, 4*z);
      ctx.strokeStyle = '#5a4230'; ctx.lineWidth = 0.7*z;
      ctx.strokeRect(sx - 3*z, y0 - 18.5*z, 6*z, 4*z);
      ctx.beginPath(); ctx.moveTo(sx, y0 - 18.5*z); ctx.lineTo(sx, y0 - 14.5*z); ctx.stroke();
    }
  }

  /* plac budowy: rusztowanie + pasek postępu */
  function drawSite(ctx, sx, sy, z, p, progress) {
    ctx.fillStyle = 'rgba(140,110,70,0.35)';
    ctx.beginPath(); ctx.ellipse(sx, sy, 13*z, 5.5*z, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#7a5c3a'; ctx.lineWidth = 1.6 * z;
    ctx.beginPath();
    ctx.moveTo(sx - 10*z, sy - 2*z); ctx.lineTo(sx - 10*z, sy - 16*z);
    ctx.moveTo(sx + 10*z, sy - 2*z); ctx.lineTo(sx + 10*z, sy - 16*z);
    ctx.moveTo(sx - 10*z, sy - 10*z); ctx.lineTo(sx + 10*z, sy - 10*z);
    ctx.moveTo(sx - 10*z, sy - 15*z); ctx.lineTo(sx + 10*z, sy - 15*z);
    ctx.stroke();
    ctx.fillStyle = 'rgba(160,120,70,0.5)';
    ctx.fillRect(sx - 10*z, sy - 15*z, 20*z, 5*z);
    ctx.fillStyle = '#c8a878'; ctx.fillRect(sx - 7*z, sy - 1*z, 8*z, 1.6*z);
    ctx.fillStyle = '#9a9a92'; ctx.beginPath(); ctx.ellipse(sx + 6*z, sy - 0.5*z, 2.2*z, 1.3*z, 0, 0, 7); ctx.fill();
    const w = 24 * z;
    ctx.fillStyle = '#241c12'; ctx.fillRect(sx - w/2, sy - 23*z, w, 4*z);
    ctx.fillStyle = '#c8a04e';
    ctx.fillRect(sx - w/2 + 0.5*z, sy - 22.5*z, Math.max(0, (w - z) * progress), 3*z);
  }

  return { drawTile, ART, drawCitizen, drawSite, shade, setAnim };
})();

/* ============================= MODUL: WORLD =============================== */
const World = (() => {
  const state = {
    factionId: null, map: null, buildings: [], citizens: [],
    time: 0, speed: 1, res: {}, nextId: 1,
    pop: 14, controls: { rations: 1, tax: 1 },
    starveTimer: 0, immigrantTimer: 0, tooled: {}, staffed: {},
    saplings: [], treeFrac: 0, plantFrac: 0, churchFed: false, bathFed: false,
    workersStaffed: 0, workersNeeded: 0, waitingForTool: false,
    /* Etap 3 — logistyka budowy */
    sites: [], builders: 3, buildersActive: 0, buildersWorking: 0, carriers: [],
    /* Etap 4 — haracz, handel, wyprawy */
    tribute: null, marketPrices: { kadzidło: 4.2, tkanina: 3.6, ceramika: 2.4 },
    voyageMode: 'normal', crewAway: 0, voyages: [],
    /* Etap 5 — świat dynamiczny */
    raids: { count: 0, lost: 0, next: 40 }, crisis: null, eventMsgs: []
  };

  function init(factionId) {
    state.factionId = factionId;
    state.map = MapGen.generate(factionId);
    state.buildings = []; state.citizens = [];
    state.time = 0; state.nextId = 1;
    state.pop = 14; state.controls = { rations: 1, tax: 1 };
    state.starveTimer = 0; state.immigrantTimer = 0;
    state.tooled = {}; state.staffed = {}; state.saplings = [];
    state.treeFrac = 0; state.plantFrac = 0;
    state.churchFed = false; state.bathFed = false; state.waitingForTool = false;
    state.sites = []; state.builders = 3;
    state.buildersActive = 0; state.buildersWorking = 0; state.carriers = [];
    state.tribute = null;
    state.marketPrices = { kadzidło: 4.2, tkanina: 3.6, ceramika: 2.4 };
    state.voyageMode = 'normal'; state.crewAway = 0; state.voyages = [];
    state.raids = { count: 0, lost: 0, next: 40 };
    state.crisis = null; state.eventMsgs = [];
    const f = Data.FACTIONS[factionId];
    // pełny magazyn towarów wg limitów z sekcji "Magazyny"
    state.res = {};
    for (const g of Object.keys(Economy.LIMIT)) state.res[g] = 0;
    state.res.złoto = f.start.gold;
    state.res.narzędzia = f.start.tools;
    state.res.deski = f.start.wood;
    state.res.kamień = f.start.stone || 0;
    state.res.glina = f.start.clay || 0;
    state.res[f.start.foodKind.toLowerCase()] = f.start.food;
    state.res.popularity = 50;
    // Dwór na środku (2x2)
    const c = Math.floor(state.map.size / 2) - 1;
    placeBuilding('keep', c, c, true);
    state.keep = state.buildings[0];
    for (let i = 0; i < state.pop; i++) spawnCitizen();
  }

  function placeBuilding(id, x, y, instant) {
    const b = { id, x, y, uid: state.nextId++ };
    state.buildings.push(b);
    const size = id === 'keep' ? 2 : 1;
    for (let dy = 0; dy < size; dy++) for (let dx = 0; dx < size; dx++) {
      const t = MapGen.at(state.map, x + dx, y + dy);
      if (t) t.occup = b.uid;
    }
    return b;
  }

  function canPlace(id, x, y) {
    const def = Data.BUILDINGS[id];
    const size = id === 'keep' ? 2 : 1;
    let hasWater = false, hasForest = 0;
    for (let dy = -1; dy <= size; dy++) for (let dx = -1; dx <= size; dx++) {
      const t = MapGen.at(state.map, x + dx, y + dy);
      if (!t) continue;
      if (t.h === 0) hasWater = true;
      if (t.trees > 0) hasForest += t.trees;
    }
    for (let dy = 0; dy < size; dy++) for (let dx = 0; dx < size; dx++) {
      const t = MapGen.at(state.map, x + dx, y + dy);
      if (!t || t.h !== 1 || t.occup || t.trees > 0) return { ok: false, reason: 'Zajęte lub niebudowlane pole' };
      // złoże jest zarezerwowane dla pasującej kopalni
      if (t.deposit && def.req !== 'deposit:' + t.deposit) return { ok: false, reason: 'Złoże — miejsce tylko na kopalnię' };
    }
    if (def.req === 'forest' && hasForest < 4) return { ok: false, reason: 'Wymaga lasu w pobliżu' };
    if (def.req === 'shore' && !hasWater) return { ok: false, reason: 'Wymaga brzegu morza' };
    if (id === 'fisherhut' && state.buildings.filter(b => b.id === 'fisherhut').length >= 6)
      return { ok: false, reason: 'Brzeg pełny: maks. 6 Chat rybaka (spec.)' };
    if (def.req === 'waterEdge' && !hasWater) return { ok: false, reason: 'Wymaga bezpośredniego dostępu do wody' };
    if (def.req && def.req.startsWith('deposit:')) {
      const kind = def.req.split(':')[1];
      const t = MapGen.at(state.map, x, y);
      if (!t.deposit || t.deposit !== kind) return { ok: false, reason: 'Wymaga złoża (' + kind + ')' };
    }
    if (id === 'ship' && !state.buildings.some(b => b.id === 'dock'))
      return { ok: false, reason: 'Okręt wymaga Przystani' };
    return { ok: true };
  }

  function costOf(id) {
    const f = World.state().factionId;
    const raw = Data.BUILDINGS[id].costs[f];
    return raw ? { ...raw } : {};
  }

  function canAfford(id) {
    const c = costOf(id);
    const r = state.res;
    if ((c.d || 0) > r.deski) return false;
    if ((c.k || 0) > (r.kamień || 0)) return false;
    if ((c.gl || 0) > (r.glina || 0)) return false;
    if ((c.zl || 0) > r.złoto) return false;
    return true;
  }

  function build(id, x, y) {
    const c = costOf(id);
    if (!canAfford(id)) return false;
    const check = canPlace(id, x, y);
    if (!check.ok) return false;
    state.res.deski -= (c.d || 0);
    state.res.kamień = (state.res.kamień || 0) - (c.k || 0);
    state.res.glina = (state.res.glina || 0) - (c.gl || 0);
    state.res.złoto -= (c.zl || 0);
    placeBuilding(id, x, y);
    return true;
  }

  function placeFree(id, x, y) {
    if (!canPlace(id, x, y).ok) return false;
    placeBuilding(id, x, y);
    return true;
  }

  function spawnCitizen() {
    const p = Data.FACTIONS[state.factionId].palette;
    const keep = state.keep;
    state.citizens.push({
      x: keep.x + 1 + RNG.range(-1, 1), y: keep.y + 2 + RNG.range(0, 2),
      tx: keep.x + 1, ty: keep.y + 2,
      phase: RNG.range(0, 6.28),
      color: RNG.next() < 0.5 ? p.citizen : p.citizenAlt,
      speed: 0.25
    });
  }

  /* --- drzewa jako globalny zasób mapy --- */
  function treeCount() {
    let n = 0;
    for (const t of state.map.tiles) n += t.trees;
    return n;
  }
  function addTree() {
    const tiles = state.map.tiles;
    for (let tries = 0; tries < 30; tries++) {
      const t = tiles[RNG.int(0, tiles.length - 1)];
      if (t.h === 1 && !t.occup && t.trees < 3 && !t.deposit) { t.trees++; return true; }
    }
    return false;
  }
  function takeTrees(n) {
    state.treeFrac += n;
    while (state.treeFrac >= 1) {
      let done = false;
      for (let tries = 0; tries < 40 && !done; tries++) {
        const t = state.map.tiles[RNG.int(0, state.map.tiles.length - 1)];
        if (t.trees > 0) { t.trees--; done = true; }
      }
      state.treeFrac -= 1;
      if (!done) { state.treeFrac = 0; break; }
    }
  }

  function tick(dt) { // dt w minutach gry
    state.time += dt;
    Economy.tick(dt);
    Build.tick(dt); // kolejka placów, budowniczowie (po Economy — zna obsadę)
    Tribute.tick(dt); // haracz, sprzedaż na Targu, wyprawy Wikingów
    Events.tick(dt); // napady na karawany, kryzysy
    // liczba figurek = ludność
