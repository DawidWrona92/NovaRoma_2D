    // kolejność kampanii (spec): Słowianie, Frankowie, Wikingowie, Saraceni — trudniejsza nacja później
    const order = Object.keys(Data.FACTIONS).sort((a, b) => Data.FACTIONS[a].campaign.order - Data.FACTIONS[b].campaign.order);
    for (const fid of order) {
      const f = Data.FACTIONS[fid];
      const card = document.createElement('div');
      card.className = 'factionCard';
      const mini = document.createElement('canvas');
      mini.width = 220; mini.height = 130;
      card.appendChild(mini);
      const h2 = document.createElement('h2'); h2.textContent = f.name; card.appendChild(h2);
      const tag = document.createElement('div'); tag.className = 'tagline'; tag.textContent = f.tagline; card.appendChild(tag);
      const camp = document.createElement('div'); camp.className = 'campaign';
      camp.textContent = 'Etap kampanii ' + f.campaign.order + '/4 · trudność ' + '★'.repeat(f.campaign.stars) + '☆'.repeat(4 - f.campaign.stars) + ' — ' + f.campaign.note;
      card.appendChild(camp);
      const ul = document.createElement('ul');
      f.desc.forEach(d => { const li = document.createElement('li'); li.textContent = d; ul.appendChild(li); });
      card.appendChild(ul);
      card.onclick = () => startGame(fid);
      // dotyk: tap bez przesunięcia startuje grę, przesunięcie przewija listę kart
      let tapStart = null;
      card.addEventListener('touchstart', ev => {
        const tp = ev.touches[0];
        tapStart = { x: tp.clientX, y: tp.clientY };
      }, { passive: true });
      card.addEventListener('touchend', ev => {
        if (!tapStart) return;
        const tp = ev.changedTouches[0];
        const moved = Math.hypot(tp.clientX - tapStart.x, tp.clientY - tapStart.y) > 10;
        tapStart = null;
        if (moved) return;
        ev.preventDefault(); // blokuje syntetyczny click (bez podwójnego startu)
        startGame(fid);
      }, { passive: false });
      wrap.appendChild(card);
      // miniatura: budynek + obywatel na tle terenu
      const mctx = mini.getContext('2d');
      const terrainColors = { grass: ['#5a8a3c', '#4e7a34'], sand: ['#d8c090', '#c8b080'], tundra: ['#6a7a4c', '#5e6e42'] };
      const [c1, c2] = terrainColors[f.palette.terrain];
      mctx.fillStyle = c1; mctx.fillRect(0, 0, 220, 130);
      mctx.fillStyle = c2;
      for (let i = 0; i < 40; i++) mctx.fillRect((i * 37) % 220, (i * 53) % 130, 12, 6);
      Gfx.ART.keep(mctx, 110, 92, 1.1, f.palette, 0);
      Gfx.ART.hut(mctx, 50, 108, 0.9, f.palette, 0);
      const fake = { phase: 1, color: f.palette.citizen };
      Gfx.drawCitizen(mctx, fake, 175, 110, 1.3, fid, f.palette, 0);
    }
  }

  /* HUD zawija się do kilku wierszy: pozostałe panele przesuwają się o jego faktyczną wysokość */
  function syncHudHeight() { // wysokości HUD i paska budowy sterują położeniem paneli (zasoby, doradca, panel botów)
    const root = document.documentElement.style;
    root.setProperty('--hud-h', Math.ceil(hud.getBoundingClientRect().height) + 'px');
    if (buildBar.offsetHeight) root.setProperty('--bar-h', buildBar.offsetHeight + 'px');
  }
  window.addEventListener('resize', syncHudHeight);

  function startGame(fid) {
    if (gameStarted) return;
    gameStarted = true;
    document.getElementById('factionPick').style.display = 'none';
    hud.style.display = 'flex';
    buildBar.style.display = 'block';
    document.getElementById('hint').style.display = 'block';
    World.init(fid);
    document.getElementById('hudFaction').innerHTML = '<b>' + Data.FACTIONS[fid].name + '</b>';
    // kamera na Dwór
    const c = MapGen.SIZE / 2;
    Camera.x = 0; Camera.y = 0;
    const target = Camera.worldToScreen(c, c);
    Camera.x -= target.x - canvas.width / dpr / 2;
    Camera.y -= target.y - canvas.height / dpr / 2;
    buildTabsUi();
    refreshHUD();
    // sterowanie racjami i podatkiem
    const s = World.state();
    const btnR = document.getElementById('btnRations');
    const btnT = document.getElementById('btnTax');
    const upd = () => {
      btnR.textContent = 'Racje: ×' + s.controls.rations;
      btnT.textContent = 'Podatek: ' + s.controls.tax;
    };
    btnR.onclick = () => {
      const opts = [0.5, 1, 1.5, 2];
      s.controls.rations = opts[(opts.indexOf(s.controls.rations) + 1) % opts.length];
      upd();
    };
    btnT.onclick = () => { s.controls.tax = (s.controls.tax + 1) % 4; upd(); };
    // liczbę budowniczych ustawia się w Dworze (2–5, domyślnie 3)
    const btnB = document.getElementById('btnBuilders');
    const updB = () => { btnB.textContent = '👷 Budowniczowie: ' + s.builders; };
    btnB.onclick = () => { s.builders = s.builders >= 5 ? 2 : s.builders + 1; updB(); };
    updB();
    // preset haraczu (Łatwy/Normalny/Trudny/Mistrz) albo własny poziom 1–11; tryb wypraw Wikingów
    const selTr = document.getElementById('btnTribute');
    const btnV = document.getElementById('btnVoyages');
    const trOpts = [['off', '📜 Haracz: wyłączony']];
    for (const pr of ['easy', 'normal', 'hard', 'master'])
      trOpts.push([pr, '📜 ' + Tribute.PRESET_LABEL[pr] + ' (poz. ' + Tribute.PRESET_LEVEL[pr][fid] + ')']);
    for (let l = 1; l <= 11; l++) trOpts.push(['L' + l, '📜 Własny poziom ' + l]);
    selTr.innerHTML = '';
    for (const [v, label] of trOpts) { const o = document.createElement('option'); o.value = v; o.textContent = label; selTr.appendChild(o); }
    selTr.value = 'off';
    selTr.onchange = () => {
      const v = selTr.value;
      UI.flashHint(v[0] === 'L' ? Tribute.set('custom', +v.slice(1)) : Tribute.set(v));
      selTr.blur();
    };
    if (fid === 'vikings') {
      const updV = () => { btnV.textContent = '⛵ Wyprawy: ' + (s.voyageMode === 'mixed' ? 'Mieszane' : 'Zwykłe'); };
      btnV.onclick = () => { s.voyageMode = s.voyageMode === 'mixed' ? 'normal' : 'mixed'; updV(); };
      updV();
      const btnG = document.getElementById('btnGuard');
      const updG = () => { btnG.textContent = '⛵ Zapas załogi: ' + (s.settings.voyageGuard ? '90%' : 'brak'); };
      btnG.onclick = () => { s.settings.voyageGuard = !s.settings.voyageGuard; updG(); };
      updG();
    } else {
      btnV.style.display = 'none';
      document.getElementById('btnGuard').style.display = 'none';
    }
    const btnRd = document.getElementById('btnRaids');
    if (fid === 'saracens') {
      const updRd = () => { btnRd.textContent = '🏴 Napady: ' + (s.settings.raids ? 'wł.' : 'wył.'); };
      btnRd.onclick = () => { s.settings.raids = !s.settings.raids; updRd(); };
      updRd();
    } else btnRd.style.display = 'none';
    document.getElementById('btnAdvisor').onclick = () => UI.toggleAdvisor();
    const btnMore = document.getElementById('btnMore');
    btnMore.onclick = () => { // małe ekrany: rzadko używane ustawienia zwijane pod „Więcej"
      const open = hud.classList.toggle('open');
      btnMore.textContent = open ? '⚙ Mniej' : '⚙ Więcej';
      syncHudHeight();
    };
    document.getElementById('advisor').addEventListener('click', ev => { if (ev.target.id === 'advClose') UI.toggleAdvisor(false); });
    // kryzysy wg harmonogramu (scenariusze v3.5) — domyślnie wyłączone
    const btnC = document.getElementById('btnCrisis');
    let crisisOn = false;
    const updC = () => { btnC.textContent = crisisOn ? '🔥 Kryzysy: harmonogram' : '🔥 Kryzysy: wył.'; };
    btnC.onclick = () => { crisisOn = !crisisOn; UI.flashHint(Events.setCrisis(crisisOn)); updC(); };
    updC();
    upd();
    document.getElementById('resPanel').style.display = 'block';
    syncHudHeight();
    Game.start();
  }

  function buildTabsUi() {
    const fid = World.state().factionId;
    buildTabs.innerHTML = '';
    for (const cat of Data.CATS) {
      const has = Object.entries(Data.BUILDINGS)
        .some(([id, d]) => d.cat === cat && (!d.factions || d.factions.includes(fid)) && id !== 'keep');
      if (!has) continue;
      const btn = document.createElement('button');
      btn.textContent = cat;
      if (cat === activeCat) btn.classList.add('active');
      btn.onclick = () => { activeCat = cat; buildTabsUi(); buildItemsUi(); };
      buildTabs.appendChild(btn);
    }
    buildItemsUi();
  }

  function buildItemsUi() {
    const fid = World.state().factionId;
    buildItems.innerHTML = '';
    for (const [id, def] of Object.entries(Data.BUILDINGS)) {
      if (id === 'keep') continue;
      if (def.cat !== activeCat) continue;
      if (def.factions && !def.factions.includes(fid)) continue;
      const item = document.createElement('div');
      item.className = 'buildItem';
      if (BuildMode.isSelected() === id) item.classList.add('selected');
      const mini = document.createElement('canvas');
      mini.width = 62; mini.height = 44;
      const mctx = mini.getContext('2d');
      const p = Data.FACTIONS[fid].palette;
      mctx.fillStyle = p.terrain === 'sand' ? '#d8c090' : p.terrain === 'tundra' ? '#6a7a4c' : '#5a8a3c';
      mctx.fillRect(0, 0, 62, 44);
      const art = Gfx.ART[def.art];
      if (art) art(mctx, 31, 38, 0.85, p, 0);
      item.appendChild(mini);
      const nm = document.createElement('div'); nm.className = 'bname'; nm.textContent = Data.nameOf(id, fid); item.appendChild(nm);
      const cost = document.createElement('div'); cost.className = 'bcost';
      const c = World.costOf(id);
      cost.textContent = Object.entries(c).map(([k, v]) => v + Data.RES_LABEL[k]).join(' · ') +
        (def.tool ? ' + T' : '');
      item.appendChild(cost);
      item.onclick = () => {
        BuildMode.select(id);
        document.querySelectorAll('.buildItem').forEach(el => el.classList.remove('selected'));
        item.classList.add('selected');
      };
      item.onmouseenter = () => showTooltip(id, def, c, item);
      item.onmouseleave = hideTooltip;
      buildItems.appendChild(item);
    }
    syncHudHeight(); // wysokość paska zależy od zawijania nazw pozycji
  }

  function showTooltip(id, def, c, anchor) {
    const afford = World.canAfford(id);
    const lbl = g => Advisor.goodLabel(def, g);
    let html = '<h3>' + Data.nameOf(id) + '</h3>';
    const costStr = Object.entries(c).map(([k, v]) => v + ' ' + Data.RES_LABEL[k]).join(', ');
    html += '<div class="' + (afford ? 'affordable' : 'expensive') + '">Koszt: ' + (costStr || '—') + '</div>';
    if (def.tool) html += '<div class="expensive">Wymaga narzędzia</div>';
    if (def.worker) html += '<div>Pracownik: ' + def.worker + '</div>';
    if (def.inp) html += '<div>Wejście: ' + Object.entries(def.inp).map(([k, v]) => v + ' ' + k).join(' + ') + ' /min</div>';
    if (def.out) html += '<div><b>' + Object.entries(def.out).map(([k, v]) => v + ' ' + lbl(k)).join(' + ') + ' /min</b></div>';
    if (def.forest) html += '<div class="sub">Puszcza: plon × min(1, drzewa/' + Data.FOREST_REF[World.state().factionId] + ')</div>';
    if (def.note) html += '<em>' + def.note + '</em>';
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    const r = anchor.getBoundingClientRect();
    tooltip.style.left = Math.min(window.innerWidth - 260, r.left) + 'px';
    tooltip.style.top = (r.top - tooltip.offsetHeight - 8) + 'px';
  }
  function hideTooltip() { tooltip.style.display = 'none'; }

  function refreshHUD() {
    const s = World.state();
    document.getElementById('hudTime').textContent = Math.floor(s.time);
    document.getElementById('hudPop').textContent = Math.floor(s.pop);
    document.getElementById('hudPopularity').textContent = Math.round(s.res.popularity || 50);
    document.getElementById('hudGold').textContent = Math.floor(s.res.złoto);
    document.getElementById('hudTools').textContent = Math.floor(s.res.narzędzia);
    document.getElementById('hudFood').textContent = Math.floor(Economy.totalFood(s.res));
    document.getElementById('hudJobs').textContent = s.workersStaffed + '/' + s.workersNeeded;
    document.getElementById('hudHousing').textContent = Economy.housing(s);
    // komunikaty zdarzeń (napady, kryzysy)
    while (s.eventMsgs && s.eventMsgs.length) flashHint(s.eventMsgs.shift().text);
    // ogłoszenie haraczu 30 min przed pierwszym terminem
    const t = s.tribute;
    if (t && t.announced && t.announceMsg && !t.msgShown) {
      t.msgShown = true;
      flashHint(t.announceMsg);
    }
    refreshResPanel();
    refreshOverlays();
  }

  /* karta budynku (najechanie / dotknięcie) i panel Doradcy */
  let pinned = null, hovered = null, advisorOpen = false;
  const infoEl = document.getElementById('bInfo');
  function buildingInfoHtml(b) {
    const def = Data.BUILDINGS[b.id], st = Advisor.statusOf(b), lbl = g => Advisor.goodLabel(def, g);
    let h = '<h3>' + Data.nameOf(b.id) + '</h3>';
    h += '<div style="color:' + { bad: '#e08484', warn: '#e8b060', info: '#a8b8a8', good: '#8fce8f' }[st.sev] + '">' + st.text + '</div>';
    if (def.inp) h += '<div class="sub">Wejście: ' + Object.entries(def.inp).map(([k, v]) => v + ' ' + k).join(' + ') + ' /min</div>';
    if (def.out) h += '<div class="sub">Wyjście: ' + Object.entries(def.out).map(([k, v]) => v + ' ' + lbl(k)).join(' + ') + ' /min</div>';
    if (def.tool) h += '<div class="sub">Wymaga narzędzia' + (World.state().tooled[b.uid] ? ' (obsadzony)' : '') + '</div>';
    return h;
  }
  function showInfo(b) {
    if (!b) { infoEl.style.display = 'none'; return; }
    infoEl.innerHTML = buildingInfoHtml(b);
    infoEl.style.display = 'block';
  }
  function refreshOverlays() {
    const shown = advisorOpen ? null : (pinned || hovered);
    if (shown && World.state().buildings.includes(shown)) showInfo(shown);
    else { pinned = null; hovered = null; showInfo(null); }
    if (advisorOpen) document.getElementById('advisor').innerHTML = Advisor.render();
  }
  function pinBuilding(b) { pinned = b; refreshOverlays(); }
  function hoverBuilding(b) { if (b !== hovered) { hovered = b; refreshOverlays(); } }
  function toggleAdvisor(force) {
    advisorOpen = force === undefined ? !advisorOpen : force;
    const el = document.getElementById('advisor');
    el.style.display = advisorOpen ? 'block' : 'none';
    if (advisorOpen) el.innerHTML = Advisor.render();
  }

  let lastPanel = -1;
  function refreshResPanel() {
    const s = World.state();
    if (s.time - lastPanel < 0.2) return;
    lastPanel = s.time;
    const panel = document.getElementById('resPanel');
    let html = '<h3>MAGAZYN</h3>';
    let shown = 0;
    for (const g of Object.keys(Economy.LIMIT)) {
      const producers = s.buildings.filter(b => {
        const o = Data.BUILDINGS[b.id].out;
        return o && Object.keys(o)[0] === g;
      }).length;
      const val = s.res[g] || 0;
      if (val < 0.01 && producers === 0) continue;
      const cap = Economy.capOf(s, g);
      const full = val >= cap - 0.01;
      html += `<div class="row${full ? ' full' : ''}"><span>${g}</span>` +
              `<span class="v">${Math.floor(val)}<span class="cap"> /${cap}</span></span></div>`;
      shown++;
    }
    if (!shown) html += '<div class="row"><span class="v">— pusto —</span></div>';
    html += '<div class="sep"></div>';
    const rep = s.foodRep;
    if (rep) { // bilans jedzenia: produkcja, zużycie, podatek górniczy, maksymalna ludność z bramki imigracji
      const f = v => v.toFixed(1).replace('.', ',');
      html += '<h3>ŻYWNOŚĆ</h3>';
      html += `<div class="row"><span>Produkcja</span><span class="v">${f(rep.potential)}/min</span></div>`;
      html += `<div class="row"><span>Zużycie ludzi</span><span class="v">−${f(rep.people + rep.builders)}</span></div>`;
      if (rep.buildings > 0) html += `<div class="row warn"><span>Podatek górniczy</span><span class="v">−${f(rep.buildings)}</span></div>`;
      html += `<div class="row"><span>Maks. ludność</span><span class="v">${rep.pmax}</span></div>`;
      html += '<div class="sep"></div>';
    }
    const starve = s.starveTimer > 0 ? Math.ceil(5 - s.starveTimer) : null;
    html += `<div class="row"><span>Głód za</span><span class="v">${starve !== null ? starve + ' min' : '—'}</span></div>`;
    if (s.waitingForTool) html += '<div class="row full"><span>Budynek czeka na narzędzie!</span></div>';
    if ((s.res.popularity || 50) < 45) html += '<div class="row full"><span>Popularność < 45: brak imigracji!</span></div>';
    else if (s.controls.tax === 3) html += '<div class="row warn"><span>Podatek 3: −16 popularności</span></div>';
    const nWarn = Advisor.warnings(s).filter(x => x.sev !== 'info').length;
    html += `<div class="row"><span class="link" id="resAdvisor">🧭 Doradca${nWarn ? ' (' + nWarn + ' ⚠)' : ''}</span></div>`;
    // budowniczowie i kolejka budowy
    html += `<div class="row"><span>Budowniczowie</span><span class="v">${s.buildersActive || 0}/${s.builders}</span></div>`;
    if (s.sites.length) {
      html += '<div class="sep"></div><h3>BUDOWA</h3>';
      s.sites.slice(0, 4).forEach((st, i) => {
        const pr = Math.round(Build.progressOf(st) * 100);
        html += `<div class="row"><span>${i + 1}. ${Data.nameOf(st.id)}</span>` +
                `<span class="v">${pr}%</span></div>`;
      });
      if (s.sites.length > 4)
        html += `<div class="row"><span>…i ${s.sites.length - 4} dalej</span></div>`;
      html += '<div class="row"><span style="color:#7a6c55">Klik na plac = anuluj</span></div>';
    }
    // status haraczu i wypraw
    const t = s.tribute;
    if (t) {
      html += '<div class="sep"></div><h3>HARACZ</h3>';
      const unit = Tribute.UNIT[s.factionId];
      const required = Tribute.requiredCum(t.level, s.factionId, Math.max(1, t.terms + 1));
      const nextAt = t.firstTerm + t.terms * 15;
      if (s.time < t.firstTerm)
        html += `<div class="row"><span>Pierwsza rata</span><span class="v">za ${Math.ceil(nextAt - s.time)} min</span></div>`;
      else
        html += `<div class="row"><span>Następna rata</span><span class="v">za ${Math.ceil(nextAt - s.time)} min</span></div>`;
      html += `<div class="row"><span>Dostawa (${unit})</span><span class="v">${Math.floor(t.delivered)} / ${required}</span></div>`;
      html += `<div class="row"><span>Terminy</span><span class="v">${t.met} ✔ / ${t.missed} ✘</span></div>`;
      if (s.factionId === 'franks' && !s.buildings.some(b => b.id === 'barracks'))
        html += '<div class="row full"><span>Bez Koszar brak dostaw!</span></div>';
      const bk = Tribute.basketStatus(s); // Słowianie: koszyk daniny na najbliższy termin
      if (bk) {
        html += `<div class="row"><span style="color:#7a6c55">Koszyk (szt. / potrzeba, min. 50%)</span></div>`;
        for (const r of bk.rows) {
          const low = r.have < r.minUnits - 1e-9;
          html += `<div class="row${low ? ' full' : ''}"><span>${r.good}</span><span class="v">${Math.floor(r.have)} / ${Math.ceil(r.needUnits)}</span></div>`;
        }
        html += `<div class="row"><span>Wartość w zapasie</span><span class="v">${Math.floor(bk.totalVal)} / ${Math.ceil(bk.D)}</span></div>`;
      }
    }
    if (s.factionId === 'vikings' && (s.voyages.length || s.crewAway)) {
      html += `<div class="row"><span>Załoga w morzu</span><span class="v">${s.crewAway}</span></div>`;
      for (const v of s.voyages.slice(0, 3))
        html += `<div class="row"><span>${v.great ? 'Wielka wyprawa' : 'Wyprawa'} (2 okr.)</span>` +
                `<span class="v">${Math.ceil(Math.max(0, v.until - s.time))} min</span></div>`;
    }
    // napady na karawanę (Saraceni)
    if (s.factionId === 'saracens' && (s.raids.count || s.raids.lost)) {
      html += '<div class="sep"></div><h3>NAPADY</h3>';
      const guards = s.buildings.filter(b => b.id === 'guardpost' && s.staffed[b.uid]).length;
      html += `<div class="row"><span>Napady / strata</span><span class="v">${s.raids.count} / ${Math.round(s.raids.lost)} zł</span></div>`;
      html += `<div class="row"><span>Strażnice czynne</span><span class="v">${Math.min(2, guards)} (max 2)</span></div>`;
    }
    if (s.crisis) html += '<div class="row full"><span>🔥 Kryzysy: harmonogram aktywny</span></div>';
    panel.innerHTML = html;
    const link = document.getElementById('resAdvisor');
    if (link) link.onclick = () => UI.toggleAdvisor(true);
  }

  function flashHint(msg) {
    hintEl.textContent = msg;
    hintEl.style.color = '#e8a060';
    hintEl.classList.add('flash'); // na telefonie podpowiedź jest widoczna tylko jako komunikat
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => {
      hintEl.textContent = DEFAULT_HINT;
      hintEl.style.color = '#b8a888';
      hintEl.classList.remove('flash');
    }, Math.max(2500, msg.length * 70));
  }

  return { buildFactionCards, startGame, refreshHUD, flashHint, tooltip, pinBuilding, hoverBuilding, toggleAdvisor };
})();

/* ================================ MODUL: GAME ============================== */
const Game = (() => {
  const ctx = canvas.getContext('2d');
  let running = false, lastFrame = 0, lastHudTick = -1;
  let keys = {};

  function fit() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }
  window.addEventListener('resize', () => fit());

  function start() {
    if (running) return;
    running = true;
    lastFrame = performance.now();
    requestAnimationFrame(loop);
    UI.refreshHUD();
    TestBots.createPanel(); // panel botów R/D/N (warstwa testowa)
  }

  function loop(now) {
    const realDt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    // ruch kamery
    const pan = 420 * realDt;
    if (keys['w'] || keys['arrowup']) Camera.y += pan;
    if (keys['s'] || keys['arrowdown']) Camera.y -= pan;
    if (keys['a'] || keys['arrowleft']) Camera.x += pan;
    if (keys['d'] || keys['arrowright']) Camera.x -= pan;
    // zegar gry: 4 s realnych = 1 min gry
    const s = World.state();
    const gameDt = realDt / 4 * s.speed;
    if (s.factionId) {
      World.tick(gameDt);
      const hudTick = Math.floor(s.time * 4); // odświeżenie HUD co 1/4 minuty gry
      if (hudTick !== lastHudTick) { lastHudTick = hudTick; UI.refreshHUD(); }
    }
    render(now / 1000);
    requestAnimationFrame(loop);
  }

  function render(t) {
    Gfx.setAnim(t);
    const s = World.state();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
    if (!s.map) return;
    const f = Data.FACTIONS[s.factionId];
    ctx.fillStyle = '#10140f';
    ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);
    const z = Camera.zoom;
    const size = s.map.size;
    const byUid = new Map();
    for (const b of s.buildings) byUid.set(b.uid, b);
    // zbierz obiekty do posortowania po głębi (y świata)
    const drawables = [];
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const tile = s.map.tiles[y * size + x];
        tile.x = x; tile.y = y;
        const scr = Camera.worldToScreen(x + 0.5, y + 0.5);
        if (scr.x < -80 || scr.x > canvas.width / dpr + 80 || scr.y < -80 || scr.y > canvas.height / dpr + 80) continue;
        drawTile(x, y, scr, tile);
        if (tile.occup) {
          const b = byUid.get(tile.occup);
          // budynek rysujemy raz, z kafla początkowego (Dwór 2x2 zajmuje cztery kafle)
          if (b && b.x === x && b.y === y) {
            const big = b.id === 'keep';
            drawables.push({ depth: x + y + (big ? 2.5 : 0.5), b,
              scr: big ? Camera.worldToScreen(x + 1.25, y + 1.25) : scr });
          }
        }
      }
    }
    // obywatele i nosiciele
    for (const c of s.citizens) {
      const scr = Camera.worldToScreen(c.x, c.y);
      drawables.push({ depth: c.x + c.y, citizen: c, scr });
    }
    for (const c of s.carriers) {
      const scr = Camera.worldToScreen(c.x, c.y);
      drawables.push({ depth: c.x + c.y, citizen: c, scr });
    }
    drawables.sort((a, b) => a.depth - b.depth);
    for (const d of drawables) {
      if (d.b) {
        const def = Data.BUILDINGS[d.b.id];
        const art = Gfx.ART[def.art];
        if (art) art(ctx, d.scr.x, d.scr.y, z, f.palette, t);
      } else {
        Gfx.drawCitizen(ctx, d.citizen, d.scr.x, d.scr.y, z, s.factionId, f.palette, t);
      }
    }
    // place budowy z budowniczymi
    for (const st of s.sites) {
      const scr = Camera.worldToScreen(st.x + 0.5, st.y + 0.5);
      if (scr.x < -80 || scr.x > canvas.width / dpr + 80 || scr.y < -80 || scr.y > canvas.height / dpr + 80) continue;
      Gfx.drawSite(ctx, scr.x, scr.y, z, f.palette, Build.progressOf(st));
      for (let i = 0; i < st.assigned; i++) {
        const ang = i * 2.1 + st.uid;
        const bx = scr.x + Math.cos(ang) * 12 * z;
        const by = scr.y + Math.sin(ang) * 6 * z + 3 * z;
        Gfx.drawCitizen(ctx, { phase: t * 2 + i, color: f.palette.citizen },
                        bx, by, z, s.factionId, f.palette, t);
      }
    }
    // znaczniki statusu: ! brak wejścia · T narzędzie · P pracownik · Z pełny magazyn · J jedzenie (spec: „brak wejścia” na budynku)
    for (const b of s.buildings) {
      const badge = Advisor.badgeOf(b); if (!badge) continue;
      const scr = Camera.worldToScreen(b.x + 0.5, b.y + 0.5);
      if (scr.x < -40 || scr.x > canvas.width / dpr + 40 || scr.y < -40 || scr.y > canvas.height / dpr + 40) continue;
      const bx = scr.x + 13 * z, by = scr.y - 36 * z, r = 6.5 * z;
      ctx.fillStyle = badge[1]; ctx.beginPath(); ctx.arc(bx, by, r, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.65)'; ctx.lineWidth = Math.max(1, z); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold ' + Math.max(8, Math.round(9 * z)) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.fillText(badge[0], bx, by + 3.3 * z); ctx.textAlign = 'start';
    }
    BuildMode.draw(ctx);
  }

  function drawTile(x, y, scr, tile) {
    let coast = 0;
    if (tile.h === 0) {
      const s2 = World.state();
      const dirs = [[0,-1],[1,0],[0,1],[-1,0]];
      for (let i = 0; i < 4; i++) {
        const n = MapGen.at(s2.map, x + dirs[i][0], y + dirs[i][1]);
        if (n && n.h !== 0) coast |= (1 << i);
      }
    }
    Gfx.drawTile(ctx, tile, scr.x, scr.y, Camera.zoom, Data.FACTIONS[World.state().factionId].palette.terrain, coast);
  }

  /* --- input --- */
  let dragging = false, dragStart = null, camStart = null, dragged = false;
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('mousedown', e => {
    dragged = false; // każde naciśnięcie zaczyna od zera (prawy przycisk nie generuje click, który by to zerował)
    if (e.button === 2 || (e.button === 0 && e.shiftKey)) {
      dragging = true; canvas.classList.add('dragging');
      dragStart = { x: e.clientX, y: e.clientY };
      camStart = { x: Camera.x, y: Camera.y };
    }
  });
  window.addEventListener('mouseup', e => {
    if (e.button === 2 || dragging) { dragging = false; canvas.classList.remove('dragging'); }
  });
  window.addEventListener('mousemove', e => {
    if (dragging) {
      if (Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y) > 5) dragged = true;
      Camera.x = camStart.x + (e.clientX - dragStart.x);
      Camera.y = camStart.y + (e.clientY - dragStart.y);
    } else {
      const w = Camera.screenToWorld(e.clientX, e.clientY);
      BuildMode.setHover(w.x, w.y);
      UI.hoverBuilding(BuildMode.isSelected() ? null : BuildMode.buildingAtHover());
    }
  });
  canvas.addEventListener('click', e => {
    if (dragged) { dragged = false; return; } // to był drag kamery, nie klik
    if (e.button === 0 && !e.shiftKey) {
      const w = Camera.screenToWorld(e.clientX, e.clientY);
      BuildMode.setHover(w.x, w.y);
      BuildMode.click();
    }
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const before = Camera.screenToWorld(e.clientX, e.clientY);
    Camera.zoom = Math.min(2.2, Math.max(0.5, Camera.zoom * (e.deltaY < 0 ? 1.1 : 0.9)));
    const after = Camera.worldToScreen(before.x, before.y);
    Camera.x += e.clientX - after.x;
    Camera.y += e.clientY - after.y;
  }, { passive: false });
  /* --- sterowanie dotykiem: 1 palec = kamera, 2 palce = pinch-zoom, tap = klik --- */
  let touchMode = null; // 'pan' | 'pinch' | null
  let tStart = null, tCamStart = null, pinchStart = null, pinchZoomStart = 1;
  const rectOf = () => canvas.getBoundingClientRect();
  function tPos(touches) {
    const r = rectOf();
    return { x: (touches[0].clientX - r.left), y: (touches[0].clientY - r.top) };
  }
  function tMid(touches) {
    const r = rectOf();
    return { x: ((touches[0].clientX + touches[1].clientX) / 2 - r.left),
             y: ((touches[0].clientY + touches[1].clientY) / 2 - r.top) };
  }
  function tDist(touches) {
    return Math.hypot(touches[0].clientX - touches[1].clientX,
                      touches[0].clientY - touches[1].clientY);
  }
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (e.touches.length === 1) {
      touchMode = 'pan';
      const p = tPos(e.touches);
      tStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, sx: p.x, sy: p.y, t: Date.now() };
      tCamStart = { x: Camera.x, y: Camera.y };
      dragged = false;
    } else if (e.touches.length === 2) {
      touchMode = 'pinch';
      dragged = true; // dwa palce nigdy nie są tapem
      pinchStart = { mid: tMid(e.touches), dist: tDist(e.touches), cam: { x: Camera.x, y: Camera.y } };
      pinchZoomStart = Camera.zoom;
    }
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (touchMode === 'pan' && e.touches.length === 1) {
      if (Math.hypot(e.touches[0].clientX - tStart.x, e.touches[0].clientY - tStart.y) > 8) dragged = true;
      Camera.x = tCamStart.x + (e.touches[0].clientX - tStart.x);
      Camera.y = tCamStart.y + (e.touches[0].clientY - tStart.y);
    } else if (touchMode === 'pinch' && e.touches.length === 2) {
      // zoom względem środka uszczypnięcia
      const d = tDist(e.touches);
      const zoomNew = Math.min(2.2, Math.max(0.5, pinchZoomStart * (d / pinchStart.dist)));
      const mid = tMid(e.touches);
      const before = Camera.screenToWorld(mid.x, mid.y);
      Camera.zoom = zoomNew;
      const after = Camera.worldToScreen(before.x, before.y);
      Camera.x += mid.x - after.x;
      Camera.y += mid.y - after.y;
      // pan środkiem uszczypnięcia
      Camera.x += mid.x - pinchStart.mid.x;
      Camera.y += mid.y - pinchStart.mid.y;
      pinchStart.mid = mid; // przyrostowo: bez kumulowania przesunięcia co klatkę
    }
  }, { passive: false });
  canvas.addEventListener('touchend', e => {
    e.preventDefault();
    if (touchMode === 'pan' && e.changedTouches.length === 1 && !dragged) {
      const dx = e.changedTouches[0].clientX - tStart.x;
      const dy = e.changedTouches[0].clientY - tStart.y;
      if (Math.hypot(dx, dy) < 8 && Date.now() - tStart.t < 600) {
        // tap: jak klik lewym przyciskiem — budowa / wybór
        const w = Camera.screenToWorld(tStart.sx, tStart.sy);
        BuildMode.setHover(w.x, w.y);
        BuildMode.click();
      }
    }
    if (e.touches.length === 0) { touchMode = null; dragged = false; }
  }, { passive: false });
  canvas.addEventListener('touchcancel', () => { touchMode = null; dragged = false; }, { passive: true });
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === 'Escape') {
      BuildMode.clear();
      UI.pinBuilding(null);
      document.querySelectorAll('.buildItem').forEach(el => el.classList.remove('selected'));
    }
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  document.getElementById('btnSpeed').onclick = () => {
    const s = World.state();
    s.speed = s.speed === 1 ? 2 : s.speed === 2 ? 4 : 1;
    document.getElementById('btnSpeed').textContent = 'Prędkość: ×' + s.speed;
  };

  fit();
  UI.buildFactionCards();
  return { start };
})();
</script>
