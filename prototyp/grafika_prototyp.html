<div id="cap"><b>Nova Roma — próbka nowego stylu (v3)</b><div>Budynki o różnych rozmiarach (2×2 … 4×4 pola) · Słowianie, Frankowie, Saraceni, Wikingowie · wszystko rysowane kodem</div></div>
<div id="st"><span id="fps"></span><br><span id="bake"></span></div>

<script>
/* ---- 00_util.js ---- */
/* ====================== NARZĘDZIA ====================== */
const TAU = Math.PI * 2;
const SEARCH = typeof location !== 'undefined' ? location.search : '';   // parametry URL (?lint=1, ?nowear=1, ?q=…) — bezpieczne także bez przeglądarki (testy headless)
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

function rng(seed) { // mulberry32 — deterministyczny generator (te same tekstury za każdym razem)
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function hex(c) { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const scaleC = (c, f) => [clamp(c[0] * f, 0, 255), clamp(c[1] * f, 0, 255), clamp(c[2] * f, 0, 255)];
function ramp(stops, t) { // stops: [[pozycja, [r,g,b]], ...]
  t = clamp(t, 0, 1);
  for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) {
    const [p0, c0] = stops[i - 1], [p1, c1] = stops[i];
    return mixc(c0, c1, (t - p0) / ((p1 - p0) || 1));
  }
  return stops[stops.length - 1][1];
}
/* tablica kolorów (256 wpisów) zamiast liczenia rampy dla każdego piksela */
function lutRamp(stops, n = 256) { return Array.from({ length: n }, (_, i) => ramp(stops, i / (n - 1))); }
function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }

/* drobny szum ziarna dodany do całej tekstury */
function addGrain(g, w, h, amt, seed) {
  const r = rng(seed || 1), im = g.getImageData(0, 0, w, h), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * amt; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(im, 0, 0);
}

/* szum wartościowy okresowy (kafelkowalny) i fbm */
function periodicNoise(size, cells, seed) {
  const r = rng(seed), L = new Float32Array(cells * cells);
  for (let i = 0; i < L.length; i++) L[i] = r();
  const out = new Float32Array(size * size), s = cells / size;
  for (let y = 0; y < size; y++) {
    const fy = y * s, y0 = Math.floor(fy), ty = fy - y0, sy = ty * ty * (3 - 2 * ty), yy0 = y0 % cells, yy1 = (y0 + 1) % cells;
    for (let x = 0; x < size; x++) {
      const fx = x * s, x0 = Math.floor(fx), tx = fx - x0, sx = tx * tx * (3 - 2 * tx), xx0 = x0 % cells, xx1 = (x0 + 1) % cells;
      const a = L[yy0 * cells + xx0], b = L[yy0 * cells + xx1], c = L[yy1 * cells + xx0], d = L[yy1 * cells + xx1];
      out[y * size + x] = lerp(lerp(a, b, sx), lerp(c, d, sx), sy);
    }
  }
  return out;
}
function fbm(size, cells, oct, seed) {
  const out = new Float32Array(size * size); let amp = 1, tot = 0;
  for (let o = 0; o < oct; o++) {
    const n = periodicNoise(size, cells * (1 << o), seed + o * 101);
    for (let i = 0; i < out.length; i++) out[i] += n[i] * amp;
    tot += amp; amp *= 0.5;
  }
  for (let i = 0; i < out.length; i++) out[i] /= tot;
  return out;
}

/* miękki cień/poświata: rysuje kształt poza płótnem i przesuwa jego cień (shadowBlur działa w każdej przeglądarce).
   Rozmycie i przesunięcie cienia nie podlegają macierzy, więc skalujemy je o mnożnik z bieżącej macierzy kontekstu. */
function softFill(g, pathFn, color, blur, dx = 0, dy = 0) {
  const OFF = 4000, R = g.getTransform().a || 1;
  g.save();
  g.shadowColor = color; g.shadowBlur = blur * R; g.shadowOffsetX = (OFF + dx) * R; g.shadowOffsetY = dy * R;
  g.translate(-OFF, 0);
  g.fillStyle = '#000'; g.beginPath(); pathFn(g); g.fill();
  g.restore();
}

/* LOD (mipmapy): przy oddaleniu rysujemy wstępnie pomniejszone kopie — bez poszarpanych krawędzi */
function lodHalf(c) {
  if (!c._h) {
    const h = newCanvas(Math.max(1, c.width >> 1), Math.max(1, c.height >> 1)), g = h.getContext('2d');
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high'; g.drawImage(c, 0, 0, h.width, h.height); c._h = h;
  }
  return c._h;
}
function lodPick(c, ratio) { while (ratio >= 2 && c.width > 8 && c.height > 8) { c = lodHalf(c); ratio /= 2; } return c; }

/* ---- 10_tex.js ---- */
/* ====================== TEKSTURY PROCEDURALNE ======================
   Każda tekstura jest kafelkowalna (szwy okresowe) i ma gęstość ppu = pikseli tekstury na jednostkę świata,
   więc na każdej ścianie / połaci deska, bal czy dachówka mają ten sam rozmiar. */
const GEN = {};
const TEXCACHE = {};
let TEXRES = 1;                     // mnożnik rozdzielczości tekstur terenu (ustawiany przy starcie razem z RES)
function tex(name, pal) {
  const key = name + '|' + (pal || '');
  return TEXCACHE[key] || (TEXCACHE[key] = GEN[name](pal ?? undefined));        // null = brak palety (domyślna z parametru generatora)
}
/* rysuje obiekt także w kopiach przesuniętych o okres, żeby kafelek był bezszwowy */
function wrapDraw(N, x, y, w, h, fn) {
  for (const ox of [-N, 0, N]) for (const oy of [-N, 0, N]) {
    if (x + ox > N + 4 || x + ox + w < -4 || y + oy > N + 4 || y + oy + h < -4) continue;
    fn(ox, oy);
  }
}

/* --- bale (zrąb): poziome okrągłe kłody z usłojeniem i sękami --- */
GEN.log = (base = '#a0723f') => {
  const N = 128, c = newCanvas(N, N), g = c.getContext('2d'), r = rng(11), rows = 8, rh = N / rows, b = hex(base);
  for (let i = 0; i < rows; i++) {
    const y = i * rh, k = 0.86 + r() * 0.28;
    const gr = g.createLinearGradient(0, y, 0, y + rh);
    gr.addColorStop(0, css(scaleC(b, 1.28 * k))); gr.addColorStop(0.3, css(scaleC(b, 1.05 * k))); gr.addColorStop(0.75, css(scaleC(b, 0.74 * k))); gr.addColorStop(1, css(scaleC(b, 0.46 * k)));
    g.fillStyle = gr; g.fillRect(0, y, N, rh);
    for (let j = 0; j < 8; j++) { // usłojenie: falujące, okresowe linie
      const yy = y + 2 + r() * (rh - 5), ph = r() * TAU, amp = 0.5 + r() * 1.1, f = 1 + ((r() * 3) | 0);
      g.strokeStyle = `rgba(36,20,8,${0.12 + r() * 0.22})`; g.lineWidth = 0.7 + r() * 0.9;
      g.beginPath();
      for (let x = 0; x <= N; x += 4) { const v = yy + Math.sin(x / N * TAU * f + ph) * amp; x ? g.lineTo(x, v) : g.moveTo(x, v); }
      g.stroke();
    }
    if (r() < 0.5) { // sęk
      const kx = r() * N, ky = y + rh * (0.35 + r() * 0.3), kr = 2.4 + r() * 2;
      wrapDraw(N, kx - 9, ky - 6, 18, 12, (ox, oy) => {
        g.fillStyle = 'rgba(30,16,6,0.55)'; g.beginPath(); g.ellipse(kx + ox, ky + oy, kr, kr * 0.7, 0, 0, TAU); g.fill();
        g.strokeStyle = 'rgba(30,16,6,0.28)'; g.lineWidth = 1; g.beginPath(); g.ellipse(kx + ox, ky + oy, kr * 2, kr * 1.3, 0, 0, TAU); g.stroke();
      });
    }
    g.fillStyle = 'rgba(14,7,2,0.6)'; g.fillRect(0, y + rh - 1.6, N, 1.6);   // szczelina między bali
    g.fillStyle = 'rgba(255,225,170,0.2)'; g.fillRect(0, y + 0.4, N, 1);     // błysk na grzbiecie
  }
  addGrain(g, N, N, 15, 2);
  return { c, ppu: 112 };
};

/* --- kora / okrąglak stojący: pionowe usłojenie, bruzdy i sęki (słupki, pnie, pale, beczki z kłód) --- */
GEN.bark = (base = '#6a4a2c') => {
  const N = 128, c = newCanvas(N, N), g = c.getContext('2d'), r = rng(17), b = hex(base);
  g.fillStyle = css(b); g.fillRect(0, 0, N, N);
  for (let i = 0; i < 16; i++) {   // pasma o różnym odcieniu
    const x = i * N / 16, k = 0.8 + r() * 0.4, gr = g.createLinearGradient(x, 0, x + N / 16, 0);
    gr.addColorStop(0, css(scaleC(b, 0.8 * k))); gr.addColorStop(0.5, css(scaleC(b, 1.18 * k))); gr.addColorStop(1, css(scaleC(b, 0.7 * k)));
    g.fillStyle = gr; g.fillRect(x, 0, N / 16 + 0.5, N);
  }
  for (let i = 0; i < 46; i++) {   // bruzdy: falujące pionowe linie, okresowe w pionie i poziomie
    const x = r() * N, ph = r() * TAU, amp = 0.6 + r() * 1.4, f = 1 + ((r() * 2) | 0), len = 30 + r() * 70, y0 = r() * N;
    g.strokeStyle = `rgba(20,10,4,${0.2 + r() * 0.34})`; g.lineWidth = 0.7 + r() * 1.1;
    for (const oy of [-N, 0]) { g.beginPath(); for (let y = 0; y <= len; y += 4) { const v = x + Math.sin((y + y0) / N * TAU * f + ph) * amp; y ? g.lineTo(v, y0 + y + oy) : g.moveTo(v, y0 + y + oy); } g.stroke(); }
  }
  for (let i = 0; i < 5; i++) { const kx = r() * N, ky = r() * N, kr = 2.4 + r() * 2; wrapDraw(N, kx - 9, ky - 7, 18, 14, (ox, oy) => { g.fillStyle = 'rgba(24,12,4,0.55)'; g.beginPath(); g.ellipse(kx + ox, ky + oy, kr * 0.7, kr, 0, 0, TAU); g.fill(); g.strokeStyle = 'rgba(24,12,4,0.28)'; g.lineWidth = 1; g.beginPath(); g.ellipse(kx + ox, ky + oy, kr * 1.5, kr * 2.2, 0, 0, TAU); g.stroke(); }); }
  addGrain(g, N, N, 15, 2);
  return { c, ppu: 120 };
};

/* --- deski pionowe --- */
GEN.plank = (base = '#7b5a36') => {
  const N = 128, c = newCanvas(N, N), g = c.getContext('2d'), r = rng(13), b = hex(base), cols = 8, cw = N / cols;
  for (let i = 0; i < cols; i++) {
    const x = i * cw, k = 0.85 + r() * 0.3;
    const gr = g.createLinearGradient(x, 0, x + cw, 0);
    gr.addColorStop(0, css(scaleC(b, 0.8 * k))); gr.addColorStop(0.5, css(scaleC(b, 1.08 * k))); gr.addColorStop(1, css(scaleC(b, 0.75 * k)));
    g.fillStyle = gr; g.fillRect(x, 0, cw, N);
    for (let j = 0; j < 6; j++) {
      const xx = x + 2 + r() * (cw - 4), ph = r() * TAU, amp = 0.6 + r() * 0.8;
      g.strokeStyle = `rgba(30,16,6,${0.12 + r() * 0.2})`; g.lineWidth = 0.7 + r() * 0.7; g.beginPath();
      for (let y = 0; y <= N; y += 4) { const v = xx + Math.sin(y / N * TAU * 2 + ph) * amp; y ? g.lineTo(v, y) : g.moveTo(v, y); }
      g.stroke();
    }
    g.fillStyle = 'rgba(12,6,2,0.65)'; g.fillRect(x + cw - 1.2, 0, 1.2, N);
  }
  g.fillStyle = 'rgba(20,14,10,0.7)';
  for (let i = 0; i < cols; i++) for (const y of [20, 64, 108]) { g.beginPath(); g.arc(i * cw + cw / 2, y, 1.1, 0, TAU); g.fill(); }
  addGrain(g, N, N, 13, 4);
  return { c, ppu: 120 };
};

/* --- strzecha: gęste źdźbła wzdłuż spadku, pasy wiązań --- */
GEN.thatch = (base = '#cba94d') => {
  const N = 128, c = newCanvas(N, N), g = c.getContext('2d'), r = rng(21), b = hex(base);
  g.fillStyle = css(scaleC(b, 0.62)); g.fillRect(0, 0, N, N);
  const cols = [scaleC(b, 1.3), scaleC(b, 1.12), b, scaleC(b, 0.86), scaleC(b, 0.66), mixc(b, [255, 246, 205], 0.45)];
  for (let i = 0; i < 3600; i++) {
    const x = r() * N, y = r() * N, len = 9 + r() * 18, ang = Math.PI / 2 + (r() - 0.5) * 0.3;
    g.strokeStyle = css(cols[(r() * cols.length) | 0], 0.5 + r() * 0.45); g.lineWidth = 0.8 + r() * 1.1;
    wrapDraw(N, x - 20, y - 20, 40, 40 + len, (ox, oy) => { g.beginPath(); g.moveTo(x + ox, y + oy); g.lineTo(x + ox + Math.cos(ang) * len, y + oy + Math.sin(ang) * len); g.stroke(); });
  }
  for (let k = 0; k < 4; k++) { // wiązania
    const y = k * 32 + 22;
    g.fillStyle = 'rgba(38,24,8,0.3)'; g.fillRect(0, y, N, 3);
    g.fillStyle = 'rgba(255,240,170,0.16)'; g.fillRect(0, y + 3, N, 2);
  }
  addGrain(g, N, N, 16, 3);
  return { c, ppu: 96 };
};

/* --- dachówka ceramiczna (karpiówka) --- */
GEN.tiles = (base = '#b4532f') => {
  const N = 128, c = newCanvas(N, N), g = c.getContext('2d'), r = rng(31), b = hex(base), rows = 8, rh = N / rows, tw = 16;
  g.fillStyle = css(scaleC(b, 0.4)); g.fillRect(0, 0, N, N);
  for (let row = 0; row < rows; row++) {
    const y = row * rh, off = (row % 2) * tw / 2;
    for (let col = -1; col <= N / tw; col++) {
      const x = col * tw + off, k = 0.8 + r() * 0.4;
      const gr = g.createLinearGradient(0, y, 0, y + rh);
      gr.addColorStop(0, css(scaleC(b, 0.7 * k))); gr.addColorStop(0.5, css(scaleC(b, 1.0 * k))); gr.addColorStop(1, css(scaleC(b, 1.22 * k)));
      g.fillStyle = gr;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + tw, y); g.lineTo(x + tw, y + rh - 4);
      g.quadraticCurveTo(x + tw, y + rh, x + tw / 2, y + rh); g.quadraticCurveTo(x, y + rh, x, y + rh - 4); g.closePath(); g.fill();
      g.strokeStyle = 'rgba(32,10,4,0.6)'; g.lineWidth = 1; g.stroke();
      g.fillStyle = 'rgba(255,214,170,0.15)'; g.fillRect(x + 1.5, y + 2, 2, rh - 7);
      if (r() < 0.2) { g.fillStyle = `rgba(86,118,48,${0.1 + r() * 0.16})`; g.beginPath(); g.ellipse(x + r() * tw, y + rh * (0.45 + r() * 0.5), 3 + r() * 4, 2 + r() * 2, 0, 0, TAU); g.fill(); }
    }
  }
  addGrain(g, N, N, 14, 5);
  return { c, ppu: 96 };
};

/* --- gonty drewniane (ciemne dachy wikińskie) --- */
GEN.shingle = (base = '#4a3a2e') => {
  const N = 128, c = newCanvas(N, N), g = c.getContext('2d'), r = rng(33), b = hex(base), rows = 10, rh = N / rows;
  g.fillStyle = css(scaleC(b, 0.35)); g.fillRect(0, 0, N, N);
  for (let row = 0; row < rows; row++) {
    const y = row * rh, tw = 12.8, off = (row % 2) * tw / 2;
    for (let col = -1; col <= N / tw; col++) {
      const x = col * tw + off, k = 0.75 + r() * 0.5;
      const gr = g.createLinearGradient(0, y, 0, y + rh);
      gr.addColorStop(0, css(scaleC(b, 0.7 * k))); gr.addColorStop(1, css(scaleC(b, 1.25 * k)));
      g.fillStyle = gr; g.fillRect(x, y, tw - 0.6, rh - 0.6);
      g.strokeStyle = `rgba(0,0,0,${0.25 + r() * 0.2})`; g.lineWidth = 0.8; g.beginPath(); g.moveTo(x + 3 + r() * 6, y + 1); g.lineTo(x + 3 + r() * 6, y + rh - 1); g.stroke();
      g.fillStyle = 'rgba(20,10,4,0.55)'; g.fillRect(x, y + rh - 1.5, tw - 0.6, 1.5);
    }
  }
  addGrain(g, N, N, 14, 6);
  return { c, ppu: 110 };
};

/* --- kamień ciosowy / łamany --- */
function stoneTex(base, seed, rows, jitter, bevel, mortar) {
  const N = 128, c = newCanvas(N, N), g = c.getContext('2d'), r = rng(seed), b = hex(base), rh = N / rows;
  g.fillStyle = css(scaleC(b, mortar)); g.fillRect(0, 0, N, N);
  for (let row = 0; row < rows; row++) {
    const y = row * rh, ws = []; let sum = 0;
    while (sum < N - 22) { const w = 24 + r() * 26; ws.push(w); sum += w; }
    ws.push(N - sum); // domknięcie okresu
    let x = 0;
    for (const w of ws) {
      const k = 1 - jitter + r() * jitter * 2, tint = mixc(b, r() < 0.5 ? [150, 128, 96] : [120, 130, 140], 0.12 + r() * 0.12);
      wrapDraw(N, x, y, w, rh, (ox, oy) => {
        const gr = g.createLinearGradient(0, y + oy, 0, y + oy + rh);
        gr.addColorStop(0, css(scaleC(tint, 1.18 * k))); gr.addColorStop(1, css(scaleC(tint, 0.86 * k)));
        g.fillStyle = gr; g.fillRect(x + ox + 1, y + oy + 1, w - 2, rh - 2);
        g.fillStyle = `rgba(255,255,255,${bevel})`; g.fillRect(x + ox + 1, y + oy + 1, w - 2, 1.6); g.fillRect(x + ox + 1, y + oy + 1, 1.4, rh - 2);
        g.fillStyle = `rgba(0,0,0,${bevel * 1.5})`; g.fillRect(x + ox + 1, y + oy + rh - 2.6, w - 2, 1.6); g.fillRect(x + ox + w - 2.4, y + oy + 1, 1.4, rh - 2);
        for (let q = 0; q < 5; q++) { g.fillStyle = `rgba(20,20,16,${0.08 + r() * 0.14})`; g.fillRect(x + ox + 3 + r() * (w - 8), y + oy + 3 + r() * (rh - 8), 1 + r() * 2, 1 + r() * 2); }
      });

      const X0 = x * k / res, X1 = (x + 1) * k / res, Y0 = y * k / res, Y1 = (y + 1) * k / res;

/* dach dwuspadowy; o.ridge 'x' (kalenica wzdłuż x, szczyty po bokach ±x) albo 'y'.

    if (gm) sc.face([x1, y1, top], [0, -(y1 - y0), 0], [0, 0, -rise], gm, { shade: LIGHT.east, pal: gpal, clip: [[0.5, 0], [1, 1], [0, 1]], vgrad: [[0, 0], [0.8, 0], [1, 0.3]] });   // szczyt widoczny (+x)
    sc.face([x0 - ovE, ym, top], [L, 0, 0], [0, ySo - ym, zE - top], mat, { shade: LIGHT.roofS, pal, edge: 0.4, roof: true, vgrad: [[0, 0], [0.86, 0], [1, 0.22]] });   // połać południowa (przednia)
    return { ridgeA: [x0 - ovE, ym, top], ridgeB: [x1 + ovE, ym, top], eaveZ: zE, ySo, yNo };

/* ====================== ZUŻYCIE: przybrudzenia, zacieki, pęknięcia, łaty napraw, mech, ziarno ======================

  plank:     { streak: 0.6, grime: 0.7, patch: ['plank', '#bb915c', 'rect'], patchN: 1.0, moss: 0.3, crack: 0.2, nail: 1, tone: 1 },
  thatch:    { streak: 0.3, patch: ['thatch', '#e8c35a', 'blob'], patchN: 0.9, moss: 0.55, dark: 0.8, tone: 1 },
  tiles:     { streak: 0.3, patch: ['tiles', '#c8672f', 'rect'], patchN: 1.2, moss: 0.5, missing: 0.5, tone: 1 },
  shingle:   { streak: 0.3, patch: ['shingle', '#80664a', 'rect'], patchN: 0.9, moss: 0.4, missing: 0.4, tone: 1 },
  slate:     { streak: 0.35, patch: ['slate', '#7c8794', 'rect'], patchN: 0.9, moss: 0.45, missing: 0.35, tone: 1 },
  stone:     { streak: 0.5, grime: 0.9, patch: ['stone', '#bdb9ac', 'rect'], patchN: 0.8, moss: 0.5, crack: 1.0, chip: 0.8, tone: 1 },
  rubble:    { streak: 0.4, grime: 0.9, patch: ['rubble', '#a49f93', 'rect'], patchN: 0.5, moss: 0.7, crack: 0.8, chip: 0.6, tone: 1 },
  sandstone: { streak: 0.45, grime: 0.7, patch: ['sandstone', '#ecd8a6', 'rect'], patchN: 0.8, crack: 0.9, chip: 0.8, salt: 0.6, tone: 1 },
  plaster:   { streak: 0.8, grime: 0.8, patch: ['plaster', '#d8ccae', 'blob'], patchN: 0.6, moss: 0.15, crack: 0.6, peel: 0.7, tone: 1 },

function wearBlob(g, r, cx, cy, rad, n = 9, jit = 0.38) {
  g.beginPath();

  g.strokeStyle = 'rgba(16,10,6,0.62)'; g.lineWidth = 1.1 / px; for (const p of all) draw(p, 0);
}

/* zaplata ze świeżej słomy: wąski prostokąt z postrzępioną dolną krawędzią, kładziony na starą strzechę (cień + jasna krawędź zamiast obrysu) */

  const n = 8, T = [], B = [];
  for (let i = 0; i <= n; i++) { const t = i / n; T.push([x + w * t, y + (r() - 0.5) * h * 0.08]); B.push([x + w * t + (r() - 0.5) * w * 0.05, y + h * (0.93 + r() * 0.15)]); }

  g.strokeStyle = 'rgba(30,18,6,0.5)'; g.beginPath(); B.forEach(([a, b], i) => i ? g.lineTo(a, b + 0.6 / px) : g.moveTo(a, b + 0.6 / px)); g.stroke();

  g.strokeStyle = 'rgba(52,32,12,0.75)'; g.lineWidth = 1.5 / px; g.beginPath(); g.moveTo(x - 1 / px, cy0); g.lineTo(x + w + 1 / px, cy1); g.stroke();

/* kolor łaty: na ciemnych ścianach (smołowane deski, ciemny gont) łata ma być tylko trochę jaśniejsza, a nie jasnobrązowa */
function patchPal(base, def) {
  if (typeof base !== 'string' || !/^#[0-9a-f]{6}$/i.test(base)) return def;
  const c = hex(base), lum = (c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11) / 255; if (lum > 0.38) return def;
  const m = mixc(scaleC(c, 1.35), hex(def), clamp((lum - 0.1) / 0.28, 0, 1) * 0.6);

function wearFace(sc, mat, o, W, H, K, px, seed) {

  const ink = a => `rgba(24,16,9,${a})`, bone = a => `rgba(240,232,210,${a})`, moss = a => `rgba(70,118,40,${a})`;
  const cnt = x => { const n = Math.floor(x); return n + (r() < x - n ? 1 : 0); };

    const x = r() * W, y0 = r() * H * 0.35, len = H * (0.2 + r() * 0.55), w = (0.012 + r() * 0.04) * K, light = P.salt && r() < 0.4;

      if (P.nail) { g.fillStyle = ink(0.8); for (const [nx, ny] of [[x + 2.5 / px, y + 2.5 / px], [x + w - 2.5 / px, y + 2.5 / px], [x + 2.5 / px, y + h - 2.5 / px], [x + w - 2.5 / px, y + h - 2.5 / px]]) { g.beginPath(); g.arc(nx, ny, 0.9 / px, 0, TAU); g.fill(); } }

    g.fillStyle = sc.pat('stone', '#9a8c7a').pat; g.fillRect(x - rad * 2, y - rad * 2, rad * 4, rad * 4);

    wearBlob(g, r, x, y, rad, 10, 0.42); g.strokeStyle = ink(0.6); g.lineWidth = 1.3 / px; g.stroke();

    g.fillStyle = fresh ? 'rgba(255,196,140,0.30)' : 'rgba(36,44,30,0.34)'; g.fillRect(x, y + 2, gu - 2, gu - 3);          // wymieniona (jaśniejsza) albo zmurszała (ciemna) dachówka

      g.save(); g.translate(x, H); g.scale(1, ry / rx); g.translate(-x, -H); g.fillStyle = gr; g.fillRect(x - rx, H - rx, rx * 2, rx * 2); g.restore();

  }

}

/* ziarno całego sprite'a: drobne jasne i ciemne kropki wewnątrz sylwetki (kafel 256×256 px w pamięci podręcznej) */
const GRAIN = {};
function grainTiles(R) {
  if (!GRAIN[R]) {
    const mk = (light) => { const N = 256, c = newCanvas(N, N), g = c.getContext('2d'), r = rng(light ? 91 : 53); for (let i = 0; i < 2400; i++) { const s = (0.7 + r() * 1.5) * R; g.fillStyle = light ? `rgba(255,244,214,${0.03 + r() * 0.06})` : `rgba(20,12,6,${0.05 + r() * 0.12})`; g.fillRect(r() * N, r() * N, s, s * (0.6 + r() * 0.8)); } return c; };
    GRAIN[R] = [mk(false), mk(true)];
  }
  return GRAIN[R];
}
function addSpriteGrain(g, w, h, R, amount = 1) {
  const [dk, lt] = grainTiles(R);
  g.save(); g.globalCompositeOperation = 'source-atop'; g.globalAlpha = Math.min(1, amount);
  g.fillStyle = g.createPattern(dk, 'repeat'); g.fillRect(0, 0, w, h);
  g.fillStyle = g.createPattern(lt, 'repeat'); g.fillRect(0, 0, w, h);
  g.restore();
}

/* ---- 26_build.js ---- */
/* ====================== BUDOWA Z BRYŁ: automatyczna kolejność rysowania, cienie, układ okien ======================
   Zamiast ręcznie ustawiać kolejność wywołań (źródło „ścian przechodzących przez siebie") budynek składa się z węzłów:
   każdy węzeł to bryła (prostopadłościan AABB) + funkcja rysująca. flush() ustala kolejność z relacji „bliżej / dalej od widza"
   (przy rzucie dimetrycznym bryła A jest bliżej, gdy leży dalej w +x, +y albo wyżej), rzuca cienie z sumy brył
   i dopiero potem rysuje. Okna i drzwi układa facade() w równych odstępach — nie nachodzą na siebie i nie wychodzą poza ścianę. */

/* wysokość połaci dwuspadowej w punkcie (x, y) — do osadzania kominów */
const gableZ = (o, x, y) => { const half = o.ridge === 'y' ? (o.x1 - o.x0) / 2 : (o.y1 - o.y0) / 2, d = o.ridge === 'y' ? Math.abs(x - (o.x0 + o.x1) / 2) : Math.abs(y - (o.y0 + o.y1) / 2); return o.z + o.rise * Math.max(0, 1 - d / half); };

class Build {
  constructor(sc) { this.sc = sc; this.nodes = []; }
  /* dodaje węzeł; pts — punkty 3D do cienia (domyślnie narożniki bryły), o.shadow:false — bez cienia, o.nest — dozwolone przenikanie */
  add(kind, x0, y0, z0, x1, y1, z1, draw, o = {}) {
    const n = { kind, x0, y0, z0, x1, y1, z1, draw, tag: o.tag || '', nest: !!o.nest, shadow: o.shadow !== false, pts: o.pts, contact: o.contact, i: this.nodes.length };
    this.nodes.push(n); return n;
  }
  /* prostopadłościan; deco(S, E, V) — dekoracje ścian południowej (+y) i wschodniej (+x): S, E = {O,U,V}, V = {x0,y0,x1,y1,z0,z1} */
  box(x0, y0, z0, x1, y1, z1, m, o = {}, deco) {
    return this.add('box', x0, y0, z0, x1, y1, z1, () => { this.sc.box(x0, y0, z0, x1, y1, z1, m, o); if (deco) deco(wallS(x0, x1, y1, z1, z0), wallE(y0, y1, x1, z1, z0), { x0, y0, x1, y1, z0, z1 }); }, { tag: o.tag, nest: o.nest, shadow: o.shadow, contact: o.contact ?? z0 < 0.14 });
  }
  cyl(cx, cy, z0, z1, r, o = {}, deco) {
    const pts = []; for (let k = 0; k < 8; k++) for (const z of [z0, z1]) pts.push([cx + Math.cos(k * TAU / 8) * r, cy + Math.sin(k * TAU / 8) * r, z]);
    return this.add('cyl', cx - r, cy - r, z0, cx + r, cy + r, z1, () => { this.sc.cyl(cx, cy, z0, z1, r, o); if (deco) deco(); }, { tag: o.tag, nest: o.nest, shadow: o.shadow, contact: o.contact ?? z0 < 0.14, pts });
  }
  /* dach dwuspadowy na prostokącie ścian; deco(R) po narysowaniu; zwraca węzeł z polem .info */
  gable(o, deco) {
    const oe = o.ovE ?? 0.05, ov = o.ov ?? 0.07, ex = o.ridge === 'y' ? ov : oe, ey = o.ridge === 'y' ? oe : ov, z = o.z, top = z + o.rise;

/* ---------- układ elewacji: drzwi + równo rozmieszczone okna ----------

/* ====================== DOM: wspólny szkielet małych budynków ======================
   Prostokątny budynek z dachem dwuspadowym (jedno- albo dwukondygnacyjny, z nawisem piętra). Okna i drzwi układa facade(),
   komin osadza chim() na połaci. Zwraca opis (roof, zTop…), z którego korzystają rekwizyty.
   o: x0,x1,y0,y1 — ściany parteru; h1 — wysokość parteru nad cokołem zp; floors: 1|2, h2, J (nawis piętra);
      low: [mat, pal, kolor ryglówki?]; up: [mat, pal, kolor ryglówki?]; plinth: [mat, pal] | false;
      S, E — elewacje parteru (opcje facade); S2, E2 — piętra; nu — liczba pól ryglówki;
      roof: { mat, pal, rise, ov, ovE, ridge, gableMat, gablePal, gwin }; chim: [x, y, h, w] | null; wear */
/* grubość darniowej połaci: ciemna krawędź pod okapem przedniej (widocznej) połaci */
function sodEdge(sc, roof, R, pal = '#4a3a22', mat = 'dirt', shade = 0.7) {
  const ovE = roof.ovE ?? 0.1;
  if (roof.ridge === 'y') sc.face([R.xEo, roof.y1 + ovE, R.eaveZ], [0, -(roof.y1 - roof.y0 + 2 * ovE), 0], [0, 0, -0.1], mat, { shade, pal, edge: 0.45 });
  else sc.face([roof.x0 - ovE, R.ySo, R.eaveZ], [roof.x1 - roof.x0 + 2 * ovE, 0, 0], [0, 0, -0.1], mat, { shade, pal, edge: 0.45 });
}
function cottage(B, o) {
  const sc = B.sc, zp = o.zp ?? 0.1, { x0, x1, y0, y1 } = o, z1 = zp + o.h1, two = o.floors === 2, J = two ? (o.J ?? 0.1) : 0, zt = two ? z1 + o.h2 : z1, low = o.low, up = o.up || o.low;
  if (o.plinth !== false) { const p = o.plinth || ['stone', null]; B.box(x0 - 0.02, y0 - 0.02, 0, x1 + 0.02, y1 + 0.02, zp, p[0], { ao: 0.4, pal: p[1] }); }
  const timber = (S, E, spec, nuS, nuE) => { if (spec[2]) { halfTimber(sc, S.O, S.U, S.V, { nu: nuS, col: spec[2] }); halfTimber(sc, E.O, E.U, E.V, { nu: nuE, col: spec[2] }); } };
  B.box(x0, y0, zp, x1, y1, z1, low[0], { ao: 0.3, pal: low[1], eave: two ? 0.55 : 0.4, wear: o.wear }, (S, E) => {
    timber(S, E, low, o.nuS ?? Math.max(2, Math.round((x1 - x0) / 0.5)), o.nuE ?? Math.max(2, Math.round((y1 - y0) / 0.5)));
    const rS = o.S ? facade(sc, S, o.S) : null, rE = o.E ? facade(sc, E, o.E) : null; if (o.deco1) o.deco1(S, E, rS, rE, { x0, y0, x1, y1, z0: zp, z1 });
  });
  if (two) B.box(x0 - J, y0 - J, z1, x1 + J, y1 + J, zt, up[0], { ao: 0.15, pal: up[1], eave: 0.3, wear: o.wear }, (S, E) => {
    const nS = o.S2 && o.S2.win ? o.S2.win.n : 2, nE = o.E2 && o.E2.win ? o.E2.win.n : 2;                      // pola ryglówki = liczba okien, okna w środku pól (słup nigdy nie przecina okna)
    timber(S, E, up, o.nuS2 ?? nS, o.nuE2 ?? nE);
    if (o.S2) facade(sc, S, { ...o.S2, marg: 0 }); if (o.E2) facade(sc, E, { ...o.E2, marg: 0 }); if (o.deco2) o.deco2(S, E);
  });
  const r = o.roof, roof = { x0: x0 - J, x1: x1 + J, y0: y0 - J, y1: y1 + J, z: zt, rise: r.rise, ov: r.ov ?? 0.1, ovE: r.ovE ?? 0.1, mat: r.mat, pal: r.pal, gableMat: r.gableMat, gablePal: r.gablePal, ridge: o.ridge || 'x', nest: r.nest };
  B.gable(roof, (R) => {
    if (r.sod) sodEdge(sc, roof, R, r.sodPal, r.sodMat, r.sodShade);
    if (!r.gwin) return;
    const gy = roof.ridge === 'y', G = gy ? { O: [roof.x0, roof.y1, zt + r.rise], U: [roof.x1 - roof.x0, 0, 0], V: [0, 0, -r.rise] } : { O: [roof.x1, roof.y1, zt + r.rise], U: [0, -(roof.y1 - roof.y0), 0], V: [0, 0, -r.rise] };
    const lu = Math.hypot(...G.U), w = r.gwin.w ?? 0.16; windowAt(sc, G.O, G.U, G.V, lu / 2 - w / 2, r.rise * 0.4, w, r.gwin.h ?? 0.22, { frame: r.gwin.frame || '#3b2616', shutters: r.gwin.shut });
  });
  if (o.chim) { const [cx, cy, ch, cw, cm, cp] = o.chim; B.chim(roof, cx, cy, ch, cw, cm, cp); }
  return { roof, zp, z1, zt, J, x0, x1, y0, y1 };
}

/* ====================== KATALOG BUDYNKÓW: id z gry → sprite, obrys, nazwa ======================
   Sprite budynku `id` nacji `n` nazywa się `${n}_${id}` (np. franks_mill). Obrys (fw×fh w polach) pochodzi z wypieczonego sprite'a.
   Lista id odpowiada Data.BUILDINGS z Nova_Roma.html: 12 budynków wspólnych + budynki specyficzne dla nacji. */
const COMMON_IDS = ['keep', 'hut', 'woodcutter', 'forester', 'sawmill', 'hunter', 'dairy', 'orchard', 'watercarrier', 'market', 'store', 'temple'];
const NATIONS = {
  franks: COMMON_IDS.concat(['quarry', 'farm', 'mill', 'bakery', 'ironmine', 'coalmine', 'smelter', 'toolforge', 'armory', 'vineyard', 'winery', 'barracks']),
  saracens: COMMON_IDS.concat(['claypit', 'dategrove', 'incensewood', 'incense', 'cotton', 'weaver', 'pottery', 'qanat', 'bathhouse', 'caravanserai', 'guardpost']),
  vikings: COMMON_IDS.concat(['fisherhut', 'peatmine', 'charburner', 'mead', 'dock', 'smelter', 'toolforge', 'armory', 'ship']),
  slavs: COMMON_IDS.concat(['gatherer', 'field', 'kasha', 'bartnik', 'waxery', 'trapper', 'tannery', 'sauna'])
};
const NATION_PL = { franks: 'FRANKOWIE', saracens: 'SARACENI', vikings: 'WIKINGOWIE', slavs: 'SŁOWIANIE' };
const NAMES = {
  keep: 'Dwór', hut: 'Chata', woodcutter: 'Chata drwala', forester: 'Leśniczówka', sawmill: 'Tartak', hunter: 'Chata myśliwego', dairy: 'Mleczarnia', orchard: 'Sad', watercarrier: 'Chata nosiwody', market: 'Targ', store: 'Skład', temple: 'Świątynia',
  quarry: 'Kamieniołom', farm: 'Farma', mill: 'Młyn', bakery: 'Piekarnia', ironmine: 'Kopalnia żelaza', coalmine: 'Kopalnia węgla', smelter: 'Huta', toolforge: 'Kuźnia narzędzi', armory: 'Zbrojownia', vineyard: 'Winnica', winery: 'Winiarz', barracks: 'Koszary',
  claypit: 'Glinianka', dategrove: 'Gaj daktylowy', incensewood: 'Las kadzidlany', incense: 'Wytwórnia kadzidła', cotton: 'Plantacja bawełny', weaver: 'Tkalnia', pottery: 'Garncarnia', qanat: 'Qanat', bathhouse: 'Łaźnia', caravanserai: 'Karawanseraj', guardpost: 'Strażnica',
  fisherhut: 'Chata rybaka', peatmine: 'Kopalnia darniowa', charburner: 'Wypalarka węgla', mead: 'Miodosytnia', dock: 'Przystań', ship: 'Okręt',
  gatherer: 'Chata zbieracza', field: 'Pole stałe', kasha: 'Kaszarnia', bartnik: 'Barć', waxery: 'Woskarnia', trapper: 'Chata łowcy futer', tannery: 'Garbarnia', sauna: 'Bania'
};
const TEMPLE_PL = { franks: 'Kościół', saracens: 'Meczet', vikings: 'Kościół', slavs: 'Kapliczka' };
const spriteName = (nation, id) => `${nation}_${id}`;
const nameOfBuilding = (nation, id) => id === 'temple' ? TEMPLE_PL[nation] : NAMES[id];

/* eksport katalogu do integracji z grą: id → sprite, obrys, wejście, kotwice dymu, rozmiar i kotwica sprite'a.
   Współrzędne (wejście, drzwi, dym): pola względem środka obrysu (x w prawo-dół, y w lewo-dół, z w górę); sprite: w px logicznych, (ax, ay) = środek obrysu na ziemi.
   `wejscie` = punkt na krawędzi obrysu, do którego dochodzą pracownicy (strona S: y = fh/2, strona E: x = fw/2); `drzwi` = faktyczne położenie pierwszych drzwi w bryle (null, gdy budynek ma wejście bez drzwi: wiata, sad, targ…).
   Środek obrysu budynku z północnym rogiem (i, j) leży w polu (i + fw/2, j + fh/2); na ekranie (przy zoomie 1): ((x − y)·AX, (x + y)·AY). */
function catalogJSON() {
  const out = { wersja: 'v4-katalog', pole: { AX, AY, VH }, nacje: {} }, r2 = v => +v.toFixed(2), cl = (v, m) => Math.max(-m, Math.min(m, v));
  for (const n of Object.keys(NATIONS)) {
    out.nacje[n] = { nazwa: NATION_PL[n], budynki: {} };
    for (const id of NATIONS[n]) {
      const s = SPR[spriteName(n, id)]; if (!s) continue;
      const d = (s.doors && s.doors[0]) || null, fw = s.fw, fh = s.fh;
      const wejscie = d && d.side === 'E' ? { strona: 'E', x: r2(fw / 2), y: r2(cl(d.y, fh / 2 - 0.3)) } : { strona: 'S', x: r2(cl(d ? d.x : 0, fw / 2 - 0.3)), y: r2(fh / 2) };
      out.nacje[n].budynki[id] = { sprite: spriteName(n, id), nazwa: nameOfBuilding(n, id), obrys: [fw, fh], wejscie, drzwi: d ? { strona: d.side, x: d.x, y: d.y } : null, dym: s.smoke || [], sprite_px: { w: Math.round(s.w), h: Math.round(s.h), ax: Math.round(s.ax), ay: Math.round(s.ay) } };
    }
  }
  return out;
}

/* ---- 30_buildings.js ---- */
/* ====================== ZESTAW ELEMENTÓW ARCHITEKTONICZNYCH ====================== */
const BAKED = {};

/* scena dla budynku o obrysie fw×fh pól i wysokości hgt (w polach); początek układu = środek obrysu na ziemi */
function sceneFor(fw, fh, hgt, o = {}) {
  const half = (fw + fh) / 2, W = (fw + fh) * AX + 150 + hgt * 60, top = hgt * VH + half * AY + 70, bot = half * AY + 80 + hgt * 16;
  return new Scene(W, top + bot, half * AX + 75, top, Object.assign({ fw, fh }, o));
}
/* układ (O,U,V) ściany południowej (+y) i wschodniej (+x) prostopadłościanu — do drzwi, okien, zdobień */
const wallS = (x0, x1, y1, zt, zb) => ({ O: [x0, y1, zt], U: [x1 - x0, 0, 0], V: [0, 0, -(zt - zb)] });
const wallE = (y0, y1, x1, zt, zb) => ({ O: [x1, y1, zt], U: [0, -(y1 - y0), 0], V: [0, 0, -(zt - zb)] });

/* drzwi z (opcjonalnym) łukiem i okuciami; (u0,w) — położenie na ścianie, h — wysokość, vb — v podstawy drzwi */
function door(sc, O, U, V, u0, w, h, o = {}) {
  const lu = Math.hypot(...U), lv = Math.hypot(...V), vb = o.vb ?? lv;
  if (LINT) sc.regRect(O, U, V, 'drzwi', u0 - 0.04, u0 + w + 0.04, vb - h - (o.arch ? w / 2 : 0) - 0.06, vb);
  sc.local(O, U, V, (g) => {
    g.fillStyle = o.frame || '#2b1c10';
    g.beginPath(); g.moveTo(u0 - 0.025, vb); g.lineTo(u0 - 0.025, vb - h); if (o.arch) g.arc(u0 + w / 2, vb - h, w / 2 + 0.025, Math.PI, 0); else g.lineTo(u0 + w + 0.025, vb - h); g.lineTo(u0 + w + 0.025, vb); g.closePath(); g.fill();
    if (o.lintel) { g.fillStyle = o.lintel; g.fillRect(u0 - 0.06, vb - h - (o.arch ? w / 2 : 0) - 0.06, w + 0.12, 0.05); }
  });
  const dir = [U[0] / lu, U[1] / lu, U[2] / lu], up = [-V[0] / lv, -V[1] / lv, -V[2] / lv];
  if (sc.doors) sc.doors.push({ side: Math.abs(U[0]) > Math.abs(U[1]) ? 'S' : 'E', x: +(O[0] + dir[0] * (u0 + w / 2)).toFixed(3), y: +(O[1] + dir[1] * (u0 + w / 2)).toFixed(3), z: +(O[2] - vb).toFixed(3) });   // wejście do katalogu
  const base = [O[0] + dir[0] * u0 + V[0] / lv * vb, O[1] + dir[1] * u0 + V[1] / lv * vb, O[2] + dir[2] * u0 + V[2] / lv * vb];
  const topLeft = [base[0] + up[0] * h, base[1] + up[1] * h, base[2] + up[2] * h];
  sc.face(topLeft, [dir[0] * w, dir[1] * w, dir[2] * w], [-up[0] * h, -up[1] * h, -up[2] * h], 'plank', { shade: 1, pal: o.pal || '#6a4a2c', edge: 0.5, wear: 0.4, vgrad: [[0, 0.25], [0.5, 0], [1, 0.2]], clip: o.arch ? [[0, 1], [0, 0.18], [0.08, 0.1], [0.5, 0.0], [0.92, 0.1], [1, 0.18], [1, 1]] : undefined });
  sc.local(O, U, V, (g) => { // okucia i klamka
    g.strokeStyle = 'rgba(20,16,12,0.75)'; g.lineWidth = 0.016;
    for (const f of [0.22, 0.7]) { g.beginPath(); g.moveTo(u0, vb - h * (1 - f)); g.lineTo(u0 + w, vb - h * (1 - f)); g.stroke(); }
    g.fillStyle = '#c9a85a'; g.beginPath(); g.arc(u0 + w * 0.78, vb - h * 0.46, 0.016, 0, TAU); g.fill();
  });
}

/* okno z oświetlonym wnętrzem, ramą i (opcjonalnie) okiennicami */
function windowAt(sc, O, U, V, u0, v0, w, h, o = {}) {
  if (LINT) { const sw = o.shutters ? w * 0.42 + 0.012 : 0.014; sc.regRect(O, U, V, 'okno', u0 - sw, u0 + w + sw, v0 - 0.014, v0 + h + (o.sill ? 0.05 : 0.026)); }
  sc.local(O, U, V, (g) => {
    if (o.shutters) { g.fillStyle = o.shutters; const sw = w * 0.42; g.fillRect(u0 - sw - 0.012, v0 - 0.004, sw, h + 0.008); g.fillRect(u0 + w + 0.012, v0 - 0.004, sw, h + 0.008);
      g.strokeStyle = 'rgba(0,0,0,0.4)'; g.lineWidth = 0.008; g.strokeRect(u0 - sw - 0.012, v0 - 0.004, sw, h + 0.008); g.strokeRect(u0 + w + 0.012, v0 - 0.004, sw, h + 0.008);
      g.strokeStyle = 'rgba(0,0,0,0.3)'; g.lineWidth = 0.005; for (const x of [u0 - sw * 0.5 - 0.012, u0 + w + sw * 0.5 + 0.012]) for (let i = 1; i < 5; i++) { g.beginPath(); g.moveTo(x - sw * 0.4, v0 + h * i / 5); g.lineTo(x + sw * 0.4, v0 + h * i / 5); g.stroke(); } }
    g.fillStyle = o.frame || '#3a2818'; g.fillRect(u0 - 0.014, v0 - 0.014, w + 0.028, h + 0.028);
    const gr = g.createLinearGradient(0, v0, 0, v0 + h), glow = !!(o.lit || o.glow);                                // za dnia: ciemna szyba z odbiciem nieba; ciepłe światło tylko na życzenie (o.glow / o.lit)
    if (glow) { gr.addColorStop(0, o.lit || '#ffe9a0'); gr.addColorStop(1, '#d99a40'); } else { gr.addColorStop(0, '#9bb0c4'); gr.addColorStop(0.5, '#51657a'); gr.addColorStop(1, '#2c3947'); }
    g.fillStyle = o.dark ? '#1c1710' : gr; g.fillRect(u0, v0, w, h);
    if (!glow && !o.dark) { g.strokeStyle = 'rgba(235,245,255,0.28)'; g.lineWidth = 0.014; g.beginPath(); g.moveTo(u0 + w * 0.12, v0 + h * 0.46); g.lineTo(u0 + w * 0.46, v0 + h * 0.08); g.stroke(); }
    g.strokeStyle = o.frame || '#3a2818'; g.lineWidth = 0.012; g.beginPath(); g.moveTo(u0 + w / 2, v0); g.lineTo(u0 + w / 2, v0 + h); g.moveTo(u0, v0 + h / 2); g.lineTo(u0 + w, v0 + h / 2); g.stroke();
    g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(u0 - 0.014, v0 + h + 0.014, w + 0.028, 0.012);   // parapet
    if (o.sill) { g.fillStyle = o.sill; g.fillRect(u0 - 0.03, v0 + h + 0.014, w + 0.06, 0.03); }
  });
}

/* okno łukowe (architektura wschodnia): ciemne wnętrze albo światło lampy */
function archWin(sc, O, U, V, u0, v0, w, h, o = {}) {
  if (LINT) sc.regRect(O, U, V, 'okno', u0 - 0.014, u0 + w + 0.014, v0 - 0.014, v0 + h + 0.026);
  sc.local(O, U, V, (g) => {
    const r = w / 2, e = 0.014;
    g.fillStyle = o.frame || '#8a5a2a'; g.beginPath(); g.moveTo(u0 - e, v0 + h + e); g.lineTo(u0 - e, v0 + r); g.arc(u0 + r, v0 + r, r + e, Math.PI, 0); g.lineTo(u0 + w + e, v0 + h + e); g.closePath(); g.fill();
    const gr = g.createLinearGradient(0, v0, 0, v0 + h); gr.addColorStop(0, o.lit || '#241a10'); gr.addColorStop(1, o.lit2 || '#120d08');
    g.fillStyle = gr; g.beginPath(); g.moveTo(u0, v0 + h); g.lineTo(u0, v0 + r); g.arc(u0 + r, v0 + r, r, Math.PI, 0); g.lineTo(u0 + w, v0 + h); g.closePath(); g.fill();
    if (o.louver) { g.strokeStyle = 'rgba(150,118,76,0.85)'; g.lineWidth = 0.014; for (let j = 0; j < 6; j++) { const yy = v0 + r * 0.9 + j * (h - r * 0.9) / 6 + 0.03; g.beginPath(); g.moveTo(u0 + 0.01, yy + 0.03); g.lineTo(u0 + w - 0.01, yy); g.stroke(); } }
    if (o.grille) { g.strokeStyle = 'rgba(210,170,90,0.55)'; g.lineWidth = 0.008; for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(u0 + w * i / 4, v0 + r * 0.6); g.lineTo(u0 + w * i / 4, v0 + h); g.stroke(); } }
    g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(u0 - e, v0 + h + e, w + 2 * e, 0.012);
  });
}

/* ostrołukowe okno witrażowe (gotyk): kamienna rama, ołowiane szprosy, kolorowe szybki */
function glassWin(sc, O, U, V, u0, v0, w, h, o = {}) {
  if (LINT) sc.regRect(O, U, V, 'okno', u0 - 0.02, u0 + w + 0.02, v0 - w * 0.275 - 0.02, v0 + h + 0.02);
  sc.local(O, U, V, (g) => {
    const r = w / 2, e = 0.02, x1 = u0 + w, xm = u0 + r, ys = v0 + r, yt = v0 - r * 0.55, yb = v0 + h;
    const path = (dx) => { g.beginPath(); g.moveTo(u0 - dx, yb + dx); g.lineTo(u0 - dx, ys); g.quadraticCurveTo(u0 - dx, yt + r * 0.6 - dx, xm, yt - dx); g.quadraticCurveTo(x1 + dx, yt + r * 0.6 - dx, x1 + dx, ys); g.lineTo(x1 + dx, yb + dx); g.closePath(); };
    g.fillStyle = o.frame || '#8d897d'; path(e); g.fill();
    g.save(); path(0); g.clip();
    const cols = o.glass || ['#3c62a8', '#a8342c', '#d8a830', '#2f7a58', '#4a7ac0'], rr = rng(Math.round((u0 + v0) * 977));
    const nx = 3, ny = 6; for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) { const c = cols[(rr() * cols.length) | 0]; g.fillStyle = c; g.fillRect(u0 + i * w / nx, yt + j * (yb - yt) / ny, w / nx + 0.002, (yb - yt) / ny + 0.002); }
    const gl = g.createLinearGradient(0, yt, 0, yb); gl.addColorStop(0, 'rgba(255,255,255,0.28)'); gl.addColorStop(1, 'rgba(0,0,20,0.35)'); g.fillStyle = gl; g.fillRect(u0, yt, w, yb - yt);
    g.strokeStyle = 'rgba(14,14,20,0.8)'; g.lineWidth = 0.008; for (let i = 1; i < nx; i++) { g.beginPath(); g.moveTo(u0 + i * w / nx, yt); g.lineTo(u0 + i * w / nx, yb); g.stroke(); } for (let j = 1; j < ny; j++) { g.beginPath(); g.moveTo(u0, yt + j * (yb - yt) / ny); g.lineTo(x1, yt + j * (yb - yt) / ny); g.stroke(); }
    g.restore(); g.strokeStyle = 'rgba(20,16,12,0.6)'; g.lineWidth = 0.008; path(0); g.stroke();
  });
}

/* ryglówka: słupy, rygle i zastrzały na ścianie */
function halfTimber(sc, O, U, V, o = {}) {
  const nu = o.nu ?? 4, nv = o.nv ?? 1, bw = o.bw ?? 0.03, col = o.col || '#3b2616';
  sc.local(O, U, V, (g, lu, lv) => {
    g.fillStyle = col;
    g.fillRect(0, 0, lu, bw); g.fillRect(0, lv - bw, lu, bw);
    for (let j = 1; j < nv; j++) g.fillRect(0, lv * j / nv - bw / 2, lu, bw * 0.8);
    for (let i = 0; i <= nu; i++) g.fillRect(i * (lu - bw) / nu, 0, bw, lv);
    g.strokeStyle = col; g.lineWidth = bw * 0.9;
    for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) { const a = i * lu / nu, b = (i + 1) * lu / nu, y0 = lv * j / nv, y1 = lv * (j + 1) / nv; g.beginPath(); if ((i + j) % 2) { g.moveTo(a, y1 - bw); g.lineTo(b, y0 + bw); } else { g.moveTo(a, y0 + bw); g.lineTo(b, y1 - bw); } g.stroke(); }
    g.fillStyle = 'rgba(255,235,200,0.14)'; for (let i = 0; i <= nu; i++) g.fillRect(i * (lu - bw) / nu, 0, bw * 0.28, lv);   // światło na krawędzi słupów
  });
}

/* sadza: ciemny nalot na połaci przy kominie / nad paleniskiem */
function soot(sc, x, y, z, r = 0.12, a = 0.4) {
  const g = sc.g, [px, py] = sc.P(x, y, z), rr = r * AX * sc.F, gr = g.createRadialGradient(px, py, 0, px, py, rr);
  gr.addColorStop(0, `rgba(10,8,6,${a})`); gr.addColorStop(1, 'rgba(10,8,6,0)');
  g.save(); g.translate(px, py); g.scale(1, 0.62); g.translate(-px, -py); g.fillStyle = gr; g.fillRect(px - rr, py - rr, rr * 2, rr * 2); g.restore();
}
/* komin z kapturem i ciemnym wylotem */
function chimney(sc, cx, cy, zb, zt, w = 0.24, mat = 'stone', pal) {
  sc.box(cx - w / 2, cy - w / 2, zb, cx + w / 2, cy + w / 2, zt, mat, { ao: 0.15, pal, tag: 'komin' });
  sc.box(cx - w / 2 - 0.035, cy - w / 2 - 0.035, zt, cx + w / 2 + 0.035, cy + w / 2 + 0.035, zt + 0.07, mat, { ao: 0, pal, wear: 0.3, tag: 'komin' });
  const g = sc.g, [px, py] = sc.P(cx, cy, zt + 0.07), rx = (w / 2 - 0.02) * AX * sc.F * 1.4142;
  g.fillStyle = '#17120e'; g.beginPath(); g.ellipse(px, py, rx * 0.8, rx * 0.4, 0, 0, TAU); g.fill();
}
/* schody przed drzwiami (n stopni, od najwyższego); xa..xb — szerokość */
function stairs(sc, xa, xb, y, n, h, mat = 'stone', d = 0.17, pal) {
  for (let i = 0; i < n; i++) sc.box(xa, y + i * d, 0, xb, y + (i + 1) * d, h * (n - i) / n, mat, { ao: 0.2, pal, wear: 0.5 });
}
/* skrzynka z kwiatami pod oknem (na ścianie) */
function flowerBox(sc, O, U, V, u0, v, w, cols = ['#d8433a', '#f0d84a', '#e8e0d0']) {
  if (LINT) sc.regRect(O, U, V, 'kwiaty', u0 - 0.02, u0 + w + 0.02, v - 0.05, v + 0.07);
  sc.local(O, U, V, (g) => {
    g.fillStyle = '#6a4428'; g.fillRect(u0 - 0.02, v, w + 0.04, 0.07); g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 0.006; g.strokeRect(u0 - 0.02, v, w + 0.04, 0.07);
    const r = rng(Math.round(u0 * 311 + v * 97)); for (let i = 0; i < 9; i++) { const x = u0 + (i + 0.5) * w / 9; g.fillStyle = '#3f7a2c'; g.beginPath(); g.arc(x, v - 0.005, 0.022, 0, TAU); g.fill(); g.fillStyle = cols[(r() * cols.length) | 0]; g.beginPath(); g.arc(x + (r() - 0.5) * 0.01, v - 0.03, 0.016, 0, TAU); g.fill(); }
  });
}
/* latarnia przy drzwiach: ciepłe światło */
function lantern(sc, x, y, z) {
  const g = sc.g, f = sc.F, [px, py] = sc.P(x, y, z), gr = g.createRadialGradient(px, py, 0, px, py, 16 * f);
  gr.addColorStop(0, 'rgba(255,214,120,0.55)'); gr.addColorStop(1, 'rgba(255,190,80,0)'); g.fillStyle = gr; g.beginPath(); g.arc(px, py, 16 * f, 0, TAU); g.fill();
  g.strokeStyle = '#2a2018'; g.lineWidth = 1.6 * f; g.beginPath(); g.moveTo(px, py - 7 * f); g.lineTo(px, py - 3 * f); g.stroke();
  g.fillStyle = '#ffe08a'; g.strokeStyle = '#2a2018'; g.lineWidth = 1.2 * f; g.beginPath(); g.rect(px - 2.6 * f, py - 3 * f, 5.2 * f, 7 * f); g.fill(); g.stroke();
}
/* wiszący szyld nad wejściem: żelazny wysięgnik i deska z godłem */
function signBoard(sc, x, y, z, emblem = 'loaf') {
  const g = sc.g, f = sc.F, [px, py] = sc.P(x, y, z);
  g.strokeStyle = '#2a2018'; g.lineWidth = 2 * f; g.beginPath(); g.moveTo(px - 14 * f, py); g.lineTo(px + 8 * f, py); g.moveTo(px - 8 * f, py); g.lineTo(px - 2 * f, py - 6 * f); g.stroke();
  g.fillStyle = '#7a5530'; g.strokeStyle = '#2a2018'; g.lineWidth = 1.3 * f; g.beginPath(); g.rect(px - 2 * f, py + 3 * f, 13 * f, 14 * f); g.fill(); g.stroke();

  g.restore(); path(); g.strokeStyle = 'rgba(10,36,44,0.75)'; g.lineWidth = 1.3 * f; g.stroke();

/* ====================== PRZYRODA: teren, drzewa, skały, mieszkańcy ====================== */

/* trawa kafelkowalna rysowana w płaszczyźnie świata (jeden wzór dla całej mapy — brak szwów między kaflami) */
GEN.grass = (pal = 'green') => {
  const T = TEXRES, B = 256, N = B * T, c = newCanvas(N, N), g = c.getContext('2d'), im = g.createImageData(N, N), d = im.data;
  const sets = {
    green: { stops: [[0, '#2c5520'], [0.35, '#44782a'], [0.65, '#5c9533'], [1, '#8ab648']], blades: ['#22481a', '#336322', '#4a8a2c', '#6aa83c', '#9bc653', '#c3d86a'], dirt: '#7a6232' },
    sand: { stops: [[0, '#b99c62'], [0.4, '#cdb27a'], [0.7, '#dcc48e'], [1, '#e8d6a4']], blades: ['#9c8248', '#b89c60', '#cfb77c', '#e4d3a0', '#a3a06a'], dirt: '#a8884e' },
    tundra: { stops: [[0, '#3a5a34'], [0.4, '#52743e'], [0.7, '#6a8a48'], [1, '#8da358']], blades: ['#2c4a2a', '#406038', '#587a42', '#7a9850', '#a3b46a'], dirt: '#6a5a3a' }
  }[pal];
  const st = sets.stops.map(([p, h]) => [p, hex(h)]);
  const n1 = fbm(N, 3, 4, 7), n2 = fbm(N, 10, 3, 19), n3 = periodicNoise(N, 40, 31);
  const dirt = hex(sets.dirt), lut = lutRamp(st);
  for (let i = 0; i < N * N; i++) {
    const t = n1[i] * 0.55 + n2[i] * 0.3 + n3[i] * 0.15;
    let col = lut[clamp(((t - 0.25) * 1.7 * 255) | 0, 0, 255)];
    const dm = clamp((n1[i] - 0.64) * 6, 0, 0.5) * clamp((n2[i] - 0.3) * 3, 0, 1);     // plamy gołej ziemi
    if (dm > 0) col = mixc(col, dirt, dm);
    d[i * 4] = col[0]; d[i * 4 + 1] = col[1]; d[i * 4 + 2] = col[2]; d[i * 4 + 3] = 255;
  }
  g.putImageData(im, 0, 0); g.scale(T, T);
  const r = rng(5);
  for (let i = 0; i < 5200; i++) { // źdźbła
    const x = r() * B, y = r() * B, a = r() * TAU, l = 2 + r() * 5;
    g.strokeStyle = sets.blades[(r() * sets.blades.length) | 0]; g.globalAlpha = 0.22 + r() * 0.4; g.lineWidth = 0.8 + r() * 0.8;
    wrapDraw(B, x - 8, y - 8, 16, 16, (ox, oy) => { g.beginPath(); g.moveTo(x + ox, y + oy); g.lineTo(x + ox + Math.cos(a) * l, y + oy + Math.sin(a) * l); g.stroke(); });
  }
  g.globalAlpha = 1;
  if (pal !== 'sand') for (let i = 0; i < 36; i++) { // kwiatki
    const x = r() * B, y = r() * B, col = ['#f4efe0', '#f0d84a', '#e87a9a', '#c9a0e8'][(r() * 4) | 0];
    g.fillStyle = col; g.globalAlpha = 0.75; g.beginPath(); g.arc(x, y, 1.1 + r() * 0.9, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  return { c, ppu: 64 * T };
};

  const N = 256, c = newCanvas(N, N), g = c.getContext('2d'), im = g.createImageData(N, N), d = im.data, n1 = fbm(N, 2, 3, 91), n2 = fbm(N, 5, 3, 97);

/* ====================== WIKINGOWIE: ciemne drewno, darń na dachach, tarcze, smocze łby ======================

   Okna są małe i ciemne (1 na ścianę), tarcze nie nachodzą na drzwi i okna (omijają je według wyniku facade()). */
const VK = { wall: '#52402c', wallL: '#64503a', tar: '#3b2a1a', log: '#7a5632', logD: '#5a3e22', plank: '#7a5a36', dark: '#2a1c10', door: '#3a2816', doorF: '#1f1308', red: '#a8352b', blue: '#2f5aa8', gold: '#d8a830', cream: '#e8d8a0', shingle: '#4a3a2e', shingleD: '#3a2e24', bog: '#7a6540' };

/* smocze zwieńczenie szczytu: skrzyżowane belki z rzeźbionymi łbami. Zasada: łby ZAWSZE patrzą od siebie, na zewnątrz budynku —
   lewy łeb w lewo, prawy w prawo, na przednim i na tylnym końcu kalenicy (d = ±1 odwraca tylko położenie ramion, więc dziób liczymy z faktycznej strony: side = s2·d). */

  const g = sc.g, f = sc.F, [px, py] = sc.P(x, y, z);
  g.lineCap = 'round';
  for (const s2 of [1, -1]) {
    const side = s2 * d, hx = px + 14 * side * f, hy = py - 30 * f, X = v => hx + v * side * f;                              // X(v): przesunięcie wzdłuż kierunku, w którym patrzy łeb (v > 0 — przód)
    g.strokeStyle = '#1c1008'; g.lineWidth = 7 * f; g.beginPath(); g.moveTo(px - 3 * side * f, py + 8 * f); g.lineTo(hx, hy); g.stroke();
    g.strokeStyle = '#4a301a'; g.lineWidth = 4.6 * f; g.stroke();
    g.fillStyle = '#4a301a'; g.strokeStyle = '#1c1008'; g.lineWidth = 1.3 * f; g.beginPath(); g.moveTo(X(-2), hy + 4 * f); g.quadraticCurveTo(X(-5), hy - 6 * f, X(1), hy - 8 * f); g.lineTo(X(9), hy - 5 * f); g.lineTo(X(6), hy - 2 * f); g.lineTo(X(9), hy + 1 * f); g.lineTo(X(3), hy + 1 * f); g.quadraticCurveTo(X(2), hy + 5 * f, hx, hy + 5 * f); g.closePath(); g.fill(); g.stroke();

/* przedziały ściany zajęte przez drzwi i okna (wynik facade()) */
const avoidOf = (res, m = 0.07) => res ? [...res.win.map(w => [w.u0 - m, w.u0 + w.w + m]), ...(res.door ? [[res.door.u0 - m - 0.03, res.door.u0 + res.door.w + m + 0.03]] : [])] : [];

function vkShields(sc, W, o = {}) {
  const lu = Math.hypot(...W.U), r = o.r ?? 0.065, a = o.a ?? 0.2, b = o.b ?? lu - 0.2, n = o.n ?? 7, avoid = o.avoid || [], cols = o.cols || VK_SH;

/* nieregularna plama wody (wielokąt 18-kątny z szumem promienia), do dekali pod pomostem i okrętem */
function waterBlob(cx, cy, rx, ry, seed = 1) {
  const r = rng(seed), pts = []; for (let i = 0; i < 18; i++) { const a = i * TAU / 18, k = 0.9 + r() * 0.12; pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]); } return [pts];
}
/* okręt wikingów rysowany w płaszczyźnie sceny: kadłub klepkowy, tarcze na burcie, żagiel w pasy, smocza głowa na dziobie.
   (ox, oy) — środek na ziemi, k — skala (1 = kadłub 1.84 pola) wzdłuż osi x; o.sail / o.shields / o.heads / o.plain — wersje uproszczone (łódź rybacka) */

  const xs = Array.from({ length: N + 1 }, (_, i) => -H + 2 * H * i / N), rev = xs.slice().reverse();
  const poly = pts => { g.beginPath(); pts.forEach(([a, b], i) => i ? g.lineTo(a, b) : g.moveTo(a, b)); g.closePath(); };
  softFill(sc.gu, gg => { xs.forEach((x, i) => { const p = P(x, hw(x) + 0.06, 0); i ? gg.lineTo(p[0], p[1]) : gg.moveTo(p[0], p[1]); }); rev.forEach(x => { const p = P(x, -hw(x) - 0.06, 0); gg.lineTo(p[0], p[1]); }); gg.closePath(); }, 'rgba(238,252,255,0.6)', 9 * sf);
  softFill(sc.gu, gg => { xs.forEach((x, i) => { const p = P(x + 0.22, hw(x) + 0.1, 0); i ? gg.lineTo(p[0], p[1]) : gg.moveTo(p[0], p[1]); }); rev.forEach(x => { const p = P(x + 0.22, -hw(x) + 0.1, 0); gg.lineTo(p[0], p[1]); }); gg.closePath(); }, 'rgba(6,34,52,0.42)', 10 * sf);
  poly([...xs.map(x => P(x, -hw(x), zt(x))), ...rev.map(x => P(x, -hw(x) * 0.78, zt(x) - 0.13))]); g.fillStyle = '#4a3220'; g.fill(); g.strokeStyle = 'rgba(20,10,4,0.7)'; g.stroke();
  poly([...xs.map(x => P(x, -hw(x) * 0.8, zt(x) - 0.1)), ...rev.map(x => P(x, hw(x) * 0.8, zt(x) - 0.1))]);
  const dg = g.createLinearGradient(...P(0, -0.2, 0.1), ...P(0, 0.2, 0.1)); dg.addColorStop(0, '#7a5a34'); dg.addColorStop(1, '#a98450'); g.fillStyle = dg; g.fill(); g.stroke();
  g.strokeStyle = 'rgba(40,24,10,0.55)'; g.lineWidth = 0.75 * sf; for (let i = -7; i <= 7; i++) { const x = i * 0.11; g.beginPath(); g.moveTo(...P(x, -hw(x) * 0.78, zt(x) - 0.1)); g.lineTo(...P(x, hw(x) * 0.78, zt(x) - 0.1)); g.stroke(); }
  if (o.sail !== false) {
  g.lineCap = 'round'; g.strokeStyle = '#4a301a'; g.lineWidth = 4 * f; g.beginPath(); g.moveTo(...P(0, 0, zt(0) - 0.1)); g.lineTo(...P(0, 0, 1.0)); g.stroke();
  const sails = 8, sy0 = 0.93, sy1 = 0.36, swd = 0.34;

    poly([P(bulge(a / swd), a, sy0), P(bulge(b / swd), b, sy0), P(bulge(b / swd) * 0.7, b, sy1), P(bulge(a / swd) * 0.7, a, sy1)]);
    g.fillStyle = i % 2 ? '#efe4c6' : '#b8352b'; g.fill(); g.strokeStyle = 'rgba(40,20,10,0.4)'; g.lineWidth = 0.6 * sf; g.stroke();

  g.strokeStyle = '#3a2614'; g.lineWidth = 3.4 * f; g.beginPath(); g.moveTo(...P(0, -swd - 0.03, sy0 + 0.01)); g.lineTo(...P(0, swd + 0.03, sy0 + 0.01)); g.stroke();

    poly([...xs.map(x => P(x, hw(x) * (1 - a * 0.28), lerp(zt(x), zb(x), a))), ...rev.map(x => P(x, hw(x) * (1 - b * 0.28), lerp(zt(x), zb(x), b)))]);
    const gr = g.createLinearGradient(...P(0, 0, zt(0)), ...P(0, 0, zb(0)));
    const base = k === 0 && !o.plain ? [184, 53, 43] : (k % 2 ? [112, 78, 46] : [138, 98, 56]); gr.addColorStop(0, css(scaleC(base, 1.2))); gr.addColorStop(1, css(scaleC(base, 0.72)));

    g.restore();
  };

}

    const z = Math.min(Z, (W * 0.98) / Math.max(...rows.map(r => r.w)), (H - rows.length * lab - 12 * dpr) / rows.reduce((a, r) => a + r.up + r.down, 0));
    const text = (t, x, y, px, bold, al = 'center') => { ctx.textAlign = al; ctx.font = `${bold ? 'bold ' : ''}${Math.round(px * dpr)}px Georgia, serif`; ctx.lineJoin = 'round'; ctx.lineWidth = 3.5 * dpr; ctx.strokeStyle = 'rgba(14,20,8,0.92)'; ctx.strokeText(t, x, y); ctx.fillStyle = '#f6ecd0'; ctx.fillText(t, x, y); };
    let y = 8 * dpr + 24 * z;
    for (const r of rows) {
      const base = y + r.up * z; let x = (W - (r.w * z)) / 2 + GAP * z;
      if (r.title) text(r.title, 14 * dpr, y + 20 * dpr, 17, true, 'left');
      for (const o of r.it) {
        const cx = x + o.w * z / 2, s = o.s, fw = s.fw || 0, fh = s.fh || 0;
        for (const l of ['p', 'u']) if (s[l]) ctx.drawImage(lodPick(s[l], layerR(s, l) / z), cx - s.ax * z, base - s.ay * z, s.w * z, s.h * z);
        if (fw) {
          const c = [[fw / 2, fh / 2], [fw / 2, -fh / 2], [-fw / 2, -fh / 2], [-fw / 2, fh / 2]].map(([a, b]) => [cx + (a - b) * AX * z, base + (a + b) * AY * z]);
          ctx.beginPath(); c.forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b)); ctx.closePath(); ctx.fillStyle = 'rgba(255,214,70,0.13)'; ctx.fill(); ctx.lineWidth = 2 * dpr; ctx.strokeStyle = 'rgba(255,214,70,0.9)'; ctx.stroke();
        }
        if (s.c) ctx.drawImage(lodPick(s.c, layerR(s, 'c') / z), cx - s.ax * z, base - s.ay * z, s.w * z, s.h * z);
        text(nameOfBuilding(o.n, o.id) + (fw ? ' · ' + fw + '×' + fh : ''), cx, base + r.down * z + 22 * dpr, 15, false);
        x += (o.w + GAP) * z;
      }
      y += (r.up + r.down) * z + lab;
    }
    return;
  }
  if (mode === 'b') {
    const items = Object.keys(SPR), cols = Math.ceil(Math.sqrt(items.length * W / H)), rows = Math.ceil(items.length / cols), cw = W / cols, ch = H / rows;
    items.forEach((n, i) => { const spr = SPR[n], z = Math.min(Z * 0.5, cw * 0.95 / spr.w, ch * 0.95 / (spr.h - spr.ay * 0.0)); draw(spr, (i % cols + 0.5) * cw, Math.floor(i / cols) * ch + ch * 0.8, z, ['p', 'u', 'c']); });
  } else if (mode === 'n') {
    const rows = [H * 0.3, H * 0.62, H * 0.93], row1 = [SETS.oaks[0], SETS.oaks[1], SETS.pines[0], SETS.pines[1]], row2 = [SETS.palms[0], SETS.palms[1], SETS.rocks[0], SETS.rocks[1]];
    row1.forEach((t, i) => draw(t, (i + 0.5) * W / 4, rows[0], Z * 0.5, ['u', 'c'])); row2.forEach((t, i) => draw(t, (i + 0.5) * W / 4, rows[1], Z * 0.5, ['u', 'c']));
  } else {
    const keys = Object.keys(SETS.cast), n = keys.length, cw = W / n;
    keys.forEach((key, i) => { const cs = SETS.cast[key]; [cs.front[0], cs.front[1], cs.back[0]].forEach((spr, q) => draw(spr, (i + 0.5) * cw, H * (0.3 + q * 0.33), Z, ['u', 'c'])); });
  }
}

async function boot() {
  const t0 = performance.now();
  resize(); zoom = ZDEF; clampCam();
  await bakeAll();
  const sheet = location.hash.startsWith('#sheet') || QS.has('sprite');
  if (!sheet) {
    WORLD = layoutWorld();
    // wypiek widocznych kafli terenu przed pierwszą klatką
    const tc0 = performance.now(), k = kk(), W = cv.width, H = cv.height, vx = W / 2 - cam.x * k, vy = H / 2 - cam.y * k;
    TOTAL += 0; for (let j = Math.floor((-vy / k) / CH); j <= Math.floor(((H - vy) / k) / CH); j++) for (let i = Math.floor((-vx / k) / CH); i <= Math.floor(((W - vx) / k) / CH); i++) await step('Teren', () => chunkOf(i, j));
    tmark('teren(kafle)', tc0);
  }
  BAKE_MS = performance.now() - t0; window.__bakeMs = BAKE_MS; window.__parts = PARTS;
  document.getElementById('bake').textContent = `Wypiek: ${BAKE_MS.toFixed(0)} ms · rozdzielczość ×${RES} · ${innerWidth}×${innerHeight} @${dpr}`;
  const ld = document.getElementById('load'); if (ld) ld.style.display = 'none';
  if (sheet) { sheetFrame(); window.__catalog = catalogJSON; window.__ready = true; return; }
  addEventListener('resize', () => { const r = zoom / ZDEF; resize(); zoom = clamp(ZDEF * r, ZMIN, ZMAX); clampCam(); updateUI(); });
  // sterowanie: przeciąganie, kółko, pinch, przyciski, klawisze
  const ptrs = new Map(); let pinch0 = null;
  cv.addEventListener('pointerdown', e => { try { cv.setPointerCapture(e.pointerId); } catch (err) { /* zdarzenia syntetyczne */ } ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: zoom }; } });
  cv.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId); if (!p) return; const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 1) { cam.x -= dx * dpr / kk(); cam.y -= dy * dpr / kk(); clampCam(); }
    else if (ptrs.size === 2 && pinch0) { const [a, b] = [...ptrs.values()]; setZoom(pinch0.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch0.d, (a.x + b.x) / 2, (a.y + b.y) / 2); }
  });
  const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.12 : 1 / 1.12), e.clientX, e.clientY); }, { passive: false });
  const home = () => { cam.x = bx(11.0, 7.6); cam.y = by(11.0, 7.6); };
  const act = { zin: () => setZoom(zoom * 1.25), zout: () => setZoom(zoom / 1.25), zreset: () => { setZoom(ZDEF); home(); clampCam(); }, grid: () => { gridOn = !gridOn; updateUI(); } };
  for (const id of Object.keys(act)) { const el = document.getElementById(id); if (el) el.addEventListener('click', act[id]); }
  addEventListener('keydown', e => { if (e.key === '+' || e.key === '=') act.zin(); else if (e.key === '-') act.zout(); else if (e.key === '0') act.zreset(); else if (e.key === 'g' || e.key === 'G') act.grid(); });
  const cx = parseFloat(QS.get('cx')), cy = parseFloat(QS.get('cy')); if (!isNaN(cx) && !isNaN(cy)) { cam.x = bx(cx, cy); cam.y = by(cx, cy); clampCam(); }
  updateUI();
  let last = performance.now(), T = 0, frames = 0, fpsT = 0;
  const loop = (now) => {
    const dt = clamp((now - last) / 1000, 0, 0.05); last = now; T += dt;
    update(dt); drawFrame(T, dt);
    frames++; fpsT += dt; if (fpsT > 1) { document.getElementById('fps').textContent = Math.round(frames / fpsT) + ' FPS'; frames = 0; fpsT = 0; }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  window.__setZoom = z => setZoom(z); window.__catalog = catalogJSON; window.__ready = true;
}
boot().catch(e => { const t = document.getElementById('ltxt'); if (t) t.textContent = 'Błąd: ' + e.message; console.error(e); });
