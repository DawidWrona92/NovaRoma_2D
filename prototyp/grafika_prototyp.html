<div id="cap"><b>Nova Roma — próbka nowego stylu (v3)</b><div>Budynki o różnych rozmiarach (2×2 … 4×4 pola) · Słowianie, Frankowie, Saraceni, Wikingowie · wszystko rysowane kodem</div></div>
<div id="st"><span id="fps"></span><br><span id="bake"></span></div>

<div id="ui"><span id="zl"></span><button id="zout" aria-label="Oddal">−</button><button id="zin" aria-label="Przybliż">+</button><button id="zreset" aria-label="Domyślny widok">⟲</button><button id="grid" aria-label="Siatka pól">▦</button></div>
<script>
/* ---- 00_util.js ---- */
/* ====================== NARZĘDZIA ====================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

function rng(seed) { // mulberry32 — deterministyczny generator (te same tekstury za każdym razem)
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function hex(c) { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const scaleC = (c, f) => [clamp(c[0] * f, 0, 255), clamp(c[1] * f, 0, 255), clamp(c[2] * f, 0, 255)];
function ramp(stops, t) { // stops: [[pozycja, [r,g,b]], ...]
  t = clamp(t, 0, 1);
  for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) {
    const [p0, c0] = stops[i - 1], [p1, c1] = stops[i];
    return mixc(c0, c1, (t - p0) / ((p1 - p0) || 1));
  }
  return stops[stops.length - 1][1];
}
/* tablica kolorów (256 wpisów) zamiast liczenia rampy dla każdego piksela */
function lutRamp(stops, n = 256) { return Array.from({ length: n }, (_, i) => ramp(stops, i / (n - 1))); }
function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }

/* drobny szum ziarna dodany do całej tekstury */
function addGrain(g, w, h, amt, seed) {
  const r = rng(seed || 1), im = g.getImageData(0, 0, w, h), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * amt; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(im, 0, 0);
}

/* szum wartościowy okresowy (kafelkowalny) i fbm */
function periodicNoise(size, cells, seed) {
  const r = rng(seed), L = new Float32Array(cells * cells);
  for (let i = 0; i < L.length; i++) L[i] = r();
  const out = new Float32Array(size * size), s = cells / size;
  for (let y = 0; y < size; y++) {
    const fy = y * s, y0 = Math.floor(fy), ty = fy - y0, sy = ty * ty * (3 - 2 * ty), yy0 = y0 % cells, yy1 = (y0 + 1) % cells;
    for (let x = 0; x < size; x++) {
      const fx = x * s, x0 = Math.floor(fx), tx = fx - x0, sx = tx * tx * (3 - 2 * tx), xx0 = x0 % cells, xx1 = (x0 + 1) % cells;
      const a = L[yy0 * cells + xx0], b = L[yy0 * cells + xx1], c = L[yy1 * cells + xx0], d = L[yy1 * cells + xx1];
      out[y * size + x] = lerp(lerp(a, b, sx), lerp(c, d, sx), sy);
    }
  }
  return out;
}
function fbm(size, cells, oct, seed) {
  const out = new Float32Array(size * size); let amp = 1, tot = 0;
  for (let o = 0; o < oct; o++) {
    const n = periodicNoise(size, cells * (1 << o), seed + o * 101);
    for (let i = 0; i < out.length; i++) out[i] += n[i] * amp;
    tot += amp; amp *= 0.5;
  }
  for (let i = 0; i < out.length; i++) out[i] /= tot;
  return out;
}

/* miękki cień/poświata: rysuje kształt poza płótnem i przesuwa jego cień (shadowBlur działa w każdej przeglądarce).
   Rozmycie i przesunięcie cienia nie podlegają macierzy, więc skalujemy je o mnożnik z bieżącej macierzy kontekstu. */
function softFill(g, pathFn, color, blur, dx = 0, dy = 0) {
  const OFF = 4000, R = g.getTransform().a || 1;
  g.save();
  g.shadowColor = color; g.shadowBlur = blur * R; g.shadowOffsetX = (OFF + dx) * R; g.shadowOffsetY = dy * R;
  g.translate(-OFF, 0);
  g.fillStyle = '#000'; g.beginPath(); pathFn(g); g.fill();
  g.restore();
}

/* LOD (mipmapy): przy oddaleniu rysujemy wstępnie pomniejszone kopie — bez poszarpanych krawędzi */
function lodHalf(c) {
  if (!c._h) {
    const h = newCanvas(Math.max(1, c.width >> 1), Math.max(1, c.height >> 1)), g = h.getContext('2d');
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high'; g.drawImage(c, 0, 0, h.width, h.height); c._h = h;
  }
  return c._h;
}
function lodPick(c, ratio) { while (ratio >= 2 && c.width > 8 && c.height > 8) { c = lodHalf(c); ratio /= 2; } return c; }

/* ---- 10_tex.js ---- */
/* ====================== TEKSTURY PROCEDURALNE ======================
   Każda tekstura jest kafelkowalna (szwy okresowe) i ma gęstość ppu = pikseli tekstury na jednostkę świata,
   więc na każdej ścianie / połaci deska, bal czy dachówka mają ten sam rozmiar. */
const GEN = {};
const TEXCACHE = {};
let TEXRES = 1;                     // mnożnik rozdzielczości tekstur terenu (ustawiany przy starcie razem z RES)
function tex(name, pal) {
  const key = name + '|' + (pal || '');
  return TEXCACHE[key] || (TEXCACHE[key] = GEN[name](pal));
}
/* rysuje obiekt także w kopiach przesuniętych o okres, żeby kafelek był bezszwowy */
function wrapDraw(N, x, y, w, h, fn) {
  for (const ox of [-N, 0, N]) for (const oy of [-N, 0, N]) {
    if (x + ox > N + 4 || x + ox + w < -4 || y + oy > N + 4 || y + oy + h < -4) continue;
    fn(ox, oy);
  }
}

/* --- bale (zrąb): poziome okrągłe kłody z usłojeniem i sękami --- */
GEN.log = (base = '#a0723f') => {
  const N = 128, c = newCanvas(N, N), g = c.getContext('2d'), r = rng(11), rows = 8, rh = N / rows, b = hex(base);
  for (let i = 0; i < rows; i++) {
    const y = i * rh, k = 0.86 + r() * 0.28;
    const gr = g.createLinearGradient(0, y, 0, y + rh);
    gr.addColorStop(0, css(scaleC(b, 1.28 * k))); gr.addColorStop(0.3, css(scaleC(b, 1.05 * k))); gr.addColorStop(0.75, css(scaleC(b, 0.74 * k))); gr.addColorStop(1, css(scaleC(b, 0.46 * k)));
    g.fillStyle = gr; g.fillRect(0, y, N, rh);
    for (let j = 0; j < 8; j++) { // usłojenie: falujące, okresowe linie
      const yy = y + 2 + r() * (rh - 5), ph = r() * TAU, amp = 0.5 + r() * 1.1, f = 1 + ((r() * 3) | 0);
      g.strokeStyle = `rgba(36,20,8,${0.12 + r() * 0.22})`; g.lineWidth = 0.7 + r() * 0.9;
      g.beginPath();
      for (let x = 0; x <= N; x += 4) { const v = yy + Math.sin(x / N * TAU * f + ph) * amp; x ? g.lineTo(x, v) : g.moveTo(x, v); }
      g.stroke();
    }
    if (r() < 0.5) { // sęk
      const kx = r() * N, ky = y + rh * (0.35 + r() * 0.3), kr = 2.4 + r() * 2;
      wrapDraw(N, kx - 9, ky - 6, 18, 12, (ox, oy) => {
        g.fillStyle = 'rgba(30,16,6,0.55)'; g.beginPath(); g.ellipse(kx + ox, ky + oy, kr, kr * 0.7, 0, 0, TAU); g.fill();
        g.strokeStyle = 'rgba(30,16,6,0.28)'; g.lineWidth = 1; g.beginPath(); g.ellipse(kx + ox, ky + oy, kr * 2, kr * 1.3, 0, 0, TAU); g.stroke();
      });
    }
    g.fillStyle = 'rgba(14,7,2,0.6)'; g.fillRect(0, y + rh - 1.6, N, 1.6);   // szczelina między bali
    g.fillStyle = 'rgba(255,225,170,0.2)'; g.fillRect(0, y + 0.4, N, 1);     // błysk na grzbiecie
  }
  addGrain(g, N, N, 15, 2);
  return { c, ppu: 112 };
};

/* --- deski pionowe --- */
GEN.plank = (base = '#7b5a36') => {
  const N = 128, c = newCanvas(N, N), g = c.getContext('2d'), r = rng(13), b = hex(base), cols = 8, cw = N / cols;
  for (let i = 0; i < cols; i++) {
    const x = i * cw, k = 0.85 + r() * 0.3;
    const gr = g.createLinearGradient(x, 0, x + cw, 0);
    gr.addColorStop(0, css(scaleC(b, 0.8 * k))); gr.addColorStop(0.5, css(scaleC(b, 1.08 * k))); gr.addColorStop(1, css(scaleC(b, 0.75 * k)));
    g.fillStyle = gr; g.fillRect(x, 0, cw, N);
    for (let j = 0; j < 6; j++) {
      const xx = x + 2 + r() * (cw - 4), ph = r() * TAU, amp = 0.6 + r() * 0.8;
      g.strokeStyle = `rgba(30,16,6,${0.12 + r() * 0.2})`; g.lineWidth = 0.7 + r() * 0.7; g.beginPath();
      for (let y = 0; y <= N; y += 4) { const v = xx + Math.sin(y / N * TAU * 2 + ph) * amp; y ? g.lineTo(v, y) : g.moveTo(v, y); }
      g.stroke();
    }
    g.fillStyle = 'rgba(12,6,2,0.65)'; g.fillRect(x + cw - 1.2, 0, 1.2, N);
  }
  g.fillStyle = 'rgba(20,14,10,0.7)';
  for (let i = 0; i < cols; i++) for (const y of [20, 64, 108]) { g.beginPath(); g.arc(i * cw + cw / 2, y, 1.1, 0, TAU); g.fill(); }
  addGrain(g, N, N, 13, 4);
  return { c, ppu: 120 };
};

/* --- strzecha: gęste źdźbła wzdłuż spadku, pasy wiązań --- */
GEN.thatch = (base = '#cba94d') => {
  const N = 128, c = newCanvas(N, N), g = c.getContext('2d'), r = rng(21), b = hex(base);
  g.fillStyle = css(scaleC(b, 0.62)); g.fillRect(0, 0, N, N);
  const cols = [scaleC(b, 1.3), scaleC(b, 1.12), b, scaleC(b, 0.86), scaleC(b, 0.66), mixc(b, [255, 246, 205], 0.45)];
  for (let i = 0; i < 3600; i++) {
    const x = r() * N, y = r() * N, len = 9 + r() * 18, ang = Math.PI / 2 + (r() - 0.5) * 0.3;
    g.strokeStyle = css(cols[(r() * cols.length) | 0], 0.5 + r() * 0.45); g.lineWidth = 0.8 + r() * 1.1;
    wrapDraw(N, x - 20, y - 20, 40, 40 + len, (ox, oy) => { g.beginPath(); g.moveTo(x + ox, y + oy); g.lineTo(x + ox + Math.cos(ang) * len, y + oy + Math.sin(ang) * len); g.stroke(); });
  }
  for (let k = 0; k < 4; k++) { // wiązania
    const y = k * 32 + 22;
    g.fillStyle = 'rgba(38,24,8,0.3)'; g.fillRect(0, y, N, 3);
    g.fillStyle = 'rgba(255,240,170,0.16)'; g.fillRect(0, y + 3, N, 2);
  }
  addGrain(g, N, N, 16, 3);
  return { c, ppu: 96 };
};

/* --- dachówka ceramiczna (karpiówka) --- */
GEN.tiles = (base = '#b4532f') => {
  const N = 128, c = newCanvas(N, N), g = c.getContext('2d'), r = rng(31), b = hex(base), rows = 8, rh = N / rows, tw = 16;
  g.fillStyle = css(scaleC(b, 0.4)); g.fillRect(0, 0, N, N);
  for (let row = 0; row < rows; row++) {
    const y = row * rh, off = (row % 2) * tw / 2;
    for (let col = -1; col <= N / tw; col++) {
      const x = col * tw + off, k = 0.8 + r() * 0.4;
      const gr = g.createLinearGradient(0, y, 0, y + rh);
      gr.addColorStop(0, css(scaleC(b, 0.7 * k))); gr.addColorStop(0.5, css(scaleC(b, 1.0 * k))); gr.addColorStop(1, css(scaleC(b, 1.22 * k)));
      g.fillStyle = gr;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + tw, y); g.lineTo(x + tw, y + rh - 4);
      g.quadraticCurveTo(x + tw, y + rh, x + tw / 2, y + rh); g.quadraticCurveTo(x, y + rh, x, y + rh - 4); g.closePath(); g.fill();
      g.strokeStyle = 'rgba(32,10,4,0.6)'; g.lineWidth = 1; g.stroke();
      g.fillStyle = 'rgba(255,214,170,0.15)'; g.fillRect(x + 1.5, y + 2, 2, rh - 7);
      if (r() < 0.2) { g.fillStyle = `rgba(86,118,48,${0.1 + r() * 0.16})`; g.beginPath(); g.ellipse(x + r() * tw, y + rh * (0.45 + r() * 0.5), 3 + r() * 4, 2 + r() * 2, 0, 0, TAU); g.fill(); }
    }
  }
  addGrain(g, N, N, 14, 5);
  return { c, ppu: 96 };
};

/* --- gonty drewniane (ciemne dachy wikińskie) --- */
GEN.shingle = (base = '#4a3a2e') => {
  const N = 128, c = newCanvas(N, N), g = c.getContext('2d'), r = rng(33), b = hex(base), rows = 10, rh = N / rows;
  g.fillStyle = css(scaleC(b, 0.35)); g.fillRect(0, 0, N, N);
  for (let row = 0; row < rows; row++) {
    const y = row * rh, tw = 12.8, off = (row % 2) * tw / 2;
    for (let col = -1; col <= N / tw; col++) {
      const x = col * tw + off, k = 0.75 + r() * 0.5;
      const gr = g.createLinearGradient(0, y, 0, y + rh);
      gr.addColorStop(0, css(scaleC(b, 0.7 * k))); gr.addColorStop(1, css(scaleC(b, 1.25 * k)));
      g.fillStyle = gr; g.fillRect(x, y, tw - 0.6, rh - 0.6);
      g.strokeStyle = `rgba(0,0,0,${0.25 + r() * 0.2})`; g.lineWidth = 0.8; g.beginPath(); g.moveTo(x + 3 + r() * 6, y + 1); g.lineTo(x + 3 + r() * 6, y + rh - 1); g.stroke();
      g.fillStyle = 'rgba(20,10,4,0.55)'; g.fillRect(x, y + rh - 1.5, tw - 0.6, 1.5);
    }
  }
  addGrain(g, N, N, 14, 6);
  return { c, ppu: 110 };
};

/* --- kamień ciosowy / łamany --- */
function stoneTex(base, seed, rows, jitter, bevel, mortar) {
  const N = 128, c = newCanvas(N, N), g = c.getContext('2d'), r = rng(seed), b = hex(base), rh = N / rows;
  g.fillStyle = css(scaleC(b, mortar)); g.fillRect(0, 0, N, N);
  for (let row = 0; row < rows; row++) {
    const y = row * rh, ws = []; let sum = 0;
    while (sum < N - 22) { const w = 24 + r() * 26; ws.push(w); sum += w; }
    ws.push(N - sum); // domknięcie okresu
    let x = 0;
    for (const w of ws) {
      const k = 1 - jitter + r() * jitter * 2, tint = mixc(b, r() < 0.5 ? [150, 128, 96] : [120, 130, 140], 0.12 + r() * 0.12);
      wrapDraw(N, x, y, w, rh, (ox, oy) => {
        const gr = g.createLinearGradient(0, y + oy, 0, y + oy + rh);
        gr.addColorStop(0, css(scaleC(tint, 1.18 * k))); gr.addColorStop(1, css(scaleC(tint, 0.86 * k)));
        g.fillStyle = gr; g.fillRect(x + ox + 1, y + oy + 1, w - 2, rh - 2);
        g.fillStyle = `rgba(255,255,255,${bevel})`; g.fillRect(x + ox + 1, y + oy + 1, w - 2, 1.6); g.fillRect(x + ox + 1, y + oy + 1, 1.4, rh - 2);
        g.fillStyle = `rgba(0,0,0,${bevel * 1.5})`; g.fillRect(x + ox + 1, y + oy + rh - 2.6, w - 2, 1.6); g.fillRect(x + ox + w - 2.4, y + oy + 1, 1.4, rh - 2);
        for (let q = 0; q < 5; q++) { g.fillStyle = `rgba(20,20,16,${0.08 + r() * 0.14})`; g.fillRect(x + ox + 3 + r() * (w - 8), y + oy + 3 + r() * (rh - 8), 1 + r() * 2, 1 + r() * 2); }
      });
      x += w;
    }
  }
  addGrain(g, N, N, 14, seed + 1);
  return { c, ppu: 120 };
}
GEN.stone = (base = '#9d9a90') => stoneTex(base, 41, 6, 0.1, 0.22, 0.38);
GEN.rubble = (base = '#8a877c') => stoneTex(base, 43, 5, 0.2, 0.26, 0.3);
GEN.sandstone = (base = '#d8c08c') => stoneTex(base, 45, 7, 0.06, 0.16, 0.62);

/* --- tynk / wapno z plamami i spękaniami --- */
GEN.plaster = (base = '#e9dfc4') => {
  const N = 128, c = newCanvas(N, N), g = c.getContext('2d'), r = rng(51), b = hex(base);
  g.fillStyle = css(b); g.fillRect(0, 0, N, N);
  for (let i = 0; i < 140; i++) {
    const x = r() * N, y = r() * N, rad = 8 + r() * 26, light = r() < 0.5;
    wrapDraw(N, x - rad, y - rad, rad * 2, rad * 2, (ox, oy) => {
      const gr = g.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, rad);
      gr.addColorStop(0, light ? 'rgba(255,250,235,0.1)' : 'rgba(90,70,40,0.09)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(x + ox - rad, y + oy - rad, rad * 2, rad * 2);
    });
  }
  g.strokeStyle = 'rgba(70,52,30,0.2)'; g.lineWidth = 0.8;
  for (let i = 0; i < 7; i++) { let x = r() * N, y = r() * N; g.beginPath(); g.moveTo(x, y); for (let j = 0; j < 5; j++) { x += (r() - 0.5) * 14; y += r() * 10; g.lineTo(x, y); } g.stroke(); }
  addGrain(g, N, N, 12, 7);
  return { c, ppu: 120 };
};

/* --- ubita ziemia (decal pod budynkami) --- */
GEN.dirt = (base = '#85693b') => {
  const T = TEXRES, B = 128, N = B * T, c = newCanvas(N, N), g = c.getContext('2d'), im = g.createImageData(N, N), d = im.data, b = hex(base);
  const n1 = fbm(N, 4, 3, 61), n2 = periodicNoise(N, 32, 67);
  const stops = [[0, scaleC(b, 0.62)], [0.5, b], [1, scaleC(b, 1.32)]], lut = lutRamp(stops);

/* ---- 20_scene.js ---- */
/* ====================== SCENA: RZUT, ŚCIANY, POŁACIE, CIENIE ======================
   Sprite budynku jest wypiekany raz z brył 3D: każda ściana i połać to równoległobok z teksturą nałożoną afinicznie
   (w rzucie ortogonalnym to dokładne odwzorowanie), oświetlony z lewej góry.
   Układ współrzędnych: środek pola = (0,0), x rośnie w prawo-dół ekranu, y w lewo-dół, z w górę (1 jednostka = 1 pole).
   Dwa niezależne mnożniki:
     F   — skala geometrii sprite'a (żeby budynek wypełniał swoje pole; tekstury zachowują stałą gęstość na ekranie),
     RES — rozdzielczość wypieku (px na px logiczny); wszystko rysujemy w px logicznych pod macierzą RES. */
const S = 2;                       // 1 pole = 64·S px logicznych szerokości
const AX = 32 * S, AY = 16 * S;    // sx = (x−y)·AX, sy = (x+y)·AY
const VH = 39 * S;                 // px na jednostkę wysokości (rzut dimetryczny 2:1)
const LIGHT = { top: 1.0, south: 0.86, east: 0.6, roofS: 1.02, roofN: 0.78, roofE: 0.8, roofW: 1.0 };
const SHADOW_DIR = [0.62, 0.1];    // długość cienia (x,y) na jednostkę wysokości — pada w prawo-dół
let RES = 1;                       // ustawiane przy starcie (zależnie od DPR / parametru ?q=)

function convexHull(pts) {
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  lo.pop(); up.pop(); return lo.concat(up);
}

class Scene {
  /* w,h,ax,ay — wymiary i punkt zaczepienia w px logicznych przy F=1; o.F — skala geometrii; o.R — rozdzielczość; o.ground — tylko warstwa terenu */
  constructor(w, h, ax, ay, o = {}) {
    const F = this.F = o.F ?? 1, R = this.R = o.R ?? RES;
    this.Rp = o.ground ? R : Math.min(R, 1); this.Ru = Math.min(R, 1);                              // plac i cień są miękkie — wystarczy rozdzielczość 1
    this.w = Math.ceil(w * F); this.h = Math.ceil(h * F); this.ax = ax * F; this.ay = ay * F;       // wymiary logiczne
    this.pw = Math.ceil(this.w * R); this.ph = Math.ceil(this.h * R); this.fw = o.fw; this.fh = o.fh;
    const mk = res => { const c = newCanvas(Math.ceil(this.w * res), Math.ceil(this.h * res)), g = c.getContext('2d'); g.setTransform(res, 0, 0, res, 0, 0); return [c, g]; };
    [this.pcv, this.pg] = mk(this.Rp);                                                               // warstwa 1: plac / decale terenu
    if (!o.ground) { [this.ucv, this.gu] = mk(this.Ru); [this.c, this.g] = mk(R); }                  // warstwa 2: cień rzucony; warstwa 3: obiekty
    this.pats = {}; this.wear = o.wear ?? 1; this._wn = 0;                                           // natężenie zużycia (0 = czysto)
  }
  P(x, y, z = 0) { const F = this.F; return [(x - y) * AX * F + this.ax, (x + y) * AY * F - z * VH * F + this.ay]; }
  pat(name, pal, ctx) {
    const k = name + '|' + (pal || '') + '|' + (ctx === this.gu ? 'u' : 'o');
    if (!this.pats[k]) { const t = tex(name, pal); this.pats[k] = { pat: (ctx || this.g).createPattern(t.c, 'repeat'), ppu: t.ppu }; }
    return this.pats[k];
  }

  /* równoległobok O + s·U + t·V pokryty teksturą; gęstość tekstury na ekranie jest stała niezależnie od F (K·F) */
  face(O, U, V, mat, o = {}) {
    const g = this.g, R = this.R, m = this.pat(mat, o.pal), lu = Math.hypot(...U), lv = Math.hypot(...V), K = (o.ppu || m.ppu) * this.F;
    const p0 = this.P(...O), pu = this.P(O[0] + U[0], O[1] + U[1], O[2] + U[2]), pv = this.P(O[0] + V[0], O[1] + V[1], O[2] + V[2]);
    const a = (pu[0] - p0[0]) / (lu * K), b = (pu[1] - p0[1]) / (lu * K), c = (pv[0] - p0[0]) / (lv * K), d = (pv[1] - p0[1]) / (lv * K);
    const sc = Math.hypot(a, b) || 1;
    g.save();
    g.setTransform(R * a, R * b, R * c, R * d, R * p0[0], R * p0[1]);
    g.beginPath();
    if (o.clip) o.clip.forEach(([s, t], i) => g[i ? 'lineTo' : 'moveTo'](s * lu * K, t * lv * K)); else g.rect(0, 0, lu * K, lv * K);
    g.closePath();
    g.fillStyle = m.pat; g.fill();
    g.strokeStyle = m.pat; g.lineWidth = 1.1 / sc; g.stroke();        // zakładka — brak szwów między ścianami
    if (o.wear !== 0 && this.wear > 0) wearFace(this, mat, o, lu * K, lv * K, K, sc, (++this._wn) * 7919 + Math.round(O[0] * 173 + O[1] * 379 + O[2] * 571) + 1000);
    const sh = o.shade ?? 1;
    if (sh < 1) { g.globalCompositeOperation = 'multiply'; g.fillStyle = `rgb(${255 * sh * 0.97 | 0},${255 * sh * 0.98 | 0},${255 * Math.min(1, sh * 1.03) | 0})`; g.fill(); }
    else if (sh > 1) { g.globalCompositeOperation = 'soft-light'; g.globalAlpha = Math.min(1, (sh - 1) * 2.4); g.fillStyle = '#fff1c4'; g.fill(); }
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
    if (o.vgrad) { // zaciemnienie wzdłuż v (np. przy ziemi lub pod okapem)
      const gr = g.createLinearGradient(0, 0, 0, lv * K); o.vgrad.forEach(([t, al]) => gr.addColorStop(t, `rgba(12,8,4,${al})`));
      g.fillStyle = gr; g.fill();
    }
    if (o.ugrad) {
      const gr = g.createLinearGradient(0, 0, lu * K, 0); o.ugrad.forEach(([t, al]) => gr.addColorStop(t, `rgba(12,8,4,${al})`));
      g.fillStyle = gr; g.fill();
    }
    if (o.edge !== 0) { g.strokeStyle = `rgba(14,8,4,${o.edge ?? 0.3})`; g.lineWidth = 1.0 / sc; g.stroke(); }
    g.restore();
  }

  /* rysowanie 2D w układzie ściany: jednostki = jednostki świata (u wzdłuż U, v wzdłuż V) */
  local(O, U, V, fn) {
    const g = this.g, R = this.R, lu = Math.hypot(...U), lv = Math.hypot(...V);
    const p0 = this.P(...O), pu = this.P(O[0] + U[0], O[1] + U[1], O[2] + U[2]), pv = this.P(O[0] + V[0], O[1] + V[1], O[2] + V[2]);
    g.save();
    g.setTransform(R * (pu[0] - p0[0]) / lu, R * (pu[1] - p0[1]) / lu, R * (pv[0] - p0[0]) / lv, R * (pv[1] - p0[1]) / lv, R * p0[0], R * p0[1]);
    fn(g, lu, lv);
    g.restore();
  }

  /* prostopadłościan: ściana wschodnia (prawa), południowa (lewa) i wierzch */
  box(x0, y0, z0, x1, y1, z1, m, o = {}) {
    const h = z1 - z0, me = m.east || m, ms = m.south || m, mt = m.top || m.south || m;
    const ao = o.ao ?? 0.4, vg = [[0, o.eave ?? 0], [0.15, 0], [0.78, 0], [1, ao]];
    this.face([x1, y1, z1], [0, -(y1 - y0), 0], [0, 0, -h], me, { shade: LIGHT.east, vgrad: vg, pal: o.pal, ugrad: [[0, 0.16], [0.2, 0]] });
    this.face([x0, y1, z1], [x1 - x0, 0, 0], [0, 0, -h], ms, { shade: LIGHT.south, vgrad: vg, pal: o.pal, ugrad: [[0.85, 0], [1, 0.12]] });
    if (o.top !== false) this.face([x0, y0, z1], [x1 - x0, 0, 0], [0, y1 - y0, 0], mt, { shade: LIGHT.top, pal: o.topPal || o.pal, edge: 0.35 });
  }

  /* cień rzucony na ziemię: rzut punktów bryły wzdłuż światła + otoczka wypukła, miękki brzeg */
  shadow(pts3, o = {}) {
    const sd = o.dir || SHADOW_DIR;
    const pts = pts3.map(([x, y, z]) => this.P(x + z * sd[0], y + z * sd[1], 0));
    const hull = convexHull(pts);
    softFill(this.gu, g => { hull.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); }, `rgba(14,22,8,${o.alpha ?? 0.5})`, (o.blur ?? 9) * this.F);
  }
  shadowBox(x0, y0, x1, y1, h, o) {
    this.shadow([[x0, y0, 0], [x1, y0, 0], [x1, y1, 0], [x0, y1, 0], [x0, y0, h], [x1, y0, h], [x1, y1, h], [x0, y1, h]], o);
  }
  /* miękki mrok przy podstawie (ambient occlusion) */
  contact(x0, y0, x1, y1, o = {}) {
    const e = o.grow ?? 0.05, P = (x, y) => this.P(x, y, 0);
    softFill(this.gu, g => { [[x0 - e, y0 - e], [x1 + e, y0 - e], [x1 + e, y1 + e], [x0 - e, y1 + e]].forEach(([x, y], i) => { const p = P(x, y); i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }); g.closePath(); }, `rgba(10,12,4,${o.alpha ?? 0.55})`, (o.blur ?? 6) * this.F);
  }

  /* decal terenu: tekstura rzucona w płaszczyznę świata (izometrycznie), przycięta do wielokątów z miękkim brzegiem */
  decal(mat, pal, polys, o = {}) {
    const R = this.Rp, m = tex(mat, pal), K = m.ppu;
    let x0 = 0, y0 = 0, x1 = this.w, y1 = this.h;                          // obszar roboczy (px logiczne) — dla wielokątów tylko ich obwiednia
    if (polys) {
      let a = 1e9, b = 1e9, c = -1e9, d = -1e9;
      for (const pts of polys) for (const [x, y] of pts) { const p = this.P(x, y, 0); if (p[0] < a) a = p[0]; if (p[0] > c) c = p[0]; if (p[1] < b) b = p[1]; if (p[1] > d) d = p[1]; }
      const mg = (o.feather ?? 14) * 2 + 6;
      x0 = Math.max(0, a - mg); y0 = Math.max(0, b - mg); x1 = Math.min(this.w, c + mg); y1 = Math.min(this.h, d + mg);
      if (x1 <= x0 || y1 <= y0) return;
    }
    const ox = Math.floor(x0 * R), oy = Math.floor(y0 * R), tw = Math.ceil(x1 * R) - ox, th = Math.ceil(y1 * R) - oy, lx = ox / R, ly = oy / R;   // przesunięcie w px urządzenia
    const t = newCanvas(tw, th), tg = t.getContext('2d');
    tg.setTransform(R * AX / K, R * AY / K, -R * AX / K, R * AY / K, R * (this.ax - lx), R * (this.ay - ly));
    tg.fillStyle = tg.createPattern(m.c, 'repeat');
    const ext = (this.w + this.h) * K / Math.min(AX, AY);
    tg.fillRect(-ext, -ext, 2 * ext, 2 * ext);
    tg.setTransform(1, 0, 0, 1, 0, 0);
    if (polys) {
      const mk = newCanvas(tw, th), mg = mk.getContext('2d'); mg.setTransform(R, 0, 0, R, -R * lx, -R * ly);
      const path = g => { for (const pts of polys) { pts.forEach(([x, y], i) => { const p = this.P(x, y, 0); i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }); g.closePath(); } };
      if (o.feather === 0) { mg.fillStyle = '#fff'; mg.beginPath(); path(mg); mg.fill(); } else softFill(mg, path, '#fff', o.feather ?? 14);
      tg.globalCompositeOperation = 'destination-in'; tg.drawImage(mk, 0, 0);
    }
    const dst = o.layer || this.pg;
    dst.save(); dst.setTransform(1, 0, 0, 1, 0, 0); dst.globalAlpha = o.alpha ?? 1; if (o.blend) dst.globalCompositeOperation = o.blend; dst.drawImage(t, ox, oy); dst.restore();
  }
  /* jednolita, rozmyta plama koloru (mokry piasek, ściółka) */
  flat(polys, color, feather, layer) {
    softFill(layer || this.pg, g => { for (const pts of polys) { pts.forEach(([x, y], i) => { const p = this.P(x, y, 0); i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }); g.closePath(); } }, color, feather);
  }
  /* organiczna plama ubitej ziemi (znak rozpoznawczy „Settlers"); wymiary w POLACH (niezależnie od F) */
  patch(cx, cy, rx, ry, o = {}) {
    const r = rng(o.seed || 9), pts = [], n = 16, f = 1 / this.F;
    for (let i = 0; i < n; i++) { const a = i / n * TAU, k = 0.82 + r() * 0.3; pts.push([(cx + Math.cos(a) * rx * k) * f, (cy + Math.sin(a) * ry * k) * f]); }
    this.decal(o.mat || 'dirt', o.pal, [pts], { feather: o.feather ?? 12, alpha: o.alpha ?? 0.92 });
  }
  /* prostokątny, wybrukowany plac (np. dziedziniec, targowisko); współrzędne w polach */
  paved(x0, y0, x1, y1, o = {}) {
    const f = 1 / this.F, j = o.jit ?? 0.05, r = rng(o.seed || 5), q = () => (r() - 0.5) * j;
    this.decal(o.mat || 'pavers', o.pal, [[[x0 * f + q(), y0 * f + q()], [x1 * f + q(), y0 * f + q()], [x1 * f + q(), y1 * f + q()], [x0 * f + q(), y1 * f + q()]]], { feather: o.feather ?? 3, alpha: o.alpha ?? 1 });
  }

  /* walec pionowy (wieża, minaret, beczka): gradient poziomy, elipsy góry i dołu */
  cyl(cx, cy, z0, z1, r, o = {}) {

/* ---------- połacie dachowe ---------- */
/* dach dwuspadowy; o.ridge 'x' (kalenica wzdłuż x, szczyty po bokach ±x) albo 'y'.
   o: x0,y0,x1,y1 — obrys ścian, z — wysokość ścian, rise — wzniesienie kalenicy, ov — okap, ovE — wysunięcie szczytu */
function gableRoof(sc, o) {
  const { x0, y0, x1, y1, z, rise } = o, ov = o.ov ?? 0.07, ovE = o.ovE ?? 0.05, mat = o.mat, pal = o.pal, gm = o.gableMat || o.wallMat, gpal = o.gablePal || o.wallPal;
  if ((o.ridge || 'x') === 'x') {
    const ym = (y0 + y1) / 2, hs = (y1 - y0) / 2, dz = rise * ov / hs, zE = z - dz, L = x1 - x0 + 2 * ovE;
    const ySo = y1 + ov, yNo = y0 - ov, top = z + rise;
    sc.face([x0 - ovE, ym, top], [L, 0, 0], [0, yNo - ym, zE - top], mat, { shade: LIGHT.roofN, pal, edge: 0.35, roof: true });                       // połać północna (tylna)
    if (gm) sc.face([x1, y1, top], [0, -(y1 - y0), 0], [0, 0, -rise], gm, { shade: LIGHT.east, pal: gpal, clip: [[0.5, 0], [1, 1], [0, 1]], vgrad: [[0, 0], [0.8, 0], [1, 0.3]] });   // szczyt widoczny (+x)
    sc.face([x0 - ovE, ym, top], [L, 0, 0], [0, ySo - ym, zE - top], mat, { shade: LIGHT.roofS, pal, edge: 0.4, roof: true, vgrad: [[0, 0], [0.86, 0], [1, 0.22]] });   // połać południowa (przednia)
    return { ridgeA: [x0 - ovE, ym, top], ridgeB: [x1 + ovE, ym, top], eaveZ: zE, ySo, yNo };
  }
  const xm = (x0 + x1) / 2, hs = (x1 - x0) / 2, dz = rise * ov / hs, zE = z - dz, L = y1 - y0 + 2 * ovE;
  const xEo = x1 + ov, xWo = x0 - ov, top = z + rise;
  sc.face([xm, y1 + ovE, top], [0, -L, 0], [xWo - xm, 0, zE - top], mat, { shade: LIGHT.roofW, pal, edge: 0.35, roof: true });                  // połać zachodnia (tylna)
  if (gm) sc.face([x0, y1, top], [x1 - x0, 0, 0], [0, 0, -rise], gm, { shade: LIGHT.south, pal: gpal, clip: [[0.5, 0], [1, 1], [0, 1]], vgrad: [[0, 0], [0.8, 0], [1, 0.3]] });   // szczyt (+y)
  sc.face([xm, y1 + ovE, top], [0, -L, 0], [xEo - xm, 0, zE - top], mat, { shade: LIGHT.roofE, pal, edge: 0.4, roof: true, vgrad: [[0, 0], [0.86, 0], [1, 0.25]] });                  // połać wschodnia (przednia)
  return { ridgeA: [xm, y1 + ovE, top], ridgeB: [xm, y0 - ovE, top], eaveZ: zE, xEo, xWo };
}

/* dach czterospadowy / ostrosłup (wieże, kapliczki) */
function pyramidRoof(sc, o) {
  const { x0, y0, x1, y1, z, rise, mat, pal } = o, ov = o.ov ?? 0.05, xm = (x0 + x1) / 2, ym = (y0 + y1) / 2, top = z + rise;
  const a = [x0 - ov, y0 - ov, z - rise * ov / ((x1 - x0) / 2)], b = [x1 + ov, y0 - ov, a[2]], c = [x1 + ov, y1 + ov, a[2]], d = [x0 - ov, y1 + ov, a[2]];
  const quadTri = (p, q, shade) => {
    const U = [q[0] - p[0], q[1] - p[1], q[2] - p[2]], T = [xm, ym, top], V = [T[0] - p[0], T[1] - p[1], T[2] - p[2]];

/* ====================== ZUŻYCIE: przybrudzenia, zacieki, pęknięcia, łaty napraw, mech, ziarno ======================
   Rysowane na każdej ścianie/połaci zaraz po nałożeniu tekstury (więc dostają to samo oświetlenie co reszta).
   Wszystkie rozmiary w tekselach: K tekseli = 1 jednostka świata (pole). Deterministyczne (ziarno z położenia ściany). */

  plank:     { streak: 0.6, grime: 0.7, patch: ['plank', '#bb915c', 'rect'], patchN: 1.0, moss: 0.3, crack: 0.2, nail: 1, tone: 1 },
  thatch:    { streak: 0.3, patch: ['thatch', '#e8c35a', 'blob'], patchN: 0.9, moss: 0.55, dark: 0.8, tone: 1 },
  tiles:     { streak: 0.3, patch: ['tiles', '#c8672f', 'rect'], patchN: 1.2, moss: 0.5, missing: 0.5, tone: 1 },
  shingle:   { streak: 0.3, patch: ['shingle', '#80664a', 'rect'], patchN: 0.9, moss: 0.4, missing: 0.4, tone: 1 },
  slate:     { streak: 0.35, patch: ['slate', '#7c8794', 'rect'], patchN: 0.9, moss: 0.45, missing: 0.35, tone: 1 },
  stone:     { streak: 0.5, grime: 0.9, patch: ['stone', '#bdb9ac', 'rect'], patchN: 0.8, moss: 0.5, crack: 1.0, chip: 0.8, tone: 1 },
  rubble:    { streak: 0.4, grime: 0.9, patch: ['rubble', '#a49f93', 'rect'], patchN: 0.5, moss: 0.7, crack: 0.8, chip: 0.6, tone: 1 },
  sandstone: { streak: 0.45, grime: 0.7, patch: ['sandstone', '#ecd8a6', 'rect'], patchN: 0.8, crack: 0.9, chip: 0.8, salt: 0.6, tone: 1 },
  plaster:   { streak: 0.8, grime: 0.8, patch: ['plaster', '#d8ccae', 'blob'], patchN: 0.6, moss: 0.15, crack: 1.1, peel: 0.9, tone: 1 },
  whitewash: { streak: 0.7, grime: 0.7, patch: ['whitewash', '#e4dcc4', 'blob'], patchN: 0.5, crack: 0.8, peel: 0.7, tone: 1 }

function wearBlob(g, r, cx, cy, rad, n = 9, jit = 0.38) {
  g.beginPath();
  for (let i = 0; i < n; i++) { const a = i / n * TAU, k = 1 - jit + r() * jit * 2, x = cx + Math.cos(a) * rad * k, y = cy + Math.sin(a) * rad * k * 0.85; i ? g.lineTo(x, y) : g.moveTo(x, y); }

  let x = r() * W, y = r() * H * 0.75, ang = Math.PI / 2 + (r() - 0.5) * 1.1;
  const pts = [[x, y]], steps = Math.round((5 + r() * 9) * long), br = [];

    ang += (r() - 0.5) * 0.95; const l = (0.012 + r() * 0.024) * K; x += Math.cos(ang) * l; y += Math.sin(ang) * l; pts.push([x, y]);
    if (r() < 0.2) br.push([x, y, ang + (r() < 0.5 ? 0.9 : -0.9), 2 + (r() * 4 | 0)]);
  }
  const draw = (p, off) => { g.beginPath(); p.forEach(([a, b], i) => i ? g.lineTo(a + off, b + off) : g.moveTo(a + off, b + off)); g.stroke(); };
  const all = [pts];
  for (const [bx0, by0, ba, bn] of br) { const q = [[bx0, by0]]; let a2 = ba, xx = bx0, yy = by0; for (let s = 0; s < bn; s++) { a2 += (r() - 0.5) * 0.8; const l = (0.01 + r() * 0.02) * K; xx += Math.cos(a2) * l; yy += Math.sin(a2) * l; q.push([xx, yy]); } all.push(q); }
  g.lineJoin = 'round'; g.lineCap = 'round';
  g.strokeStyle = 'rgba(238,228,204,0.16)'; g.lineWidth = 0.9 / px; for (const p of all) draw(p, 0.8 / px);
  g.strokeStyle = 'rgba(16,10,6,0.62)'; g.lineWidth = 1.1 / px; for (const p of all) draw(p, 0);

/* zaplata ze świeżej słomy: wąski prostokąt z postrzępioną dolną krawędzią, kładziony na starą strzechę (cień + jasna krawędź zamiast obrysu) */

  path(); g.fillStyle = pat; g.fill();
  g.lineJoin = 'round'; g.lineWidth = 1.5 / px; g.strokeStyle = 'rgba(244,226,150,0.5)'; g.beginPath(); T.forEach(([a, b], i) => i ? g.lineTo(a, b) : g.moveTo(a, b)); g.stroke();
  g.strokeStyle = 'rgba(30,18,6,0.5)'; g.beginPath(); B.forEach(([a, b], i) => i ? g.lineTo(a, b + 0.6 / px) : g.moveTo(a, b + 0.6 / px)); g.stroke();

  g.strokeStyle = 'rgba(52,32,12,0.75)'; g.lineWidth = 1.5 / px; g.beginPath(); g.moveTo(x - 1 / px, cy0); g.lineTo(x + w + 1 / px, cy1); g.stroke();
  g.strokeStyle = 'rgba(214,176,98,0.45)'; g.lineWidth = 0.6 / px; g.beginPath(); g.moveTo(x - 1 / px, cy0 - 1 / px); g.lineTo(x + w + 1 / px, cy1 - 1 / px); g.stroke();
  g.fillStyle = 'rgba(46,28,10,0.85)'; for (const [kx, ky] of [[x + w * 0.12, cy0 + (cy1 - cy0) * 0.12], [x + w * 0.88, cy0 + (cy1 - cy0) * 0.88]]) { g.beginPath(); g.arc(kx, ky, 1.5 / px, 0, TAU); g.fill(); }

function wearFace(sc, mat, o, W, H, K, px, seed) {
  const P = WEAR[mat]; if (!P) return;
  const k = (o.wear ?? 1) * sc.wear; if (k <= 0) return;
  const g = sc.g, r = rng(seed), A = (W * H) / (K * K), roof = !!o.roof;
  const ink = a => `rgba(24,16,9,${a})`, bone = a => `rgba(240,232,210,${a})`, moss = a => `rgba(70,118,40,${a})`;
  const cnt = x => { const n = Math.floor(x); return n + (r() < x - n ? 1 : 0); };
  g.save(); g.clip();

  // 1) plamy tonalne: wilgoć i wyblaknięcie — ożywiają jednolite powierzchnie
  for (let i = cnt(A * 2.6 * k); i > 0; i--) {
    const x = r() * W, y = r() * H, rr = (0.1 + r() * 0.22) * K, dark = r() < 0.6, gr = g.createRadialGradient(x, y, 0, x, y, rr);
    gr.addColorStop(0, dark ? ink(0.10 * P.tone) : bone(0.07 * P.tone)); gr.addColorStop(1, dark ? ink(0) : bone(0));

  if (P.dark) for (let i = cnt(A * 3 * k); i > 0; i--) {
    const x = r() * W, y = r() * H, rx = (0.06 + r() * 0.14) * K, ry = rx * (1.6 + r()), gr = g.createRadialGradient(x, y, 0, x, y, ry);
    gr.addColorStop(0, ink(0.16 * P.dark)); gr.addColorStop(1, ink(0));
    g.save(); g.translate(x, y); g.scale(rx / ry, 1); g.translate(-x, -y); g.fillStyle = gr; g.fillRect(x - ry, y - ry, ry * 2, ry * 2); g.restore();
  }

  if (P.streak) for (let i = cnt(P.streak * k * (W / K) * 2.4); i > 0; i--) {
    const x = r() * W, y0 = r() * H * 0.35, len = H * (0.2 + r() * 0.55), w = (0.012 + r() * 0.04) * K, light = P.salt && r() < 0.4;
    const gr = g.createLinearGradient(0, y0, 0, y0 + len), a = 0.08 + r() * 0.11, col = light ? bone : ink;

      g.strokeStyle = bone(0.12); g.lineWidth = 0.9 / px; g.beginPath(); g.moveTo(x, y + h); g.lineTo(x, y); g.lineTo(x + w, y); g.stroke();
      if (P.nail) { g.fillStyle = ink(0.8); for (const [nx, ny] of [[x + 2.5 / px, y + 2.5 / px], [x + w - 2.5 / px, y + 2.5 / px], [x + 2.5 / px, y + h - 2.5 / px], [x + w - 2.5 / px, y + h - 2.5 / px]]) { g.beginPath(); g.arc(nx, ny, 0.9 / px, 0, TAU); g.fill(); } }
    } else if (mat === 'thatch') {

    const x = r() * W, y = r() * H * 0.9, rad = (0.04 + r() * 0.09) * K;

      const x = r() * W, rx = (0.04 + r() * 0.1) * K, ry = (0.025 + r() * 0.06) * K, gr = g.createRadialGradient(x, H, 0, x, H, rx);
      gr.addColorStop(0, ink(0.13 + r() * 0.1)); gr.addColorStop(1, ink(0));
      g.save(); g.translate(x, H); g.scale(1, ry / rx); g.translate(-x, -H); g.fillStyle = gr; g.fillRect(x - rx, H - rx, rx * 2, rx * 2); g.restore();
    }
    g.fillStyle = ink(0.3); for (let i = cnt(P.grime * k * (W / K) * 26); i > 0; i--) { const x = r() * W, y = H - Math.pow(r(), 2.2) * H * 0.22; g.fillRect(x, y, 1.3 / px, 1.3 / px); }
  }
  // 9) mech: u podstawy ścian i na połaciach
  if (P.moss) for (let i = cnt(P.moss * k * A * 5); i > 0; i--) {
    const x = r() * W, y = roof ? r() * H : H * (0.7 + r() * 0.3), rr = (0.014 + r() * 0.04) * K, gr = g.createRadialGradient(x, y, 0, x, y, rr);
    gr.addColorStop(0, moss(0.55)); gr.addColorStop(0.7, moss(0.28)); gr.addColorStop(1, moss(0));
    g.fillStyle = gr; g.fillRect(x - rr, y - rr, rr * 2, rr * 2);
  }
  g.restore();
}

/* ziarno całego sprite'a: drobne jasne i ciemne kropki wewnątrz sylwetki (kafel 256×256 px w pamięci podręcznej) */
const GRAIN = {};
function grainTiles(R) {
  if (!GRAIN[R]) {
    const mk = (light) => { const N = 256, c = newCanvas(N, N), g = c.getContext('2d'), r = rng(light ? 91 : 53); for (let i = 0; i < 2400; i++) { const s = (0.7 + r() * 1.5) * R; g.fillStyle = light ? `rgba(255,244,214,${0.03 + r() * 0.06})` : `rgba(20,12,6,${0.05 + r() * 0.12})`; g.fillRect(r() * N, r() * N, s, s * (0.6 + r() * 0.8)); } return c; };
    GRAIN[R] = [mk(false), mk(true)];
  }
  return GRAIN[R];
}
function addSpriteGrain(g, w, h, R, amount = 1) {
  const [dk, lt] = grainTiles(R);
  g.save(); g.globalCompositeOperation = 'source-atop'; g.globalAlpha = Math.min(1, amount);
  g.fillStyle = g.createPattern(dk, 'repeat'); g.fillRect(0, 0, w, h);
  g.fillStyle = g.createPattern(lt, 'repeat'); g.fillRect(0, 0, w, h);
  g.restore();
}

/* ---- 30_buildings.js ---- */
/* ====================== ZESTAW ELEMENTÓW ARCHITEKTONICZNYCH ====================== */
const BAKED = {};

/* scena dla budynku o obrysie fw×fh pól i wysokości hgt (w polach); początek układu = środek obrysu na ziemi */
function sceneFor(fw, fh, hgt, o = {}) {
  const half = (fw + fh) / 2, W = (fw + fh) * AX + 150 + hgt * 60, top = hgt * VH + half * AY + 70, bot = half * AY + 80 + hgt * 16;
  return new Scene(W, top + bot, half * AX + 75, top, Object.assign({ fw, fh }, o));
}
/* układ (O,U,V) ściany południowej (+y) i wschodniej (+x) prostopadłościanu — do drzwi, okien, zdobień */
const wallS = (x0, x1, y1, zt, zb) => ({ O: [x0, y1, zt], U: [x1 - x0, 0, 0], V: [0, 0, -(zt - zb)] });
const wallE = (y0, y1, x1, zt, zb) => ({ O: [x1, y1, zt], U: [0, -(y1 - y0), 0], V: [0, 0, -(zt - zb)] });

/* drzwi z (opcjonalnym) łukiem i okuciami; (u0,w) — położenie na ścianie, h — wysokość, vb — v podstawy drzwi */
function door(sc, O, U, V, u0, w, h, o = {}) {
  const lu = Math.hypot(...U), lv = Math.hypot(...V), vb = o.vb ?? lv;
  sc.local(O, U, V, (g) => {
    g.fillStyle = o.frame || '#2b1c10';
    g.beginPath(); g.moveTo(u0 - 0.025, vb); g.lineTo(u0 - 0.025, vb - h); if (o.arch) g.arc(u0 + w / 2, vb - h, w / 2 + 0.025, Math.PI, 0); else g.lineTo(u0 + w + 0.025, vb - h); g.lineTo(u0 + w + 0.025, vb); g.closePath(); g.fill();
    if (o.lintel) { g.fillStyle = o.lintel; g.fillRect(u0 - 0.06, vb - h - (o.arch ? w / 2 : 0) - 0.06, w + 0.12, 0.05); }
  });
  const dir = [U[0] / lu, U[1] / lu, U[2] / lu], up = [-V[0] / lv, -V[1] / lv, -V[2] / lv];
  const base = [O[0] + dir[0] * u0 + V[0] / lv * vb, O[1] + dir[1] * u0 + V[1] / lv * vb, O[2] + dir[2] * u0 + V[2] / lv * vb];
  const topLeft = [base[0] + up[0] * h, base[1] + up[1] * h, base[2] + up[2] * h];
  sc.face(topLeft, [dir[0] * w, dir[1] * w, dir[2] * w], [-up[0] * h, -up[1] * h, -up[2] * h], 'plank', { shade: 1, pal: o.pal || '#6a4a2c', edge: 0.5, wear: 0.4, vgrad: [[0, 0.25], [0.5, 0], [1, 0.2]], clip: o.arch ? [[0, 1], [0, 0.18], [0.08, 0.1], [0.5, 0.0], [0.92, 0.1], [1, 0.18], [1, 1]] : undefined });
  sc.local(O, U, V, (g) => { // okucia i klamka
    g.strokeStyle = 'rgba(20,16,12,0.75)'; g.lineWidth = 0.016;
    for (const f of [0.22, 0.7]) { g.beginPath(); g.moveTo(u0, vb - h * (1 - f)); g.lineTo(u0 + w, vb - h * (1 - f)); g.stroke(); }
    g.fillStyle = '#c9a85a'; g.beginPath(); g.arc(u0 + w * 0.78, vb - h * 0.46, 0.016, 0, TAU); g.fill();
  });
}

/* okno z oświetlonym wnętrzem, ramą i (opcjonalnie) okiennicami */
function windowAt(sc, O, U, V, u0, v0, w, h, o = {}) {
  sc.local(O, U, V, (g) => {
    if (o.shutters) { g.fillStyle = o.shutters; const sw = w * 0.42; g.fillRect(u0 - sw - 0.012, v0 - 0.004, sw, h + 0.008); g.fillRect(u0 + w + 0.012, v0 - 0.004, sw, h + 0.008);
      g.strokeStyle = 'rgba(0,0,0,0.4)'; g.lineWidth = 0.008; g.strokeRect(u0 - sw - 0.012, v0 - 0.004, sw, h + 0.008); g.strokeRect(u0 + w + 0.012, v0 - 0.004, sw, h + 0.008);
      g.strokeStyle = 'rgba(0,0,0,0.3)'; g.lineWidth = 0.005; for (const x of [u0 - sw * 0.5 - 0.012, u0 + w + sw * 0.5 + 0.012]) for (let i = 1; i < 5; i++) { g.beginPath(); g.moveTo(x - sw * 0.4, v0 + h * i / 5); g.lineTo(x + sw * 0.4, v0 + h * i / 5); g.stroke(); } }
    g.fillStyle = o.frame || '#3a2818'; g.fillRect(u0 - 0.014, v0 - 0.014, w + 0.028, h + 0.028);
    const gr = g.createLinearGradient(0, v0, 0, v0 + h); gr.addColorStop(0, o.lit || '#ffe9a0'); gr.addColorStop(1, '#d99a40');
    g.fillStyle = o.dark ? '#1c1710' : gr; g.fillRect(u0, v0, w, h);
    g.strokeStyle = o.frame || '#3a2818'; g.lineWidth = 0.012; g.beginPath(); g.moveTo(u0 + w / 2, v0); g.lineTo(u0 + w / 2, v0 + h); g.moveTo(u0, v0 + h / 2); g.lineTo(u0 + w, v0 + h / 2); g.stroke();
    g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(u0 - 0.014, v0 + h + 0.014, w + 0.028, 0.012);   // parapet
    if (o.sill) { g.fillStyle = o.sill; g.fillRect(u0 - 0.03, v0 + h + 0.014, w + 0.06, 0.03); }
  });
}

/* okno łukowe (architektura wschodnia): ciemne wnętrze albo światło lampy */
function archWin(sc, O, U, V, u0, v0, w, h, o = {}) {
  sc.local(O, U, V, (g) => {
    const r = w / 2, e = 0.014;
    g.fillStyle = o.frame || '#8a5a2a'; g.beginPath(); g.moveTo(u0 - e, v0 + h + e); g.lineTo(u0 - e, v0 + r); g.arc(u0 + r, v0 + r, r + e, Math.PI, 0); g.lineTo(u0 + w + e, v0 + h + e); g.closePath(); g.fill();
    const gr = g.createLinearGradient(0, v0, 0, v0 + h); gr.addColorStop(0, o.lit || '#241a10'); gr.addColorStop(1, o.lit2 || '#120d08');
    g.fillStyle = gr; g.beginPath(); g.moveTo(u0, v0 + h); g.lineTo(u0, v0 + r); g.arc(u0 + r, v0 + r, r, Math.PI, 0); g.lineTo(u0 + w, v0 + h); g.closePath(); g.fill();
    if (o.grille) { g.strokeStyle = 'rgba(210,170,90,0.55)'; g.lineWidth = 0.008; for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(u0 + w * i / 4, v0 + r * 0.6); g.lineTo(u0 + w * i / 4, v0 + h); g.stroke(); } }
    g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(u0 - e, v0 + h + e, w + 2 * e, 0.012);
  });
}

/* ostrołukowe okno witrażowe (gotyk): kamienna rama, ołowiane szprosy, kolorowe szybki */
function glassWin(sc, O, U, V, u0, v0, w, h, o = {}) {
  sc.local(O, U, V, (g) => {
    const r = w / 2, e = 0.02, x1 = u0 + w, xm = u0 + r, ys = v0 + r, yt = v0 - r * 0.55, yb = v0 + h;
    const path = (dx) => { g.beginPath(); g.moveTo(u0 - dx, yb + dx); g.lineTo(u0 - dx, ys); g.quadraticCurveTo(u0 - dx, yt + r * 0.6 - dx, xm, yt - dx); g.quadraticCurveTo(x1 + dx, yt + r * 0.6 - dx, x1 + dx, ys); g.lineTo(x1 + dx, yb + dx); g.closePath(); };
    g.fillStyle = o.frame || '#8d897d'; path(e); g.fill();
    g.save(); path(0); g.clip();
    const cols = o.glass || ['#3c62a8', '#a8342c', '#d8a830', '#2f7a58', '#4a7ac0'], rr = rng(Math.round((u0 + v0) * 977));
    const nx = 3, ny = 6; for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) { const c = cols[(rr() * cols.length) | 0]; g.fillStyle = c; g.fillRect(u0 + i * w / nx, yt + j * (yb - yt) / ny, w / nx + 0.002, (yb - yt) / ny + 0.002); }
    const gl = g.createLinearGradient(0, yt, 0, yb); gl.addColorStop(0, 'rgba(255,255,255,0.28)'); gl.addColorStop(1, 'rgba(0,0,20,0.35)'); g.fillStyle = gl; g.fillRect(u0, yt, w, yb - yt);
    g.strokeStyle = 'rgba(14,14,20,0.8)'; g.lineWidth = 0.008; for (let i = 1; i < nx; i++) { g.beginPath(); g.moveTo(u0 + i * w / nx, yt); g.lineTo(u0 + i * w / nx, yb); g.stroke(); } for (let j = 1; j < ny; j++) { g.beginPath(); g.moveTo(u0, yt + j * (yb - yt) / ny); g.lineTo(x1, yt + j * (yb - yt) / ny); g.stroke(); }
    g.restore(); g.strokeStyle = 'rgba(20,16,12,0.6)'; g.lineWidth = 0.008; path(0); g.stroke();
  });
}

/* ryglówka: słupy, rygle i zastrzały na ścianie */
function halfTimber(sc, O, U, V, o = {}) {
  const nu = o.nu ?? 4, nv = o.nv ?? 1, bw = o.bw ?? 0.03, col = o.col || '#3b2616';
  sc.local(O, U, V, (g, lu, lv) => {
    g.fillStyle = col;
    g.fillRect(0, 0, lu, bw); g.fillRect(0, lv - bw, lu, bw);
    for (let j = 1; j < nv; j++) g.fillRect(0, lv * j / nv - bw / 2, lu, bw * 0.8);
    for (let i = 0; i <= nu; i++) g.fillRect(i * (lu - bw) / nu, 0, bw, lv);
    g.strokeStyle = col; g.lineWidth = bw * 0.9;
    for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) { const a = i * lu / nu, b = (i + 1) * lu / nu, y0 = lv * j / nv, y1 = lv * (j + 1) / nv; g.beginPath(); if ((i + j) % 2) { g.moveTo(a, y1 - bw); g.lineTo(b, y0 + bw); } else { g.moveTo(a, y0 + bw); g.lineTo(b, y1 - bw); } g.stroke(); }
    g.fillStyle = 'rgba(255,235,200,0.14)'; for (let i = 0; i <= nu; i++) g.fillRect(i * (lu - bw) / nu, 0, bw * 0.28, lv);   // światło na krawędzi słupów
  });
}

/* sadza: ciemny nalot na połaci przy kominie / nad paleniskiem */
function soot(sc, x, y, z, r = 0.12, a = 0.4) {
  const g = sc.g, [px, py] = sc.P(x, y, z), rr = r * AX * sc.F, gr = g.createRadialGradient(px, py, 0, px, py, rr);
  gr.addColorStop(0, `rgba(10,8,6,${a})`); gr.addColorStop(1, 'rgba(10,8,6,0)');
  g.save(); g.translate(px, py); g.scale(1, 0.62); g.translate(-px, -py); g.fillStyle = gr; g.fillRect(px - rr, py - rr, rr * 2, rr * 2); g.restore();
}
/* komin z kapturem i ciemnym wylotem */
function chimney(sc, cx, cy, zb, zt, w = 0.24, mat = 'stone', pal) {
  sc.box(cx - w / 2, cy - w / 2, zb, cx + w / 2, cy + w / 2, zt, mat, { ao: 0.15, pal });
  sc.box(cx - w / 2 - 0.035, cy - w / 2 - 0.035, zt, cx + w / 2 + 0.035, cy + w / 2 + 0.035, zt + 0.07, mat, { ao: 0, pal, wear: 0.3 });
  const g = sc.g, [px, py] = sc.P(cx, cy, zt + 0.07), rx = (w / 2 - 0.02) * AX * sc.F * 1.4142;
  g.fillStyle = '#17120e'; g.beginPath(); g.ellipse(px, py, rx * 0.8, rx * 0.4, 0, 0, TAU); g.fill();
}
/* schody przed drzwiami (n stopni, od najwyższego); xa..xb — szerokość */
function stairs(sc, xa, xb, y, n, h, mat = 'stone', d = 0.17, pal) {
  for (let i = 0; i < n; i++) sc.box(xa, y + i * d, 0, xb, y + (i + 1) * d, h * (n - i) / n, mat, { ao: 0.2, pal, wear: 0.5 });
}
/* skrzynka z kwiatami pod oknem (na ścianie) */
function flowerBox(sc, O, U, V, u0, v, w, cols = ['#d8433a', '#f0d84a', '#e8e0d0']) {
  sc.local(O, U, V, (g) => {
    g.fillStyle = '#6a4428'; g.fillRect(u0 - 0.02, v, w + 0.04, 0.07); g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 0.006; g.strokeRect(u0 - 0.02, v, w + 0.04, 0.07);
    const r = rng(Math.round(u0 * 311 + v * 97)); for (let i = 0; i < 9; i++) { const x = u0 + (i + 0.5) * w / 9; g.fillStyle = '#3f7a2c'; g.beginPath(); g.arc(x, v - 0.005, 0.022, 0, TAU); g.fill(); g.fillStyle = cols[(r() * cols.length) | 0]; g.beginPath(); g.arc(x + (r() - 0.5) * 0.01, v - 0.03, 0.016, 0, TAU); g.fill(); }
  });
}
/* latarnia przy drzwiach: ciepłe światło */
function lantern(sc, x, y, z) {
  const g = sc.g, f = sc.F, [px, py] = sc.P(x, y, z), gr = g.createRadialGradient(px, py, 0, px, py, 16 * f);
  gr.addColorStop(0, 'rgba(255,214,120,0.55)'); gr.addColorStop(1, 'rgba(255,190,80,0)'); g.fillStyle = gr; g.beginPath(); g.arc(px, py, 16 * f, 0, TAU); g.fill();
  g.strokeStyle = '#2a2018'; g.lineWidth = 1.6 * f; g.beginPath(); g.moveTo(px, py - 7 * f); g.lineTo(px, py - 3 * f); g.stroke();
  g.fillStyle = '#ffe08a'; g.strokeStyle = '#2a2018'; g.lineWidth = 1.2 * f; g.beginPath(); g.rect(px - 2.6 * f, py - 3 * f, 5.2 * f, 7 * f); g.fill(); g.stroke();
}
/* wiszący szyld nad wejściem: żelazny wysięgnik i deska z godłem */
function signBoard(sc, x, y, z, emblem = 'loaf') {
  const g = sc.g, f = sc.F, [px, py] = sc.P(x, y, z);
  g.strokeStyle = '#2a2018'; g.lineWidth = 2 * f; g.beginPath(); g.moveTo(px - 14 * f, py); g.lineTo(px + 8 * f, py); g.moveTo(px - 8 * f, py); g.lineTo(px - 2 * f, py - 6 * f); g.stroke();
  g.fillStyle = '#7a5530'; g.strokeStyle = '#2a2018'; g.lineWidth = 1.3 * f; g.beginPath(); g.rect(px - 2 * f, py + 3 * f, 13 * f, 14 * f); g.fill(); g.stroke();
  g.strokeStyle = '#2a2018'; g.lineWidth = f; g.beginPath(); g.moveTo(px + 1 * f, py); g.lineTo(px + 1 * f, py + 3 * f); g.moveTo(px + 8 * f, py); g.lineTo(px + 8 * f, py + 3 * f); g.stroke();
  g.fillStyle = '#e8c870';
  if (emblem === 'loaf') { g.beginPath(); g.ellipse(px + 4.5 * f, py + 10 * f, 4.4 * f, 3 * f, 0, 0, TAU); g.fill(); } else if (emblem === 'anvil') { g.fillRect(px + 0.5 * f, py + 8 * f, 8 * f, 2.6 * f); g.fillRect(px + 2.6 * f, py + 10.6 * f, 3.8 * f, 3.4 * f); } else { g.fillRect(px + 1.5 * f, py + 7 * f, 6 * f, 7 * f); }
}
/* markiza w pasy nad drzwiami / straganem: skośna połać + przednia falbana */
function awning(sc, x, y, z, width, depth, drop, pal = '#b8352b|#f1e6c8') {
  sc.face([x, y, z], [width, 0, 0], [0, depth, -drop], 'stripes', { shade: 1.0, edge: 0.45, pal, ppu: 150, wear: 0.3 });
  sc.face([x, y + depth, z - drop], [width, 0, 0], [0, 0, -0.07], 'stripes', { shade: 0.8, edge: 0.45, pal, ppu: 150, wear: 0 });
}
/* krenelaż: rząd blanek wzdłuż krawędzi (x lub y) */
function merlonLine(sc, x0, y0, x1, y1, z, n, size = 0.09, h = 0.12, mat = 'stone') {
  for (let i = 0; i < n; i++) { const t = n === 1 ? 0.5 : i / (n - 1), x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t; sc.box(x - size / 2, y - size / 2, z, x + size / 2, y + size / 2, z + h, mat, { ao: 0.1, wear: 0.7 }); }
}
/* płot wiklinowy (odcinek wzdłuż x lub y) */
function wattle(sc, x0, y0, x1, y1, h = 0.4, th = 0.05) {
  sc.box(Math.min(x0, x1) - th / 2, Math.min(y0, y1) - th / 2, 0, Math.max(x0, x1) + th / 2, Math.max(y0, y1) + th / 2, h, { east: 'wattle', south: 'wattle', top: 'plank' }, { ao: 0.25, pal: '#8a6a3c', wear: 0.5 });
}
/* ul: słomiany kosz (dla pszczół) rysowany w przestrzeni ekranu */
function skep(sc, x, y, s = 1) {
  const g = sc.g, f = sc.F * s, [px, py] = sc.P(x, y, 0), w = 8 * f, h = 12 * f;
  g.fillStyle = 'rgba(14,22,8,0.3)'; g.beginPath(); g.ellipse(px + 3 * f, py + 0.5 * f, w * 0.9, w * 0.35, 0, 0, TAU); g.fill();
  const gr = g.createLinearGradient(px - w, 0, px + w, 0); gr.addColorStop(0, '#f0d27a'); gr.addColorStop(0.55, '#d4a948'); gr.addColorStop(1, '#8c6a28');
  g.fillStyle = gr; g.strokeStyle = 'rgba(40,26,8,0.8)'; g.lineWidth = 1; g.beginPath(); g.moveTo(px - w, py); g.quadraticCurveTo(px - w * 1.05, py - h * 0.9, px, py - h); g.quadraticCurveTo(px + w * 1.05, py - h * 0.9, px + w, py); g.ellipse(px, py, w, w * 0.32, 0, 0, Math.PI); g.closePath(); g.fill(); g.stroke();
  g.strokeStyle = 'rgba(70,44,10,0.55)'; for (let i = 1; i < 5; i++) { const t = i / 5, yy = py - h * t, ww = w * (1 - t * 0.85); g.beginPath(); g.ellipse(px, yy, ww, ww * 0.3, 0, 0, Math.PI); g.stroke(); }
  g.fillStyle = '#2a1c0c'; g.beginPath(); g.ellipse(px, py - 2.6 * f, 1.8 * f, 1.2 * f, 0, 0, TAU); g.fill();
}

/* ---------- drobne rekwizyty ---------- */
function barrel(sc, x, y, z = 0, s = 1) {
  sc.cyl(x, y, z, z + 0.2 * s, 0.085 * s, { color: [132, 92, 52], ao: 0, topMat: 'plank', topPal: '#7a5632', mat: 'plank', pal: '#84603a' });
  const g = sc.g, [px, py] = sc.P(x, y, z + 0.05 * s), [, py2] = sc.P(x, y, z + 0.15 * s), rx = 0.085 * s * AX * sc.F * 1.4142;
  g.strokeStyle = 'rgba(30,22,14,0.85)'; g.lineWidth = 1.8 * sc.F;
  for (const yy of [py, py2]) { g.beginPath(); g.ellipse(px, yy, rx, rx / 2, 0, 0, Math.PI); g.stroke(); }
}
function logPile(sc, x, y, n = 6) { // stos kłód (końce okrągłe)
  const g = sc.g, r = 0.05, rows = [3, 2, 1], F = sc.F;

  poly([...xs.map(x => sc.P(x, -hw(x) * 0.8, zt(x) - 0.1)), ...rev.map(x => sc.P(x, hw(x) * 0.8, zt(x) - 0.1))]);

  const stem = (x, d, hgt, head) => {

}

  ctx.setTransform(k * AX / K, k * AY / K, -k * AX / K, k * AY / K, VX + GX * k + (t * 0.05 % 4) * AX * k, VY + GY * k + (t * 0.03 % 4) * AY * k);
  ctx.globalAlpha = 0.38; ctx.globalCompositeOperation = 'overlay'; ctx.fillStyle = drawFrame.wp;
  const Rr = 40 * K; ctx.fillRect(-Rr, -Rr, 2 * Rr, 2 * Rr);
  ctx.restore();

  if (gridOn) drawGrid(k);

  // cienie ruchomych postaci (cienie reszty są w terenie)
  for (const f of WORLD.figs) { const [sx, sy] = toScr(f.x, f.y); blit(f.cast.front[0], 'u', sx, sy, 1); }

  // obiekty posortowane (z odrzucaniem poza ekranem)
  const list = [];
  for (const o of WORLD.objs) {
    const [sx, sy] = toScr(o.x, o.y), ks = o.k * k, s = o.spr, bb = [sx - s.ax * ks, sy - s.ay * ks, sx + (s.w - s.ax) * ks, sy + (s.h - s.ay) * ks];
    if (bb[2] < -30 || bb[0] > W + 30 || bb[3] < -30 || bb[1] > H + 30) continue;
    list.push({ d: o.x + o.y, o, sx, sy, rect: o.rect, bb, x: o.x, y: o.y });
  }
  for (const f of WORLD.figs) { const [sx, sy] = toScr(f.x, f.y), ks = FIG * k; list.push({ d: f.x + f.y, f, sx, sy, bb: [sx - 40 * ks, sy - 100 * ks, sx + 40 * ks, sy + 10 * ks], x: f.x, y: f.y }); }
  sortDrawables(list);
  for (const it of list) {
    if (it.o) {
      const o = it.o, { sx, sy } = it, ks = o.k * k, im = lodPick(o.spr.c, o.spr.R / ks), dx = sx - o.spr.ax * ks, dy = sy - o.spr.ay * ks, w = o.spr.w * ks, h = o.spr.h * ks;
      if (o.bob) {
        const by2 = Math.sin(t * 1.4 + o.x) * 1.6 * k, rot = Math.sin(t * 1.1 + 1) * 0.012, c = Math.cos(rot), s = Math.sin(rot);
        ctx.setTransform(c, s, -s, c, sx - c * sx + s * sy, sy - s * sx - c * sy + by2); ctx.drawImage(im, dx, dy, w, h); ctx.setTransform(1, 0, 0, 1, 0, 0);
      } else if (o.sway) {
        const sw = (Math.sin(t * 1.25 + o.ph) * 0.010 + Math.sin(t * 0.43 + o.ph * 1.7) * 0.008) * o.sway;
        ctx.setTransform(1, 0, -sw, 1, sw * sy, 0); ctx.drawImage(im, dx, dy, w, h); ctx.setTransform(1, 0, 0, 1, 0, 0);
      } else ctx.drawImage(im, dx, dy, w, h);
    } else {
      const f = it.f, spr = f.cast[f.view][Math.floor(f.t * 3.6) % 2], bob = Math.abs(Math.sin(f.t * 3.6 * Math.PI)) * 1.2 * k, ks = k;
      ctx.save(); ctx.translate(it.sx, it.sy - bob); ctx.scale(f.mirror ? -1 : 1, 1);
      ctx.drawImage(lodPick(spr.c, spr.R / ks), -spr.ax * ks, -spr.ay * ks, spr.w * ks, spr.h * ks); ctx.restore();
    }
  }

  // dym z kominów
  for (const o of WORLD.objs) if (o.smoke) {
    o.nextPuff = (o.nextPuff ?? Math.random() * 0.6) - dt;
    if (o.nextPuff < 0) { o.nextPuff += 0.45 + Math.random() * 0.2; smoke.push({ x: o.x + o.smoke[0], y: o.y + o.smoke[1], z: o.smoke[2], a: 0, ph: Math.random() * TAU }); }
  }
  for (let i = smoke.length - 1; i >= 0; i--) {
    const p = smoke[i]; p.a += dt; p.z += dt * 0.3; p.x += dt * 0.12; p.y -= dt * 0.05;
    if (p.a > 4) { smoke.splice(i, 1); continue; }
    const [sx, sy] = toScr(p.x + Math.sin(p.a * 1.6 + p.ph) * 0.03, p.y, p.z), u = p.a / 4, rad = (5 + u * 17) * k * S * 0.6;
    const gr = ctx.createRadialGradient(sx, sy, 0, sx, sy, rad); const al = (1 - u) * 0.62 * Math.min(1, p.a * 3);
    gr.addColorStop(0, `rgba(214,210,204,${al})`); gr.addColorStop(0.55, `rgba(206,202,196,${al * 0.55})`); gr.addColorStop(1, 'rgba(200,196,190,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(sx, sy, rad, 0, TAU); ctx.fill();
  }

  // delikatny „grading": ciepłe światło z lewej-góry, chłodniejszy dół, winieta — jedna warstwa w pamięci podręcznej
  if (!drawFrame.grade || drawFrame.grade.width !== W || drawFrame.grade.height !== H) {
    const gc = newCanvas(W, H), g = gc.getContext('2d');
    let gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, 'rgba(255,214,130,0.12)'); gr.addColorStop(0.5, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(60,80,150,0.10)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    gr = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.78); gr.addColorStop(0, 'rgba(10,16,4,0)'); gr.addColorStop(1, 'rgba(10,16,4,0.42)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    drawFrame.grade = gc;
  }
  ctx.drawImage(drawFrame.grade, 0, 0);
}

/* siatka pól + ślady budynków (przełącznik G / przycisk) — pokazuje obrys każdego budynku w polach (np. 2×3, 4×4) */
function drawGrid(k) {
  const W = cv.width, H = cv.height, inv = (sx, sy) => { const X = (sx - VX) / k, Y = (sy - VY) / k, u = (X - GX) / AX, v = (Y - GY) / AY; return [(u + v) / 2, (v - u) / 2]; };
  const cs = [inv(0, 0), inv(W, 0), inv(0, H), inv(W, H)], xs = cs.map(c => c[0]), ys = cs.map(c => c[1]);
  const i0 = Math.floor(Math.min(...xs)), i1 = Math.ceil(Math.max(...xs)), j0 = Math.floor(Math.min(...ys)), j1 = Math.ceil(Math.max(...ys));
  const diamond = (i, j, w, h) => { ctx.beginPath(); for (const [x, y] of [[i, j], [i + w, j], [i + w, j + h], [i, j + h]]) { const [sx, sy] = toScr(x, y); ctx.lineTo(sx, sy); } ctx.closePath(); };
  ctx.save(); ctx.lineWidth = Math.max(1, dpr); ctx.strokeStyle = 'rgba(255,255,255,0.20)';
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) { if (i < 0 || j < 0 || i >= MAP_W || j >= MAP_H) continue; diamond(i, j, 1, 1); ctx.stroke(); }
  ctx.lineWidth = Math.max(2, 2 * dpr); ctx.strokeStyle = 'rgba(255,214,70,0.95)'; ctx.fillStyle = 'rgba(255,214,70,0.12)'; ctx.font = `${Math.round(13 * dpr)}px monospace`; ctx.textAlign = 'center';
  for (const [i, j, w, h] of FOOT) { diamond(i, j, w, h); ctx.fill(); ctx.stroke(); const [cx, cy] = toScr(i + w / 2, j + h / 2); ctx.fillStyle = 'rgba(255,240,170,0.95)'; ctx.fillText(w + '×' + h, cx, cy); ctx.fillStyle = 'rgba(255,214,70,0.12)'; }
  ctx.restore();
}

function update(dt) {
  for (const f of WORLD.figs) {
    f.t += dt;
    const segs = []; let L = 0;
    for (let i = 0; i < f.path.length - 1; i++) { const l = Math.hypot(f.path[i + 1][0] - f.path[i][0], f.path[i + 1][1] - f.path[i][1]); segs.push(l); L += l; }
    f.s += dt * f.speed * (f.back ? -1 : 1);
    if (f.s > L) { f.s = L; f.back = true; } else if (f.s < 0) { f.s = 0; f.back = false; }
    let s = f.s, i = 0; while (i < segs.length - 1 && s > segs[i]) { s -= segs[i]; i++; }
    const a = f.path[i], b = f.path[i + 1], u = clamp(s / segs[i], 0, 1), px = f.x, py = f.y;
    f.x = lerp(a[0], b[0], u); f.y = lerp(a[1], b[1], u);
    const dx = f.x - px, dy = f.y - py, sdx = dx - dy, sdy = dx + dy;                 // ruch w osiach ekranu
    if (Math.abs(sdx) + Math.abs(sdy) > 1e-6) { f.view = sdy < -1e-6 ? 'back' : 'front'; if (Math.abs(sdx) > 1e-6) f.mirror = sdx < 0; }
  }
}

/* arkusze sprite'ów do oględzin: ?sprite=a,b&zs=3 (wybrane budynki), #sheet-b-… (wszystkie budynki), #sheet-n (przyroda), #sheet-f (postacie) */
function sheetFrame() {
  const W = cv.width, H = cv.height, mode = (location.hash.match(/sheet-(\w)/) || [])[1] || 'b', Z = parseFloat((location.hash.match(/-([\d.]+)$/) || [])[1] || '1') * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  const bg = new Scene(W, H, W / 2, 20, { R: 1, ground: true }); bg.decal('grass', 'green', null); bg.decal('grassDetail', null, null, { alpha: 0.34 }); ctx.drawImage(bg.pcv, 0, 0, W, H);
  const draw = (spr, cx, cy, z, layers) => { for (const l of layers) if (spr[l]) ctx.drawImage(lodPick(spr[l], layerR(spr, l) / z), cx - spr.ax * z, cy - spr.ay * z, spr.w * z, spr.h * z); };
  if (QS.get('sprite')) {
    const names = QS.get('sprite').split(','), zs = parseFloat(QS.get('zs') || '2') * dpr, cw = W / names.length;
    names.forEach((n, i) => { const spr = SPR[n]; if (spr) draw(spr, (i + 0.5) * cw, H * (parseFloat(QS.get('y') || '0.82')), zs, ['p', 'u', 'c']); });
    return;
  }
  if (mode === 'r') {                                                  // porównanie rozmiarów: wszystkie budynki w tej samej skali, z obrysem w polach i podpisem
    const LAB = { frankHouse: 'Dom ryglowy', frankChurch: 'Kościół', frankMill: 'Młyn', frankBarracks: 'Koszary', frankSmithy: 'Kuźnia', frankKeep: 'Zamek', slavHut: 'Chata', slavStore: 'Spichlerz', slavWaxery: 'Woskarnia', slavShrine: 'Święty krąg', well: 'Studnia', saracenHouse: 'Dom', saracenMosque: 'Meczet', saracenMarket: 'Targ', saracenSerai: 'Karawanseraj', vikingHut: 'Chata', vikingMead: 'Miodosytnia', vikingHall: 'Długi dom', vikingDock: 'Przystań', longship: 'Okręt' };
    const ROWS = [['FRANKOWIE', ['frankHouse', 'frankSmithy', 'frankMill', 'frankBarracks', 'frankChurch', 'frankKeep']], ['SŁOWIANIE', ['well', 'slavHut', 'slavWaxery', 'slavStore', 'slavShrine']], ['SARACENI', ['saracenHouse', 'saracenMarket', 'saracenMosque', 'saracenSerai']], ['WIKINGOWIE', ['vikingHut', 'vikingMead', 'vikingHall', 'vikingDock', 'longship']]];
    for (const id of ['cap', 'leg', 'st', 'ui']) { const el = document.getElementById(id); if (el) el.style.display = 'none'; }
    const GAP = 30, lab = 36 * dpr, lay = ROWS.map(([nm, ks]) => { const it = ks.filter(k => SPR[k]).map(k => { const s = SPR[k]; return { k, s, w: s.fw ? (s.fw + s.fh) * AX + 40 : s.w * 0.8, up: s.ay - 20, down: s.fw ? (s.fw + s.fh) / 2 * AY + 14 : s.h - s.ay }; }); return { nm, it, w: it.reduce((a, o) => a + o.w + GAP, GAP), up: Math.max(...it.map(o => o.up)), down: Math.max(...it.map(o => o.down)) }; });
    const z = Math.min(Z, (W * 0.98) / Math.max(...lay.map(r => r.w)), (H - lay.length * lab - 12 * dpr) / lay.reduce((a, r) => a + r.up + r.down, 0));
    ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    const text = (t, x, y, px, bold) => { ctx.font = `${bold ? 'bold ' : ''}${Math.round(px * dpr)}px Georgia, serif`; ctx.lineWidth = 3.5 * dpr; ctx.strokeStyle = 'rgba(14,20,8,0.92)'; ctx.strokeText(t, x, y); ctx.fillStyle = '#f6ecd0'; ctx.fillText(t, x, y); };
    let y = 8 * dpr;
    for (const r of lay) {
      const base = y + r.up * z; let x = (W - (r.w * z)) / 2 + GAP * z;
      ctx.textAlign = 'left'; text(r.nm, 14 * dpr, y + 20 * dpr, 17, true); ctx.textAlign = 'center';
      for (const o of r.it) {
        const cx = x + o.w * z / 2, s = o.s, fw = s.fw || 0, fh = s.fh || 0;
        for (const l of ['p', 'u']) if (s[l]) ctx.drawImage(lodPick(s[l], layerR(s, l) / z), cx - s.ax * z, base - s.ay * z, s.w * z, s.h * z);
        if (fw) {
          const c = [[fw / 2, fh / 2], [fw / 2, -fh / 2], [-fw / 2, -fh / 2], [-fw / 2, fh / 2]].map(([a, b]) => [cx + (a - b) * AX * z, base + (a + b) * AY * z]);
          ctx.beginPath(); c.forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b)); ctx.closePath(); ctx.fillStyle = 'rgba(255,214,70,0.13)'; ctx.fill(); ctx.lineWidth = 2 * dpr; ctx.strokeStyle = 'rgba(255,214,70,0.9)'; ctx.stroke();
        }
        if (s.c) ctx.drawImage(lodPick(s.c, layerR(s, 'c') / z), cx - s.ax * z, base - s.ay * z, s.w * z, s.h * z);
        text(LAB[o.k] + (fw ? ' · ' + fw + '×' + fh : ''), cx, base + r.down * z + 22 * dpr, 15, false);
        x += (o.w + GAP) * z;
      }
      y += (r.up + r.down) * z + lab;
    }
    return;
  }
  if (mode === 'b') {
    const items = Object.keys(SPR), cols = Math.ceil(Math.sqrt(items.length * W / H)), rows = Math.ceil(items.length / cols), cw = W / cols, ch = H / rows;
    items.forEach((n, i) => { const spr = SPR[n], z = Math.min(Z * 0.5, cw * 0.95 / spr.w, ch * 0.95 / (spr.h - spr.ay * 0.0)); draw(spr, (i % cols + 0.5) * cw, Math.floor(i / cols) * ch + ch * 0.8, z, ['p', 'u', 'c']); });
  } else if (mode === 'n') {
    const rows = [H * 0.3, H * 0.62, H * 0.93], row1 = [SETS.oaks[0], SETS.oaks[1], SETS.pines[0], SETS.pines[1]], row2 = [SETS.palms[0], SETS.palms[1], SETS.rocks[0], SETS.rocks[1]];
    row1.forEach((t, i) => draw(t, (i + 0.5) * W / 4, rows[0], Z * 0.5, ['u', 'c'])); row2.forEach((t, i) => draw(t, (i + 0.5) * W / 4, rows[1], Z * 0.5, ['u', 'c']));
  } else {
    const keys = Object.keys(SETS.cast), n = keys.length, cw = W / n;
    keys.forEach((key, i) => { const cs = SETS.cast[key]; [cs.front[0], cs.front[1], cs.back[0]].forEach((spr, q) => draw(spr, (i + 0.5) * cw, H * (0.3 + q * 0.33), Z, ['u', 'c'])); });
  }
}

async function boot() {
  const t0 = performance.now();
  resize(); zoom = ZDEF; clampCam();
  await bakeAll();
  const sheet = location.hash.startsWith('#sheet') || QS.has('sprite');
  if (!sheet) {
    WORLD = layoutWorld();
    // wypiek widocznych kafli terenu przed pierwszą klatką
    const tc0 = performance.now(), k = kk(), W = cv.width, H = cv.height, vx = W / 2 - cam.x * k, vy = H / 2 - cam.y * k;
    TOTAL += 0; for (let j = Math.floor((-vy / k) / CH); j <= Math.floor(((H - vy) / k) / CH); j++) for (let i = Math.floor((-vx / k) / CH); i <= Math.floor(((W - vx) / k) / CH); i++) await step('Teren', () => chunkOf(i, j));
    tmark('teren(kafle)', tc0);
  }
  BAKE_MS = performance.now() - t0; window.__bakeMs = BAKE_MS; window.__parts = PARTS;
  document.getElementById('bake').textContent = `Wypiek: ${BAKE_MS.toFixed(0)} ms · rozdzielczość ×${RES} · ${innerWidth}×${innerHeight} @${dpr}`;
  const ld = document.getElementById('load'); if (ld) ld.style.display = 'none';
  if (sheet) { sheetFrame(); window.__ready = true; return; }
  addEventListener('resize', () => { const r = zoom / ZDEF; resize(); zoom = clamp(ZDEF * r, ZMIN, ZMAX); clampCam(); updateUI(); });
  // sterowanie: przeciąganie, kółko, pinch, przyciski, klawisze
  const ptrs = new Map(); let pinch0 = null;
  cv.addEventListener('pointerdown', e => { try { cv.setPointerCapture(e.pointerId); } catch (err) { /* zdarzenia syntetyczne */ } ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: zoom }; } });
  cv.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId); if (!p) return; const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 1) { cam.x -= dx * dpr / kk(); cam.y -= dy * dpr / kk(); clampCam(); }
    else if (ptrs.size === 2 && pinch0) { const [a, b] = [...ptrs.values()]; setZoom(pinch0.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch0.d, (a.x + b.x) / 2, (a.y + b.y) / 2); }
  });
  const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.12 : 1 / 1.12), e.clientX, e.clientY); }, { passive: false });
  const home = () => { cam.x = bx(11.0, 7.6); cam.y = by(11.0, 7.6); };
  const act = { zin: () => setZoom(zoom * 1.25), zout: () => setZoom(zoom / 1.25), zreset: () => { setZoom(ZDEF); home(); clampCam(); }, grid: () => { gridOn = !gridOn; updateUI(); } };
  for (const id of Object.keys(act)) { const el = document.getElementById(id); if (el) el.addEventListener('click', act[id]); }
  addEventListener('keydown', e => { if (e.key === '+' || e.key === '=') act.zin(); else if (e.key === '-') act.zout(); else if (e.key === '0') act.zreset(); else if (e.key === 'g' || e.key === 'G') act.grid(); });
  const cx = parseFloat(QS.get('cx')), cy = parseFloat(QS.get('cy')); if (!isNaN(cx) && !isNaN(cy)) { cam.x = bx(cx, cy); cam.y = by(cx, cy); clampCam(); }
  updateUI();
  let last = performance.now(), T = 0, frames = 0, fpsT = 0;
  const loop = (now) => {
    const dt = clamp((now - last) / 1000, 0, 0.05); last = now; T += dt;
    update(dt); drawFrame(T, dt);
    frames++; fpsT += dt; if (fpsT > 1) { document.getElementById('fps').textContent = Math.round(frames / fpsT) + ' FPS'; frames = 0; fpsT = 0; }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  window.__setZoom = z => setZoom(z); window.__ready = true;
}
boot().catch(e => { const t = document.getElementById('ltxt'); if (t) t.textContent = 'Błąd: ' + e.message; console.error(e); });
